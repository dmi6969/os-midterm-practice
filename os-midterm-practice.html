","src":"原題 W3-21","group":"W3-21","type":"single","q":"\u003cp>The program below is run from a terminal as \u003ccode>./prog /bin/echo\u003c/code>, so the child becomes echo and prints B.\u003c/p>\u003cpre>\u003ccode>int main(int argc, char *argv[]) {\n    printf(\"A\\n\");\n    pid_t pid = fork();\n    if (pid == 0) {\n        char *args[] = {argv[1], \"B\", NULL};\n        execv(argv[1], args);\n        printf(\"C\\n\");\n        return 1;\n    }\n    printf(\"D\\n\");\n    wait(NULL);\n    printf(\"E\\n\");\n    return 0;\n}\u003c/code>\u003c/pre>\u003cp>Which statement about the order of the output lines is correct?\u003c/p>","opts":["B always appears before D; E is always the last line.","D always appears before B; E may appear before B.","The order of B and D is not determined; E is always the last line.","The order of B and D is not determined, and E may appear before B."],"ans":2,"exp":"\u003cp>fork 之後 parent（印 D）和 child（exec echo 印 B）是兩個可同時執行的 process，誰先由 scheduler 決定 → B、D 的順序\u003cb>不一定\u003c/b>。\u003c/p>\u003cp>E 在 wait(NULL) 之後：wait 回來代表 child（echo）已經結束、B 一定已經印完，所以 E 一定是最後一行。\u003c/p>"},{"id":"w3-20","week":"W3","topic":"GLIBC_2.34 not found","src":"原題 W3-20","group":"W3-20","type":"single","q":"\u003cp>You copy a program you built on your laptop to an older server. Running it there prints \u003ccode>version 'GLIBC_2.34' not found\u003c/code>. Which statement explains this?\u003c/p>","opts":["The program is statically linked, so it carries the libc from your laptop.","The program is dynamically linked, so at run time it uses the libc installed on the other machine.","The program is dynamically linked, so it carries a copy of the libc from your laptop.","The program is statically linked, so the kernel refuses to run it on another machine."],"ans":1,"exp":"\u003cp>動態連結的執行檔只記錄「需要 libc.so.6（版本 ≥ GLIBC_2.34）」，執行時由 dynamic loader 在\u003cb>那台機器\u003c/b>上找 libc。舊機器的 libc 太舊 → 找不到需要的版本。靜態連結（Go / Rust 的單一執行檔）就不會遇到。\u003c/p>"},{"id":"w4-n11","week":"W4","topic":"為什麼 kernel map 在每個 address space","src":"新題（講義 W4 Part 3）","group":"W4-as","type":"single","q":"\u003cp>Why does the kernel map itself into the top of every process's address space instead of living in a separate address space?\u003c/p>","opts":["So that user programs can call kernel functions directly","Because each process needs its own private copy of the kernel code","So that a trap can start running the handler without switching address spaces, which makes system calls much faster","So that root processes can read kernel memory"],"ans":2,"exp":"\u003cp>目前的 page table 本來就有 kernel 的映射 → trap 進來不用換 page table，直接執行 handler，system call 從幾千 ns 降到幾百 ns。那些頁標成 kernel-only，user mode 碰不到；所有 process 都 map 到\u003cb>同一份\u003c/b>實體 kernel code，只有 kernel stack 是每個 process 各一份。代價：安全性依賴硬體正確檢查權限（Meltdown 時硬體出包，KPTI 用效能換回隔離）。\u003c/p>"},{"id":"w3-19","week":"W3","topic":"Double fork / daemon","src":"原題 W3-19","group":"W3-19","type":"single","q":"\u003cpre>\u003ccode>int main(void) {\n    if (fork() == 0) {                   // C\n        setsid();\n        if (fork() == 0) run_server();   // G: runs for a long time\n        exit(0);\n    }\n    wait(NULL);                          // P\n    return 0;\n}\u003c/code>\u003c/pre>\u003cp>After C has exited and P has reaped it and returned, who is G's parent, and who will reap G when it finally exits?\u003c/p>","opts":["G's parent is C; C reaps it","G's parent is P; P reaps it","G's parent is init; init reaps it","G has no parent; the kernel deletes it immediately"],"ans":2,"exp":"\u003cp>這是 double fork：C fork 出 G 後馬上 exit，P 用 wait 收掉 C。G 的 parent（C）不見了 → G 成為刻意製造的 orphan，PPID 變成 1，由 \u003cb>init\u003c/b> 收養；G 結束時也由 init reap。\u003c/p>\u003cp>setsid() 讓它脫離終端機，第二次 fork 讓它不會再取得控制終端機。這是傳統 daemon 的做法（現在多半交給 systemd service）。\u003c/p>","cprog":"w3_fork w3-19","cexpect":"1"},{"id":"w6-02","week":"W6","topic":"由 timeline 算 turnaround","src":"新題（依講義 W6 Part 2）","group":"W6-metric","type":"fill","q":"\u003cp>Job X arrives at t = 3 ms. The CPU timeline is: another job runs 0–6; X runs 6–8; another job runs 8–10; X runs 10–13 and finishes. What is X's \u003cb>turnaround\u003c/b> time, in ms?\u003c/p>","ans":["10","10 ms"],"exp":"\u003cp>turnaround = done − arrive = 13 − 3 = \u003cb>10\u003c/b> ms。（response = 第一次執行 − 抵達 = 6 − 3 = 3；waiting = turnaround − burst = 10 − 5 = 5。）\u003c/p>","calc":{"fn":"timeline","arrive":3,"runs":[[6,8],[10,13]],"metric":"turnaround"}},{"id":"w2-19a","week":"W2","topic":"碰觸頁面與 frame 數","src":"原題 W2-19 ⚠️","group":"W2-19","type":"fill","q":"\u003cp>Page size is 4096 bytes. A program maps 64 KiB (16 pages) that it has not touched yet. It then writes one byte at each of these offsets, in order: 0, 100, 20000, 65000. After all four writes, how many physical frames does this region use?\u003c/p>","ans":["3"],"exp":"\u003cp>頁號 = offset ÷ 4096 取整數：0 → 第 0 頁、100 → 第 0 頁、20000 → 第 4 頁、65000 → 第 15 頁。前兩次都在第 0 頁（此時只有 1 個 frame）；四次寫完共碰了 0、4、15 三頁 → \u003cb>3\u003c/b> 個 frame。frame 數只看碰到幾個「不同的頁」，跟 offset 數字大小無關（原答 21275 錯）。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[0,100,20000,65000],"unit":"count"}},{"id":"w6-10","week":"W6","topic":"RR q = 1：平均 turnaround","src":"新題（依講義 W6 Part 5）","group":"W6-rr","type":"fill","q":"\u003cp>Three jobs A, B, C each need 3 ms and all arrive at t = 0 (queue order A, B, C). Under \u003cb>round robin\u003c/b> with q = 1 ms and free context switches, what is the average turnaround time, in ms?\u003c/p>","ans":["8","8 ms"],"exp":"\u003cp>A B C A B C A B C，每格 1 ms：A 在 7 完成、B 在 8、C 在 9 → 平均 \u003cb>8\u003c/b> ms。若用 FIFO：3、6、9 → 平均 6。平均 response：RR 是 (0 + 1 + 2)/3 = 1，FIFO 是 3。RR 用 turnaround 換 response。\u003c/p>","calc":{"fn":"sched","policy":"rr","q":1,"jobs":[["A",0,3],["B",0,3],["C",0,3]],"metric":"avgTurnaround"}},{"id":"w3-07","week":"W3","topic":"fork 的回傳值","src":"原題 W3-07","group":"W3-07","type":"single","q":"\u003cp>\u003ccode>pid_t p = fork();\u003c/code> Assuming fork succeeds, what is \u003ccode>p\u003c/code> in the parent and in the child?\u003c/p>","opts":["In the parent: the child's PID; in the child: 0","In the parent: 0; in the child: the parent's PID","In each process: its own PID","In the parent: 1; in the child: 0"],"ans":0,"exp":"\u003cp>fork 回傳給 parent 的是 child 的 PID，回傳給 child 的是 0；失敗時 parent 得到 −1、不會產生 child。回傳值是兩個 process 唯一能分辨「我是誰」的資訊。child 要知道 parent 的 PID 用 \u003ccode>getppid()\u003c/code>。\u003c/p>"},{"id":"w6-14","week":"W6","topic":"連續預測兩次 burst","src":"新題（依講義 W6 Part 4）","group":"W6-pred","type":"fill","q":"\u003cp>Using \u003ccode>next guess = α × last burst + (1 − α) × previous guess\u003c/code> with α = ½ and an initial guess of 10 ms, a process then has two CPU bursts of 6 ms and 4 ms, in that order. What is the guess after the second burst, in ms?\u003c/p>","ans":["6","6 ms"],"exp":"\u003cp>第一次更新：½ × 6 + ½ × 10 = 8。第二次更新：½ × 4 + ½ × 8 = \u003cb>6\u003c/b> ms。一直出現短 burst 的 process，猜測值很快就變短，SJF / STCF 就會優先排它。\u003c/p>","calc":{"fn":"predict","alpha":0.5,"guess":10,"bursts":[6,4]}},{"id":"w3-12","week":"W3","topic":"Orphan","src":"原題 W3-12","group":"W3-12","type":"single","q":"\u003cp>A parent exits before its child. \u003ccode>ps\u003c/code> shows the child still running, now with PPID 1. What kind of process is the child, and what happens when it exits later?\u003c/p>","opts":["A zombie; it stays in the process table until the machine reboots","An orphan; init reaps it, and its row leaves the process table","A daemon; it can never exit","An orphan; it stays a zombie forever because its original parent is gone"],"ans":1,"exp":"\u003cp>parent 先結束、child 還在跑 → \u003cb>orphan\u003c/b>。kernel 把它的 PPID 改成 1，由 init（systemd）收養；init 會替它 wait，所以 child 結束時那一列會被收掉，不會永遠留下 zombie。這是正常、有用的機制。\u003c/p>"},{"id":"w4-n02","week":"W4","topic":"四種 exception：哪些是 fault","src":"新題（講義 W4 Part 5）","group":"W4-exc","type":"multi","q":"\u003cp>Which of the following events are \u003cb>faults\u003c/b>? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>int x = 0; printf(\"%d\", 10 / x);\u003c/code>","The first write to a page obtained with \u003ccode>malloc(1 &lt;&lt; 20)\u003c/code>","\u003ccode>read(0, buf, 1)\u003c/code>","A timer tick","\u003ccode>asm(\"hlt\");\u003c/code> in a user program","The program reaches a gdb breakpoint (int3)","A network packet arrives"],"ans":[0,1,4],"exp":"\u003cp>四類 exception：\u003cb>trap\u003c/b> = 程式故意的（system call、gdb 插入的 int3）；\u003cb>fault\u003c/b> = 指令意外出錯（除以 0、page fault、user mode 執行特權指令）；\u003cb>interrupt\u003c/b> = 外部裝置（timer、鍵盤、網路卡）；\u003cb>abort\u003c/b> = 硬體損壞（無法修正的記憶體錯誤 → kernel panic）。\u003c/p>\u003cp>page fault 修得好就重試（malloc 的頁），除以 0 和 hlt 修不好 → 送 signal 終止。\u003c/p>"},{"id":"w6-25","week":"W6","topic":"RR 的 slice 長度","src":"新題（依講義 W6 Part 5）","group":"W6-slice","type":"single","q":"\u003cp>What happens to round robin when the time slice is made very large, and when it is made very small?\u003c/p>","opts":["Very large: RR behaves like FIFO and response time gets bad. Very small: a large share of the CPU is wasted on context switches.","Very large: more context switches. Very small: RR behaves like FIFO.","Very large: RR behaves like SJF. Very small: response time gets worse.","The slice length does not matter as long as switches are free."],"ans":0,"exp":"\u003cp>slice 大到每個工作都能一次跑完 → 就是 FIFO，後面的人要等很久才第一次跑到（response 差）。slice 很小 → response 好，但切換次數暴增，CPU 很大一部分花在切換（講義例子：q = 0.5 ms 時浪費 29%）。slice 要遠大於切換成本、又短到人感覺不到。\u003c/p>"},{"id":"w4-v03","week":"W4","topic":"Function call 改了什麼","src":"變化題（源自 W4-03）","group":"W4-03","type":"single","q":"\u003cp>A program calls an ordinary C function \u003ccode>meow(3)\u003c/code>. Which of the following does the call change?\u003c/p>","opts":["Only the program counter and the stack pointer","The mode bit and the program counter","The address space, because the function's code is in another region","The program counter, the stack pointer and the mode bit"],"ans":0,"exp":"\u003cp>function call 把參數、區域變數空間和 return address 推進 user stack（改 SP），然後跳到函式（改 PC）——就這樣，約 1 ns。不改 mode bit、不換 address space、不用 kernel stack。system call 則要另外切 mode、換用 kernel stack，所以貴很多。\u003c/p>"},{"id":"w4-n10","week":"W4","topic":"Timer tick 的間隔換數字","src":"新題（講義 W4 Part 6）","group":"W4-timer","type":"fill","q":"\u003cp>A 3.4 GHz CPU runs a kernel configured for 250 timer ticks per second. How many clock cycles pass between two ticks?\u003c/p>","ans":["13600000","13,600,000","13.6 million"],"exp":"\u003cp>3.4 × 10⁹ cycles/s ÷ 250 = \u003cb>13,600,000\u003c/b> cycles（tick 間隔 4 ms）。處理一次 tick 約 1 µs，只佔 4 ms 的 0.025%，timer interrupt 很便宜。（講義的例子是 1000 ticks/s → 3.4 million cycles。）\u003c/p>","calc":{"fn":"cycles","ghz":3.4,"hz":250}},{"id":"w6-22","week":"W6","topic":"Cooperative 的 scheduling point","src":"新題（依講義 W6 Part 3）","group":"W6-preempt","type":"multi","q":"\u003cp>At which moments can a \u003cb>cooperative\u003c/b> (non-preemptive) scheduler pick a new process to run? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The running process blocks, e.g. it calls read() and must wait (running → waiting)","The running process exits","A timer tick fires because the time slice is used up (running → ready)","Another process's I/O completes and it wakes up (waiting → ready)"],"ans":[0,1],"exp":"\u003cp>四個 scheduling point：① running → waiting（自己 block）② timer tick ③ I/O 完成、有人醒來 ④ exit。cooperative 只能在 process \u003cb>自己\u003c/b>交出 CPU 時決定：① 和 ④（或呼叫 yield）。preemptive 還能在 ②、③ 把 CPU 搶過來——這需要 timer interrupt。\u003c/p>"},{"id":"w5-v09b","week":"W5","topic":"Python：communicate()","src":"變化題（源自 W5-09）","group":"W5-09","type":"single","q":"\u003cp>A Python program runs a command whose stdout and stderr can each be several megabytes, using \u003ccode>p = subprocess.Popen(cmd, stdout=PIPE, stderr=PIPE)\u003c/code>. Which way of collecting the output cannot deadlock?\u003c/p>","opts":["\u003ccode>p.wait()\u003c/code>, then \u003ccode>p.stdout.read()\u003c/code> and \u003ccode>p.stderr.read()\u003c/code>","\u003ccode>p.stdout.read()\u003c/code>, then \u003ccode>p.stderr.read()\u003c/code>, then \u003ccode>p.wait()\u003c/code>","\u003ccode>out, err = p.communicate()\u003c/code>","\u003ccode>p.wait(timeout=600)\u003c/code>, then read both"],"ans":2,"exp":"\u003cp>(a)(d) 先 wait：輸出超過 64 KiB 就 deadlock（加 timeout 只是把 deadlock 變成「逾時」，誤導人以為指令太慢）。(b) 先把 stdout 讀到 EOF：如果 child 先在 stderr 寫滿 64 KiB，它卡在 write(2)，stdout 永遠等不到 EOF → 一樣卡住。\u003c/p>\u003cp>communicate() 會\u003cb>同時\u003c/b>讀兩條 pipe 直到 EOF，然後才 wait → 不會卡（Python 文件推薦）。\u003c/p>"}]</script>
<script>
(function () {
  'use strict';
  var QS = JSON.parse(document.getElementById('qdata').textContent);
  var KEY = 'os-midterm-practice-2026';
  var LET = 'abcdefghij';
  var TYPE = { single: '單選', multi: '多選', fill: '填充' };

  // ---------- 狀態（localStorage 讀寫都包 try/catch） ----------
  // ans[id] = 目前這題的作答 {r, ok}；hist[id] = 這題答錯過幾次（重做後也保留）
  // mode: all / wrong / ever / redo；redo = 這一輪要重做的題目 id
  function fresh() { return { ans: {}, hist: {}, cur: QS.length ? QS[0].id : null, mode: 'all', redo: [], grid: false }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object' && s.ans && typeof s.ans === 'object') return s;
    } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var st = load();
  var byId = {};
  QS.forEach(function (q, i) { byId[q.id] = i; });
  // 舊版紀錄相容：補上新欄位、丟掉對不上的紀錄
  if (!st.hist || typeof st.hist !== 'object') st.hist = {};
  if (!st.mode) st.mode = st.wrongOnly ? 'wrong' : 'all';
  delete st.wrongOnly;
  if (!Array.isArray(st.redo)) st.redo = [];
  Object.keys(st.ans).forEach(function (id) {
    var q = QS[byId[id]], r = st.ans[id] && st.ans[id].r;
    var fits = q && (q.type === 'fill' ? typeof r === 'string'
      : q.type === 'single' ? typeof r === 'number' && r < q.opts.length
      : Array.isArray(r) && r.every(function (i) { return i < q.opts.length; }));
    if (!fits) delete st.ans[id];
    else if (!st.ans[id].ok && !st.hist[id]) st.hist[id] = 1;
  });
  Object.keys(st.hist).forEach(function (id) { if (!(id in byId)) delete st.hist[id]; });
  st.redo = st.redo.filter(function (id) { return id in byId; });
  if (st.mode === 'redo' && !st.redo.length) st.mode = 'all';
  if (!(st.cur in byId)) st.cur = QS.length ? QS[0].id : null;

  var draft = {};   // 尚未送出的選擇（不存檔）

  // ---------- 答案比對 ----------
  function norm(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/\s*,\s*/g, ',');
  }
  function asNum(s) {
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : null;
  }
  function fillCorrect(input, accepted) {
    var a = norm(input);
    if (!a) return false;
    var na = asNum(a);
    return accepted.some(function (x) {
      var b = norm(x);
      if (a === b) return true;
      var nb = asNum(b);
      return na !== null && nb !== null && Math.abs(na - nb) < 1e-9;
    });
  }
  function grade(q, resp) {
    if (q.type === 'fill') return fillCorrect(resp, q.ans);
    if (q.type === 'single') return resp === q.ans;
    var a = (resp || []).slice().sort(), b = q.ans.slice().sort();
    return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
  }

  // ---------- 清單與統計 ----------
  function idxWhere(f) { var out = []; QS.forEach(function (q, i) { if (f(q)) out.push(i); }); return out; }
  function isWrong(q) { var r = st.ans[q.id]; return !!(r && !r.ok); }
  function wrongList() { return idxWhere(isWrong); }
  function list() {
    if (st.mode === 'wrong') return wrongList();
    if (st.mode === 'ever') return idxWhere(function (q) { return st.hist[q.id] > 0; });
    if (st.mode === 'redo') return st.redo.map(function (id) { return byId[id]; });
    return QS.map(function (_, i) { return i; });
  }
  function stats() {
    var n = 0, ok = 0, bad = 0;
    QS.forEach(function (q) { var r = st.ans[q.id]; if (r) { n++; if (r.ok) ok++; else bad++; } });
    return { n: n, ok: ok, bad: bad };
  }
  function cellClass(q) {
    var r = st.ans[q.id];
    if (!r) return '';
    if (!r.ok) return ' bad';
    return st.hist[q.id] > 0 ? ' fixed' : ' ok';
  }

  var $ = function (id) { return document.getElementById(id); };
  function h(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escT(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- 畫面 ----------
  function renderStats() {
    var s = stats();
    $('sAns').textContent = s.n;
    $('sTot').textContent = QS.length;
    $('sOk').textContent = s.ok;
    $('sBad').textContent = s.bad;
    $('sAcc').textContent = s.n ? Math.round(s.ok / s.n * 1000) / 10 + '%' : '–';
    $('pbar').style.width = (QS.length ? s.n / QS.length * 100 : 0) + '%';
  }

  function renderToolbar() {
    $('fAll').setAttribute('aria-pressed', st.mode === 'all' ? 'true' : 'false');
    $('fWrong').setAttribute('aria-pressed', st.mode === 'wrong' ? 'true' : 'false');
    $('fEver').setAttribute('aria-pressed', st.mode === 'ever' ? 'true' : 'false');
    var w = stats().bad;
    var b = $('bRedo');
    b.textContent = '重做錯題' + (w ? '（' + w + '）' : '');
    b.disabled = !w;
  }

  function renderBanner() {
    var box = $('banner');
    box.innerHTML = '';
    if (st.mode !== 'redo') return;
    var total = st.redo.length, done = 0, ok = 0;
    st.redo.forEach(function (id) { var r = st.ans[id]; if (r) { done++; if (r.ok) ok++; } });
    var bad = done - ok;
    var bn = h('div', 'banner');
    bn.appendChild(h('span', null, '錯題重做：已作答 <b>' + done + '</b> / <b>' + total + '</b>，訂正 <b>' + ok + '</b> 題' + (bad ? '，仍答錯 <b>' + bad + '</b> 題' : '')));
    if (done === total) {
      bn.appendChild(h('span', null, bad ? '— 這一輪做完了。' : '— 全部訂正！🎉'));
      if (bad) {
        var again = h('button', 'tbtn redo', '再重做仍答錯的 ' + bad + ' 題');
        again.id = 'bRedoAgain';
        again.addEventListener('click', startRedo);
        bn.appendChild(again);
      }
    }
    var exit = h('button', 'tbtn', '結束重做');
    exit.id = 'bRedoExit';
    exit.addEventListener('click', function () { setMode('all'); });
    bn.appendChild(exit);
    box.appendChild(bn);
  }

  function renderGrid() {
    var g = $('grid');
    $('bGrid').setAttribute('aria-pressed', st.grid ? 'true' : 'false');
    g.hidden = !st.grid;
    if (!st.grid) return;
    g.innerHTML = '';
    var label = { all: '', wrong: '（目前只顯示答錯的題目）', ever: '（目前只顯示曾經答錯的題目）', redo: '（目前只顯示這一輪要重做的題目）' }[st.mode];
    g.appendChild(h('div', 'legend',
      '<span><i style="background:var(--cell)"></i>未作答</span>' +
      '<span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>答對</span>' +
      '<span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>答錯</span>' +
      '<span><i style="background:var(--fix-soft);border:1px solid var(--fix)"></i>重做後答對</span>' +
      (label ? '<span>' + label + '</span>' : '')));
    var L = list();
    if (!L.length) { g.appendChild(h('div', 'empty', emptyText())); return; }
    var wrap = h('div', 'cells');
    L.forEach(function (i) {
      var q = QS[i];
      var b = h('button', 'cell' + cellClass(q) + (q.id === st.cur ? ' cur' : ''), String(i + 1));
      b.title = '第 ' + (i + 1) + ' 題';
      b.addEventListener('click', function () { go(q.id); });
      wrap.appendChild(b);
    });
    g.appendChild(wrap);
  }

  function emptyText() {
    return { wrong: '目前沒有答錯的題目。', ever: '還沒有答錯過的題目。', redo: '沒有要重做的題目。', all: '沒有題目。' }[st.mode];
  }

  function renderCard() {
    var card = $('card');
    card.innerHTML = '';
    var L = list();
    if (!L.length) {
      card.appendChild(h('div', 'empty', emptyText() + (st.mode !== 'all' ? ' 按「全部」可回到全部題目。' : '')));
      $('pos').textContent = '';
      $('bPrev').disabled = $('bNext').disabled = true;
      return;
    }
    var idx = byId[st.cur];
    if (L.indexOf(idx) < 0) { idx = L[0]; st.cur = QS[idx].id; }
    var q = QS[idx], rec = st.ans[q.id], locked = !!rec;
    var p = L.indexOf(idx);
    var prefix = { all: '', wrong: '錯題 ', ever: '曾錯 ', redo: '重做 ' }[st.mode];
    $('pos').textContent = st.mode === 'all' ? (idx + 1) + ' / ' + QS.length : prefix + (p + 1) + ' / ' + L.length;
    $('bPrev').disabled = p <= 0;
    $('bNext').disabled = p >= L.length - 1;

    var head = h('div', 'qhead');
    head.appendChild(h('span', 'qno', '第 ' + (idx + 1) + ' 題'));
    head.appendChild(h('span', 'badge', TYPE[q.type]));
    if (!locked && st.hist[q.id] > 0) head.appendChild(h('span', 'badge again', '重做'));
    head.appendChild(h('span', 'of', '共 ' + QS.length + ' 題'));
    card.appendChild(head);
    card.appendChild(h('div', 'stem', q.q));

    var resp = locked ? rec.r : draft[q.id];
    var body;
    if (q.type === 'fill') {
      body = h('div', 'fillrow');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'fill'; inp.id = 'fillIn';
      inp.placeholder = '輸入答案'; inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.setAttribute('autocapitalize', 'off');
      inp.value = resp || '';
      if (locked) { inp.disabled = true; inp.classList.add(rec.ok ? 'okv' : 'badv'); }
      inp.addEventListener('input', function () { draft[q.id] = inp.value; updateSubmit(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!st.ans[q.id]) submit(); else next(); }
      });
      body.appendChild(inp);
    } else {
      body = h('div', 'opts' + (locked ? ' locked' : ''));
      var multi = q.type === 'multi';
      q.opts.forEach(function (o, i) {
        var lab = h('label', 'opt');
        var inp = document.createElement('input');
        inp.type = multi ? 'checkbox' : 'radio';
        inp.name = 'opt'; inp.value = i;
        var chosen = multi ? (resp || []).indexOf(i) >= 0 : resp === i;
        inp.checked = chosen;
        if (chosen && !locked) lab.classList.add('sel');
        var isAns = multi ? q.ans.indexOf(i) >= 0 : q.ans === i;
        if (locked) {
          inp.disabled = true;
          if (isAns) lab.classList.add('is-correct');
          else if (chosen) lab.classList.add('is-wrong');
        }
        lab.appendChild(inp);
        lab.appendChild(h('span', 'ol', '(' + LET[i] + ')'));
        lab.appendChild(h('span', 'ot', o));
        if (locked) {
          if (isAns) lab.appendChild(h('span', 'mark', '✓'));
          else if (chosen) lab.appendChild(h('span', 'mark', '✗'));
        }
        inp.addEventListener('change', function () { pick(q, i); });
        body.appendChild(lab);
      });
    }
    card.appendChild(body);

    var act = h('div', 'actions');
    var sb = h('button', 'primary', locked ? '已送出' : '送出');
    sb.id = 'bSubmit';
    sb.addEventListener('click', submit);
    act.appendChild(sb);
    if (!locked && q.type === 'multi') act.appendChild(h('span', 'small', '多選題：全部選對才算對'));
    if (!locked && q.type === 'fill') act.appendChild(h('span', 'small', '不分大小寫、忽略前後空白'));
    card.appendChild(act);
    updateSubmit();

    if (locked) card.appendChild(resultBox(q, rec));
  }

  function answerText(q) {
    if (q.type === 'fill') {
      var s = '<code>' + escT(q.ans[0]) + '</code>';
      if (q.ans.length > 1) s += ' <span class="small">（也接受：' + q.ans.slice(1).map(function (a) { return '<code>' + escT(a) + '</code>'; }).join('、') + '）</span>';
      return s;
    }
    var arr = q.type === 'multi' ? q.ans.slice().sort() : [q.ans];
    return arr.map(function (i) { return '(' + LET[i] + ')'; }).join(' ');
  }
  function respText(q, r) {
    if (q.type === 'fill') return '<code>' + escT(r) + '</code>';
    var arr = q.type === 'multi' ? (r || []).slice().sort() : [r];
    return arr.length ? arr.map(function (i) { return '(' + LET[i] + ')'; }).join(' ') : '（未選）';
  }
  function resultBox(q, rec) {
    var box = h('div', 'result');
    var vr = h('div', 'vrow');
    vr.appendChild(h('span', 'verdict ' + (rec.ok ? 'ok' : 'bad'), rec.ok ? '✓ 答對了' : '✗ 答錯了'));
    var n = st.hist[q.id] || 0;
    if (rec.ok && n > 0) vr.appendChild(h('span', 'note', '之前答錯 ' + n + ' 次，這次訂正了'));
    if (!rec.ok) {
      var rb = h('button', 'tbtn redo', '重做這題');
      rb.id = 'bRedoOne';
      rb.addEventListener('click', function () { redoOne(q.id); });
      vr.appendChild(rb);
    }
    box.appendChild(vr);
    box.appendChild(h('div', 'kv', '<span class="k">正確答案：</span>' + answerText(q)));
    if (!rec.ok) box.appendChild(h('div', 'kv', '<span class="k">你的答案：</span>' + respText(q, rec.r)));
    var meta = h('div', 'meta');
    meta.appendChild(h('span', 'tag wk', q.week));
    meta.appendChild(h('span', 'tag', escT(q.topic)));
    meta.appendChild(h('span', 'tag', escT(q.src)));
    box.appendChild(meta);
    box.appendChild(h('div', 'exp', q.exp));
    return box;
  }

  function currentQ() { return QS[byId[st.cur]]; }
  function hasResp(q) {
    var r = draft[q.id];
    if (q.type === 'fill') return !!(r && r.trim());
    if (q.type === 'single') return typeof r === 'number';
    return !!(r && r.length);
  }
  function updateSubmit() {
    var b = $('bSubmit'), q = currentQ();
    if (!b || !q) return;
    b.disabled = !!st.ans[q.id] || !hasResp(q);
  }
  function pick(q, i) {
    if (st.ans[q.id]) return;
    if (q.type === 'single') draft[q.id] = i;
    else {
      var a = (draft[q.id] || []).slice(), k = a.indexOf(i);
      if (k >= 0) a.splice(k, 1); else a.push(i);
      draft[q.id] = a;
    }
    var labs = document.querySelectorAll('#card .opt');
    labs.forEach(function (lab, j) {
      var on = q.type === 'single' ? draft[q.id] === j : draft[q.id].indexOf(j) >= 0;
      lab.classList.toggle('sel', on);
      lab.querySelector('input').checked = on;
    });
    updateSubmit();
  }
  function submit() {
    var q = currentQ();
    if (!q || st.ans[q.id] || !hasResp(q)) return;
    var r = draft[q.id];
    if (q.type === 'fill') r = r.trim();
    var ok = grade(q, r);
    st.ans[q.id] = { r: r, ok: ok };
    if (!ok) st.hist[q.id] = (st.hist[q.id] || 0) + 1;
    delete draft[q.id];
    save();
    render();
    var res = document.querySelector('#card .result');
    if (res && res.getBoundingClientRect().top > window.innerHeight - 120) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- 重做 ----------
  function redoOne(id) {
    delete st.ans[id];
    delete draft[id];
    save(); render();
    var f = $('fillIn');
    if (f && window.matchMedia('(min-width: 700px)').matches) f.focus();
  }
  function startRedo() {
    var ids = wrongList().map(function (i) { return QS[i].id; });
    if (!ids.length) return;
    ids.forEach(function (id) { delete st.ans[id]; delete draft[id]; });
    st.redo = ids;
    st.mode = 'redo';
    st.cur = ids[0];
    save(); render();
    window.scrollTo(0, 0);
  }
  function setMode(m) {
    if (st.mode === 'redo' && m !== 'redo') st.redo = [];
    st.mode = m;
    var L = list();
    if (L.length && L.indexOf(byId[st.cur]) < 0) st.cur = QS[L[0]].id;
    save(); render();
  }

  function go(id) {
    st.cur = id; save(); render();
    window.scrollTo(0, 0);
    var f = $('fillIn');
    if (f && !f.disabled && window.matchMedia('(min-width: 700px)').matches) f.focus();
  }
  function step(d) {
    var L = list(), p = L.indexOf(byId[st.cur]);
    var np = p + d;
    if (np >= 0 && np < L.length) go(QS[L[np]].id);
  }
  function next() { step(1); }

  function render() { renderStats(); renderToolbar(); renderBanner(); renderCard(); renderGrid(); }

  // ---------- 事件 ----------
  $('bPrev').addEventListener('click', function () { step(-1); });
  $('bNext').addEventListener('click', next);
  $('bGrid').addEventListener('click', function () { st.grid = !st.grid; save(); renderGrid(); });
  $('fAll').addEventListener('click', function () { setMode('all'); });
  $('fWrong').addEventListener('click', function () { setMode('wrong'); });
  $('fEver').addEventListener('click', function () { setMode('ever'); });
  $('bRedo').addEventListener('click', startRedo);
  $('bReset').addEventListener('click', function () {
    if (!confirm('確定要清除全部作答紀錄（包括錯題紀錄），從頭開始嗎？')) return;
    var g = st.grid;
    st = fresh(); st.grid = g; draft = {};
    save(); render(); window.scrollTo(0, 0);
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' && t.type === 'text' || t.tagName === 'TEXTAREA')) return;
    var q = currentQ();
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 'Enter' && q) {
      if (t && t.tagName === 'BUTTON') return;
      e.preventDefault();
      if (st.ans[q.id]) next(); else submit();
    } else if (q && q.type !== 'fill' && !st.ans[q.id] && /^[1-9]$/.test(e.key)) {
      var i = +e.key - 1;
      if (i < q.opts.length) pick(q, i);
    }
  });

  render();
})();
</script>
</body>
</html>
