<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS 期中練習 · 第一回</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #677084; --border: #dde2ea;
  --accent: #2b67d6; --accent-soft: #e7effc; --ok: #17804a; --ok-soft: #e3f4ea;
  --bad: #c42c2c; --bad-soft: #fbe9e9; --fix: #b26a00; --fix-soft: #fdf1dc;
  --code-bg: #f0f2f5; --cell: #eceff3; --shadow: 0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161b; --card: #1c2027; --text: #e5e8ed; --muted: #98a1b0; --border: #2e343e;
    --accent: #6c9eff; --accent-soft: #1d2a42; --ok: #4fc487; --ok-soft: #163325;
    --bad: #ff7373; --bad-soft: #3a1c1c; --fix: #f0b048; --fix-soft: #3a2c12;
    --code-bg: #252a32; --cell: #262b33; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* header */
header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 10px 0 8px; flex-wrap: wrap; }
.title { font-weight: 700; font-size: 17px; margin-right: auto; }
.stats { display: flex; gap: 14px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--cell); }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; align-items: center; }
.tbtn {
  border: 1px solid var(--border); background: var(--card); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; min-height: 36px; text-decoration: none; color: var(--text);
  display: inline-flex; align-items: center;
}
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tbtn:disabled { opacity: .45; cursor: not-allowed; }
.tbtn.danger { color: var(--bad); }
.tbtn.redo { color: var(--fix); border-color: var(--fix); font-weight: 600; }
.seg { display: inline-flex; }
.seg .tbtn { border-radius: 0; margin-left: -1px; }
.seg .tbtn:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg .tbtn:last-child { border-radius: 0 8px 8px 0; }
.seg .tbtn[aria-pressed="true"] { position: relative; z-index: 1; }
.spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); width: 100%; }

/* redo banner */
.banner {
  border: 1px solid var(--fix); background: var(--fix-soft); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.banner b { font-variant-numeric: tabular-nums; }
.banner .tbtn { min-height: 32px; padding: 4px 10px; }

/* grid */
#grid { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
#grid .legend { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
#grid .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.cell {
  border: 1px solid transparent; background: var(--cell); border-radius: 6px; height: 34px;
  font-size: 13px; font-variant-numeric: tabular-nums; padding: 0;
}
.cell.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.cell.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.cell.fixed { background: var(--fix-soft); color: var(--fix); border-color: var(--fix); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.qno { font-weight: 700; font-size: 18px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge.again { background: var(--fix-soft); color: var(--fix); }
.qhead .of { color: var(--muted); font-size: 14px; margin-left: auto; }
.stem { overflow-wrap: anywhere; }
.stem p { margin: 0 0 10px; }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 10px 0; font-size: 14px; line-height: 1.5;
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .92em; }
:not(pre) > code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; white-space: nowrap; }
th { background: var(--code-bg); }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; cursor: pointer; background: var(--card); transition: border-color .1s, background .1s;
}
.opt:hover { border-color: var(--accent); }
.opt input { margin: 5px 0 0; flex: none; width: 17px; height: 17px; accent-color: var(--accent); }
.opt .ol { font-weight: 600; color: var(--muted); flex: none; min-width: 1.6em; }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .ot pre { margin: 4px 0; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.locked .opt { cursor: default; }
.locked .opt:hover { border-color: var(--border); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .mark { flex: none; font-weight: 700; }
.opt.is-correct .mark { color: var(--ok); }
.opt.is-wrong .mark { color: var(--bad); }

.fillrow { margin: 14px 0 4px; }
.fill {
  width: 100%; max-width: 420px; font: inherit; padding: 9px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
}
.fill:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fill.okv { border-color: var(--ok); background: var(--ok-soft); }
.fill.badv { border-color: var(--bad); background: var(--bad-soft); }

.actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.primary {
  background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 9px 22px; font-weight: 600; min-height: 42px;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 13px; color: var(--muted); }

.result { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
.vrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.verdict { font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.note { font-size: 13px; color: var(--fix); font-weight: 600; }
.kv { margin: 4px 0; overflow-wrap: anywhere; }
.kv .k { color: var(--muted); }
.meta { display: inline-flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--border); }
.tag.wk { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.exp { background: var(--code-bg); border-radius: 9px; padding: 10px 14px; overflow-wrap: anywhere; }
.exp p { margin: 0 0 8px; }
.exp p:last-child { margin-bottom: 0; }
.exp pre { background: var(--card); }

/* bottom nav */
.nav { display: flex; gap: 10px; justify-content: space-between; margin: 14px 0 28px; }
.nav button {
  flex: 1; max-width: 220px; border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 10px; min-height: 44px; font-weight: 600;
}
.nav button:disabled { opacity: .4; cursor: not-allowed; }
.nav .pos { align-self: center; color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 560px) {
  body { font-size: 15.5px; }
  .card { padding: 14px 13px; border-radius: 10px; }
  pre { font-size: 12.5px; padding: 8px 10px; }
  .hint { display: none; }
  .stats { gap: 10px; font-size: 13px; }
  .title { font-size: 16px; }
  .tbtn { padding: 6px 10px; }
  .nav { position: sticky; bottom: 0; background: var(--bg); margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .nav button { max-width: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="title">OS 期中練習 · 第一回</div>
      <div class="stats">
        <span>已作答 <b id="sAns">0</b> / <b id="sTot">0</b></span>
        <span>答對 <b id="sOk">0</b></span>
        <span>正確率 <b id="sAcc">–</b></span>
        <span>錯題 <b id="sBad">0</b></span>
      </div>
    </div>
  </div>
  <div class="bar"><div id="pbar"></div></div>
</header>

<main class="wrap">
  <div class="toolbar">
    <button class="tbtn" id="bGrid" aria-pressed="false">題號</button>
    <span class="seg" role="group" aria-label="篩選">
      <button class="tbtn" id="fAll" aria-pressed="true">全部</button>
      <button class="tbtn" id="fWrong" aria-pressed="false">只看答錯</button>
      <button class="tbtn" id="fEver" aria-pressed="false">曾經答錯</button>
    </span>
    <button class="tbtn redo" id="bRedo">重做錯題</button>
    <span class="spacer"></span>
    <a class="tbtn" id="otherSet" href="os-midterm-practice-2.html">第二回 →</a>
    <button class="tbtn danger" id="bReset">全部重來</button>
    <span class="hint">← → 換題 · Enter 送出 / 下一題 · 1–7 選選項 · 「重做錯題」把目前答錯的題目全部解鎖重新作答</span>
  </div>
  <div id="banner"></div>
  <div id="grid" hidden></div>
  <article class="card" id="card"></article>
  <div class="nav">
    <button id="bPrev">← 上一題</button>
    <span class="pos" id="pos"></span>
    <button id="bNext">下一題 →</button>
  </div>
</main>

<script id="qdata" type="application/json">[{"id":"w2-11b","week":"W2","topic":"PATH：怎麼讓 greet 直接能跑","src":"原題 W2-11 ⚠️","group":"W2-11","type":"multi","q":"\u003cp>niko's program \u003ccode>/home/niko/bin/greet\u003c/code> is \u003ccode>-rwxr-xr-x\u003c/code>, but typing \u003ccode>greet\u003c/code> prints \u003ccode>command not found\u003c/code>. PATH is \u003ccode>/usr/local/bin:/usr/bin:/bin\u003c/code>. Which changes let niko run the program by typing only \u003ccode>greet\u003c/code>? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["Add \u003ccode>export PATH=\"$PATH:/home/niko/bin\"\u003c/code> to ~/.bashrc and open a new terminal","Run \u003ccode>chmod +x /home/niko/bin/greet\u003c/code>","Copy greet into /usr/bin","\u003ccode>cd /home/niko/bin\u003c/code> first, then type \u003ccode>greet\u003c/code>","Run it once with sudo so the shell remembers it","Run \u003ccode>export PATH=\"$PATH:/home/niko/bin\"\u003c/code> in the current terminal"],"ans":[0,2,5],"exp":"\u003cp>關鍵：shell 只搜尋 PATH 裡的目錄。\u003c/p>\u003cp>(a) 寫進 ~/.bashrc、開新終端機 → 新 shell 的 PATH 包含 /home/niko/bin ✓\u003cbr>(c) /usr/bin 本來就在 PATH 裡 ✓\u003cbr>(f) 在目前終端機 export，當下這個 shell 立刻生效 ✓\u003c/p>\u003cp>(b) 本來就有 x 權限，問題不在權限。(d) PATH 裡沒有「.」，shell 不會搜尋目前目錄（要打 \u003ccode>./greet\u003c/code>）。(e) 沒有這種機制。\u003c/p>"},{"id":"w6-27","week":"W6","topic":"CFS 挑誰下一個跑","src":"新題（依講義 W6 Part 7）","group":"W6-cfs","type":"fill","q":"\u003cp>A CFS run queue holds these runnable processes and their vruntimes (ms): vim 14.2, bash 9.1, chrome 21.7, gcc 6.3, top 11.8. Which process does CFS run next? Type its name.\u003c/p>","ans":["gcc"],"exp":"\u003cp>CFS 永遠挑 vruntime \u003cb>最小\u003c/b>的——也就是到目前為止拿到最少（加權後）CPU 時間、最「落後」的那個 → gcc（6.3）。run queue 用紅黑樹依 vruntime 排序，最左邊的節點有快取指標，挑選是 O(1)。\u003c/p>"},{"id":"w4-n09","week":"W4","topic":"vDSO 能不能處理 read()","src":"新題（講義 W4 Part 7）","group":"W4-vdso","type":"single","q":"\u003cp>Could \u003ccode>read()\u003c/code> be served by the vDSO, the way \u003ccode>gettimeofday()\u003c/code> is?\u003c/p>","opts":["Yes, any system call can be moved into the vDSO","No, because read() is not a libc function","Yes, but only for regular files","No: read() may need device access, may block (which needs the scheduler), and depends on the process's fd table, which lives in the kernel"],"ans":3,"exp":"\u003cp>vDSO 只適用於「讀 kernel 維護的公開資料、不需要其他特權操作」的呼叫（時間、getcpu；getpid 原則上也可以）。read 要碰 I/O 裝置（只有 kernel mode 可以）、可能要睡覺等資料（需要 scheduler）、結果取決於 kernel 裡的 fd table → 一定要 trap 進 kernel。\u003c/p>"},{"id":"w2-12","week":"W2","topic":"路徑解析與目錄的 x 權限","src":"原題 W2-12 ⚠️","group":"W2-12","type":"single","q":"\u003cp>None of these paths has been looked up yet (nothing is cached):\u003c/p>\u003cpre>\u003ccode>/                         inode 2\n/home                     inode 100\n/home/nini                inode 137\n/home/nini/catfood        inode 198\n/home/nini/catfood/fish   inode 259\u003c/code>\u003c/pre>\u003cp>A program calls \u003ccode>open(\"/home/nini/catfood/fish\", O_RDONLY)\u003c/code>. (1) How many directories' contents must the kernel read to find fish's inode number? (2) On how many directories must the kernel check execute (x) permission?\u003c/p>","opts":["(1) 4; (2) 3","(1) 5; (2) 5","(1) 4; (2) 4","(1) 3; (2) 4"],"ans":2,"exp":"\u003cp>路徑解析一次走一層：讀 / 的內容找到 home → 讀 /home 找到 nini → 讀 /home/nini 找到 catfood → 讀 /home/nini/catfood 找到 fish(259)。共讀 \u003cb>4\u003c/b> 個目錄。\u003c/p>\u003cp>要「穿過」一個目錄、在裡面查名字，就需要這個目錄的 x（search）權限。/、/home、/home/nini、/home/nini/catfood 四個都要穿過 → \u003cb>4\u003c/b> 個（原答 3 錯：最後一層 catfood 也要 x 才能在裡面找到 fish）。fish 是檔案本身，open 檢查的是它的 r。\u003c/p>","calc":{"fn":"pathWalk","path":"/home/nini/catfood/fish","expect":[4,4]}},{"id":"w3-14a","week":"W3","topic":"fork 計數：Hi 行數","src":"原題 W3-14","group":"W3-14","type":"fill","q":"\u003cp>How many lines of \u003ccode>Hi\u003c/code> does this program print? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>pid_t pid1 = fork();\npid_t pid2 = fork();\nif (pid1 == 0) { exit(0); } else { fork(); }\nif (pid2 == 0) { printf(\"Hi\\n\"); }\nreturn 0;\u003c/code>\u003c/pre>","ans":["2"],"exp":"\u003cp>兩次 fork 後有 4 個 process，(pid1, pid2) 分別是 (&gt;0,&gt;0)、(&gt;0,0)、(0,&gt;0)、(0,0)。\u003c/p>\u003cp>pid1 == 0 的兩個直接 exit。剩下 (&gt;0,&gt;0) 和 (&gt;0,0) 各再 fork 一次，新 child 繼承同樣的 pid2。pid2 == 0 的是 (&gt;0,0) 和它剛 fork 出的 child → 印 \u003cb>2\u003c/b> 行。\u003c/p>","cprog":"w3_fork w3-14 (tty)"},{"id":"w2-v12a","week":"W2","topic":"路徑解析：要檢查幾個目錄的 x","src":"變化題（源自 W2-12 ⚠️）","group":"W2-12","type":"fill","q":"\u003cp>Nothing is cached. A program calls \u003ccode>open(\"/srv/www/site/img/logo.png\", O_RDONLY)\u003c/code>. On how many directories must the kernel check execute (x) permission while resolving this path?\u003c/p>","ans":["5"],"exp":"\u003cp>要穿過的目錄：/、/srv、/srv/www、/srv/www/site、/srv/www/site/img，共 \u003cb>5\u003c/b> 個。每穿過一個目錄都要它的 x 權限，也要讀它的內容找下一個名字。logo.png 是檔案本身，檢查的是 r（O_RDONLY），不是 x。\u003c/p>\u003cp>規則：絕對路徑有 k 個名字時，要穿過 k 個目錄（/ 加上前 k−1 個名字）。\u003c/p>","calc":{"fn":"pathWalk","path":"/srv/www/site/img/logo.png"}},{"id":"w4-v04b","week":"W4","topic":"Zero page：讀寫各 1000 次有幾次 fault","src":"變化題（源自 W4-04 ⚠️）","group":"W4-04","type":"fill","q":"\u003cp>A virtual page is already mapped to the shared read-only zero page. The program reads from that page 1000 times and then writes to it 1000 times. How many page faults does this page cause?\u003c/p>","ans":["1"],"exp":"\u003cp>讀：映射存在而且可讀 → 0 次 fault。第一次寫：寫唯讀頁 → fault，kernel 配新 frame、改成可寫的映射、重新執行。之後 999 次寫入直接進新 frame，不再 fault。共 \u003cb>1\u003c/b> 次。\u003c/p>"},{"id":"w3-v17a","week":"W3","topic":"Zombie 計數：只 wait 一次","src":"變化題（源自 W3-17 ⚠️）","group":"W3-17","type":"fill","q":"\u003cp>A parent process runs:\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 4; i++)\n    if (fork() == 0) exit(0);     // each child exits immediately\nsleep(1);\nwait(NULL);\nsleep(30);\u003c/code>\u003c/pre>\u003cp>During the final \u003ccode>sleep(30)\u003c/code>, how many zombie processes does this parent have?\u003c/p>","ans":["3"],"exp":"\u003cp>4 個 child 都已經 exit，parent 只呼叫一次 wait()，只收掉其中 1 個 → 剩 \u003cb>3\u003c/b> 個 zombie（process table 還留著它們的 PID 和 exit code）。要全部收掉得呼叫 4 次 wait，或寫 \u003ccode>while (wait(NULL) &gt; 0);\u003c/code>。（已實測。）\u003c/p>","cprog":"w3_fork z4"},{"id":"w3-v21a","week":"W3","topic":"fork + exec 成功 + 導向檔案：A 印幾次","src":"變化題（源自 W3-21 ⚠️）","group":"W3-21","type":"fill","q":"\u003cp>The program below is run with its output redirected to a file: \u003ccode>./prog /bin/echo &gt; out.txt\u003c/code> (exec succeeds).\u003c/p>\u003cpre>\u003ccode>int main(int argc, char *argv[]) {\n    printf(\"A\\n\");\n    pid_t pid = fork();\n    if (pid == 0) {\n        char *args[] = {argv[1], \"B\", NULL};\n        execv(argv[1], args);\n        printf(\"C\\n\");\n        return 1;\n    }\n    printf(\"D\\n\");\n    wait(NULL);\n    printf(\"E\\n\");\n    return 0;\n}\u003c/code>\u003c/pre>\u003cp>How many lines of out.txt are exactly \u003ccode>A\u003c/code>?\u003c/p>","ans":["1"],"exp":"\u003cp>導向檔案 → fully buffered：fork 時 \"A\\n\" 還在 buffer，child 也複製了一份。但 child 接著 \u003cb>execv 成功\u003c/b>：整個舊程式映像（連同那份 stdio buffer）被丟掉，沒有 flush → child 那份 A 消失。parent 結束時 flush 自己的 A、D、E → A 只出現 \u003cb>1\u003c/b> 次。\u003c/p>\u003cp>實測 out.txt 是 B、A、D、E（echo 立刻寫出 B；parent 的三行等到結束才一起寫出）。常見誤解：「導向檔案時 A 一定印兩次」——只有 child 沒有 exec、而是正常結束時才會（見另一個情況：exec 失敗）。\u003c/p>","cprog":"w3_fork w3-21 (file)"},{"id":"w4-03b","week":"W4","topic":"Buffer overflow：跳到自己的程式碼","src":"原題 W4-03 (b)","group":"W4-03","type":"single","q":"\u003cp>A C function has a stack buffer overflow that overwrites the saved return address in its own stack frame.\u003c/p>\u003cp>The overwritten return address now points to another executable location in the same process's user space. What happens when the function returns?\u003c/p>","opts":["The CPU refuses to jump because the address was not produced by a call instruction.","The program may continue execution from that location.","The kernel is notified and kills the process.","The CPU switches to kernel mode to check the address."],"ans":1,"exp":"\u003cp>那是同一個 process 自己的、可執行的 user-space 位址，硬體的權限檢查不會擋：ret 照樣跳過去，程式就從那裡繼續執行（這正是控制流程劫持攻擊的基礎）。\u003c/p>"},{"id":"w5-v01a","week":"W5","topic":"Ctrl-C 整個前景 pipeline","src":"變化題（源自 W5-01）","group":"W5-01","type":"single","q":"\u003cp>In a terminal you run \u003ccode>sleep 1000 | cat\u003c/code> in the foreground and press Ctrl-C. No signal handler is installed. What happens?\u003c/p>","opts":["Only sleep receives SIGINT; cat then sees EOF and exits with status 0","Only cat, the last process in the pipeline, receives SIGINT","The terminal sends SIGINT to every process in the foreground pipeline, so both sleep and cat are terminated; $? is 130","sleep receives SIGINT and cat receives SIGPIPE"],"ans":2,"exp":"\u003cp>Ctrl-C 是終端機送的 SIGINT，對象是\u003cb>整個前景 pipeline\u003c/b>，不是單一 process → sleep、cat 都被終止，shell 回報 128 + 2 = 130。\u003c/p>\u003cp>對照原題：\u003ccode>kill -INT &lt;PID&gt;\u003c/code> 只送給那一個 PID，cat 是因為讀到 EOF 才正常結束。\u003c/p>"},{"id":"w5-v06b","week":"W5","topic":"兩條 pipe：close(A) 放錯位置","src":"變化題（源自 W5-06 ⚠️）","group":"W5-06","type":"single","q":"\u003cp>parent ──(pipe A)──▶ child ──(pipe B)──▶ parent. Each pipe holds 64 KiB; the child loops: read up to 4 KiB from A, write it into B, and exits when A reaches EOF. The parent's code is changed so that it closes A \u003cb>after\u003c/b> reading B:\u003c/p>\u003cpre>\u003ccode>write(A, data, n);   read B until read() returns 0;   close(A);\u003c/code>\u003c/pre>\u003cp>What happens with n = 10 KiB?\u003c/p>","opts":["It finishes, because 10 KiB fits easily in the pipes","The child is killed by SIGPIPE","It hangs: both are blocked in write()","It hangs: the parent is blocked in read(B) and the child is blocked in read(A)"],"ans":3,"exp":"\u003cp>10 KiB 很小，不會塞滿。parent 寫完就去讀 B，讀到 10 KiB。但 parent 還握著 A 的 write end → child 讀完 A 的資料後，下一次 read(A) 是 block 而不是 EOF → child 不會結束 → B 的 write end 一直開著 → parent 的 read(B) 也等不到 0。兩邊都卡在 \u003cb>read()\u003c/b>。\u003c/p>\u003cp>只是把一個 close 換了位置，跟資料量完全無關就會卡住。（已實測。）\u003c/p>","cprog":"w5_pipe twopipe-late-close","cexpect":"hang"},{"id":"w2-v08a","week":"W2","topic":"printf 緩衝：終端機是 line-buffered","src":"變化題（源自 W2-08 ⚠️）","group":"W2-08","type":"fill","q":"\u003cp>\u003ccode>./test\u003c/code> is run in a terminal (no redirection). It has executed:\u003c/p>\u003cpre>\u003ccode>printf(\"hello\\n\");\nprintf(\"world\");\u003c/code>\u003c/pre>\u003cp>and is now sleeping. How many bytes are waiting in the C library's stdout buffer?\u003c/p>","ans":["5"],"exp":"\u003cp>stdout 是終端機時是 \u003cb>line-buffered\u003c/b>：遇到 \\n 就 flush。\"hello\\n\" 已經用 write() 送出、出現在畫面上；\"world\" 沒有換行，還留在 buffer → \u003cb>5\u003c/b> bytes。\u003c/p>\u003cp>對照原題：導向檔案時是 fully buffered，換行也不會 flush，全部都會留在 buffer。（已用 pty 實測。）\u003c/p>","cprog":"w2_buffers v08a"},{"id":"w2-v16","week":"W2","topic":"read() 回傳值：換檔案長度","src":"變化題（源自 W2-16 ⚠️）","group":"W2-16","type":"fill","q":"\u003cp>A file contains \u003ccode>hello, world\\n\u003c/code> (13 bytes). A program opens it and runs:\u003c/p>\u003cpre>\u003ccode>read(fd, buf, 5);\nread(fd, buf, 5);\nn = read(fd, buf, 5);\u003c/code>\u003c/pre>\u003cp>What is n?\u003c/p>","ans":["3"],"exp":"\u003cp>前兩次各讀 5 bytes（offset 0 → 5 → 10），剩 13 − 10 = 3 bytes（\"ld\\n\"）→ n = \u003cb>3\u003c/b>。再讀一次才會回傳 0（EOF）。\u003c/p>","calc":{"fn":"readSeq","size":13,"reqs":[5,5,5],"which":2},"cprog":"w2_files v16"},{"id":"w3-01","week":"W3","topic":"exec 成功後保留什麼","src":"原題 W3-01","group":"W3-01","type":"multi","q":"\u003cp>A child process calls exec successfully. Which of the following stay the same after exec? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["the values of global variables","the program code","the current position in the program","the PPID","the open files (the fd table)","the PID"],"ans":[3,4,5],"exp":"\u003cp>exec 換掉整個程式映像：code、全域變數、heap、stack、執行位置全部換成新程式的（從新程式的開頭開始跑）。\u003c/p>\u003cp>保留的是 process 本身和 kernel 端的狀態：\u003cb>PID、PPID、fd table\u003c/b>（標記 close-on-exec 的除外）、cwd、使用者身分、環境變數（execve 可另外指定）。這也是 shell 能在 fork 後、exec 前先做好 redirection 的原因。\u003c/p>"},{"id":"w2-03","week":"W2","topic":"User-facing vs batch","src":"原題 W2-03","group":"W2-03","type":"multi","q":"\u003cp>Spotify's front end plays a song the moment you tap it. Its back end computes tonight's recommendations from today's listening. Which statements describe the \u003cb>batch back end\u003c/b> (rather than the user-facing front end)? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\"99% of requests are answered within 100 ms.\"","\"The whole run finishes within 6 hours.\"","Throughput is measured in how much data is processed.","A user notices immediately when it is slow.","When the machine runs short of CPU, the scheduler slows down or kills this one first."],"ans":[1,2,4],"exp":"\u003cp>User-facing serving：看 availability、latency（SLO 用百分位數，例如 99% 的 request 在 100 ms 內）、每秒能處理多少 request；一慢使用者馬上感覺到 → S1、S4。\u003c/p>\u003cp>Batch：看資料吞吐量（處理多少資料）和 end-to-end latency（整批跑多久）→ S2、S3。Borg 在機器快滿時只 throttle / kill batch，從不動 user-facing → S5 也是 batch。\u003c/p>"},{"id":"w6-15","week":"W6","topic":"CFS：nice 0 vs nice 10 的 CPU 比例","src":"新題（依講義 W6 Part 7）","group":"W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>Two CPU-bound processes share one core: one has nice 0 and the other has nice 10. About what percentage of the CPU does the nice-0 process get? (Round to one decimal place; type just the number.)\u003c/p>","ans":["90.3","90","90.3%","90%"],"exp":"\u003cp>CPU 比例 = weight ÷ 總 weight = 1024 / (1024 + 110) = 1024 / 1134 ≈ \u003cb>90.3%\u003c/b>，nice 10 那個約 9.7%。nice 只看相對值。\u003c/p>","calc":{"fn":"cfsShare","weights":[1024,110],"which":0}},{"id":"w3-08","week":"W3","topic":"fork 後變數各自獨立","src":"原題 W3-08","group":"W3-08","type":"single","q":"\u003cpre>\u003ccode>int x = 1;\nif (fork() == 0) {\n    x = x + 1;\n    printf(\"child %d\\n\", x);\n} else {\n    wait(NULL);\n    printf(\"parent %d\\n\", x);\n}\u003c/code>\u003c/pre>\u003cp>What is printed?\u003c/p>","opts":["child 2, then parent 2","child 2, then parent 1","parent 1, then child 2","child 1, then parent 1"],"ans":1,"exp":"\u003cp>fork 之後兩個 process 各有一份記憶體（copy-on-write：有人寫的時候才真的複製那一頁）。child 把\u003cb>自己的\u003c/b> x 改成 2，parent 的 x 仍是 1。parent 先 wait(NULL)，等 child 結束才印，所以順序固定：child 2 → parent 1。\u003c/p>","cprog":"w3_fork w3-08","cexpect":"child 2|parent 1"},{"id":"w4-03a","week":"W4","topic":"Buffer overflow：改到 return address","src":"原題 W4-03 (a)","group":"W4-03","type":"single","q":"\u003cp>A C function has a stack buffer overflow that overwrites the saved return address in its own stack frame.\u003c/p>\u003cp>What is the most direct effect of overwriting the saved return address?\u003c/p>","opts":["It changes where the program continues execution after ret.","It switches the CPU into kernel mode.","It changes the process's user ID.","It immediately causes a timer interrupt."],"ans":0,"exp":"\u003cp>ret 指令就是把 stack 上存的 return address 載入 PC。改掉它 = 改掉函式回傳後要跳去哪裡。function call / ret 只改 PC 和 SP，不改 mode bit、不改 address space、不改使用者身分。\u003c/p>"},{"id":"w5-v02a","week":"W5","topic":"close(0) 之後 pipe 拿到的 fd","src":"變化題（源自 W5-02）","group":"W5-02","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>close(0);\nint fd[2];\npipe(fd);\u003c/code>\u003c/pre>\u003cp>What are fd[0] and fd[1]? Type the two numbers separated by a space.\u003c/p>","ans":["0 3","0,3"],"exp":"\u003cp>永遠配最小的可用編號：0 剛被關掉 → fd[0] = \u003cb>0\u003c/b>；下一個可用的是 3 → fd[1] = \u003cb>3\u003c/b>。read end 剛好變成了 stdin。已實測。\u003c/p>","cprog":"w5_pipe v02a"},{"id":"w6-12","week":"W6","topic":"RR q = 4：有人晚到","src":"新題（依講義 W6 Part 5）","group":"W6-rr","type":"fill","q":"\u003cp>Under \u003cb>round robin\u003c/b> with q = 4 ms and free context switches: A (6 ms) and B (2 ms) arrive at t = 0, in that order, and C (5 ms) arrives at t = 1. A job that arrives joins the back of the queue; a job whose slice runs out goes behind the jobs already waiting. What is C's \u003cb>waiting\u003c/b> time, in ms?\u003c/p>","ans":["7","7 ms"],"exp":"\u003cp>A 0–4（t = 1 時 C 進到 queue：B, C）→ A 用完 slice，排到最後：B, C, A。B 4–6（完成）。C 6–10（剩 1）→ queue：A, C。A 10–12（完成）。C 12–13（完成）。\u003c/p>\u003cp>C：turnaround = 13 − 1 = 12，waiting = 12 − 5 = \u003cb>7\u003c/b> ms（1→6 等了 5，10→12 又等 2）。\u003c/p>","calc":{"fn":"sched","policy":"rr","q":4,"jobs":[["A",0,6],["B",0,2],["C",1,5]],"metric":"waiting","job":"C"}},{"id":"w3-05a","week":"W3","topic":"靜態 / 動態連結：DRAM 用量","src":"原題 W3-05","group":"W3-05","type":"single","q":"\u003cp>libY contains 4 MB of code. 20 different programs each have 2 MB of their own code, and all of them use libY. One process of each program is running. How much DRAM does \u003cb>libY's code\u003c/b> use if every program is statically linked, and if every program is dynamically linked?\u003c/p>","opts":["Static: 80 MB; dynamic: 4 MB","Static: 4 MB; dynamic: 80 MB","Static: 80 MB; dynamic: 80 MB","Static: 120 MB; dynamic: 44 MB"],"ans":0,"exp":"\u003cp>靜態：每個執行檔各自帶一份 libY，而且是 20 個不同的檔案，kernel 不會共享 → 20 × 4 = \u003cb>80 MB\u003c/b>。\u003c/p>\u003cp>動態：libY.so 只有一個檔案，DRAM 裡只有一份 \u003cb>4 MB\u003c/b>，被 20 個 process 的 page table 共同 map（library code 是唯讀的，可以共享）。\u003c/p>","calc":{"fn":"linkMem","lib":4,"own":2,"n":20,"expect":[80,4]}},{"id":"w3-16a","week":"W3","topic":"迴圈中 fork：輸出行數（終端機）","src":"原題 W3-16","group":"W3-16","type":"fill","q":"\u003cp>How many lines of \u003ccode>Hi\u003c/code> are printed? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 3; i++) {\n    fork();\n    printf(\"Hi\\n\");\n}\nreturn 0;\u003c/code>\u003c/pre>","ans":["14"],"exp":"\u003cp>每一輪所有 process 都先 fork（數量加倍）再各印一行：第 1 輪 2 個 process 印 2 行、第 2 輪 4 個印 4 行、第 3 輪 8 個印 8 行 → 2 + 4 + 8 = \u003cb>14\u003c/b>。終端機是 line-buffered，每個 \"Hi\\n\" 在 fork 前就已經 flush，不會被複製。\u003c/p>","cprog":"w3_fork w3-16 (tty)"},{"id":"w4-n04","week":"W4","topic":"除以 0 的 exit status","src":"新題（講義 W4 Part 5、Part 9）","group":"W4-exc","type":"fill","q":"\u003cp>A program runs \u003ccode>int x = 0; printf(\"%d\", 10 / x);\u003c/code> and is terminated; the shell prints \u003ccode>Floating point exception\u003c/code>. What is \u003ccode>$?\u003c/code> right afterwards? (SIGFPE is signal 8.)\u003c/p>","ans":["136"],"exp":"\u003cp>除以 0 是修不好的 fault → kernel 送 SIGFPE（8）。被 signal 終止的 process，shell 回報 128 + signal 編號 = \u003cb>136\u003c/b>。同理 segfault（SIGSEGV = 11）是 139。已實測。\u003c/p>","cprog":"w4_exc fpe"},{"id":"w3-16b","week":"W3","topic":"迴圈中 fork：process 總數","src":"原題 W3-16","group":"W3-16","type":"fill","q":"\u003cp>How many processes exist in total (including the original) after this loop has finished? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 3; i++) {\n    fork();\n    printf(\"Hi\\n\");\n}\nreturn 0;\u003c/code>\u003c/pre>","ans":["8"],"exp":"\u003cp>每一輪每個 process 都 fork 一次，數量加倍：1 → 2 → 4 → \u003cb>8\u003c/b>。\u003c/p>","cprog":"w3_fork w3-16 (count)"},{"id":"w2-v13b","week":"W2","topic":"RSS：np.eye 換成 1024 × 1024","src":"變化題（源自 W2-13 ⚠️）","group":"W2-13","type":"fill","q":"\u003cp>Page size is 4 KiB. \u003ccode>c = np.eye(1024)\u003c/code> creates a 1024 × 1024 identity matrix of doubles: 8 MiB in total, stored row by row (assume it starts at a page boundary). np.eye first allocates zeros and then writes 1.0 on the diagonal. By how many KiB does RSS grow?\u003c/p>","ans":["4096","4096 KiB","4096KiB"],"exp":"\u003cp>一列 1024 × 8 = 8192 bytes = \u003cb>2 頁\u003c/b>。第 i 列的對角元素在該列內的 byte i × 8：i &lt; 512 時落在該列的第 1 頁，i ≥ 512 時落在第 2 頁 → 每一列只碰到 2 頁中的 1 頁 → 1024 頁 × 4 KiB = \u003cb>4096 KiB\u003c/b>（4 MiB，剛好一半）。\u003c/p>\u003cp>對照原題 np.eye(64)：一列只有 512 bytes、每頁 8 列，所以每頁都被碰到。換一個數字，答案就從「全部」變成「一半」。\u003c/p>","calc":{"fn":"eye","n":1024,"pageSize":4096,"elem":8}},{"id":"w4-v05c","week":"W4","topic":"System call 參數怎麼傳","src":"變化題（源自 W4-05 ⚠️）","group":"W4-05","type":"single","q":"\u003cp>For \u003ccode>write(1, \"meow\", 4)\u003c/code>, the libc wrapper puts the system call number in R1 and the three arguments in R2–R4. What does R3 hold?\u003c/p>","opts":["The four characters \"meow\"","The file descriptor, 1","The length, 4","The address of the string in the program's memory"],"ans":3,"exp":"\u003cp>暫存器只能放一個小數值，字串和陣列都用指標傳：R1 = 1（write 的編號）、R2 = 1（fd）、R3 = 字串的\u003cb>位址\u003c/b>、R4 = 4（長度）。因為拿到的是 user memory 的位址，kernel 要先檢查、再把那 4 bytes 複製進自己的記憶體才使用。\u003c/p>"},{"id":"w2-06","week":"W2","topic":"檔案權限：三組 rwx","src":"原題 W2-06","group":"W2-06","type":"single","q":"\u003cp>A file's permission string is \u003ccode>-rwxr-x---\u003c/code>. Which statement is correct?\u003c/p>","opts":["The owner can read, write and execute; members of the file's group can read and execute; everyone else has no access.","The owner can read and execute; the group can read, write and execute; others have no access.","The owner can read, write and execute; others can read and execute; the group has no access.","Only root can execute it, because the group bits are r-x."],"ans":0,"exp":"\u003cp>第一個字元是檔案類型（- 是一般檔案），後面每 3 個一組：第一組 rwx = \u003cb>owner\u003c/b>、第二組 r-x = \u003cb>group\u003c/b>、第三組 --- = \u003cb>others\u003c/b>。\u003c/p>"},{"id":"w2-05","week":"W2","topic":"檔案權限：chmod 數字","src":"原題 W2-05","group":"W2-05","type":"single","q":"\u003cpre>\u003ccode>-rw-r----- 1 nini manager 812 Sep 22 10:03 salary.csv\u003c/code>\u003c/pre>\u003cp>Which \u003ccode>chmod\u003c/code> number gives exactly these permissions?\u003c/p>","opts":["604","640","644","740"],"ans":1,"exp":"\u003cp>r = 4、w = 2、x = 1，每組相加：owner rw- = 4+2 = 6；group r-- = 4；others --- = 0 → \u003cb>640\u003c/b>。\u003c/p>"},{"id":"w5-05b","week":"W5","topic":"git 啟動 pager：git 的 fd 1 / 3 / 4","src":"原題 W5-05","group":"W5-05","type":"single","q":"\u003cp>strace of \u003ccode>git log\u003c/code> starting its pager:\u003c/p>\u003cpre>\u003ccode># 4100 is git; 4101 is the child that becomes less\n4100  pipe2([3, 4], 0)   = 0\n4100  clone(...)         = 4101\n4101  dup2(3, 0)         = 0\n4101  close(3)           = 0\n4101  close(4)           = 0\n4101  execve(\"/usr/bin/less\", ...) = 0\n4100  close(3)           = 0\n4100  dup2(4, 1)         = 1\n4100  close(4)           = 0\u003c/code>\u003c/pre>\u003cp>After the last line, what do git's (4100's) fd 1, fd 3 and fd 4 refer to?\u003c/p>","opts":["fd 1: the terminal; fd 3: the read end; fd 4: the write end","fd 1: the write end of the pipe; fd 3: not open; fd 4: not open","fd 1: the write end of the pipe; fd 3: the read end; fd 4: not open","fd 1: not open; fd 3: not open; fd 4: the write end"],"ans":1,"exp":"\u003cp>4100 做了：close(3) → 3 不開；dup2(4, 1) → fd 1 改指 write end；close(4) → 4 不開。所以 git 印到 fd 1 的東西全進 pipe，less 從自己的 fd 0 讀出來。\u003c/p>"},{"id":"w2-v01a","week":"W2","topic":"VSZ / RSS：只寫一半、每頁一個 byte","src":"變化題（源自 W2-01 ⚠️）","group":"W2-01","type":"fill","q":"\u003cp>A C program calls \u003ccode>char *p = malloc(6UL &lt;&lt; 30);\u003c/code> (6 GiB). \u003ccode>ps\u003c/code> now shows VSZ 6.3 GiB and RSS 0.3 GiB. The program then writes one byte into every 4 KiB page of the \u003cb>first half\u003c/b> of the buffer:\u003c/p>\u003cpre>\u003ccode>for (size_t i = 0; i &lt; (3UL &lt;&lt; 30); i += 4096)\n    p[i] = 1;\u003c/code>\u003c/pre>\u003cp>About how large is RSS now, in GiB?\u003c/p>","ans":["3.3","3.3 GiB","3.3GiB"],"exp":"\u003cp>malloc 6 GiB 只增加 VSZ（這麼大的 malloc 由 mmap 配置，頁都還沒有 frame）。迴圈在前 3 GiB 的\u003cb>每一頁\u003c/b>各寫 1 byte：一頁只要被寫到一次，整頁就拿到一個 4 KiB frame → 前 3 GiB 全部有 frame → RSS ≈ 0.3 + 3 = \u003cb>3.3 GiB\u003c/b>。後 3 GiB 沒碰，仍然沒有 frame；VSZ 不變。\u003c/p>\u003cp>常見錯誤：以為每頁只寫 1 byte，RSS 只會多幾 MB。frame 是以「頁」為單位配的。\u003c/p>","calc":{"fn":"rssAfterTouch","base":0.3,"touched":3}},{"id":"w2-v15b","week":"W2","topic":"rm 之後哪些操作還能用","src":"變化題（源自 W2-15 ⚠️）","group":"W2-15","type":"multi","q":"\u003cp>A program opened \u003ccode>/data/fish\u003c/code> with \u003ccode>O_RDWR\u003c/code> (link count 1). Someone runs \u003ccode>rm /data/fish\u003c/code>. The program is still running. Which of the following still work? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The program's read() on its descriptor","The program's write() on its descriptor","\u003ccode>ls /data/fish\u003c/code>","Another program calling \u003ccode>open(\"/data/fish\", O_RDONLY)\u003c/code>","\u003ccode>cat /proc/&lt;PID&gt;/fd/&lt;N&gt;\u003c/code> to see the contents"],"ans":[0,1,4],"exp":"\u003cp>開著的 fd 照樣能讀寫（a、b ✓）；資料區塊留到最後一個 open file 關掉為止。/proc/PID/fd/N 是指向那個 inode 的連結，可以把內容讀出來（e ✓，\u003ccode>ls -l\u003c/code> 會顯示 (deleted)）。\u003c/p>\u003cp>名字已經從目錄刪掉：ls 找不到（c ✗），任何「透過路徑」的 open 都會 ENOENT（d ✗）。\u003c/p>"},{"id":"w4-v04a","week":"W4","topic":"還沒映射的頁：第一次讀","src":"變化題（源自 W4-04 ⚠️）","group":"W4-04","type":"single","q":"\u003cp>A program has just mapped a fresh anonymous page that it has never touched; the page table has \u003cb>no entry\u003c/b> for it yet. The first access to the page is a read. What happens?\u003c/p>","opts":["No trap, because reads never need the kernel","The program automatically makes a system call to allocate a new frame","A segmentation fault kills the process, because the page is not mapped","A page fault: the kernel maps the page to the shared read-only zero page and retries the read"],"ans":3,"exp":"\u003cp>跟原題不同的關鍵細節：這次頁\u003cb>還沒有任何映射\u003c/b>。第一次存取（不論讀寫）都會 page fault。因為是讀，kernel 不必配新 frame，只要把它映射到共用的唯讀 zero page，再重新執行讀取 → 讀到 0。之後第一次寫入還會再 fault 一次（那時才配 frame）。\u003c/p>\u003cp>位址在合法範圍內的 page fault 是正常的，不會變成 segfault；程式也不會自己發 system call。\u003c/p>"},{"id":"w5-v10a","week":"W5","topic":"Prompt 不回來：這次是 shell 的錯","src":"變化題（源自 W5-10 ⚠️）","group":"W5-10","type":"single","q":"\u003cp>Another homemade shell runs \u003ccode>cat words.txt | grep cat\u003c/code>. cat has exited, but the prompt never comes back. This time the fd tables are:\u003c/p>\u003cpre>\u003ccode>/proc/7001/fd (shell):  0,1,2 -&gt; /dev/pts/1    4 -&gt; pipe:[5120] (l-wx)\n/proc/7003/fd (grep):   0 -&gt; pipe:[5120] (lr-x)   1,2 -&gt; /dev/pts/1\u003c/code>\u003c/pre>\u003cp>Which fd keeps grep's read() from ever returning 0?\u003c/p>","opts":["fd 4 of the shell","fd 0 of grep","fd 1 of grep","None; grep will see EOF soon"],"ans":0,"exp":"\u003cp>這次 grep 很乾淨（只有 fd 0 = read end）。唯一的 write end（l-wx）在 \u003cb>shell 的 fd 4\u003c/b> → shell 忘了 close(fd[1])。shell 又卡在 wait() 等 grep → shell 等 grep、grep 等 shell。\u003c/p>\u003cp>對照原題：同樣的症狀，原題怪 grep 自己的 fd 4，這題怪 shell。判斷方法都一樣：找出所有 l-wx。\u003c/p>"},{"id":"w3-06","week":"W3","topic":"什麼時候該用靜態連結","src":"原題 W3-06 ⚠️","group":"W3-06","type":"single","q":"\u003cp>In which situation is static linking the better choice?\u003c/p>","opts":["A library that often needs security fixes","libc, used by almost every desktop program","A command-line tool shipped to many users on many different Linux versions","200 programs on one server that call the same crypto library"],"ans":2,"exp":"\u003cp>要散布到各種不同機器的工具（fzf、ripgrep、Docker 這類 Go / Rust 單一執行檔）用靜態連結，避免對方機器缺 .so 或出現 \u003ccode>version 'GLIBC_2.34' not found\u003c/code>。\u003c/p>\u003cp>其他三個都是「很多程式共用、需要一次修補」→ 動態連結：換一個 .so 檔、程式重啟就全部修好（Heartbleed 的教訓）。\u003c/p>"},{"id":"w3-15a","week":"W3","topic":"fork 計數：條件 X","src":"原題 W3-15","group":"W3-15","type":"fill","q":"\u003cp>How many times is \u003ccode>X\u003c/code> printed? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>pid_t a = fork();\npid_t b = fork();\nif (a == 0 || b == 0) printf(\"X\\n\");\nif (a != 0 &amp;&amp; b == 0) printf(\"Y\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["3"],"exp":"\u003cp>4 個 process 的 (a, b)：(&gt;0,&gt;0) 原本的、(&gt;0,0) 第二次 fork 的 child、(0,&gt;0) 第一次 fork 的 child、(0,0) 孫子。\u003c/p>\u003cp>a == 0 || b == 0：除了原本的 process 以外都成立 → \u003cb>3\u003c/b> 次。\u003c/p>","cprog":"w3_fork w3-15 (tty)"},{"id":"w2-09","week":"W2","topic":"每個 indirection 都是一張表","src":"原題 W2-09","group":"W2-09","type":"single","q":"\u003cp>What does a page table map?\u003c/p>","opts":["a block number → a storage location","a file descriptor → an open-file table entry","a virtual page → a physical frame","a file name → an inode"],"ans":2,"exp":"\u003cp>「每個 indirection 都是一張表」：page table 把虛擬頁對應到實體 frame。(a) 是 block 層、(b) 是 fd table、(d) 是目錄（目錄內容就是「名字 → inode 編號」）。\u003c/p>"},{"id":"w5-07b","week":"W5","topic":"read() 一次最多讀多少","src":"原題 W5-07 ⚠️","group":"W5-07","type":"fill","q":"\u003cp>The parent creates a pipe and forks. The child writes 5000 bytes into the pipe and exits immediately. The parent runs:\u003c/p>\u003cpre>\u003ccode>close(fd[1]);\nsleep(2);\nchar buf[1000];\nlong total = 0;\nssize_t n;\nwhile ((n = read(fd[0], buf, sizeof buf)) &gt;= 0)\n    total += n;\nprintf(\"got %ld bytes\\n\", total);\u003c/code>\u003c/pre>\u003cp>What does the \u003cb>first\u003c/b> read() return?\u003c/p>","ans":["1000"],"exp":"\u003cp>read 最多只複製「要求的數量」：sizeof buf = 1000。即使 pipe 裡已經有 5000 bytes，第一次 read 也只回傳 \u003cb>1000\u003c/b>（原答 5000 錯，已實測）。\u003c/p>","cprog":"w5_pipe first"},{"id":"w4-n05","week":"W4","topic":"getpid() 會不會 context switch","src":"新題（講義 W4 Part 6）","group":"W4-cs","type":"single","q":"\u003cp>A program calls \u003ccode>getpid()\u003c/code>. Does this cause a context switch?\u003c/p>","opts":["Yes, every system call switches to another process","No; it traps into the kernel and returns to the same process: a mode switch, not a context switch","Yes, because the kernel has to save the PCB","No, because getpid() never enters the kernel"],"ans":1,"exp":"\u003cp>getpid 是 fast system call：trap 進 kernel、讀 PCB 的一個欄位、馬上回到同一個 process。只有 mode switch（user ↔ kernel），沒有換 process。mode switch ≠ context switch。(d) 錯：它確實會 trap 進 kernel。\u003c/p>"},{"id":"w2-17-p1","week":"W2","topic":"printf vs write 的輸出順序","src":"原題 W2-17 (P1) ⚠️","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>printf(\"one \");\nwrite(1, \"two \", 4);\nreturn 0;\u003c/code>\u003c/pre>","ans":["two one"],"exp":"\u003cp>導向檔案 → stdout fully buffered。printf 把 \"one \" 放進 libc buffer；write 是 system call，\"two \" 立刻進 kernel。return 時 libc 才把 \"one \" flush 出去，所以排在後面：\u003cb>two one\u003c/b>（原答 one two 錯）。\u003c/p>","cprog":"w2_buffers p1"},{"id":"w5-s3","week":"W5","topic":"SIGTERM 被忽略時 timeout -k","src":"新題（講義 W5 Part 4）","group":"W5-sig","type":"single","q":"\u003cp>\u003ccode>prog\u003c/code> ignores SIGTERM (it calls \u003ccode>signal(SIGTERM, SIG_IGN)\u003c/code>) and would otherwise run for 60 seconds. You run \u003ccode>timeout -k 3 5 ./prog\u003c/code>. What happens?\u003c/p>","opts":["prog is killed by SIGTERM after 5 seconds","prog runs for the full 60 seconds, because it ignores timeout's signal","At 5 s timeout sends SIGTERM, which prog ignores; at about 8 s timeout sends SIGKILL, which cannot be ignored, and prog dies","timeout sends SIGKILL after 3 s and SIGTERM after 5 s"],"ans":2,"exp":"\u003cp>timeout 先禮後兵：5 秒到送 SIGTERM（可以被 catch 或 ignore，讓程式有機會收尾）；\u003ccode>-k 3\u003c/code> 表示送出 SIGTERM 後再等 3 秒，還沒結束就送 SIGKILL。SIGKILL 不能被 catch 或 ignore，kernel 直接終止 process，不執行它的任何程式碼。\u003c/p>\u003cp>docker stop（10 秒）、Kubernetes（30 秒）、systemd（90 秒）都是同樣的模式。已實測：約 8 秒結束，$? = 137。\u003c/p>","cprog":"w5_pipe ignterm","cexpect":"status=137 elapsed≈8s"},{"id":"w6-08","week":"W6","topic":"STCF 平均 turnaround","src":"新題（依講義 W6 Part 4）","group":"W6-stcf","type":"fill","q":"\u003cp>Under \u003cb>STCF\u003c/b> (preemptive shortest time-to-completion first): A arrives at t = 0 with a 10 ms burst, B at t = 1 with 2 ms, and C at t = 2 with 4 ms. What is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["7.67","7.7","23/3"],"exp":"\u003cp>t = 0：A 開始。t = 1：B 到，2 &lt; A 剩下的 9 → 搶占，B 1–3。t = 2：C 到，4 &gt; B 剩下的 1 → B 繼續。t = 3：B 完成，C（4）&lt; A（9）→ C 3–7。A 7–16。\u003c/p>\u003cp>turnaround：A 16、B 2、C 5 → 23 / 3 ≈ \u003cb>7.67\u003c/b> ms（同一組工作用 SJF 是 11.67）。\u003c/p>","calc":{"fn":"sched","policy":"stcf","jobs":[["A",0,10],["B",1,2],["C",2,4]],"metric":"avgTurnaround"}},{"id":"w2-17-p3","week":"W2","topic":"printf + write + crash","src":"原題 W2-17 (P3)","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>printf(\"one \");\nwrite(1, \"two \", 4);\n*(int *)0 = 1;      // crash\u003c/code>\u003c/pre>","ans":["two"],"exp":"\u003cp>\"two \" 已經用 write 進了 kernel，程式 crash 也不影響。\"one \" 還在 libc buffer 裡，crash（SIGSEGV）時程式直接被終止，不會 flush → 消失。結果只有 \u003cb>two\u003c/b>。\u003c/p>","cprog":"w2_buffers p3"},{"id":"w6-17","week":"W6","topic":"CFS：slice 長度","src":"新題（依講義 W6 Part 7）","group":"W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>The scheduling latency is 6 ms, and three processes are runnable: A and B have nice 0, and C has nice 5. Using \u003ccode>slice = latency × weight / total weight\u003c/code>, how long is C's slice, in ms? (Round to two decimal places.)\u003c/p>","ans":["0.84","0.843","0.8435"],"exp":"\u003cp>總 weight = 1024 + 1024 + 335 = 2383。C 的 slice = 6 × 335 / 2383 ≈ \u003cb>0.84\u003c/b> ms；A、B 各約 2.58 ms。三者加起來剛好 6 ms，CPU 比例約 43% / 43% / 14%（講義的圖）。runnable 的 process 越多，每個人的 slice 越短。\u003c/p>","calc":{"fn":"cfsSlice","latency":6,"weights":[1024,1024,335],"which":2}},{"id":"w3-f6","week":"W3","topic":"迴圈中 fork：導向檔案","src":"變化題（源自 W3-16）","group":"W3-16","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog &gt; out.txt\u003c/code>. How many lines of \u003ccode>Hi\u003c/code> does out.txt contain? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 3; i++) {\n    fork();\n    printf(\"Hi\\n\");\n}\nreturn 0;\u003c/code>\u003c/pre>","ans":["24"],"exp":"\u003cp>從終端機執行是 14 行（每個 Hi 都在下一次 fork 前就 flush）。導向檔案時，Hi 一直留在 buffer 裡、隨 fork 被複製。最後 8 個 process，每個的 buffer 裡都有 3 行 Hi（每一輪印一行，或從 parent 繼承），結束時各自 flush → 8 × 3 = \u003cb>24\u003c/b>。已實測。\u003c/p>","cprog":"w3_fork w3-16 (file)"},{"id":"w2-15","week":"W2","topic":"rm 一個仍被開著的檔案","src":"原題 W2-15 ⚠️","group":"W2-15","type":"multi","q":"\u003cp>Two programs each have \u003ccode>/data/fish\u003c/code> open (its link count is 1). Someone runs \u003ccode>rm /data/fish\u003c/code>. Which statements are true right after that? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["While at least one program still has it open, you can copy the contents back out through that program's entry under /proc.","The data blocks stay in use, because the number of programs holding the file open has not reached zero.","The next read() in either program fails, because the path no longer leads anywhere.","Running rm a second time would free the space.","The directory no longer lists the name, so ls cannot show the file.","Both programs can carry on reading. The chain from descriptor to open file entry to inode never uses the name."],"ans":[0,1,4,5],"exp":"\u003cp>rm = unlink：只把名字從目錄刪掉（所以 ls 看不到 ✓e），link count 變 0，但還有 open file 參照 inode，所以資料區塊保留 ✓b。fd → open file entry → inode 這條鏈從不經過名字，兩個程式照樣讀 ✓f。\u003ccode>cp /proc/PID/fd/N /data/fish\u003c/code> 可以把內容救回來 ✓a。\u003c/p>\u003cp>(c) 錯：讀檔不需要路徑。(d) 錯：名字已經不在了，第二次 rm 會失敗（No such file），也不會釋放空間；要等兩個程式都關檔。\u003c/p>"},{"id":"w2-v19","week":"W2","topic":"碰觸頁面：換成 16 KiB 的頁","src":"變化題（源自 W2-19 ⚠️）","group":"W2-19","type":"fill","q":"\u003cp>A machine uses 16 KiB (16384-byte) pages. A program maps 64 KiB (4 pages) that it has not touched yet, then writes one byte at offsets 0, 100, 20000 and 65000. What is this region's RSS now, in KiB?\u003c/p>","ans":["48","48 KiB","48KiB"],"exp":"\u003cp>頁號 = offset ÷ 16384 取整數：0、100 → 第 0 頁；20000 → 第 1 頁；65000 → 第 3 頁。3 個不同的頁 × 16 KiB = \u003cb>48 KiB\u003c/b>。\u003c/p>\u003cp>同樣的 offset，頁變大後頁號跟著變，RSS 也跟著變（4 KiB 頁時是 3 頁 = 12 KiB）。\u003c/p>","calc":{"fn":"pages","pageSize":16384,"offsets":[0,100,20000,65000],"unit":"KiB"}},{"id":"w6-09","week":"W6","topic":"STCF 平均 response","src":"新題（依講義 W6 Part 4）","group":"W6-stcf","type":"fill","q":"\u003cp>Under \u003cb>STCF\u003c/b>: A arrives at t = 0 with a 10 ms burst, B at t = 1 with 2 ms, and C at t = 2 with 4 ms. What is the average \u003cb>response\u003c/b> time, in ms? (Round to two decimal places.)\u003c/p>","ans":["0.33","0.3","1/3","0.333"],"exp":"\u003cp>A 在 0 抵達、0 開始 → 0。B 在 1 抵達、立刻搶占 → 0。C 在 2 抵達，但 B 剩 1 ms 比它短，C 到 t = 3 才第一次執行 → 1。平均 (0 + 0 + 1) / 3 ≈ \u003cb>0.33\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"stcf","jobs":[["A",0,10],["B",1,2],["C",2,4]],"metric":"avgResponse"}},{"id":"w4-04-1","week":"W4","topic":"Zero page：讀取會不會 trap","src":"原題 W4-04 (1) ⚠️","group":"W4-04","type":"single","q":"\u003cp>A virtual page is already mapped to the shared read-only zero page. The program first reads a value from that page and then writes to it. The first write takes much longer than the read.\u003c/p>\u003cp>Does the first read trap into the kernel?\u003c/p>","opts":["Yes, every first access to a page traps.","No.","Only if the page size is 4 KiB.","Only the first time after a context switch."],"ans":1,"exp":"\u003cp>映射已經存在而且可讀 → 讀取直接由硬體查 page table 完成，不需要 kernel 介入，不會 trap（原答 Yes 錯）。\u003c/p>"},{"id":"w6-21","week":"W6","topic":"Aging","src":"新題（依講義 W6 Part 6）","group":"W6-prio","type":"fill","q":"\u003cp>Low-priority job L becomes ready at t = 0 with priority 0 (bigger = more important). A steady stream of high-priority jobs, each with priority 4, keeps the CPU busy. With aging, L gains +1 priority for every 3 ms it waits. L runs as soon as its priority is \u003cb>higher\u003c/b> than 4. At what time t (ms) does L first run?\u003c/p>","ans":["15","15 ms"],"exp":"\u003cp>L 要到 priority 5 才比 4 高：每 3 ms +1，從 0 到 5 要 5 × 3 = \u003cb>15\u003c/b> ms。沒有 aging 時 L 會一直停在 0、永遠跑不到（starvation）；有 aging 就保證在有限時間內跑到（liveness）。\u003c/p>","calc":{"fn":"aging","start":0,"step":3,"high":4}},{"id":"w4-04-4","week":"W4","topic":"Zero page：為什麼寫比較久","src":"原題 W4-04 (4)","group":"W4-04","type":"single","q":"\u003cp>A virtual page is already mapped to the shared read-only zero page. The program first reads a value from that page and then writes to it. The first write takes much longer than the read.\u003c/p>\u003cp>Why does the first write take longer?\u003c/p>","opts":["The write causes a page fault and traps into the kernel.","Writes are always slower than reads in DRAM.","The CPU must flush its cache before writing.","The write must wait for the disk."],"ans":0,"exp":"\u003cp>多出來的時間就是 page fault 的處理：trap 進 kernel、配 frame、清零、改 page table、回來重新執行指令。跟 DRAM 讀寫速度、磁碟都無關。\u003c/p>"},{"id":"w3-v17b","week":"W3","topic":"Parent 還活著卻不 wait","src":"變化題（源自 W3-17 ⚠️）","group":"W3-17","type":"single","q":"\u003cp>A server process P forks C1 and C2, which exit immediately. P keeps running forever and never calls wait(). What happens to C1 and C2?\u003c/p>","opts":["init reaps them right away, because they have exited","They become orphans with PPID 1","The kernel removes zombie rows automatically after a timeout","They stay zombies for as long as P is alive and does not wait for them"],"ans":3,"exp":"\u003cp>只有 parent 自己 wait 才能收掉 zombie。P 還活著，C1、C2 不是 orphan（PPID 仍是 P），init 不會插手；kernel 也沒有逾時清除機制 → 一直是 zombie，直到 P 呼叫 wait 或 P 結束（那時才由 init 收養並 reap）。\u003c/p>\u003cp>對照原題：P 結束之後，init 才會收養並 reap 它們。\u003c/p>"},{"id":"w6-11","week":"W6","topic":"RR q = 2：不同長度的工作","src":"新題（依講義 W6 Part 5）","group":"W6-rr","type":"fill","q":"\u003cp>Jobs A = 5 ms, B = 3 ms and C = 1 ms all arrive at t = 0 (queue order A, B, C). Under \u003cb>round robin\u003c/b> with q = 2 ms and free context switches, what is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["7.33","7.3","22/3"],"exp":"\u003cp>A 0–2、B 2–4、C 4–5（完成）、A 5–7、B 7–8（完成）、A 8–9（完成）。turnaround：A 9、B 8、C 5 → 22 / 3 ≈ \u003cb>7.33\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"rr","q":2,"jobs":[["A",0,5],["B",0,3],["C",0,1]],"metric":"avgTurnaround"}},{"id":"w2-14","week":"W2","topic":"close 後重新 open：fd 編號與 offset","src":"原題 W2-14 ⚠️","group":"W2-14","type":"single","q":"\u003cpre>\u003ccode>int fd = open(\"notes.txt\", O_RDONLY);   // returns 4\nread(fd, buf, 200);\nclose(fd);\nint again = open(\"notes.txt\", O_RDONLY);\nread(again, &amp;c, 1);\u003c/code>\u003c/pre>\u003cp>notes.txt is longer than 1000 bytes. What is the value of \u003ccode>again\u003c/code>, and at which byte offset does the last \u003ccode>read()\u003c/code> start?\u003c/p>","opts":["again = 5; byte 200","again = 4; byte 200","again = 4; byte 0","again = 3; byte 199"],"ans":2,"exp":"\u003cp>第一次 open 拿到 4，表示 0–3 都在用。close(4) 之後 4 空出來，open 永遠拿「最小的可用編號」→ again = \u003cb>4\u003c/b>。\u003c/p>\u003cp>每次 open() 都會建立一個\u003cb>新的\u003c/b> open-file table entry，offset 從 0 開始。offset 屬於 open file entry，不屬於檔案本身，所以從 byte \u003cb>0\u003c/b> 開始讀（原答 199 錯）。\u003c/p>","cprog":"w2_files w2-14","cexpect":"4 0"},{"id":"w3-v06b","week":"W3","topic":"靜態連結的優點","src":"變化題（源自 W3-06 ⚠️）","group":"W3-06","type":"multi","q":"\u003cp>Which of the following are advantages of \u003cb>static\u003c/b> linking? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The program runs on an older Linux machine without \u003ccode>version 'GLIBC_x.y' not found\u003c/code> errors.","After execve maps the file, main starts directly; no dynamic loader has to find and map libraries first.","A bug in the library is fixed for every program by replacing one file.","Every running program shares one copy of the library code in DRAM.","The executable file on disk is smaller."],"ans":[0,1],"exp":"\u003cp>靜態連結在建置時把 library 複製進執行檔：自給自足，到哪台 Linux 都能跑（a ✓）；執行時不需要 dynamic loader 先找 .so、map、填位址（b ✓）。\u003c/p>\u003cp>代價：執行檔比較大（e 是動態的優點）、每個程式在 DRAM 各一份 library（d 是動態的優點）、library 有漏洞時每個程式都要重新建置發布（c 是動態的優點）。\u003c/p>"},{"id":"w5-v01c","week":"W5","topic":"SIGPIPE 送給誰","src":"變化題（源自 W5-01）","group":"W5-01","type":"single","q":"\u003cp>\u003ccode>cat huge.log | head -1\u003c/code> prints one line and returns quickly, even though huge.log is 50 GB. Which process receives SIGPIPE?\u003c/p>","opts":["head, because its input still has data","cat, when it writes to the pipe after head has exited","Both cat and head","Neither; cat sees EOF and stops"],"ans":1,"exp":"\u003cp>head 印完一行就結束，pipe 的 read end 全部關閉。cat 下一次 write → 寫進沒有讀者的 pipe → kernel 送 SIGPIPE 給\u003cb>寫端\u003c/b> cat → 預設動作是終止。這也是 \u003ccode>yes | head -3\u003c/code> 會結束的原因。\u003c/p>\u003cp>SIGPIPE 永遠給「寫的人」；「讀的人」碰到的是 EOF。(d) 錯在 EOF 是讀端的事，cat 在這裡是寫端。\u003c/p>"},{"id":"w5-09a","week":"W5","topic":"先 wait 再讀：四種修法的效果","src":"原題 W5-09","group":"W5-09","type":"single","q":"\u003cp>A capture program does: create two pipes OUT and ERR → start cmd with stdout → OUT and stderr → ERR → \u003cb>wait()\u003c/b> for cmd → read OUT until 0. Each pipe holds 64 KiB, and there is a 300-second time limit.\u003c/p>\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>command\u003c/th>\u003cth>stdout\u003c/th>\u003cth>stderr\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ls\u003c/td>\u003ctd>2 KiB\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cat notes.txt\u003c/td>\u003ctd>300 KiB\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cat big.log\u003c/td>\u003ctd>2 MiB\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>find /\u003c/td>\u003ctd>5 MiB\u003c/td>\u003ctd>200 KiB\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>ls succeeds; the other three hit the 300 s limit. Proposed fixes:\u003cbr>F1: raise the time limit to 3600 s.\u003cbr>F2: enlarge OUT to 1 MiB.\u003cbr>F3: read OUT until 0 first, then wait().\u003cbr>F4: buy a faster machine.\u003c/p>\u003cp>For each fix: does it make all three failing commands succeed, only some of them, or none?\u003c/p>","opts":["F1 none, F2 some, F3 some, F4 none","F1 some, F2 some, F3 all, F4 some","F1 none, F2 some, F3 all, F4 none","F1 none, F2 none, F3 some, F4 none"],"ans":0,"exp":"\u003cp>這是 \u003cb>deadlock\u003c/b> 不是效能問題：child 輸出超過 64 KiB 就卡在 write()，parent 卡在 wait() → 時間再長、機器再快都沒用（F1、F4：完全沒用）。\u003c/p>\u003cp>F2：OUT 變 1 MiB，裝得下 notes.txt 的 300 KiB → 它好了；big.log 2 MiB、find 5 MiB 還是超過 → 部分有效。\u003c/p>\u003cp>F3：先把 OUT 讀到 EOF 再 wait → ls、notes、big.log 都好了；但 find 的 stderr 有 200 KiB，超過 ERR 的 64 KiB 又沒人讀 → 部分有效。正解是同時讀兩條 pipe（Python 的 communicate()）。\u003c/p>"},{"id":"w6-24","week":"W6","topic":"為什麼需要 STCF","src":"新題（依講義 W6 Part 4）","group":"W6-stcf","type":"single","q":"\u003cp>Dog (60 ms) starts running at t = 0. Capoo and Mika (6 ms each) arrive at t = 6. Under SJF the average turnaround is 62 ms, but under STCF it is 30 ms. Why?\u003c/p>","opts":["SJF picks a job only when the CPU is free, so it cannot stop Dog; STCF re-decides when a job arrives and preempts Dog because 6 \u003c 54","STCF runs the jobs in arrival order","SJF does not know the bursts, but STCF does","STCF gives each job a 1 ms time slice"],"ans":0,"exp":"\u003cp>SJF 是 non-preemptive：只在 CPU 空出來時才挑，Dog 已經在跑就跑到完，短工作被困在後面。STCF = SJF + 搶占：有新工作到達時重新比較「新工作的 burst」和「正在跑的工作還剩多少」，Capoo 的 6 &lt; Dog 剩下的 54 → 搶占。代價是長工作（Dog）最後才完成。\u003c/p>"},{"id":"w4-v04c","week":"W4","topic":"Fault 修好之後從哪裡繼續","src":"變化題（源自 W4-04）","group":"W4-04","type":"single","q":"\u003cp>A program's first write to a page that is mapped to the shared zero page causes a page fault. After the kernel has allocated a new frame and fixed the mapping, where does the program continue?\u003c/p>","opts":["At the instruction after the write; the kernel has already performed the write for it","At the beginning of the current function","It re-executes the same write instruction, which now succeeds","In a signal handler for SIGSEGV"],"ans":2,"exp":"\u003cp>fault 的處理是「修好，然後\u003cb>重試同一個指令\u003c/b>」。對照 trap（system call）：做完後從下一個指令繼續；interrupt：被打斷的程式從下一個指令繼續。修不好的 fault（例如無效位址）才會送 SIGSEGV。\u003c/p>"},{"id":"w4-n07","week":"W4","topic":"快 / 慢 system call","src":"新題（講義 W4 Part 6）","group":"W4-cs","type":"multi","q":"\u003cp>Which of these system calls may block, putting the process to sleep (slow system calls)? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>read()\u003c/code> from the keyboard when no key has been pressed","\u003ccode>write()\u003c/code> to a pipe whose buffer is full","\u003ccode>wait()\u003c/code> for a child that is still running","\u003ccode>getpid()\u003c/code>","\u003ccode>getuid()\u003c/code>","\u003ccode>gettimeofday()\u003c/code>"],"ans":[0,1,2],"exp":"\u003cp>slow system call 要等外部事件（按鍵、讀者把 pipe 讀出空間、child 結束）；等待時 process 睡在 wait queue、不用 CPU，kernel 切去跑別人。\u003c/p>\u003cp>getpid / getuid / gettimeofday 是 fast system call：讀一個 kernel 已經有的值就回來（gettimeofday 還可以走 vDSO，根本不進 kernel）。\u003c/p>"},{"id":"w5-v04","week":"W5","topic":"Pipeline 的兩段是同時跑的","src":"變化題（源自 W5-04）","group":"W5-04","type":"single","q":"\u003cp>A shell runs \u003ccode>cat scores.csv | grep niko\u003c/code>. Does cat have to finish before grep starts running?\u003c/p>","opts":["Yes: the shell starts grep only after cat exits","Yes, otherwise grep would read a partial line and fail","No: both run concurrently; if grep reads an empty pipe it blocks until cat writes, and bytes written early wait in the kernel's buffer","No, but grep must start first, or cat's output would be lost"],"ans":2,"exp":"\u003cp>兩次 fork 之後 cat 和 grep 是兩個可同時執行的 process，誰先跑由 scheduler 決定（多核心時真的同時跑）。grep 先讀到空 pipe → block，資料一到就被叫醒；cat 先寫 → 資料暫存在 kernel 的 pipe buffer。兩種情況結果一樣，所以 pipeline 的各段是並行的：grep 處理第一行時 cat 可能還在產生最後一行。\u003c/p>"},{"id":"w3-05b","week":"W3","topic":"靜態 / 動態連結：磁碟用量","src":"原題 W3-05","group":"W3-05","type":"fill","q":"\u003cp>libY contains 4 MB of code. 20 different programs each have 2 MB of their own code and all use libY. With \u003cb>dynamic\u003c/b> linking, how much disk space do the 20 executables plus libY.so take in total, in MB?\u003c/p>","ans":["44","44 MB","44MB"],"exp":"\u003cp>動態連結的執行檔只帶自己的 2 MB code，加上一個「NEEDED libY.so」的註記：20 × 2 + 4 = \u003cb>44 MB\u003c/b>。（若全部靜態：20 × (2 + 4) = 120 MB。）\u003c/p>","calc":{"fn":"linkDisk","lib":4,"own":2,"n":20,"mode":"dynamic"}},{"id":"w6-29","week":"W6","topic":"Response time vs throughput","src":"新題（依講義 W6 Part 2）","group":"W6-slice","type":"single","q":"\u003cp>Two CPU-bound jobs (a video encoder and gcc) share a core, and you occasionally press a key in an editor. The time slice is reduced from 8 ms to 2 ms. What is the main effect?\u003c/p>","opts":["Key presses are handled sooner, but there are more context switches, so less useful work gets done","Key presses are handled later, but throughput improves","Both response time and throughput improve","Nothing changes, because the editor is I/O-bound"],"ans":0,"exp":"\u003cp>slice 小 → 按鍵等待的時間短（講義例子 7.35 ms → 1.35 ms），但切換次數變多（3 次 → 10 次），24 ms 裡有用的工作從 22.4 ms 降到 20 ms。response time 和 throughput 通常不能兼得。\u003c/p>"},{"id":"w2-v01b","week":"W2","topic":"VSZ / RSS：寫入 0 也算寫入","src":"變化題（源自 W2-01 ⚠️）","group":"W2-01","type":"fill","q":"\u003cp>\u003ccode>a = np.zeros(512 * 1024 * 1024)\u003c/code> creates a 4 GiB array of doubles. Right after this, VSZ is 4.1 GiB and RSS is 0.1 GiB. The script then stores 0.0 into every element:\u003c/p>\u003cpre>\u003ccode>for i in range(a.size):\n    a[i] = 0.0\u003c/code>\u003c/pre>\u003cp>The array's values never change. About how large is RSS after the loop, in GiB?\u003c/p>","ans":["4.1","4.1 GiB","4.1GiB"],"exp":"\u003cp>kernel 不會檢查你寫的值是不是 0。只要對指向 zero page 的頁做「寫入」，就違反唯讀權限 → page fault → kernel 配一個新的 frame。每一頁都被寫過 → 4 GiB 全部拿到 frame → RSS ≈ 0.1 + 4 = \u003cb>4.1 GiB\u003c/b>。\u003c/p>\u003cp>值沒有變，記憶體用量卻變了：RSS 只看「有沒有被寫」，不看「寫了什麼」。\u003c/p>","calc":{"fn":"rssAfterTouch","base":0.1,"touched":4}},{"id":"w2-20","week":"W2","topic":"Overcommit：notebook server","src":"原題 W2-20","group":"W2-20","type":"single","q":"\u003cp>A server has 512 GiB of DRAM. Each user's notebook is allowed up to 16 GiB, but measurements show an average RSS of 1 GiB per notebook. (1) If every notebook really used its full 16 GiB, at most how many notebooks fit in DRAM? (2) Using the 1 GiB average instead, about how many times more notebooks can run?\u003c/p>","opts":["(1) 32; (2) about 16 times more","(1) 32; (2) about 512 times more","(1) 16; (2) about 32 times more","(1) 512; (2) about 16 times more"],"ans":0,"exp":"\u003cp>(1) 512 ÷ 16 = \u003cb>32\u003c/b> 個。(2) 以平均 RSS 1 GiB 計可以放約 512 個，512 ÷ 32 = \u003cb>16\u003c/b> 倍。這就是 overcommit：答應給的（上限 / VSZ）遠多於實際用掉的（RSS）。\u003c/p>","calc":{"fn":"overcommit","dram":512,"limit":16,"avg":1,"expect":[32,16]}},{"id":"w6-07","week":"W6","topic":"SJF 遇到晚到的短工作","src":"新題（依講義 W6 Part 4）","group":"W6-sjf","type":"fill","q":"\u003cp>Under \u003cb>SJF\u003c/b> (non-preemptive): A arrives at t = 0 with a 10 ms burst, B at t = 1 with 2 ms, and C at t = 2 with 4 ms. What is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["11.67","11.7","35/3"],"exp":"\u003cp>t = 0 只有 A → A 跑 0–10。SJF 不搶占，B、C 到了也只能等。t = 10 時 B（2）比 C（4）短 → B 10–12、C 12–16。\u003c/p>\u003cp>turnaround：A 10、B 12 − 1 = 11、C 16 − 2 = 14 → 35 / 3 ≈ \u003cb>11.67\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"sjf","jobs":[["A",0,10],["B",1,2],["C",2,4]],"metric":"avgTurnaround"}},{"id":"w2-v11a","week":"W2","topic":"PATH 對了，但沒有 x 權限","src":"變化題（源自 W2-11 ⚠️）","group":"W2-11","type":"single","q":"\u003cp>niko's PATH is now \u003ccode>/home/niko/bin:/usr/local/bin:/usr/bin:/bin\u003c/code>. The file \u003ccode>/home/niko/bin/greet\u003c/code> exists, but its permissions are \u003ccode>-rw-r--r--\u003c/code>. Typing \u003ccode>greet\u003c/code> fails. Which single change lets niko run it by typing \u003ccode>greet\u003c/code>?\u003c/p>","opts":["Add /home/niko/bin to PATH again in ~/.bashrc","Run \u003ccode>chmod +x /home/niko/bin/greet\u003c/code>","\u003ccode>cd /home/niko/bin\u003c/code> first, then type \u003ccode>greet\u003c/code>","Rename the file to greet.sh"],"ans":1,"exp":"\u003cp>這次 PATH 已經包含 /home/niko/bin，問題變成檔案沒有執行權限：shell 找到的檔案必須有 x 才能 exec（bash 會回報 Permission denied）。\u003ccode>chmod +x\u003c/code> 加上權限即可。\u003c/p>\u003cp>(a) PATH 本來就對；(c) 換目錄無關，而且 shell 不搜尋目前目錄；(d) 副檔名在 Unix 沒有意義。對照原題：原題是「有 x 但不在 PATH」，這題是「在 PATH 但沒有 x」。\u003c/p>"},{"id":"w6-19","week":"W6","topic":"nice 只有相對意義","src":"新題（依講義 W6 Part 7）","group":"W6-nice","type":"single","q":"\u003cp>A single CPU-bound process with nice 19 is the only runnable process on a core. What share of that core does it get?\u003c/p>","opts":["About 1.5%, because nice 19 has a tiny weight","100%","50%","None until a nice-0 process appears"],"ans":1,"exp":"\u003cp>CPU 比例 = 自己的 weight ÷ 所有 runnable process 的 weight 總和。只有它一個 → 比例 = 1 → \u003cb>100%\u003c/b>。nice 值只在「跟別人比」的時候才有意義。兩個都 nice 5 也是各 50%。\u003c/p>"},{"id":"w3-p2","week":"W3","topic":"fork 計數：換成 p2 == 0 先 exit","src":"變化題（源自 W3-14）","group":"W3-14","type":"fill","q":"\u003cp>How many lines of \u003ccode>Hi\u003c/code> does this program print? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>pid_t p1 = fork();\npid_t p2 = fork();\nif (p2 == 0) exit(0);\nfork();\nprintf(\"Hi\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["4"],"exp":"\u003cp>兩次 fork 後 4 個 process：(p1, p2) = (&gt;0,&gt;0)、(0,&gt;0)、(&gt;0,0)、(0,0)。p2 == 0 的兩個直接 exit。剩下 2 個各 fork 一次 → 4 個 process 各印一次 → \u003cb>4\u003c/b> 行（process 總數是 6）。\u003c/p>","cprog":"w3_fork p2"},{"id":"w3-17b","week":"W3","topic":"Parent 結束後 zombie 與 orphan 的命運","src":"原題 W3-17 ⚠️","group":"W3-17","type":"single","q":"\u003cp>Process P forks three children. C1 and C2 call \u003ccode>exit(0)\u003c/code> immediately; C3 runs \u003ccode>sleep(60)\u003c/code>. P itself calls \u003ccode>sleep(10)\u003c/code>, never calls \u003ccode>wait()\u003c/code>, and then exits.\u003c/p>\u003cp>After P exits, what happens to C1 and C2, and what is C3 now?\u003c/p>","opts":["C1 and C2 stay zombies forever; C3 becomes a zombie too","init adopts and reaps C1 and C2, and their rows leave the process table; C3 is an orphan","C3 reaps C1 and C2; C3 is now a daemon","C1 and C2 stay zombies until the next reboot; C3 is killed together with P"],"ans":1,"exp":"\u003cp>P 結束時，它所有的 child——包括已經是 zombie 的 C1、C2——都改由 init 收養。init 會替它們 wait，於是 zombie 的那一列被收掉（原答錯在以為它們會一直留著）。\u003c/p>\u003cp>C3 還在跑、原本的 parent 不見了 → \u003cb>orphan\u003c/b>，PPID 變成 1，之後結束時也由 init 收。parent 結束不會連帶殺掉 child。\u003c/p>"},{"id":"w2-02","week":"W2","topic":"np.zeros 為什麼快（lazy allocation）","src":"原題 W2-02","group":"W2-02","type":"multi","q":"\u003cp>Nini timed two calls: \u003ccode>np.zeros((1024,1024,128))\u003c/code> took 0.00004 s, but \u003ccode>np.random.rand(1024,1024,128)\u003c/code> took 0.42 s. Nini says: \"NumPy's zero-filling code must be extremely well optimized.\" Which statements are true? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["np.zeros only allocates pages. VSZ grows, but the pages have no DRAM frame yet.","np.zeros is fast because it reuses an identical array created earlier.","The zeros array never uses memory. Zeros are generated when they are read.","A page gets a DRAM frame when the program first touches it. That cost is paid later.","After np.zeros, the process's RSS barely increases."],"ans":[0,3,4],"exp":"\u003cp>np.zeros 根本沒有「填 0」：它只增加 VSZ，這些頁都指向 OS 共用的 zero page。真正的成本延後到第一次寫入時的 page fault（配 frame、清零）。\u003c/p>\u003cp>(b) 錯：沒有重用任何舊陣列。(c) 錯：一旦寫入，那一頁一定會拿到真正的 frame、佔用記憶體。np.random.rand 必須把每一頁都寫入亂數，所以每頁都要配 frame，才會慢。\u003c/p>"},{"id":"w3-v22b","week":"W3","topic":"fork 共用 offset：讀取","src":"變化題（源自 W3-22 / W2-14 ⚠️）","group":"W3-22","type":"fill","q":"\u003cp>data.txt contains \u003ccode>ABCDEF\u003c/code>.\u003c/p>\u003cpre>\u003ccode>char buf[2], ch;\nint fd = open(\"data.txt\", O_RDONLY);\nif (fork() == 0) {\n    read(fd, buf, 2);\n    exit(0);\n}\nwait(NULL);\nread(fd, &amp;ch, 1);\nprintf(\"%c\\n\", ch);\u003c/code>\u003c/pre>\u003cp>What character does the parent print?\u003c/p>","ans":["C"],"exp":"\u003cp>fd 在 fork 前打開，parent 和 child 的 fd 指向同一個 open file entry、共用 offset。child 讀走 AB，offset 變 2；parent 接著從 offset 2 讀 → \u003cb>C\u003c/b>。若 parent 自己另外 open 一次，才會從 A 開始。\u003c/p>","cprog":"w3_fork v22b"},{"id":"w3-f2","week":"W3","topic":"fork 計數：&& 短路","src":"變化題（源自 W3-15）","group":"W3-15","type":"fill","q":"\u003cp>How many lines of \u003ccode>X\u003c/code> are printed? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>fork() &amp;&amp; fork();\nprintf(\"X\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["3"],"exp":"\u003cp>&amp;&amp; 會短路：左邊是 0 就不算右邊。\u003c/p>\u003cp>原本的 process：第一個 fork 回傳 child 的 PID（非 0）→ 繼續做第二個 fork，又產生一個 child。第一次 fork 的 child：拿到 0 → 短路，不做第二個 fork。第二次 fork 的 child：&amp;&amp; 已經算完。共 3 個 process，各印一次 → \u003cb>3\u003c/b>。\u003c/p>","cprog":"w3_fork f2"},{"id":"w5-c1","week":"W5","topic":"Pipe 容量：wait 之前能寫多少","src":"新題（講義 W5 Part 3）","group":"W5-cap","type":"fill","q":"\u003cp>The lecture's 04-capture-broken program creates a pipe, forks a worker whose stdout is the pipe, and calls wait() before reading the pipe. The worker writes N bytes to the pipe with a single write() and then exits. The pipe capacity is 65,536 bytes (the Linux default). What is the largest N, in bytes, for which the program does not deadlock?\u003c/p>","ans":["65536","64 KiB","64KiB"],"exp":"\u003cp>N ≤ 65536：worker 的資料全部放得進 pipe，worker 結束、wait 回來，parent 再讀出來。N = 65537：最後 1 byte 放不進去，worker 卡在 write()，parent 卡在 wait() → deadlock。（已實測：65536 會結束、65537 會卡住。）\u003c/p>","cprog":"w5_pipe waitfirst 65536 / 65537"},{"id":"w2-v12b","week":"W2","topic":"路徑解析：相對路徑","src":"變化題（源自 W2-12 ⚠️）","group":"W2-12","type":"fill","q":"\u003cp>A process's current working directory is /home/nini (its inode is already known). Nothing else is cached. It calls \u003ccode>open(\"catfood/fish\", O_RDONLY)\u003c/code> with a relative path. How many directories' contents must the kernel read to find fish's inode number?\u003c/p>","ans":["2"],"exp":"\u003cp>相對路徑從 cwd 開始解析，不從 / 開始：讀 /home/nini 的內容找到 catfood → 讀 /home/nini/catfood 的內容找到 fish → \u003cb>2\u003c/b> 個（也要在這 2 個目錄上檢查 x）。/ 和 /home 不用再走一次。\u003c/p>","calc":{"fn":"pathWalk","path":"catfood/fish"}},{"id":"w3-f1","week":"W3","topic":"fork 計數：只有 child 印","src":"變化題（源自 W3-16）","group":"W3-16","type":"fill","q":"\u003cp>Only a newly created child prints in this loop. Counting every process that reaches the printf, how many times is \u003ccode>Hi\u003c/code> printed in total? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 4; i++) {\n    if (fork() == 0)\n        printf(\"Hi\\n\");\n}\nreturn 0;\u003c/code>\u003c/pre>","ans":["15"],"exp":"\u003cp>只有「剛被 fork 出來的 child」會印。但 child 印完不會離開迴圈，會繼續下一輪、自己也 fork。process 數 1 → 2 → 4 → 8 → 16，每輪新增的 child 是 1、2、4、8 個 → 共 \u003cb>15\u003c/b> 行（= 16 個 process 減掉原本那一個）。\u003c/p>\u003cp>對照 \u003ccode>fork(); printf(\"Hi\\n\");\u003c/code> 的版本：每一輪「所有」process 都印，3 輪是 2 + 4 + 8 = 14 行。\u003c/p>","cprog":"w3_fork f1"},{"id":"w4-n08","week":"W4","topic":"vDSO：strace 看不到 gettimeofday","src":"新題（講義 W4 Part 7）","group":"W4-vdso","type":"single","q":"\u003cp>You run \u003ccode>strace -e trace=gettimeofday,clock_gettime date\u003c/code>. date prints the time, but strace shows no gettimeofday or clock_gettime calls. Why?\u003c/p>","opts":["date caches the time from its previous run","strace cannot trace fast system calls","The time functions are served by the vDSO: a small library and a read-only time page that the kernel maps into every process, so no trap happens","date reads the hardware clock directly with a privileged instruction"],"ans":2,"exp":"\u003cp>vDSO：kernel 在每個 process 的 address space map 一個唯讀的時間頁（[vvar]）和一小段程式（[vdso]）。gettimeofday() 變成普通的函式呼叫，直接讀那一頁，不 trap、不切 mode；strace 只看得到真正進 kernel 的 system call，所以看不到。（ARM64 上從 961 ns 降到 128 ns。）\u003c/p>"},{"id":"w5-s2","week":"W5","topic":"timeout 的 exit status","src":"新題（講義 W5 Part 4）","group":"W5-sig","type":"fill","q":"\u003cp>\u003ccode>prog\u003c/code> would normally run for 60 seconds, and it does not handle any signal. You run \u003ccode>timeout 5 ./prog; echo $?\u003c/code>. What number is printed?\u003c/p>","ans":["124"],"exp":"\u003cp>時間到時 timeout 送 SIGTERM 給 prog（預設動作：終止），然後 timeout 自己以 \u003cb>124\u003c/b> 結束，讓 script 能分辨「逾時」和「被別人用 signal 殺掉」（被 SIGTERM 殺掉本來是 128 + 15 = 143）。已實測。\u003c/p>","cprog":"timeout 2 sleep 60"},{"id":"w2-19b","week":"W2","topic":"碰觸頁面與 RSS","src":"原題 W2-19 ⚠️","group":"W2-19","type":"fill","q":"\u003cp>Page size is 4096 bytes. A program maps 64 KiB (16 pages), untouched, and then writes one byte at offsets 0, 100, 20000 and 65000. Finally it writes one more byte at offset 20400. What is this region's RSS now, in KiB?\u003c/p>","ans":["12","12 KiB","12KiB"],"exp":"\u003cp>0、100 → 第 0 頁；20000 → 第 4 頁；65000 → 第 15 頁；20400 ÷ 4096 = 4.98 → 也是第 4 頁，已經有 frame 了，不會再配新的。所以仍是 3 個 frame × 4 KiB = \u003cb>12 KiB\u003c/b>（原答 64 錯：RSS 不是整個 mapping 的大小，而是有 frame 的頁）。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[0,100,20000,65000,20400],"unit":"KiB"}},{"id":"w6-28","week":"W6","topic":"Starvation / aging / liveness","src":"新題（依講義 W6 Part 6）","group":"W6-prio","type":"single","q":"\u003cp>Which term means \"every process, even the lowest-priority one, gets to run within a finite amount of time\"?\u003c/p>","opts":["Starvation","Aging","Liveness","Preemption"],"ans":2,"exp":"\u003cp>\u003cb>Liveness\u003c/b> = 沒有 starvation。Starvation 是相反的情況（低優先 process 一直跑不到）；aging（等越久優先權越高）是達成 liveness 的手段；preemption 是把正在跑的 process 停下來。\u003c/p>"},{"id":"w2-21","week":"W2","topic":"VSZ 遠大於 DRAM","src":"原題 W2-21","group":"W2-21","type":"single","q":"\u003cp>An online judge runs 10,000 submissions on one server. The dashboard shows: total VSZ = 120,000 GiB, DRAM = 512 GiB, total RSS = 310 GiB. How can the total VSZ be so much larger than DRAM?\u003c/p>","opts":["The OS compresses untouched memory.","Allocating a page grows VSZ only. A page takes a DRAM frame only when it is touched.","The dashboard has an error; VSZ can never exceed DRAM.","120,000 GiB is the total over all servers, not this one."],"ans":1,"exp":"\u003cp>VSZ 算的是「map 了多少頁」，RSS 算的是「有 DRAM frame 的頁」。配置只增加 VSZ，只有被 touch 的頁才拿 frame，所以 VSZ 加總可以遠超 DRAM，真正要跟 DRAM 比的是 RSS（310 GiB &lt; 512 GiB）。\u003c/p>"},{"id":"w5-06a","week":"W5","topic":"兩條 pipe 的 deadlock：哪些 n 會跑完","src":"原題 W5-06 ⚠️","group":"W5-06","type":"multi","q":"\u003cp>parent ──(pipe A)──▶ child ──(pipe B)──▶ parent. Each pipe holds 64 KiB. The child loops: read up to 4 KiB from A, then write those bytes into B (it exits when A reaches EOF). The parent does:\u003c/p>\u003cpre>\u003ccode>write(A, data, n);   close(A);   read B until read() returns 0\u003c/code>\u003c/pre>\u003cp>For which n does the program finish? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["n = 10 KiB","n = 100 KiB","n = 200 KiB","n = 1 MiB"],"ans":[0,1],"exp":"\u003cp>parent 開始讀 B 之前，整個系統最多只能吸收：A 裡 64 KiB + B 裡 64 KiB + child 手上已讀出、還沒寫進 B 的 4 KiB = \u003cb>132 KiB\u003c/b>。\u003c/p>\u003cp>n ≤ 132 KiB：parent 能寫完、關掉 A、開始讀 B → 跑完（10、100 KiB ✓）。200 KiB、1 MiB 超過 → B 滿了 child 卡在 write(B)，A 滿了 parent 卡在 write(A) → deadlock。\u003c/p>","calc":{"fn":"twoPipe","a":64,"b":64,"chunk":4,"opts":[10,100,200,1024]},"cprog":"w5_pipe twopipe","cexpect":"10,100"},{"id":"w4-v05a","week":"W4","topic":"System call 裡哪一步是硬體做的","src":"變化題（源自 W4-05 ⚠️）","group":"W4-05","type":"single","q":"\u003cp>In a system call, which step is performed by the CPU hardware itself rather than by software?\u003c/p>","opts":["Putting the system call number and arguments into registers","Switching to kernel mode, saving the user registers on the kernel stack, and jumping to the kernel's entry point","Checking that a buffer pointer lies entirely in user space","Turning a negative return value into errno and −1"],"ans":1,"exp":"\u003cp>(a)、(d) 是 libc 的 wrapper（user mode 的程式碼）；(c) 是 kernel 的 handler（kernel mode 的程式碼）。只有「改 mode bit、存暫存器、跳到開機時設定的固定入口」是 trap 指令讓\u003cb>硬體\u003c/b>完成的——程式不能自己改 mode bit。\u003c/p>"},{"id":"w4-v01a","week":"W4","topic":"Slow system call：睡著的 process","src":"變化題（源自 W4-01）","group":"W4-01","type":"multi","q":"\u003cp>Process A is asleep inside \u003ccode>read(0, &amp;c, 1)\u003c/code> waiting for a key, and process B is running. Which statements are true? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["A uses no CPU time while it sleeps.","A is on a wait queue for the keyboard.","A repeatedly checks whether a key has arrived.","A's registers, program counter and stack pointer are saved in its PCB.","A's user memory is copied to disk while it sleeps."],"ans":[0,1,3],"exp":"\u003cp>slow system call：kernel 把 A 設成 sleeping、放進 wait queue，context switch 給 B（A 的 context 存進 PCB）。睡著的 process 完全不用 CPU，也不會自己輪詢，等鍵盤 interrupt 把它叫醒。記憶體原地不動，不需要搬到磁碟。\u003c/p>"},{"id":"w6-30","week":"W6","topic":"STCF：連續兩個搶占","src":"新題（依講義 W6 Part 4）","group":"W6-stcf","type":"fill","q":"\u003cp>Under \u003cb>STCF\u003c/b>: A arrives at t = 0 with a 6 ms burst, B at t = 2 with 3 ms, and C at t = 3 with 1 ms. What is the average turnaround time, in ms?\u003c/p>","ans":["5","5 ms"],"exp":"\u003cp>t = 0：A 開始。t = 2：B（3）&lt; A 剩下的 4 → 搶占。t = 3：C（1）&lt; B 剩下的 2 → 再搶占，C 3–4 完成。t = 4：B（2）&lt; A（4）→ B 4–6 完成。A 6–10 完成。\u003c/p>\u003cp>turnaround：A 10、B 4、C 1 → 15 / 3 = \u003cb>5\u003c/b> ms。（FIFO 是 6.67，SJF 是 6。）\u003c/p>","calc":{"fn":"sched","policy":"stcf","jobs":[["A",0,6],["B",2,3],["C",3,1]],"metric":"avgTurnaround"}},{"id":"w6-16","week":"W6","topic":"CFS：Δvruntime","src":"新題（依講義 W6 Part 7）","group":"W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>A nice-5 process runs on the CPU for 6 ms. By how many ms does its vruntime grow? (Round to two decimal places.)\u003c/p>","ans":["18.34","18.3","18.34 ms"],"exp":"\u003cp>Δvruntime = 6 × 1024 / 335 ≈ \u003cb>18.34\u003c/b> ms。weight 小（比較 nice）的 process，vruntime 長得快，很快就不再是最小的，所以被挑中的次數少；nice 0 跑 6 ms 只長 6 ms，nice −5 只長約 1.97 ms。\u003c/p>","calc":{"fn":"cfsDv","run":6,"weight":335}},{"id":"w5-v07b","week":"W5","topic":"read() 回傳值：換 buffer 大小","src":"變化題（源自 W5-07 ⚠️）","group":"W5-07","type":"fill","q":"\u003cp>The parent creates a pipe and forks. The child writes 10000 bytes into the pipe and exits. The parent closes its own write end, sleeps 2 seconds (so all the data is already in the pipe), and then calls \u003ccode>read(fd[0], buf, 4096)\u003c/code> repeatedly. What does the \u003cb>third\u003c/b> read() return?\u003c/p>","ans":["1808"],"exp":"\u003cp>每次最多拿 4096：第一次 4096、第二次 4096、第三次是剩下的 10000 − 8192 = \u003cb>1808\u003c/b>。第四次：pipe 空了而且沒有任何 write end → 回傳 0（EOF）。已實測。\u003c/p>","calc":{"fn":"readSeq","size":10000,"reqs":[4096,4096,4096],"which":2},"cprog":"w5_pipe v07b"},{"id":"w3-15b","week":"W3","topic":"fork 計數：條件 Y 由誰印","src":"原題 W3-15","group":"W3-15","type":"single","q":"\u003cpre>\u003ccode>pid_t a = fork();\npid_t b = fork();\nif (a == 0 || b == 0) printf(\"X\\n\");\nif (a != 0 &amp;&amp; b == 0) printf(\"Y\\n\");\nreturn 0;\u003c/code>\u003c/pre>\u003cp>Assume every fork succeeds. The four processes are the original one, the child of the first fork, the child that the original process creates in the second fork, and the grandchild. Which of them print \u003ccode>Y\u003c/code>, and how many Y lines appear in total?\u003c/p>","opts":["Only the original process; 1 line","The child of the first fork and the grandchild; 2 lines","Only the child that the original process creates in the second fork; 1 line","Every process except the original one; 3 lines"],"ans":2,"exp":"\u003cp>a != 0 &amp;&amp; b == 0：第一次 fork 時是 parent（a &gt; 0），第二次 fork 時是 child（b == 0）→ 只有「原本 process 在第二次 fork 產生的 child」，(a, b) = (&gt;0, 0) → \u003cb>1\u003c/b> 行。\u003c/p>\u003cp>對照 X 的條件 a == 0 || b == 0：除了原本的 process 以外都成立 → 3 行（那是 (d) 描述的情況）。\u003c/p>","cprog":"w3_fork w3-15 (tty)","cexpect":"1"},{"id":"w4-n03","week":"W4","topic":"哪一類 exception 會重試同一個指令","src":"新題（講義 W4 Part 5）","group":"W4-exc","type":"single","q":"\u003cp>After the kernel successfully handles which kind of exception does the CPU re-execute the \u003cb>same\u003c/b> instruction that caused it?\u003c/p>","opts":["Tr
