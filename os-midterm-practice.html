ap","Fault","Interrupt","Abort"],"ans":1,"exp":"\u003cp>fault：kernel 修好問題（例如 page fault 配好 frame）後重新執行同一個指令；修不好就終止 process。trap：從下一個指令繼續（system call 回來）。interrupt：被打斷的程式從下一個指令繼續（事件跟它無關）。abort：kernel panic，沒有「繼續」。\u003c/p>"},{"id":"w5-v07a","week":"W5","topic":"read 迴圈：條件對了但忘了 close","src":"變化題（源自 W5-07 ⚠️）","group":"W5-07","type":"single","q":"\u003cp>The parent creates a pipe and forks. The child writes 5000 bytes into the pipe and exits immediately. The parent runs the loop below. The condition is now \u003ccode>&gt; 0\u003c/code>, but the parent \u003cb>forgot to close\u003c/b> its own copy of the write end:\u003c/p>\u003cpre>\u003ccode>sleep(2);\nchar buf[1000];\nlong total = 0;\nssize_t n;\nwhile ((n = read(fd[0], buf, sizeof buf)) &gt; 0)\n    total += n;\nprintf(\"got %ld bytes\\n\", total);\u003c/code>\u003c/pre>\u003cp>What happens?\u003c/p>","opts":["It prints \"got 5000 bytes\" after about 2 seconds.","Nothing is printed and it never finishes; after 2 seconds it keeps one CPU core busy.","It never finishes, uses no CPU, and stays blocked in read().","It prints \"got 5000 bytes\", because read() returns −1 at the end."],"ans":2,"exp":"\u003cp>讀完 5000 bytes 後 pipe 空了；child 已經 exit，但 parent 自己的 fd[1] 還開著 → write end 的數量不是 0 → read() \u003cb>block\u003c/b>，不會回傳 0。parent 在等它自己，睡在 read() 裡、不耗 CPU，永遠到不了 printf。\u003c/p>\u003cp>對照原題：有 close、條件寫成 &gt;= 0 → 每次立刻回傳 0 → 吃滿 CPU。兩題的症狀都是「不會結束」，但一個 block、一個 spin。（已實測：5 秒內 CPU 時間約 0。）\u003c/p>","cprog":"w5_pipe v07a","cexpect":"block"},{"id":"w3-11","week":"W3","topic":"API key 不要放命令列","src":"原題 W3-11","group":"W3-11","type":"single","q":"\u003cp>On a shared workstation, why is running \u003ccode>python3 llama.py --key sk-ABC123\u003c/code> unsafe?\u003c/p>","opts":["Command-line arguments are written to the disk in plain text.","The key can be read by other users with ps or top.","The key is passed on to every child process.","Python stores arguments in a global variable that other programs can read."],"ans":1,"exp":"\u003cp>同一台機器上的所有使用者都能用 ps / top 看到每個 process 的命令列參數。放在環境變數裡只有該 process 和它的 child 看得到，是放 secret 的標準做法。(c)「傳給 child」是環境變數的特性，也不是別的使用者看得到的原因。\u003c/p>"},{"id":"w3-f5","week":"W3","topic":"講義 loop.c 導向檔案","src":"變化題（源自 W3-16）","group":"W3-16","type":"fill","q":"\u003cp>The lecture's loop.c is run as \u003ccode>./loop &gt; out.txt\u003c/code>. How many lines does out.txt contain? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>int main(void) {\n    char *letters = \"ABC\";\n    for (int i = 0; i &lt; 3; i++) {\n        printf(\"%d prints %c\\n\", getpid(), letters[i]);\n        fork();\n    }\n    printf(\"%d finished\\n\", getpid());\n    return 0;\n}\u003c/code>\u003c/pre>","ans":["32"],"exp":"\u003cp>在終端機上是 1 + 2 + 4 + 8 = 15 行。導向檔案時 stdout 是 fully buffered，每次 fork 都把「還沒 flush 的 buffer」複製一份。最後的 8 個 process，各自的 buffer 都含有一路上印過的 A、B、C 三行，再加上自己的 finished，共 4 行；結束時各自 flush → 8 × 4 = \u003cb>32\u003c/b> 行（很多行的 PID 會重複，因為是從 parent 複製來的）。已實測。\u003c/p>","cprog":"w3_fork f5"},{"id":"w4-v05b","week":"W4","topic":"System call 參數驗證","src":"變化題（源自 W4-05 ⚠️）","group":"W4-05","type":"single","q":"\u003cp>A malicious program calls \u003ccode>write(1, (char *)0xffff880000001000, 64)\u003c/code>, passing an address inside the kernel's half of the address space. The system call handler runs in kernel mode, so it \u003ci>could\u003c/i> read that address. What happens?\u003c/p>","opts":["The trap instruction refuses to execute because the pointer is invalid","The kernel prints 64 bytes of kernel memory, because the handler runs in kernel mode","The handler checks that the whole buffer lies in user space, rejects it, and write() returns −1 with errno EFAULT","The CPU raises a fault as soon as the pointer is placed in a register"],"ans":2,"exp":"\u003cp>暫存器只裝一個數字，放進去不會出事；trap 指令也不看參數。所以 kernel 必須在 handler 裡自己驗證：sys_write 檢查整段 buffer 都在 user space，不是就拒絕 → write() 回傳 −1、errno = EFAULT（Bad address）。\u003c/p>\u003cp>若不檢查，就會把 kernel 記憶體（可能含別的 process 的資料）印出來——所以每個 system call 參數都要在 user / kernel 邊界驗證。\u003c/p>"},{"id":"w2-07","week":"W2","topic":"read() 會移動 offset","src":"原題 W2-07","group":"W2-07","type":"fill","q":"\u003cp>data.txt contains \u003ccode>ABCDEF\u003c/code>. A program opens it once and runs:\u003c/p>\u003cpre>\u003ccode>char x, y, a[2];\nread(fd, &amp;x, 1);\nread(fd, a, 2);\nread(fd, &amp;y, 1);\u003c/code>\u003c/pre>\u003cp>What are x and y? Type the two characters with no space, x first (for example \u003ccode>QZ\u003c/code>).\u003c/p>","ans":["AD","A D","A,D"],"exp":"\u003cp>同一個 fd 指向同一個 open file entry，大家共用一個 offset，每次 read 都從上次停下的地方繼續：讀 1 byte → A（offset 變 1）、讀 2 bytes → BC（offset 變 3）、讀 1 byte → D。所以 x = A、y = D。\u003c/p>","calc":{"fn":"readChars","content":"ABCDEF","reqs":[1,2,1],"pick":[0,2]},"cprog":"w2_files w2-07"},{"id":"w4-05","week":"W4","topic":"System call 流程","src":"原題 W4-05 ⚠️","group":"W4-05","type":"single","q":"\u003cp>The steps of a system call are listed out of order:\u003c/p>\u003cp>P. Call the system call handler and check whether the arguments are valid and safe\u003cbr>Q. Put the system call number and arguments into CPU registers\u003cbr>R. Return to user mode and continue the user program\u003cbr>S. The CPU switches to kernel mode and jumps to a predefined kernel entry point\u003cbr>T. Execute the trap / system call instruction\u003cbr>U. The kernel performs the requested operation\u003c/p>\u003cp>Which order is correct?\u003c/p>","opts":["Q → T → S → P → U → R","T → Q → S → P → U → R","Q → T → P → S → U → R","Q → S → T → P → U → R"],"ans":0,"exp":"\u003cp>libc wrapper 先把 system call 編號和參數放進暫存器（Q）→ 執行 trap 指令（T）→ 硬體切到 kernel mode、跳到開機時設定的固定入口（S）→ kernel 依編號找 handler、檢查參數（P；指標參數要確認整段都在 user space，並複製進 kernel）→ 做真正的工作（U）→ return-from-trap 回到 user mode，從 trap 的下一個指令繼續（R）。\u003c/p>\u003cp>重點：參數要在 trap \u003cb>之前\u003c/b>放好；切換 mode 是 trap 指令觸發硬體做的，不是 kernel 程式碼；檢查參數一定在執行工作之前。\u003c/p>"},{"id":"w6-05","week":"W6","topic":"FIFO 平均 turnaround","src":"新題（依講義 W6 Part 4）","group":"W6-fifo","type":"fill","q":"\u003cp>Three jobs arrive at t = 0 in the order A, B, C. Their bursts are A = 24 ms, B = 3 ms, C = 3 ms. Under \u003cb>FIFO\u003c/b>, what is the average turnaround time, in ms?\u003c/p>","ans":["27","27 ms"],"exp":"\u003cp>FIFO 照抵達順序跑：A 0–24、B 24–27、C 27–30。turnaround 24、27、30 → 平均 \u003cb>27\u003c/b> ms。長工作排最前面，短工作都被拖累（convoy effect）。\u003c/p>","calc":{"fn":"sched","policy":"fifo","jobs":[["A",0,24],["B",0,3],["C",0,3]],"metric":"avgTurnaround"}},{"id":"w4-03d","week":"W4","topic":"root ≠ kernel mode","src":"原題 W4-03 (d)","group":"W4-03","type":"single","q":"\u003cp>A C function has a stack buffer overflow that overwrites the saved return address in its own stack frame.\u003c/p>\u003cp>Why is this kind of attack especially dangerous when the vulnerable program is running as root?\u003c/p>","opts":["Because root processes run in kernel mode, so the attacker gets kernel mode.","Because the attacker may redirect the program to an unintended code path while the process still has root permission.","Because root processes are not protected by virtual memory.","Because root processes can jump to kernel addresses directly."],"ans":1,"exp":"\u003cp>root 是\u003cb>身分\u003c/b>（UID 0），不是 CPU 模式。root process 一樣跑在 user mode、一樣受虛擬記憶體保護、一樣要透過 system call 才能做特權操作。危險在於：攻擊者劫持控制流程後，程式仍以 root 身分執行，可以透過 system call 讀任何檔案、殺任何 process。\u003c/p>"},{"id":"w3-13","week":"W3","topic":"PATH 是誰在搜尋","src":"原題 W3-13","group":"W3-13","type":"single","q":"\u003cp>You type \u003ccode>myapp\u003c/code> and get \u003ccode>myapp: command not found\u003c/code>. Which statement is correct?\u003c/p>","opts":["The kernel searched every directory on the disk and did not find myapp.","The kernel searched the directories listed in PATH and did not find myapp.","The shell searched the directories listed in PATH and did not find myapp.","The shell searched only the current directory and did not find myapp."],"ans":2,"exp":"\u003cp>kernel 的 execve() 需要完整路徑。是 \u003cb>shell\u003c/b>（或 libc 的 execvp）依序在 PATH 的每個目錄嘗試 execve，strace 會看到一連串 \u003ccode>execve(...) = -1 ENOENT\u003c/code>。kernel 不會去搜尋 PATH；PATH 裡通常也沒有目前目錄。\u003c/p>"},{"id":"w3-17a","week":"W3","topic":"Zombie 計數","src":"原題 W3-17","group":"W3-17","type":"fill","q":"\u003cp>Process P forks three children. C1 and C2 call \u003ccode>exit(0)\u003c/code> immediately; C3 runs \u003ccode>sleep(60)\u003c/code>. P itself calls \u003ccode>sleep(10)\u003c/code>, never calls \u003ccode>wait()\u003c/code>, and then exits.\u003c/p>\u003cp>At a moment when C1 and C2 have exited but P is still sleeping, how many zombie processes exist?\u003c/p>","ans":["2"],"exp":"\u003cp>C1、C2 已經 exit，但 parent P 還活著、而且從不呼叫 wait() → 它們的 process table 那一列還留著 → \u003cb>2\u003c/b> 個 zombie。C3 還在 sleep，不是 zombie。\u003c/p>"},{"id":"w5-r1","week":"W5","topic":"read() 在 pipe 上：拿到多少就回多少","src":"變化題（源自 W2-16 ⚠️）","group":"W5-read","type":"fill","q":"\u003cp>A child writes the 10 bytes \u003ccode>0123456789\u003c/code> into a pipe and then sleeps for 100 seconds \u003cb>without closing\u003c/b> its write end. The parent has closed its own write end. After the data has arrived, the parent calls \u003ccode>read(fd[0], buf, 4)\u003c/code> three times. What does the third read() return?\u003c/p>","ans":["2"],"exp":"\u003cp>前兩次各拿 4 bytes（0123、4567），第三次只剩 89 → 回傳 \u003cb>2\u003c/b>。跟讀一般檔案一樣：read 回傳實際拿到的數量，可以比要求的少。已實測。\u003c/p>","calc":{"fn":"readSeq","size":10,"reqs":[4,4,4],"which":2},"cprog":"w5_pipe r1"},{"id":"w6-01","week":"W6","topic":"I/O-bound vs CPU-bound","src":"新題（依講義 W6 Part 1）","group":"W6-burst","type":"multi","q":"\u003cp>Which of the following programs are \u003cb>I/O-bound\u003c/b>? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["bash showing a prompt and waiting for your command","ffmpeg converting a 4K video to another format","A web server sending small files to visitors","make -j1 building the Linux kernel","A text editor while you are typing","Training a neural network"],"ans":[0,2,4],"exp":"\u003cp>I/O-bound：很多短的 CPU burst，大部分時間在等（等按鍵、等網路）——bash、web server、編輯器。等待時睡在 read() 裡，不用 CPU。\u003c/p>\u003cp>CPU-bound：很長的 CPU burst、很少等——影片編碼、編譯（原始檔通常已在記憶體）、訓練模型。scheduler 要讓 I/O-bound 程式一醒來就能馬上跑（反應快），讓 CPU-bound 程式拿到大量 CPU 時間。\u003c/p>"},{"id":"w5-10a","week":"W5","topic":"自製 shell 的 prompt 不回來：哪個 fd","src":"原題 W5-10 ⚠️（選項為推測重建）","group":"W5-10","type":"single","q":"\u003cp>A homemade shell runs \u003ccode>cat words.txt | grep cat\u003c/code>. cat has already exited, but the prompt never comes back. The fd tables are:\u003c/p>\u003cpre>\u003ccode>/proc/45111/fd (shell):  0,1,2 -&gt; /dev/pts/2    3 -&gt; pipe:[88216611] (lr-x)\n/proc/45113/fd (grep):   0 -&gt; pipe:[88216611] (lr-x)   1,2 -&gt; /dev/pts/2\n                         4 -&gt; pipe:[88216611] (l-wx)\u003c/code>\u003c/pre>\u003cp>Which fd keeps grep's read() from ever returning 0?\u003c/p>","opts":["fd 3 of the shell","fd 4 of the shell","fd 0 of grep","fd 4 of grep"],"ans":3,"exp":"\u003cp>看權限字母：\u003ccode>l-wx\u003c/code> = write end、\u003ccode>lr-x\u003c/code> = read end。這條 pipe 唯一的 write end 是 \u003cb>grep 自己的 fd 4\u003c/b> → kernel 認為還有 writer，pipe 空了就 block → grep 在等自己（原答 fd 4 of the shell 錯——shell 根本沒有 fd 4）。shell 的 fd 3 是 read end，沒關雖然也是 bug，但 read end 不影響 EOF。\u003c/p>"},{"id":"w2-04","week":"W2","topic":"隔離三層：process / container / VM","src":"原題 W2-04","group":"W2-04","type":"single","q":"\u003cp>Which statement correctly describes what a container and a virtual machine share with other workloads on the same physical machine?\u003c/p>","opts":["A container shares only the hardware. A VM shares the OS.","Both share only the hardware.","A container shares the operating system. A VM shares only the hardware.","Both share the OS."],"ans":2,"exp":"\u003cp>三層隔離，越下面邊界越強、成本越高：\u003c/p>\u003cp>① process：自己的記憶體和 CPU 時間，共用 OS 和檔案系統（幾乎免費，例如 PTT 一個登入一個 process）。\u003cbr>② container：自己的身分、檔案系統視角、CPU / 記憶體上限，\u003cb>共用 OS kernel\u003c/b>（Docker、Colab）。\u003cbr>③ VM：裡面跑自己的一整個 OS，\u003cb>只共用硬體\u003c/b>，由 hypervisor 切分（AWS / GCP VM）。\u003c/p>"},{"id":"w6-26","week":"W6","topic":"nice 的範圍與權限","src":"新題（依講義 W6 Part 6）","group":"W6-nice","type":"single","q":"\u003cp>A normal (non-root) user runs \u003ccode>nice -n -5 ./build\u003c/code> and later \u003ccode>renice -n 19 -p 4242\u003c/code> on one of their own processes. What happens?\u003c/p>","opts":["Both work; −5 makes the build nicer, and 19 makes process 4242 less nice","Both work, because users may set any nice value for their own processes","Both are refused, because only root may change nice values","The request for nice −5 is refused, because only root may give a process a negative nice value; renice to 19 works"],"ans":3,"exp":"\u003cp>nice 範圍 −20（最高優先、最不 nice）到 +19（最低優先），預設 0，child 繼承 parent 的值。數字越大越不重要。一般使用者只能讓 process \u003cb>更 nice\u003c/b>（調高數字）；要負值得有 root，否則大家都把自己設成 −20。\u003c/p>"},{"id":"w3-v18a","week":"W3","topic":"更新 libssl.so：重啟與重新建置","src":"變化題（源自 W3-18 ⚠️）","group":"W3-18","type":"single","q":"\u003cp>A machine replaces \u003ccode>libssl.so\u003c/code> with a patched version. Which version of libssl does each program use?\u003c/p>\u003cp>• D: dynamically linked; was running before the replacement, then restarted after it.\u003cbr>• E: statically linked; rebuilt against the patched OpenSSL after the replacement, then started.\u003cbr>• F: statically linked with the old OpenSSL; started after the replacement and never rebuilt.\u003c/p>","opts":["D old, E new, F old","D new, E old, F old","D new, E new, F old","D new, E new, F new"],"ans":2,"exp":"\u003cp>D：重啟時 dynamic loader 重新找 libssl.so → 新版。\u003c/p>\u003cp>E：重新編譯時把新版 OpenSSL 複製進執行檔 → 新版（讓它變新的是「重新建置」，不是系統上的 .so 被換掉）。\u003c/p>\u003cp>F：執行檔裡帶的還是舊版程式碼，系統的 .so 換了也沒用 → 舊版。\u003c/p>"},{"id":"w5-v05b","week":"W5","topic":"git 啟動 pager：less 的 fd","src":"變化題（源自 W5-05 ⚠️）","group":"W5-05","type":"single","q":"\u003cp>strace of \u003ccode>git log\u003c/code> starting its pager:\u003c/p>\u003cpre>\u003ccode># 4100 is git; 4101 is the child that becomes less\n4100  pipe2([3, 4], 0)   = 0\n4100  clone(...)         = 4101\n4101  dup2(3, 0)         = 0\n4101  close(3)           = 0\n4101  close(4)           = 0\n4101  execve(\"/usr/bin/less\", ...) = 0\n4100  close(3)           = 0\n4100  dup2(4, 1)         = 1\n4100  close(4)           = 0\u003c/code>\u003c/pre>\u003cp>After the last line, what do \u003cb>less's\u003c/b> (4101's) fd 0 and fd 1 refer to?\u003c/p>","opts":["fd 0: the read end of the pipe; fd 1: the terminal","fd 0: the terminal; fd 1: the write end of the pipe","fd 0: the read end; fd 1: the write end","fd 0: the write end; fd 1: the terminal"],"ans":0,"exp":"\u003cp>4101 做了 dup2(3, 0) → fd 0 指向 read end；接著關掉 3、4，exec less。它從沒動過 fd 1。fd 1 是 fork 當下從 git 複製來的——那時 git 還沒 dup2(4, 1)，所以是終端機。less 從 pipe 讀、畫到終端機上。\u003c/p>"},{"id":"w5-02","week":"W5","topic":"close(1) 之後 pipe 拿到的 fd","src":"原題 W5-02","group":"W5-02","type":"fill","q":"\u003cp>A process starts with only fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>close(1);\nint f = open(\"log.txt\", O_RDONLY);\nint fd[2];\npipe(fd);\u003c/code>\u003c/pre>\u003cp>What are fd[0] and fd[1]? Type the two numbers separated by a space (for example \u003ccode>7 8\u003c/code>).\u003c/p>","ans":["3 4","3,4"],"exp":"\u003cp>kernel 每次都配「最小的可用編號」。close(1) 後 1 號空出來，open 拿走 1（f = 1）。pipe 需要兩個：最小可用是 3、接著 4 → fd[0] = \u003cb>3\u003c/b>（read end）、fd[1] = \u003cb>4\u003c/b>（write end）。\u003c/p>","cprog":"w5_pipe w5-02"},{"id":"w3-22","week":"W3","topic":"fork 共用 file offset","src":"原題 W3-22 ⚠️","group":"W3-22","type":"fill","q":"\u003cpre>\u003ccode>int fd = open(\"log.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0644);\nif (fork() == 0) {\n    write(fd, \"A\", 1);\n} else {\n    wait(NULL);\n    write(fd, \"B\", 1);\n}\u003c/code>\u003c/pre>\u003cp>After both processes finish, what are the exact contents of log.txt?\u003c/p>","ans":["AB"],"exp":"\u003cp>fork 複製 fd table，但兩邊的 fd 指向\u003cb>同一個\u003c/b> open file entry，共用同一個 offset。child 寫 A 後 offset 變 1；parent 等 child 結束後寫 B，從 offset 1 開始 → 檔案內容是 \u003cb>AB\u003c/b>，共 2 bytes（原答 16 錯）。\u003c/p>\u003cp>若改成「fork 之後兩邊各自 open」，就是兩個獨立的 open file entry、各自從 0 開始，會互相覆蓋。\u003c/p>","cprog":"w3_fork w3-22"},{"id":"w5-v10b","week":"W5","topic":"只剩 read end 不影響 EOF","src":"變化題（源自 W5-10 ⚠️）","group":"W5-10","type":"single","q":"\u003cp>A homemade shell runs \u003ccode>cat words.txt | grep cat\u003c/code>, and cat has exited. The fd tables are:\u003c/p>\u003cpre>\u003ccode>/proc/8001/fd (shell):  0,1,2 -&gt; /dev/pts/3    3 -&gt; pipe:[7012] (lr-x)\n/proc/8003/fd (grep):   0 -&gt; pipe:[7012] (lr-x)   1,2 -&gt; /dev/pts/3\u003c/code>\u003c/pre>\u003cp>Will grep's read() return 0, so that grep exits and the prompt comes back?\u003c/p>","opts":["Yes: no process holds the write end any more, so once the pipe is empty grep sees EOF","No: the shell's fd 3 keeps the pipe open, so grep blocks forever","No: grep's own fd 0 counts as a writer","grep is killed by SIGPIPE"],"ans":0,"exp":"\u003cp>EOF 只看 write end：兩邊都只剩 read end（lr-x），沒有任何 l-wx → 讀完剩下的資料後 read() 回傳 0 → grep 結束，prompt 回來。shell 沒關 fd 3 是 fd 洩漏，但不影響 EOF。\u003c/p>"},{"id":"w5-s5","week":"W5","topic":"timeout -s KILL 的 exit status","src":"新題（講義 W5 Part 5 exercise 7）","group":"W5-sig","type":"fill","q":"\u003cp>You run \u003ccode>timeout -s KILL 2 sleep 10; echo $?\u003c/code>. What number is printed?\u003c/p>","ans":["137"],"exp":"\u003cp>\u003ccode>-s KILL\u003c/code> 讓 timeout 逾時時直接送 SIGKILL（9）。因為是被強制殺掉的，timeout 回報 128 + 9 = \u003cb>137\u003c/b>，而不是 124。已實測。\u003c/p>","cprog":"timeout -s KILL 2 sleep 10"},{"id":"w2-v17a","week":"W2","topic":"write / printf / write 的順序","src":"變化題（源自 W2-17 ⚠️）","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>write(1, \"one \", 4);\nprintf(\"two \");\nwrite(1, \"three \", 6);\nreturn 0;\u003c/code>\u003c/pre>","ans":["one three two"],"exp":"\u003cp>兩個 write 都是 system call，立刻依序進 kernel：one、three。printf 的 \"two \" 待在 libc buffer，直到 return 才 flush → \u003cb>one three two\u003c/b>。\u003c/p>","cprog":"w2_buffers v17a"},{"id":"w3-18","week":"W3","topic":"更新 libssl.so 後各程式用哪一版","src":"原題 W3-18 ⚠️","group":"W3-18","type":"single","q":"\u003cp>A machine replaces \u003ccode>libssl.so\u003c/code> with a patched version. Which version of libssl does each program use?\u003c/p>\u003cp>• A: dynamically linked; started before the replacement and still running.\u003cbr>• B: dynamically linked; started after the replacement.\u003cbr>• C: statically linked; started after the replacement.\u003c/p>","opts":["A old, B new, C new","A old, B new, C old","A new, B new, C old","A new, B new, C new"],"ans":1,"exp":"\u003cp>A：替換前就已經把舊版 .so map 進記憶體了，要重啟才會換 → old。\u003c/p>\u003cp>B：啟動時 dynamic loader 才去找 libssl.so，拿到新版 → new。\u003c/p>\u003cp>C：靜態連結在\u003cb>建置時\u003c/b>就把 libssl 複製進執行檔，替換 .so 對它完全沒影響，必須重新編譯、重新發布 → old（原答 new 錯）。這就是 Heartbleed 時靜態連結的程式一直沒被修好的原因。\u003c/p>"},{"id":"w3-v21c","week":"W3","topic":"printf 在 fork 前、輸出到檔案","src":"變化題（源自 W2-17 / W3-21 ⚠️）","group":"W3-21","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog &gt; out.txt\u003c/code>. How many lines does out.txt contain? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>printf(\"hi\\n\");\nfork();\nfork();\nreturn 0;\u003c/code>\u003c/pre>","ans":["4"],"exp":"\u003cp>導向檔案時 \"hi\\n\" 遇到換行也不會 flush，還在 buffer 裡。兩次 fork 產生 4 個 process，每個都帶著一份含 \"hi\\n\" 的 buffer，各自在 return 時 flush → \u003cb>4\u003c/b> 行。\u003c/p>\u003cp>輸出到終端機（line-buffered）時，\"hi\\n\" 在 fork 前就寫出去了，只有 1 行。要避免重複，fork 前先 \u003ccode>fflush(stdout)\u003c/code>。\u003c/p>","cprog":"w3_fork v21c"},{"id":"w2-v13a","week":"W2","topic":"RSS：np.zeros 之後寫三個位置","src":"變化題（源自 W2-13 ⚠️）","group":"W2-13","type":"fill","q":"\u003cp>Page size is 4 KiB. \u003ccode>a = np.zeros((64, 128))\u003c/code> is a 64 KiB array of doubles (8 bytes each, stored row by row; assume it starts at a page boundary). The script then runs:\u003c/p>\u003cpre>\u003ccode>a[0, 0] = 1.0\na[31, 0] = 1.0\na[63, 127] = 1.0\u003c/code>\u003c/pre>\u003cp>By how many KiB does RSS grow?\u003c/p>","ans":["12","12 KiB","12KiB"],"exp":"\u003cp>一列 128 × 8 = 1024 bytes，一頁放 4 列。a[0,0] 在 byte 0 → 第 0 頁；a[31,0] 在 31 × 1024 = 31744 → 第 7 頁；a[63,127] 在 63 × 1024 + 127 × 8 = 65528 → 第 15 頁。三個不同的頁 → 3 × 4 = \u003cb>12 KiB\u003c/b>，其他 13 頁仍指向 zero page。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[0,31744,65528],"unit":"KiB"}},{"id":"w4-04-3","week":"W4","topic":"Zero page：第一次寫入","src":"原題 W4-04 (3)","group":"W4-04","type":"single","q":"\u003cp>A virtual page is already mapped to the shared read-only zero page. The program first reads a value from that page and then writes to it. The first write takes much longer than the read.\u003c/p>\u003cp>What happens on the first write?\u003c/p>","opts":["A page fault occurs because the shared zero page is read-only.","The write goes directly into the shared zero page.","The program makes a system call to allocate the page.","A timer interrupt occurs."],"ans":0,"exp":"\u003cp>zero page 是全系統共用、唯讀的；寫入違反權限 → page fault → kernel 配一個新 frame、填 0、把這個虛擬頁改映射到新 frame（可寫），然後\u003cb>重新執行\u003c/b>那個寫入指令。這是可修復的 fault，程式完全感覺不到（只是慢一點）。\u003c/p>"},{"id":"w5-e1","week":"W5","topic":"2>&1 讓錯誤訊息進 pipe","src":"新題（講義 W5 Part 2）","group":"W5-err","type":"fill","q":"\u003cp>a.txt has exactly 10 lines; missing.txt does not exist. What does this command print?\u003c/p>\u003cpre>\u003ccode>cat a.txt missing.txt 2&gt;&amp;1 | wc -l\u003c/code>\u003c/pre>","ans":["11"],"exp":"\u003cp>\u003ccode>2&gt;&amp;1\u003c/code> 讓 cat 的 fd 2 也指向 fd 1 當時指的東西——也就是 pipe（shell 先接好 pipe，再處理 2&gt;&amp;1）。所以錯誤訊息 \u003ccode>cat: missing.txt: No such file or directory\u003c/code> 也進了 pipe，wc 數到 10 + 1 = \u003cb>11\u003c/b> 行。\u003c/p>\u003cp>沒有 2&gt;&amp;1 時，錯誤訊息走 fd 2 直接到終端機，wc 只會數到 10。已實測。\u003c/p>","cprog":"cat a.txt missing.txt 2>&1 | wc -l"},{"id":"w3-14b","week":"W3","topic":"fork 計數：process 總數","src":"原題 W3-14","group":"W3-14","type":"fill","q":"\u003cp>How many processes are created in total by running this program, counting the original process and the ones that exit early? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>pid_t pid1 = fork();\npid_t pid2 = fork();\nif (pid1 == 0) { exit(0); } else { fork(); }\nif (pid2 == 0) { printf(\"Hi\\n\"); }\nreturn 0;\u003c/code>\u003c/pre>","ans":["6"],"exp":"\u003cp>前兩次 fork：1 → 4 個。pid1 == 0 的 2 個 exit（它們還是算數）。剩下的 2 個各 fork 一次，再多 2 個 → 4 + 2 = \u003cb>6\u003c/b>（已實測）。\u003c/p>","cprog":"w3_fork w3-14 (count)"},{"id":"w3-02","week":"W3","topic":"兩個靜態連結執行檔的 libX","src":"原題 W3-02","group":"W3-02","type":"single","q":"\u003cp>A and B are two different executables, each statically linked with libX. Both are running at the same time. How many copies of libX's code are in DRAM, and why?\u003c/p>","opts":["1 copy, because the kernel compares page contents and shares pages that are equal","2 copies, because the kernel shares pages only when they come from the same file","2 copies, because statically linked code can never be shared","1 copy, because the same library is loaded only once"],"ans":1,"exp":"\u003cp>靜態連結把 libX 複製進 A、B 兩個\u003cb>不同的\u003c/b>執行檔。kernel 只共享「同一個檔案」被多個 process map 的頁，不會比對不同檔案的內容 → \u003cb>2\u003c/b> 份。\u003c/p>\u003cp>(c) 錯：同一個靜態執行檔同時跑兩個 process 時，code 來自同一個檔案，還是可以共享。\u003c/p>"},{"id":"w2-v11b","week":"W2","topic":"有斜線就不搜尋 PATH","src":"變化題（源自 W2-11 ⚠️）","group":"W2-11","type":"multi","q":"\u003cp>PATH is \u003ccode>/usr/local/bin:/usr/bin:/bin\u003c/code> (it does not contain /home/niko/bin), and \u003ccode>/home/niko/bin/greet\u003c/code> is \u003ccode>-rwxr-xr-x\u003c/code>. niko's home directory is /home/niko. Which of these commands run the program? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["In /home/niko/bin: \u003ccode>greet\u003c/code>","In /home/niko/bin: \u003ccode>./greet\u003c/code>","In /home/niko: \u003ccode>bin/greet\u003c/code>","In any directory: \u003ccode>~/bin/greet\u003c/code>","In /home/niko: \u003ccode>greet\u003c/code>"],"ans":[1,2,3],"exp":"\u003cp>指令名稱裡只要有斜線（/），shell 就把它當成路徑直接 exec，不搜尋 PATH：\u003ccode>./greet\u003c/code>、\u003ccode>bin/greet\u003c/code>（相對於目前目錄）、\u003ccode>~/bin/greet\u003c/code>（shell 先把 ~ 展開成 /home/niko）都可以。\u003c/p>\u003cp>沒有斜線的 \u003ccode>greet\u003c/code> 才會搜尋 PATH；PATH 裡沒有 /home/niko/bin，也沒有「.」，所以不管在哪個目錄打都找不到。\u003c/p>"},{"id":"w5-05c","week":"W5","topic":"dup2 之後 close 原本的 fd 為什麼安全","src":"原題 W5-05","group":"W5-05","type":"single","q":"\u003cp>strace of \u003ccode>git log\u003c/code> starting its pager:\u003c/p>\u003cpre>\u003ccode># 4100 is git; 4101 is the child that becomes less\n4100  pipe2([3, 4], 0)   = 0\n4100  clone(...)         = 4101\n4101  dup2(3, 0)         = 0\n4101  close(3)           = 0\n4101  close(4)           = 0\n4101  execve(\"/usr/bin/less\", ...) = 0\n4100  close(3)           = 0\n4100  dup2(4, 1)         = 1\n4100  close(4)           = 0\u003c/code>\u003c/pre>\u003cp>Why is it safe for git to call \u003ccode>close(4)\u003c/code> right after \u003ccode>dup2(4, 1)\u003c/code>?\u003c/p>","opts":["fd 1 is now also a copy of the write end, so the pipe still has a writer, and git goes on writing through fd 1.","dup2 moved the write end from fd 4 to fd 1, so fd 4 was already empty.","close(4) only takes effect after less exits.","It is not safe: less will see EOF immediately."],"ans":0,"exp":"\u003cp>dup2 是「\u003cb>複製\u003c/b>」不是「移動」：dup2(4, 1) 之後 fd 1 和 fd 4 都指向同一個 write end。close(4) 只移除一個編號，write end 仍被 fd 1 參照，pipe 還有 writer。(b) 的「移動」是常見誤解——正因為 dup2 後 fd 4 還開著，才需要 close。\u003c/p>"},{"id":"w5-v08","week":"W5","topic":"雙向溝通的正確做法","src":"變化題（源自 W5-08）","group":"W5-08","type":"single","q":"\u003cp>A parent and a child want to exchange \"ping\" and \"pong\" reliably. The single-pipe version, where both processes keep both ends open, can hang. What is the correct fix?\u003c/p>","opts":["Use two pipes, one for each direction, and have each process close the ends it does not use","Add sleep(1) before the parent's read()","Make the pipe bigger","Have the child write \"pong\" before it reads \"ping\""],"ans":0,"exp":"\u003cp>pipe 是單向的，而且不分收件人：誰先 read 誰拿走。用兩條 pipe（parent→child、child→parent），每個 process 關掉自己不用的那端 → parent 不可能讀回自己的 ping，雙方也都能正確等到 EOF。\u003c/p>\u003cp>(b) 只是降低機率，仍然是 race。(c) 跟容量無關。(d) 兩個訊息還是在同一條 pipe 裡，誰讀到哪一個仍然看運氣。\u003c/p>"},{"id":"w2-13b","week":"W2","topic":"RSS：list、np.eye、random","src":"原題 W2-13 ⚠️","group":"W2-13","type":"multi","q":"\u003cp>Page size is 4 KiB. Each object below is 32 KiB (8 pages). Which ones make the process's RSS grow by the full 32 KiB? \u003cb>(Select all that apply)\u003c/b>\u003c/p>\u003cpre>\u003ccode>a = np.zeros((32, 128))      # then: a[0,0] = 1.0 ; a[0,1] = 2.0\nb = [0.0] * 4096             # a Python list of 4096 pointers\nc = np.eye(64)               # identity matrix, 98% zeros\nd = np.random.rand(32, 128)\u003c/code>\u003c/pre>","opts":["a","b","c","d"],"ans":[1,2,3],"exp":"\u003cp>a：只寫到第一頁 → +4 KiB。\u003c/p>\u003cp>b：建立 list 時要把 4096 個指標（每個 8 bytes）實際寫進去 → 8 頁全碰 → +32 KiB（原答 0 錯）。\u003c/p>\u003cp>c：98% 是 0，但對角線\u003cb>每一列\u003c/b>都寫了一個 1；一列 64 × 8 = 512 bytes，每頁有 8 列 → 每頁都有對角元素被寫 → +32 KiB。\u003c/p>\u003cp>d：每個元素都寫入亂數 → +32 KiB。\u003c/p>\u003cp>重點：RSS 看的是「哪些頁被寫過」，不是「資料是不是大多為 0」。\u003c/p>"},{"id":"w5-08","week":"W5","topic":"用一條 pipe 雙向溝通","src":"原題 W5-08（選項為推測重建）","group":"W5-08","type":"single","q":"\u003cp>A parent and a child try to talk through a \u003cb>single\u003c/b> pipe, and both keep both ends open:\u003c/p>\u003cpre>\u003ccode>pipe(fd);\nif (fork() == 0) {                  // child\n    read(fd[0], buf, 4);            // expects \"ping\"\n    write(fd[1], \"pong\", 4);\n    exit(0);\n}\nwrite(fd[1], \"ping\", 4);            // parent\nread(fd[0], buf, 4);                // expects \"pong\"\nprintf(\"parent got %.4s\\n\", buf);\nwait(NULL);\u003c/code>\u003c/pre>\u003cp>What can happen?\u003c/p>","opts":["It always prints \"parent got pong\", because each byte goes to the other process.","It may hang: the parent reads its own ping, then blocks in read() forever.","It always hangs, because one pipe cannot be used by two processes.","It always prints \"parent got pong\", because the kernel wakes the child before the parent can read.","It may hang: the parent can read its own ping and print \"parent got ping\"; then the parent waits in wait() and the child waits in read() forever."],"ans":4,"exp":"\u003cp>pipe 不知道「這個 byte 是要給誰的」：誰先 read 誰拿走。parent 寫完 ping 馬上 read，可能把自己的 ping 讀回來 → 印出 parent got ping → 進 wait()。child 的 read 永遠拿不到資料，也不會 EOF（兩邊都還握著 write end）→ 永遠卡住。\u003c/p>\u003cp>(b) 錯在 parent 不是卡在 read（它已經讀到 ping），而是卡在 wait。如果 child 先搶到 ping，程式就能正常印 parent got pong——所以是「可能」卡住。正確做法：兩條 pipe，各管一個方向。\u003c/p>"},{"id":"w5-v01b","week":"W5","topic":"kill -9 pipeline 中間那個","src":"變化題（源自 W5-01）","group":"W5-01","type":"fill","q":"\u003cp>In bash you run \u003ccode>yes | cat | wc -l\u003c/code> in the foreground. From a second terminal, someone kills the middle process with \u003ccode>kill -9 &lt;PID of cat&gt;\u003c/code>. Afterwards, \u003ccode>echo \"${PIPESTATUS[@]}\"\u003c/code> prints the exit statuses of yes, cat and wc, in that order. What does it print? Type three numbers separated by spaces.\u003c/p>","ans":["141 137 0"],"exp":"\u003cp>cat 被 SIGKILL（9）→ 128 + 9 = \u003cb>137\u003c/b>。\u003c/p>\u003cp>yes：下一次寫進 pipe 時已經沒有讀者 → kernel 送 SIGPIPE（13）給\u003cb>寫端\u003c/b> → \u003cb>141\u003c/b>。\u003c/p>\u003cp>wc：沒有收到任何 signal。上游的 write end 隨 cat 死亡而關閉 → read() 回傳 0（EOF）→ 印出行數、正常結束 → \u003cb>0\u003c/b>。（講義用 pkill 送 SIGTERM 時是 141 143 0。已實測。）\u003c/p>","cprog":"w5_pipe three-stage"},{"id":"w2-11a","week":"W2","topic":"PATH：command not found","src":"原題 W2-11","group":"W2-11","type":"single","q":"\u003cp>niko has \u003ccode>/home/niko/bin/greet\u003c/code> with permissions \u003ccode>-rwxr-xr-x\u003c/code>. Typing \u003ccode>greet\u003c/code> prints \u003ccode>command not found\u003c/code>, but typing \u003ccode>/home/niko/bin/greet\u003c/code> runs it. \u003ccode>echo $PATH\u003c/code> prints \u003ccode>/usr/local/bin:/usr/bin:/bin\u003c/code>. Why does \u003ccode>greet\u003c/code> alone fail?\u003c/p>","opts":["The shell only looks in the current directory.","The shell only looks in the directories listed in PATH, and /home/niko/bin is not one of them.","Running programs from a home directory requires sudo.","greet has no execute permission."],"ans":1,"exp":"\u003cp>沒有斜線的指令名稱，shell 會依序到 PATH 列出的每個目錄找。/home/niko/bin 不在 PATH 裡 → 找不到。打完整路徑就不用搜尋，所以能跑。檔案本身有 x 權限，(d) 錯。\u003c/p>"},{"id":"w3-v21b","week":"W3","topic":"fork + exec 失敗 + 導向檔案：總行數","src":"變化題（源自 W3-21 ⚠️）","group":"W3-21","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog /bin/_i_dont_exist_just_4_fun &gt; out.txt\u003c/code>: exec fails, and the output goes to a file.\u003c/p>\u003cpre>\u003ccode>int main(int argc, char *argv[]) {\n    printf(\"A\\n\");\n    pid_t pid = fork();\n    if (pid == 0) {\n        char *args[] = {argv[1], \"B\", NULL};\n        execv(argv[1], args);\n        printf(\"C\\n\");\n        return 1;\n    }\n    printf(\"D\\n\");\n    wait(NULL);\n    printf(\"E\\n\");\n    return 0;\n}\u003c/code>\u003c/pre>\u003cp>How many lines does out.txt have?\u003c/p>","ans":["5"],"exp":"\u003cp>fork 時 \"A\\n\" 在 buffer 裡，child 複製一份。exec 失敗 → child 印 C（也進 buffer），return 1 時 flush 出 A、C。parent 結束時 flush 出 A、D、E。共 \u003cb>5\u003c/b> 行，A 出現 2 次。\u003c/p>\u003cp>對照：從終端機執行時 A 在 fork 前就已經 flush，只有 4 行（A、C、D、E）。\u003c/p>","cprog":"w3_fork w3-21 (file)"},{"id":"w2-v08b","week":"W2","topic":"printf 緩衝：fflush 之後的檔案大小","src":"變化題（源自 W2-08 ⚠️）","group":"W2-08","type":"fill","q":"\u003cp>A program runs as \u003ccode>./test &gt; out.txt\u003c/code> and has executed:\u003c/p>\u003cpre>\u003ccode>printf(\"hello \");\nfflush(stdout);\nprintf(\"world\");\u003c/code>\u003c/pre>\u003cp>It has not exited yet. What file size, in bytes, does \u003ccode>ls -l out.txt\u003c/code> show at this moment?\u003c/p>","ans":["6"],"exp":"\u003cp>fflush 讓 libc 立刻用 write() 把 \"hello \"（6 bytes）交給 kernel → 檔案大小 \u003cb>6\u003c/b>。之後的 \"world\" 還在 libc buffer，沒進 kernel。程式正常結束時才會變成 11 bytes；若此時 crash，檔案就停在 6 bytes。\u003c/p>","cprog":"w2_buffers v08b"},{"id":"w5-r2","week":"W5","topic":"read() 在 pipe 上：空的但還有 writer","src":"新題（講義 W5 Part 3）","group":"W5-read","type":"single","q":"\u003cp>A child writes 10 bytes into a pipe and then sleeps for 100 seconds without closing its write end. The parent has closed its own write end and has already read all 10 bytes. It now calls \u003ccode>read(fd[0], buf, 4)\u003c/code> again. What happens?\u003c/p>","opts":["read() returns 0, because the pipe is empty","The parent receives SIGPIPE","read() returns −1 with an error","read() blocks until the child writes more or the child's write end is closed"],"ans":3,"exp":"\u003cp>read() 在 pipe 上只有三種結果：有資料 → 回傳拿到的數量；空的、但還有人握著 write end → \u003cb>block\u003c/b>；空的、而且沒有任何 write end → 回傳 0（EOF）。\u003c/p>\u003cp>這裡 child 還握著 write end → block（睡覺、不耗 CPU），直到 child 寫入或 exit。SIGPIPE 是給「寫進沒有讀者的 pipe」的寫端。（已實測：第四次 read 等到 child 結束才回傳 0。）\u003c/p>","cprog":"w5_pipe r1","cexpect":"block"},{"id":"w6-03","week":"W6","topic":"由 timeline 算 waiting","src":"新題（依講義 W6 Part 2）","group":"W6-metric","type":"fill","q":"\u003cp>Job Y arrives at t = 1 ms and needs 6 ms of CPU in total. It runs during 4–6, 9–10 and 12–15, and finishes at t = 15. What is Y's \u003cb>waiting\u003c/b> time, in ms?\u003c/p>","ans":["8","8 ms"],"exp":"\u003cp>turnaround = 15 − 1 = 14；waiting = turnaround − burst = 14 − 6 = \u003cb>8\u003c/b> ms。也可以直接數在 ready queue 裡的時間：1→4（3）+ 6→9（3）+ 10→12（2）= 8。注意 waiting 和 response（4 − 1 = 3）不一樣：被搶占之後再等的時間也算 waiting。\u003c/p>","calc":{"fn":"timeline","arrive":1,"runs":[[4,6],[9,10],[12,15]],"metric":"waiting"}},{"id":"w5-v09a","week":"W5","topic":"先 wait 再讀：哪些會卡","src":"變化題（源自 W5-09）","group":"W5-09","type":"multi","q":"\u003cp>A capture program creates one pipe (capacity 64 KiB), starts a command with its stdout connected to the pipe, calls \u003cb>wait()\u003c/b> for the command, and only then reads the pipe until read() returns 0. Each command below writes only to stdout. Which commands make the program hang? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["a command that prints 10 KiB","a command that prints 60 KiB","a command that prints 100 KiB","a command that prints 3 MiB"],"ans":[2,3],"exp":"\u003cp>先 wait 再讀：child 的輸出必須整個塞得進 64 KiB 的 pipe，child 才能 exit。10、60 KiB 放得下 → child 結束、wait 回來、parent 讀出全部。100 KiB、3 MiB 放不下 → child 卡在 write()（pipe 滿了）、parent 卡在 wait() → deadlock。\u003c/p>\u003cp>這就是「小測資看起來沒問題」的典型 bug。（已實測。）\u003c/p>","calc":{"fn":"waitFirst","cap":64,"opts":[10,60,100,3072]},"cprog":"w5_pipe waitfirst","cexpect":"102400,3145728"},{"id":"w5-v06a","week":"W5","topic":"兩條 pipe 的 deadlock：換容量","src":"變化題（源自 W5-06 ⚠️）","group":"W5-06","type":"fill","q":"\u003cp>parent ──(pipe A)──▶ child ──(pipe B)──▶ parent. Each pipe holds \u003cb>16 KiB\u003c/b>, and the child loops: read up to \u003cb>1 KiB\u003c/b> from A, then write those bytes into B (it exits when A reaches EOF). The parent does:\u003c/p>\u003cpre>\u003ccode>write(A, data, n);   close(A);   read B until read() returns 0\u003c/code>\u003c/pre>\u003cp>What is the largest n, in KiB, for which the program is guaranteed to finish?\u003c/p>","ans":["33","33 KiB","33KiB"],"exp":"\u003cp>parent 開始讀 B 之前，系統最多能吸收：A 16 KiB + B 16 KiB + child 手上已讀出、還沒寫進 B 的 1 KiB = \u003cb>33 KiB\u003c/b>。n ≤ 33 KiB 時 parent 能寫完、關掉 A、開始讀 B；超過就兩邊都卡在 write()。（原題：64 + 64 + 4 = 132 KiB。）\u003c/p>","calc":{"fn":"twoPipe","a":16,"b":16,"chunk":1}},{"id":"w5-04b","week":"W5","topic":"Shell 建立 pipeline：child 的步驟順序","src":"原題 W5-04","group":"W5-04","type":"single","q":"\u003cp>A shell runs \u003ccode>cat scores.csv | grep niko\u003c/code>. Inside the child that will run \u003ccode>cat\u003c/code>, which sequence is correct?\u003c/p>","opts":["\u003ccode>dup2(fd[1], 1)\u003c/code> → \u003ccode>close(fd[0]); close(fd[1])\u003c/code> → \u003ccode>execlp(\"cat\", ...)\u003c/code>","\u003ccode>execlp(\"cat\", ...)\u003c/code> → \u003ccode>dup2(fd[1], 1)\u003c/code> → \u003ccode>close(fd[0]); close(fd[1])\u003c/code>","\u003ccode>close(fd[0]); close(fd[1])\u003c/code> → \u003ccode>dup2(fd[1], 1)\u003c/code> → \u003ccode>execlp(\"cat\", ...)\u003c/code>","\u003ccode>dup2(1, fd[1])\u003c/code> → \u003ccode>close(fd[0]); close(fd[1])\u003c/code> → \u003ccode>execlp(\"cat\", ...)\u003c/code>"],"ans":0,"exp":"\u003cp>dup2(fd[1], 1) 讓 1 號也指向 pipe 的 write end（複製，不是移動）；接著關掉原本的 fd[0]、fd[1] 很安全，因為 1 號仍參照著 write end；最後 exec，cat 只要寫 fd 1 就進 pipe（exec 保留 fd table）。\u003c/p>\u003cp>(b) exec 成功就不會回來，後面不會執行。(c) 先關掉 fd[1]，dup2 的來源已經不存在 → 失敗。(d) 參數反了：\u003ccode>dup2(oldfd, newfd)\u003c/code> 是讓 newfd 指向 oldfd 的物件，這樣是讓 fd[1] 指向終端機。\u003c/p>"},{"id":"w4-n01","week":"W4","topic":"root 執行特權指令","src":"新題（講義 W4 Part 2、Part 9）","group":"W4-root","type":"single","q":"\u003cp>A program running as \u003cb>root\u003c/b> executes \u003ccode>asm(\"hlt\");\u003c/code> in user mode. What happens?\u003c/p>","opts":["The CPU halts, because root may execute any instruction","The instruction is silently skipped","The kernel asks for confirmation before halting the CPU","A general protection fault occurs, and the kernel kills the process with SIGSEGV"],"ans":3,"exp":"\u003cp>hlt 是特權指令，能不能執行看的是 CPU 的 \u003cb>mode bit\u003c/b>，不是使用者身分。root process 一樣跑在 user mode → general protection fault → kernel 送 SIGSEGV。root（UID 0）只會讓 kernel 的權限檢查放行（讀任何檔案、殺任何 process），不會讓程式進 kernel mode。\u003c/p>"},{"id":"w3-03","week":"W3","topic":"為什麼 cd 必須是 built-in","src":"原題 W3-03","group":"W3-03","type":"single","q":"\u003cp>Why must \u003ccode>cd\u003c/code> be a shell built-in instead of a separate program like \u003ccode>ls\u003c/code>?\u003c/p>","opts":["The working directory is stored in the PWD environment variable, which only the shell can change.","exec resets the working directory of every new program.","Changing directories requires root privileges, which only the shell has.","The working directory belongs to each process. A child would change its own and then exit, leaving the shell's unchanged."],"ans":3,"exp":"\u003cp>cwd 是每個 process 的狀態，存在 kernel 的 process table（不是存在 PWD 環境變數）。若 cd 是獨立程式，bash 會 fork 出 child，child 改了自己的 cwd 就 exit，bash 的 cwd 完全沒變。exec 也不會重設 cwd（它是 exec 保留的狀態之一）。所以 cd、export、exit 都是 built-in，在 shell 自己的 process 裡執行、不 fork。\u003c/p>"},{"id":"w4-n06","week":"W4","topic":"Timer tick 一定會 context switch 嗎","src":"新題（講義 W4 Part 6）","group":"W4-cs","type":"single","q":"\u003cp>A timer tick arrives while process A is running, and A is the only ready process on this CPU. What happens?\u003c/p>","opts":["A context switch always happens on every tick","The CPU halts until another process becomes ready","A is put to sleep until the next tick","The timer handler runs in kernel mode and then returns to A; there is no context switch"],"ans":3,"exp":"\u003cp>tick 一定會讓 kernel 拿回 CPU（mode switch），但要不要換 process 由 scheduler 決定。只有 A 能跑 → 回到 A，沒有 context switch。tick \u003cb>可能\u003c/b>造成 context switch，但不一定。\u003c/p>"},{"id":"w3-v06a","week":"W3","topic":"什麼時候該用動態連結（反過來問）","src":"變化題（源自 W3-06 ⚠️）","group":"W3-06","type":"single","q":"\u003cp>In which situation is \u003cb>dynamic\u003c/b> linking the better choice?\u003c/p>","opts":["A single command-line tool that users download and run on many different Linux distributions","A rescue tool that must keep working even when the system's /usr/lib is damaged","OpenSSL, used by 150 daemons on one server that must be patched within hours of a new vulnerability","A program shipped in a minimal container image that contains no libc at all"],"ans":2,"exp":"\u003cp>很多程式共用、需要快速一次修補 → 動態連結：換掉一個 libssl.so、重啟服務，150 個 daemon 全部修好（Heartbleed 的教訓）。\u003c/p>\u003cp>(a)(b)(d) 都是「不能依賴目標機器上的 library」的情境，用靜態連結的單一執行檔比較安全。\u003c/p>"},{"id":"w4-n12","week":"W4","topic":"System call vs function call","src":"新題（講義 W4 Part 4）","group":"W4-sc","type":"multi","q":"\u003cp>Which statements are true of a \u003cb>system call\u003c/b> but not of an ordinary function call? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["It switches the CPU into kernel mode.","It enters through a fixed entry point that the kernel set up at boot.","The kernel's code runs on a separate kernel stack.","It jumps to an address chosen by the calling program.","It costs about one nanosecond."],"ans":[0,1,2],"exp":"\u003cp>system call：切 mode、從固定入口進入（程式只能選「服務編號」，不能選跳到 kernel 的哪裡，否則可以跳過權限檢查）、在 kernel stack 上執行，成本數百 ns。function call：跳到程式自己選的位址、留在 user mode、用 user stack，約 1 ns。\u003c/p>"},{"id":"w4-n14","week":"W4","topic":"數 page fault：頁邊界","src":"變化題（源自 W2-19 ⚠️）","group":"W2-19","type":"fill","q":"\u003cp>Page size is 4096 bytes. A program maps 32 KiB that it has never touched, then writes one byte at offsets 4095, 4096, 8191 and 12288. How many page faults occur?\u003c/p>","ans":["3"],"exp":"\u003cp>頁號 = offset ÷ 4096：4095 → 第 0 頁（最後一個 byte）、4096 → 第 1 頁（第一個 byte）、8191 → 第 1 頁、12288 → 第 3 頁。每一頁第一次被碰到時 fault 一次 → 第 0、1、3 頁 = \u003cb>3\u003c/b> 次。\u003c/p>\u003cp>注意 4095 和 4096 只差 1 byte 卻在不同頁；4096 和 8191 差 4095 bytes 卻在同一頁。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[4095,4096,8191,12288],"unit":"count"}},{"id":"w2-17-p2","week":"W2","topic":"printf + fflush + write","src":"原題 W2-17 (P2)","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>printf(\"one \");\nfflush(stdout);\nwrite(1, \"two \", 4);\nreturn 0;\u003c/code>\u003c/pre>","ans":["one two"],"exp":"\u003cp>fflush(stdout) 讓 libc 立刻用 write() 把 \"one \" 交給 kernel，之後 write 的 \"two \" 才進去 → \u003cb>one two\u003c/b>。\u003c/p>","cprog":"w2_buffers p2"},{"id":"w5-05a","week":"W5","topic":"git 啟動 pager：git 的 fd 0","src":"原題 W5-05 ⚠️","group":"W5-05","type":"single","q":"\u003cp>strace of \u003ccode>git log\u003c/code> starting its pager:\u003c/p>\u003cpre>\u003ccode># 4100 is git; 4101 is the child that becomes less\n4100  pipe2([3, 4], 0)   = 0\n4100  clone(...)         = 4101\n4101  dup2(3, 0)         = 0\n4101  close(3)           = 0\n4101  close(4)           = 0\n4101  execve(\"/usr/bin/less\", ...) = 0\n4100  close(3)           = 0\n4100  dup2(4, 1)         = 1\n4100  close(4)           = 0\u003c/code>\u003c/pre>\u003cp>After the last line, what does \u003cb>git's\u003c/b> (4100's) fd 0 refer to?\u003c/p>","opts":["the terminal","the read end of the pipe","the write end of the pipe","not open"],"ans":0,"exp":"\u003cp>先看每一行是哪個 PID 做的。\u003ccode>dup2(3, 0)\u003c/code> 是 \u003cb>4101（less）\u003c/b>做的，只改 less 自己的 fd table。git 從頭到尾沒動過自己的 fd 0，所以仍然指向終端機（原答 read end 錯）。\u003c/p>"},{"id":"w4-n13","week":"W4","topic":"User mode 能直接做什麼","src":"新題（講義 W4 Part 2）","group":"W4-mode","type":"multi","q":"\u003cp>Which of the following can a program running in user mode do directly, without asking the kernel? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["Add two numbers and compare the result","Call one of its own functions","Execute the system call (trap) instruction","Turn off interrupts","Change its page table","Read a disk sector directly from the disk controller","Halt the CPU"],"ans":[0,1,2],"exp":"\u003cp>一般運算、跳躍、函式呼叫隨時可以；trap 指令也可以——它是受控的 kernel 入口。\u003c/p>\u003cp>直接碰 I/O 裝置（可以繞過檔案權限）、停 CPU、關 interrupt（timer 就失效，可以霸佔 CPU）、改 page table（可以 map 任意記憶體）、安裝 trap table 都是特權操作，在 user mode 執行會觸發 exception。\u003c/p>"},{"id":"w5-r3","week":"W5","topic":"一般檔案的 EOF","src":"新題（講義 W5 Part 3）","group":"W5-read","type":"fill","q":"\u003cp>A regular file contains \u003ccode>fish is tasty\\n\u003c/code> (14 bytes). A program opens it and runs:\u003c/p>\u003cpre>\u003ccode>read(fd, buf, 10);\nread(fd, buf, 10);\nn = read(fd, buf, 10);\u003c/code>\u003c/pre>\u003cp>What is n?\u003c/p>","ans":["0"],"exp":"\u003cp>第一次拿 10 bytes、第二次拿剩下的 4 bytes、第三次 offset 已經等於檔案大小 → 回傳 \u003cb>0\u003c/b>，代表 EOF。EOF 不是檔案裡的某個字元，也不是錯誤（錯誤才是 −1）。已實測。\u003c/p>","calc":{"fn":"readSeq","size":14,"reqs":[10,10,10],"which":2},"cprog":"w2_files r3"},{"id":"w6-06","week":"W6","topic":"SJF 平均 turnaround","src":"新題（依講義 W6 Part 4）","group":"W6-sjf","type":"fill","q":"\u003cp>Three jobs arrive together at t = 0. Their bursts are A = 24 ms, B = 3 ms, C = 3 ms. Under \u003cb>SJF\u003c/b>, what is the average turnaround time, in ms?\u003c/p>","ans":["13","13 ms"],"exp":"\u003cp>SJF 先跑短的：B 0–3、C 3–6、A 6–30。turnaround 3、6、30 → 平均 \u003cb>13\u003c/b> ms（FIFO 是 27）。每個工作的 turnaround 都包含排在它前面的所有 burst，所以長 burst 放最後只被算一次 → 全部同時抵達時 SJF 的平均 turnaround 最小。\u003c/p>","calc":{"fn":"sched","policy":"sjf","jobs":[["A",0,24],["B",0,3],["C",0,3]],"metric":"avgTurnaround"}},{"id":"w3-09","week":"W3","topic":"export 的可見範圍","src":"原題 W3-09","group":"W3-09","type":"single","q":"\u003cp>In bash you run \u003ccode>export KEY=abc\u003c/code>. Which processes can see KEY?\u003c/p>","opts":["Only this shell","Every process on the machine owned by the same user","Only the next command this shell runs","This shell, the children it forks from now on, their children, and so on"],"ans":3,"exp":"\u003cp>環境變數存在每個 process 自己的記憶體裡，fork / exec 時由 parent 傳給 child。export 之後，這個 shell 從現在起 fork 出的 child、孫子……都會繼承到 KEY。已經在跑的其他 process（parent shell、其他終端機）看不到。\u003c/p>"},{"id":"w2-17-p4","week":"W2","topic":"write + printf + crash","src":"原題 W2-17 (P4)","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>write(1, \"one \", 4);\nprintf(\"two \");\n*(int *)0 = 1;      // crash\u003c/code>\u003c/pre>","ans":["one"],"exp":"\u003cp>\"one \" 由 write 直接進 kernel；\"two \" 在 libc buffer 裡，crash 時跟著消失 → \u003cb>one\u003c/b>。\u003c/p>","cprog":"w2_buffers p4"},{"id":"w5-09b","week":"W5","topic":"只讀 stdout 不讀 stderr 也會卡","src":"原題 W5-09 (F3)","group":"W5-09","type":"single","q":"\u003cp>A capture program creates two pipes OUT and ERR (64 KiB each), starts a command with stdout → OUT and stderr → ERR, then reads OUT until read() returns 0, and only then calls wait(). It runs \u003ccode>find /\u003c/code>, which writes 5 MiB to stdout and 200 KiB to stderr. Where do the two processes end up?\u003c/p>","opts":["find is blocked in write() on the ERR pipe; the parent is blocked in read() on OUT.","find is blocked in write() on OUT; the parent is blocked in wait().","Both finish, because the parent now drains OUT.","find exits, but the parent is blocked in read() on ERR."],"ans":0,"exp":"\u003cp>parent 一直在讀 OUT，stdout 那邊不會卡；但 ERR 沒人讀，find 寫滿 64 KiB 的錯誤訊息後就卡在 write(2)。find 沒結束 → OUT 的 write end 還開著 → parent 讀完 OUT 現有的資料後在 read() block，等不到 EOF。兩邊互等。\u003c/p>"},{"id":"w2-13a","week":"W2","topic":"RSS：np.zeros 之後寫兩個元素","src":"原題 W2-13 ⚠️","group":"W2-13","type":"fill","q":"\u003cp>Page size is 4 KiB. The array below is 32 KiB (32 × 128 doubles, 8 bytes each, stored row by row). By how many KiB does the process's RSS grow because of this code?\u003c/p>\u003cpre>\u003ccode>a = np.zeros((32, 128))\na[0, 0] = 1.0\na[0, 1] = 2.0\u003c/code>\u003c/pre>","ans":["4","4 KiB","4KiB","4 KB"],"exp":"\u003cp>np.zeros 只增加 VSZ（8 頁都指向共用的 zero page），不配 frame。一列 128 × 8 = 1024 bytes，a[0,0]、a[0,1] 都在第 0 列、byte 0 和 8 → 都在第一頁。只有 1 頁被寫、fault 1 次 → RSS 只增加 \u003cb>4 KiB\u003c/b>（原答 32 錯）。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[0,8],"unit":"KiB"}},{"id":"w5-04a","week":"W5","topic":"Shell 建立 pipeline：parent 的步驟順序","src":"原題 W5-04","group":"W5-04","type":"single","q":"\u003cp>A shell runs \u003ccode>cat scores.csv | grep niko\u003c/code>. Which sequence of the \u003cb>shell's own\u003c/b> (the parent's) calls is correct?\u003c/p>","opts":["pipe → fork (cat) → fork (grep) → close both ends → wait, wait","fork (cat) → pipe → fork (grep) → close both ends → wait, wait","pipe → fork (cat) → close both ends → fork (grep) → wait, wait","pipe → fork (cat) → fork (grep) → wait, wait → close both ends"],"ans":0,"exp":"\u003cp>pipe 必須在 fork 之前，child 才能透過 fork 繼承到兩端（(b) ✗）。shell 關閉兩端要在\u003cb>第二次 fork 之後\u003c/b>，否則 grep 繼承不到 read end（(c) ✗）。shell 必須在 wait \u003cb>之前\u003c/b>關掉 write end，否則 grep 永遠等不到 EOF、不會結束，shell 就卡在 wait（(d) ✗）。兩個 child 內部的步驟可以和 parent 的步驟交錯。\u003c/p>"},{"id":"w4-04-2","week":"W4","topic":"Zero page：為什麼讀不用 page fault","src":"原題 W4-04 (2)","group":"W4-04","type":"single","q":"\u003cp>A virtual page is already mapped to the shared read-only zero page. The program first reads a value from that page and then writes to it. The first write takes much longer than the read.\u003c/p>\u003cp>Why doesn't the read need a page fault?\u003c/p>","opts":["Because reads never cause page faults.","Because the virtual page is already mapped to a readable zero page.","Because the kernel prefetches all zero pages into the cache.","Because the value is kept in a CPU register."],"ans":1,"exp":"\u003cp>page fault 發生在「沒有映射」或「權限不符」的時候。這一頁有映射、有讀權限 → 沒事。(a) 錯：讀一個還沒映射的頁一樣會 page fault。\u003c/p>"},{"id":"w2-22","week":"W2","topic":"什麼事件會 flush stdout buffer","src":"原題 W2-22","group":"W2-22","type":"multi","q":"\u003cp>A program runs as \u003ccode>./test &gt; out.txt\u003c/code>. Its stdout buffer currently holds 11 bytes. Which of the following events send those bytes to the kernel? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The program crashes from an invalid memory access","The program calls fflush(stdout)","The program keeps printing until the buffer is full","The program prints nothing for 30 seconds","The program returns from main normally","The program calls exit()"],"ans":[1,2,4,5],"exp":"\u003cp>libc 只在三種時機把 buffer 交給 kernel：buffer 滿了、呼叫 fflush()、程式正常結束（從 main return 或呼叫 exit()，exit 會先 flush 所有 stdio stream）。\u003c/p>\u003cp>crash（SIGSEGV）時程式直接被 kernel 終止，buffer 跟著消失；也沒有「閒置多久自動 flush」這回事。注意 \u003ccode>_exit()\u003c/code> 不會 flush，\u003ccode>exit()\u003c/code> 會。\u003c/p>","cprog":"w2_buffers w2-22-*","cexpect":"fflush,full,return,exit"},{"id":"w6-23","week":"W6","topic":"為什麼 SJF 平均 turnaround 最小","src":"新題（依講義 W6 Part 4）","group":"W6-sjf","type":"single","q":"\u003cp>Why does SJF give the minimum average turnaround time when all jobs arrive at the same time?\u003c/p>","opts":["Because short jobs need fewer context switches","Because each job's turnaround includes the bursts of every job that ran before it, so putting long bursts last adds them to the fewest turnarounds","Because SJF preempts long jobs as soon as a short job arrives","Because the kernel knows every burst exactly"],"ans":1,"exp":"\u003cp>第 k 個執行的工作，turnaround = 前面所有 burst 的總和 + 自己的 burst。排在最前面的 burst 會被加進「每一個」工作的 turnaround，排在最後的只加一次 → 短的放前面總和最小。\u003c/p>\u003cp>(c) 那是 STCF；(d) 錯：kernel 其實不知道，只能用過去的 burst 預測。\u003c/p>"},{"id":"w3-v22a","week":"W3","topic":"fork 之後各自 open：互相覆蓋","src":"變化題（源自 W3-22 ⚠️）","group":"W3-22","type":"fill","q":"\u003cpre>\u003ccode>if (fork() == 0) {\n    int fd = open(\"log.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0644);\n    write(fd, \"AAA\", 3);\n    return 0;\n}\nwait(NULL);\nint fd = open(\"log.txt\", O_WRONLY | O_CREAT, 0644);   // no O_TRUNC\nwrite(fd, \"B\", 1);\u003c/code>\u003c/pre>\u003cp>After both processes finish, what are the exact contents of log.txt?\u003c/p>","ans":["BAA"],"exp":"\u003cp>這次是 fork \u003cb>之後\u003c/b>各自 open：兩次 open 建立兩個獨立的 open file entry，offset 各自從 0 開始。child 寫 AAA（offset 0–2）。parent 自己 open（沒有 O_TRUNC，不清空），從 offset 0 寫 B → 蓋掉第一個 A → \u003cb>BAA\u003c/b>。\u003c/p>\u003cp>對照原題：fork 前 open 的 fd 共用 offset，結果是 AB。\u003c/p>","cprog":"w3_fork v22a"},{"id":"w2-10","week":"W2","topic":"unlink：hard link 與開著的檔案","src":"原題 W2-10","group":"W2-10","type":"single","q":"\u003cpre>\u003ccode>$ ls -li /data/archive.tar\n131074 -rw-r--r-- 2 nini manager 40000000000 Sep 22 10:03 /data/archive.tar\n$ rm /data/archive.tar\u003c/code>\u003c/pre>\u003cp>A background program still has this file open. Right after \u003ccode>rm\u003c/code>: how many file names still point to inode 131074? If the background program now calls \u003ccode>read()\u003c/code>, what happens? And when are the 40 GB actually freed?\u003c/p>","opts":["0 names; read() fails; the space is freed immediately","1 name; read() succeeds; the space is freed when the program closes the file","1 name; read() succeeds; the space is freed only when the other name is removed AND the program closes the file","1 name; read() fails; the space is freed when the other name is also removed"],"ans":2,"exp":"\u003cp>權限後面那個 \u003cb>2\u003c/b> 是 link count：這個 inode 有兩個名字（hard link）。rm 就是 unlink：只刪掉一個目錄項目，link count 2 → \u003cb>1\u003c/b>。\u003c/p>\u003cp>背景程式走的是 fd → open file entry → inode，從不經過檔名，所以 read() 照樣\u003cb>成功\u003c/b>。\u003c/p>\u003cp>inode 和資料區塊要「link count = 0」\u003cb>而且\u003c/b>「沒有任何 open file 參照它」兩個條件都成立才會釋放 → 要等另一個名字也被刪掉、而且程式關檔。\u003c/p>"},{"id":"w5-07a","week":"W5","topic":"read 迴圈寫成 >= 0","src":"原題 W5-07 ⚠️","group":"W5-07","type":"single","q":"\u003cp>The parent creates a pipe and forks. The child writes 5000 bytes into the pipe and exits immediately. The parent runs:\u003c/p>\u003cpre>\u003ccode>close(fd[1]);\nsleep(2);\nchar buf[1000];\nlong total = 0;\nssize_t n;\nwhile ((n = read(fd[0], buf, sizeof buf)) &gt;= 0)\n    total += n;\nprintf(\"got %ld bytes\\n\", total);\u003c/code>\u003c/pre>\u003cp>What happens?\u003c/p>","opts":["It never finishes, uses no CPU, and stays blocked in read().","It prints \"got 5000 bytes\" after about 2 seconds.","Nothing is printed and it never finishes. After the first 2 seconds, it keeps one CPU core busy.","It prints \"got 5000 bytes\", because read() returns −1 at the end and ends the loop.","It prints \"got 0 bytes\"."],"ans":2,"exp":"\u003cp>前 5 次 read 各拿到 1000 bytes。之後 write end 已經全部關閉（child 已 exit、parent 自己也 close(fd[1]) 了），所以每次 read() 都\u003cb>立刻\u003c/b>回傳 0（EOF）。但條件寫成 &gt;= 0，0 也成立 → 迴圈永遠不停；每次都是立刻回傳而不是 block → 吃滿一顆 CPU，printf 永遠執行不到。正確寫法是 &gt; 0。\u003c/p>","cprog":"w5_pipe w5-07","cexpect":"spin"},{"id":"w6-20","week":"W6","topic":"Context switch 的成本","src":"新題（依講義 W6 Part 5）","group":"W6-slice","type":"fill","q":"\u003cp>Under round robin, every time slice is 2 ms and every context switch costs 0.5 ms. Several CPU-bound jobs are always ready. What percentage of the CPU's time is lost to context switches? Type just the number.\u003c/p>","ans":["20","20%"],"exp":"\u003cp>每一輪 = 2 ms 有用的工作 + 0.5 ms 切換 = 2.5 ms，浪費 0.5 / 2.5 = \u003cb>20%\u003c/b>。slice 改成 10 ms 就只浪費 0.5 / 10.5 ≈ 4.8%，但 response time 變差。實際上 switch 只要幾 µs、slice 是幾 ms，所以兩邊都顧得到。\u003c/p>","calc":{"fn":"overhead","slice":2,"sw":0.5}},{"id":"w4-v02","week":"W4","topic":"Context 存在哪裡","src":"變化題（源自 W4-02）","group":"W4-02","type":"fill","q":"\u003cp>When the kernel switches a process out, it saves the process's registers, program counter and stack pointer so that the process can later resume exactly where it stopped. In which per-process kernel structure is this context kept? Give the three-letter abbreviation.\u003c/p>","ans":["PCB","process control block"],"exp":"\u003cp>\u003cb>PCB\u003c/b>（process control block）。context switch = 把舊 process 的 context 存進它的 PCB，再從新 process 的 PCB 載入。記憶體不用動，所以被切走的 process 回來時完全不知道自己離開過。\u003c/p>"},{"id":"w3-21a","week":"W3","topic":"fork + execv：各行印幾次","src":"原題 W3-21 ⚠️","group":"W3-21","type":"single","q":"\u003cp>The program below is run twice \u003cb>from a terminal\u003c/b> (stdout is the terminal):\u003cbr>Run 1: \u003ccode>./prog /bin/echo\u003c/code>\u003cbr>Run 2: \u003ccode>./prog /bin/_i_dont_exist_just_4_fun\u003c/code>\u003c/p>\u003cpre>\u003ccode>int main(int argc, char *argv[]) {\n    printf(\"A\\n\");\n    pid_t pid = fork();\n    if (pid == 0) {\n        char *args[] = {argv[1], \"B\", NULL};\n        execv(argv[1], args);\n        printf(\"C\\n\");\n        return 1;\n    }\n    printf(\"D\\n\");\n    wait(NULL);\n    printf(\"E\\n\");\n    return 0;\n}\u003c/code>\u003c/pre>\u003cp>How many times are C, D and E printed in each run?\u003c/p>","opts":["Run 1: C 0, D 1, E 1 · Run 2: C 1, D 1, E 1","Run 1: C 1, D 2, E 2 · Run 2: C 1, D 1, E 1","Run 1: C 0, D 2, E 2 · Run 2: C 1, D 2, E 2","Run 1: C 0, D 1, E 1 · Run 2: C 0, D 1, E 1"],"ans":0,"exp":"\u003cp>exec 成功就不會回來（舊程式已經不存在了），所以 Run 1 的 child 變成 echo、印出 B，C 不會印。Run 2 exec 失敗，回到下一行印 C，然後 return 1。\u003c/p>\u003cp>D、E 雖然在 if 外面，但 child 不是被 exec 換掉（Run 1）就是已經 return（Run 2），只有 parent 會印 D、E，各 \u003cb>1\u003c/b> 次（原答 C=1、D=2、E=2 錯）。\u003c/p>\u003cp>A：終端機是 line-buffered，\"A\\n\" 在 fork 前已經 flush，所以兩次都只印 1 次。B：Run 1 印 1 次、Run 2 印 0 次。\u003c/p>","cprog":"w3_fork w3-21 (tty)","cexpect":"run1 C0 D1 E1|run2 C1 D1 E1"},{"id":"w3-10","week":"W3","topic":"大量 zombie","src":"原題 W3-10","group":"W3-10","type":"single","q":"\u003cp>A web server forks one child per request. After a few days, \u003ccode>fork()\u003c/code> starts returning −1, and \u003ccode>ps\u003c/code> shows tens of thousands of processes in state Z. Which call is missing?\u003c/p>","opts":["The child never calls exit().","The parent never calls wait() for its children.","The parent never calls exec().","The child never closes its file descriptors."],"ans":1,"exp":"\u003cp>Z = zombie：child 已經 exit，記憶體和檔案都釋放了，但 kernel 還留著 process table 的那一列（PID + exit code）等 parent 用 wait() 來收。parent 從不 wait → 每個 request 留一列 → 表滿了，fork() 對所有人都失敗。\u003c/p>"},{"id":"w3-f8","week":"W3","topic":"迴圈中 fork + exec","src":"變化題（源自 W3-16）","group":"W3-16","type":"fill","q":"\u003cp>How many processes are created in total, counting the original one? Assume every fork and exec succeeds.\u003c/p>\u003cpre>\u003ccode>for (int i = 0; i &lt; 3; i++) {\n    if (fork() == 0) {\n        execlp(\"echo\", \"echo\", \"hi\", (char *)NULL);\n        exit(1);\n    }\n}\nwhile (wait(NULL) &gt; 0)\n    ;\u003c/code>\u003c/pre>","ans":["4"],"exp":"\u003cp>child 一被 fork 出來就 exec 成 echo：原本的程式（包括這個 for 迴圈）被換掉，child 不會繼續跑迴圈，也不會再 fork。只有原本的 process 跑完 3 輪、產生 3 個 child → 共 \u003cb>4\u003c/b> 個 process，印 3 行 hi。\u003c/p>\u003cp>對照沒有 exec 的版本：每個 child 都會繼續迴圈，最後有 8 個 process。\u003c/p>","cprog":"w3_fork f8"},{"id":"w4-v01b","week":"W4","topic":"按鍵當下發生什麼","src":"變化題（源自 W4-01）","group":"W4-01","type":"single","q":"\u003cp>Process A is asleep in \u003ccode>read()\u003c/code> waiting for a key, and process B is running in user mode. A key is pressed. What happens right away?\u003c/p>","opts":["A starts running in user mode immediately, before any kernel code runs","Nothing happens until B makes its next system call","B receives the key, because B is the process that is running","The CPU enters the kernel's keyboard interrupt handler, which stores the character and marks A ready; the scheduler then decides whether B continues or A runs"],"ans":3,"exp":"\u003cp>按鍵 → keyboard \u003cb>interrupt\u003c/b>：不管 B 在做什麼，CPU 在兩個指令之間切到 kernel mode、執行 interrupt handler。handler 把字元存進 kernel buffer，把 A 從 wait queue 移到 ready。之後由 scheduler 決定回到 B 或切給 A，A 稍後才從 read() 回來。interrupt 不用等 B 做 system call，按鍵也跟 B 無關。\u003c/p>"},{"id":"w6-04","week":"W6","topic":"由 timeline 算 response","src":"新題（依講義 W6 Part 2）","group":"W6-metric","type":"fill","q":"\u003cp>The CPU runs A from 0 to 4, B from 4 to 6, A from 6 to 9, and then C from 9 to 12. C arrived at t = 3. What is C's \u003cb>response\u003c/b> time, in ms?\u003c/p>","ans":["6","6 ms"],"exp":"\u003cp>response = 第一次拿到 CPU − 抵達 = 9 − 3 = \u003cb>6\u003c/b> ms。\u003c/p>","calc":{"fn":"timeline","arrive":3,"runs":[[9,12]],"metric":"response"}},{"id":"w3-v18b","week":"W3","topic":"Heartbleed：修補後誰還有漏洞","src":"變化題（源自 W3-18 ⚠️）","group":"W3-18","type":"multi","q":"\u003cp>After the Heartbleed fix is installed (a patched libssl.so replaces the old one), which programs are still vulnerable? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["nginx, dynamically linked, started last week and not restarted since","curl, dynamically linked, run after the update","A vendor tool statically linked with the vulnerable OpenSSL, started after the update","A dynamically linked mail server restarted after the update"],"ans":[0,2],"exp":"\u003cp>動態連結的程式要「下次啟動」才會載入新版：還沒重啟的 nginx 記憶體裡仍是舊程式碼（a 仍有漏洞）；更新後才執行的 curl、更新後重啟的 mail server 都拿到新版（b、d 安全）。\u003c/p>\u003cp>靜態連結的工具把舊版 OpenSSL 帶在自己的執行檔裡，必須等廠商重新建置發布（c 仍有漏洞）。\u003c/p>"},{"id":"w5-v03","week":"W5","topic":"協定通道：哪些除錯輸出是安全的","src":"變化題（源自 W5-03）","group":"W5-03","type":"multi","q":"\u003cp>A language server talks to an editor over stdin/stdout, so stdout may carry only protocol messages. stderr goes to a log file. Which ways of printing a debug message do NOT break the protocol? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>fprintf(stderr, \"debug: %d\\n\", x);\u003c/code>","\u003ccode>write(2, \"debug\\n\", 6);\u003c/code>","\u003ccode>printf(\"debug: %d\\n\", x);\u003c/code>","\u003ccode>write(1, \"debug\\n\", 6);\u003c/code>","\u003ccode>puts(\"debug\");\u003c/code>","\u003ccode>dup2(1, 2);\u003c/code> at startup, then \u003ccode>fprintf(stderr, ...)\u003c/code>"],"ans":[0,1],"exp":"\u003cp>寫到 fd 2 就不會混進協定：fprintf(stderr, …) 和 write(2, …) ✓。printf、puts、write(1, …) 都寫到 stdout ✗。dup2(1, 2) 讓 fd 2 也指向 stdout 那條 pipe，之後寫 stderr 一樣進協定 ✗。\u003c/p>"},{"id":"w2-v14","week":"W2","topic":"dup 出來的 fd 共用 offset","src":"變化題（源自 W2-14 ⚠️）","group":"W2-14","type":"fill","q":"\u003cpre>\u003ccode>int fd  = open(\"notes.txt\", O_RDONLY);   // returns 3\nint fd2 = dup(fd);                        // returns 4\nread(fd, buf, 200);\nread(fd2, &amp;c, 1);\u003c/code>\u003c/pre>\u003cp>notes.txt is longer than 1000 bytes. At which byte offset does \u003ccode>read(fd2, &amp;c, 1)\u003c/code> start?\u003c/p>","ans":["200"],"exp":"\u003cp>dup 不會建立新的 open file entry，只是在 fd table 多一格指向\u003cb>同一個\u003c/b> entry → 共用 offset。fd 讀了 200 bytes，offset 變 200，fd2 接著從 \u003cb>200\u003c/b> 讀。\u003c/p>\u003cp>對照原題：close 之後重新 open 會建立新的 entry，offset 從 0 開始。\u003c/p>","cprog":"w2_files v14"},{"id":"w5-d1","week":"W5","topic":"dup2 之後 close 原本的 fd","src":"新題（講義 W5 Part 1）","group":"W5-dup","type":"single","q":"\u003cp>In a child, the code runs \u003ccode>dup2(fd[1], 1); close(fd[1]); close(fd[0]);\u003c/code> and then \u003ccode>printf(\"hi\\n\"); fflush(stdout);\u003c/code>. Where does \"hi\" go?\u003c/p>","opts":["To the terminal, because close(fd[1]) closed the pipe's write end","Nowhere: write() fails with EBADF because fd[1] was closed","Into the pipe, because fd 1 still refers to the write end","Into the pipe, but only because fd[0] was also closed"],"ans":2,"exp":"\u003cp>dup2(fd[1], 1) 讓 1 號\u003cb>也\u003c/b>指向 write end（複製，不是移動）。close(fd[1]) 只移除 fd[1] 這個編號；write end 還被 1 號參照，沒有被關閉。printf 寫到 fd 1 → 進 pipe。這正是 shell 建 pipeline 時每個 child 都做的事。已實測。\u003c/p>","cprog":"w5_pipe dup2close","cexpect":"pipe"},{"id":"w3-04","week":"W3","topic":"Everything is a file","src":"原題 W3-04","group":"W3-04","type":"single","q":"\u003cp>\u003ccode>cat /sys/class/thermal/thermal_zone0/temp\u003c/code> prints the CPU temperature. Which Unix idea does this show best?\u003c/p>","opts":["Text streams are a universal interface.","cat is a shell built-in, so it can read hardware.","Everything is a file.","Each program does one thing well."],"ans":2,"exp":"\u003cp>溫度感測器被表示成一個（不存任何資料的）虛擬檔案，所以一般的 cat 就能讀它。/proc 代表 process、/dev 代表磁碟等裝置，都是 everything is a file。(a)(d) 也是 Unix 哲學，但這個例子展示的是「感測器被當成檔案」。cat 不是 built-in。\u003c/p>"},{"id":"w5-06b","week":"W5","topic":"兩條 pipe 的 deadlock：卡在哪","src":"原題 W5-06","group":"W5-06","type":"single","q":"\u003cp>parent ──(pipe A)──▶ child ──(pipe B)──▶ parent. Each pipe holds 64 KiB. The child loops: read up to 4 KiB from A, then write those bytes into B (it exits when A reaches EOF). The parent does:\u003c/p>\u003cpre>\u003ccode>write(A, data, n);   close(A);   read B until read() returns 0\u003c/code>\u003c/pre>\u003cp>With n = 1 MiB the program gets stuck. Where are the two processes?\u003c/p>","opts":["Both are blocked in write().","Both are blocked in read().","The parent is blocked in read(B); the child is blocked in write(B).","The parent is blocked in write(A); the child is blocked in read(A)."],"ans":0,"exp":"\u003cp>B 滿了 → child 卡在 write(B)；child 不再從 A 讀 → A 也滿了 → parent 卡在 write(A)，永遠到不了「讀 B」那一步。兩個都睡在 \u003cb>write()\u003c/b> 裡，不耗 CPU，也沒有任何錯誤訊息。\u003c/p>"},{"id":"w5-v05c","week":"W5","topic":"less 忘了 close(4)","src":"變化題（源自 W5-05 / W5-10 ⚠️）","group":"W5-05","type":"single","q":"\u003cp>strace of \u003ccode>git log\u003c/code> starting its pager:\u003c/p>\u003cpre>\u003ccode># 4100 is git; 4101 is the child that becomes less\n4100  pipe2([3, 4], 0)   = 0\n4100  clone(...)         = 4101\n4101  dup2(3, 0)         = 0\n4101  close(3)           = 0\n4101  close(4)           = 0\n4101  execve(\"/usr/bin/less\", ...) = 0\n4100  close(3)           = 0\n4100  dup2(4, 1)         = 1\n4100  close(4)           = 0\u003c/code>\u003c/pre>\u003cp>Suppose 4101 had skipped \u003ccode>close(4)\u003c/code> before exec, so less keeps a copy of the write end. git writes all its output and exits. What happens to less?\u003c/p>","opts":["less sees EOF as soon as git exits","less is killed by SIGPIPE","git receives SIGPIPE when it exits","less never sees EOF: it still holds a write end itself, so once the data is consumed its read() blocks"],"ans":3,"exp":"\u003cp>read() 回傳 0 的條件是「pipe 空了，而且\u003cb>全部\u003c/b> process 都沒有 write end」。git 結束後，write end 只剩 less 自己的 fd 4 → kernel 認為還可能有資料 → less 讀完現有資料後 block，在等它自己（跟 W5-10 的 grep 是同一個 bug）。沒有人寫進沒有讀者的 pipe，所以也沒有 SIGPIPE。\u003c/p>"},{"id":"w4-01","week":"W4","topic":"慢速 system call 的事件順序","src":"原題 W4-01","group":"W4-01","type":"single","q":"\u003cp>Process A executes \u003ccode>read(0, &amp;c, 1);\u003c/code>. No key has been pressed yet, and process B is ready to run. The events below are listed out of order:\u003c/p>\u003cp>P. The kernel finds that no key is available.\u003cbr>Q. A key is pressed and a keyboard interrupt occurs.\u003cbr>R. Process A is put to sleep.\u003cbr>S. The kernel switches the CPU to process B, and B runs.\u003cbr>T. The read() system call traps into the kernel.\u003cbr>U. Process A becomes ready and later resumes.\u003c/p>\u003cp>Which order is correct?\u003c/p>","opts":["T → P → R → S → Q → U","T → P → S → R → Q → U","T → R → P → S → Q → U","T → P → R → Q → S → U"],"ans":0,"exp":"\u003cp>A 呼叫 read() → trap 進 kernel（T）→ kernel 發現沒有按鍵可讀（P）→ 把 A 設成 sleeping、放進 wait queue（R）→ context switch 到 B，B 執行（S）→ 之後才有人按鍵，產生 keyboard interrupt（Q）→ handler 存下字元、把 A 改成 ready，A 稍後被排到 CPU、從 read() 回來（U）。\u003c/p>\u003cp>A 要先睡下才會切給 B（slow system call 讓出 CPU）；按鍵是 A 睡著期間才發生的外部事件。\u003c/p>"},{"id":"w4-03c","week":"W4","topic":"Buffer overflow：跳到 kernel 位址","src":"原題 W4-03 (c)","group":"W4-03","type":"single","q":"\u003cp>A C function has a stack buffer overflow that overwrites the saved return address in its own stack frame.\u003c/p>\u003cp>The overwritten return address points to a kernel-only address, and the CPU is still in user mode. What happens when the function returns?\u003c/p>","opts":["The CPU switches to kernel mode and runs the kernel code there.","The access is blocked and a protection fault occurs.","The jump succeeds because the kernel is mapped into every address space.","Nothing; the CPU ignores the invalid address and continues at the next instruction."],"ans":1,"exp":"\u003cp>kernel 雖然 map 在每個 address space 的上半部，但 page table 把那些頁標成 kernel-only；mode bit = 0 時 CPU 擋下存取 → fault → kernel 通常送 SIGSEGV。ret 只改 PC，不會改 mode bit；只有 trap / interrupt 能讓硬體切到 kernel mode，而且只會跳到開機時設定好的固定入口。\u003c/p>"},{"id":"w6-13","week":"W6","topic":"預測下一個 burst","src":"新題（依講義 W6 Part 4）","group":"W6-pred","type":"fill","q":"\u003cp>The scheduler predicts the next CPU burst with \u003ccode>next guess = α × last burst + (1 − α) × previous guess\u003c/code>, using α = 0.25. The previous guess was 12 ms, and the burst that just ended took 4 ms. What is the next guess, in ms?\u003c/p>","ans":["10","10 ms"],"exp":"\u003cp>0.25 × 4 + 0.75 × 12 = 1 + 9 = \u003cb>10\u003c/b> ms。α 越小，越相信過去的預測；α = ½ 時是 ½ × 4 + ½ × 12 = 8。\u003c/p>","calc":{"fn":"predict","alpha":0.25,"guess":12,"bursts":[4]}},{"id":"w4-02","week":"W4","topic":"PCB 要存什麼","src":"原題 W4-02","group":"W4-02","type":"multi","q":"\u003cp>A timer interrupt arrives while process A is running, and the kernel decides to switch from A to B. What must be saved in A's PCB? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["the executable file","the stack pointer","the entire physical memory","the program counter","the CPU register values","the entire user stack"],"ans":[1,3,4],"exp":"\u003cp>context = CPU 狀態：暫存器、program counter、stack pointer，存進 A 的 PCB。A 的記憶體（包括 user stack）本來就留在原處、切換時沒被動到，不需要複製；執行檔也還在磁碟上。之後把這些值載回 CPU，A 就從被打斷的地方繼續，完全不知道自己被切走過。\u003c/p>"},{"id":"w2-16","week":"W2","topic":"read() 回傳實際讀到的 byte 數","src":"原題 W2-16 ⚠️","group":"W2-16","type":"fill","q":"\u003cp>A file contains \u003ccode>fish is tasty\\n\u003c/code> (14 bytes). A program opens it and runs:\u003c/p>\u003cpre>\u003ccode>read(fd, buf, 4);        // buf gets \"fish\"\nread(fd, buf, 4);\nn = read(fd, buf, 8);\u003c/code>\u003c/pre>\u003cp>What is n?\u003c/p>","ans":["6"],"exp":"\u003cp>第一次讀 \"fish\"（offset 0 → 4）、第二次讀 \" is \"（4 → 8）。剩 14 − 8 = 6 bytes（\"tasty\\n\"），要 8 只給 6 → n = \u003cb>6\u003c/b>（原答 3 錯）。read() 回傳的是實際讀到的數量，可以比要求的少；再讀一次才會回傳 0（EOF）。\u003c/p>","calc":{"fn":"readSeq","size":14,"reqs":[4,4,8],"which":2},"cprog":"w2_files w2-16"},{"id":"w6-18","week":"W6","topic":"CFS：三個 process 分 CPU","src":"新題（依講義 W6 Part 7）","group":"W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>Three CPU-bound processes are runnable on one core. One was started with \u003ccode>nice -n -5\u003c/code> by root; the other two use the default nice value. What percentage of the CPU does \u003cb>each\u003c/b> of the two default-nice processes get? (Round to one decimal place; type just the number.)\u003c/p>","ans":["19.8","20","19.8%","20%"],"exp":"\u003cp>預設 nice 是 0 → weight 1024；nice −5 → 3121。總 weight = 3121 + 1024 + 1024 = 5169。每個 nice-0 process 拿 1024 / 5169 ≈ \u003cb>19.8%\u003c/b>，nice −5 那個拿約 60.4%。差 5 個 nice 等級，weight 約差 1.25⁵ ≈ 3 倍。\u003c/p>","calc":{"fn":"cfsShare","weights":[3121,1024,1024],"which":1}},{"id":"w2-18","week":"W2","topic":"printf 到磁碟的路徑、page cache","src":"原題 W2-18","group":"W2-18","type":"single","q":"\u003cp>The four stages below are listed out of order:\u003c/p>\u003cp>P. The data enters the kernel's page cache, and the affected pages are marked dirty.\u003cbr>Q. The C library copies the data into a buffer in the program's own memory.\u003cbr>R. The operating system later writes the dirty pages to the disk.\u003cbr>S. When the buffer is flushed, a system call sends the data to the kernel.\u003c/p>\u003cp>What is the correct order for data written with \u003ccode>printf()\u003c/code> to reach the disk, and which stage does a direct call to \u003ccode>write()\u003c/code> skip?\u003c/p>","opts":["Q → S → P → R; write() skips Q","Q → P → S → R; write() skips Q","S → Q → P → R; write() skips S","Q → S → P → R; write() skips R"],"ans":0,"exp":"\u003cp>printf → 複製到 libc buffer（Q）→ flush 時用 write() system call 交給 kernel（S）→ 進 page cache、標成 dirty（P）→ OS 之後批次寫回磁碟（R）。\u003c/p>\u003cp>直接呼叫 write() 就是那個 system call 本身，跳過的是 libc buffer（Q）。page cache 和之後寫回磁碟仍然會發生；要立刻落盤必須呼叫 fsync()。\u003c/p>"},{"id":"w2-08","week":"W2","topic":"printf 緩衝與檔案大小","src":"原題 W2-08 ⚠️","group":"W2-08","type":"single","q":"\u003cp>A program runs as \u003ccode>./test &gt; out.txt\u003c/code>. It has executed \u003ccode>printf(\"hello \")\u003c/code> (6 bytes) and \u003ccode>printf(\"world\")\u003c/code> (5 bytes) and has not exited yet. At this moment someone runs \u003ccode>ls -l out.txt\u003c/code>.\u003c/p>\u003cp>What file size does ls show, and how many bytes are sitting in the C library's output buffer?\u003c/p>","opts":["File size 11 bytes; 0 bytes in the buffer","File size 0 bytes; 11 bytes in the buffer","File size 6 bytes; 5 bytes in the buffer","File size 0 bytes; 0 bytes in the buffer, because the data is in the kernel's page cache"],"ans":1,"exp":"\u003cp>stdout 導向檔案時是 \u003cb>fully buffered\u003c/b>：printf 只是把資料複製到程式自己記憶體裡約 4 KB 的 buffer。buffer 沒滿、沒 fflush、程式也還沒正常結束 → 還沒呼叫 write()，一個 byte 都沒進 kernel。所以檔案大小是 \u003cb>0\u003c/b>，\u003cb>11\u003c/b> bytes 全在 libc buffer 裡（原答 11 / 0 剛好相反）。\u003c/p>\u003cp>(d) 錯：資料要經過 write() 這個 system call 才會進 page cache。\u003c/p>","cprog":"w2_buffers w2-08","cexpect":"0 11"},{"id":"w2-01","week":"W2","topic":"VSZ / RSS、寫滿陣列","src":"原題 W2-01 ⚠️","group":"W2-01","type":"single","q":"\u003cp>A Python script has just created an 8 GiB array with \u003ccode>np.zeros\u003c/code>. At this moment the process has VSZ 8.2 GiB and RSS 0.2 GiB. The script then writes a value to every element of the array.\u003c/p>\u003cp>After the loop finishes, what are VSZ and RSS, approximately?\u003c/p>","opts":["VSZ grows to about 16.2 GiB; RSS is about 8.2 GiB","VSZ stays about 8.2 GiB; RSS is about 8.2 GiB","VSZ stays about 8.2 GiB; RSS is about 1.6 GiB","VSZ stays about 8.2 GiB; RSS stays about 0.2 GiB"],"ans":1,"exp":"\u003cp>np.zeros 只配置虛擬頁：VSZ 一開始就已經包含那 8 GiB，但這些頁還沒有 DRAM frame。\u003c/p>\u003cp>迴圈把每個元素都寫過一次 → 8 GiB 裡每一頁都被 touch，各自拿到一個 frame，所以 RSS ≈ 0.2 + 8 = \u003cb>8.2 GiB\u003c/b>。過程中沒有再配置新的虛擬記憶體，所以 VSZ 不變。\u003c/p>\u003cp>(c) 的 1.6 是原本答錯的數字；(d) 錯在「寫入」一定會讓那一頁拿到真正的 frame。\u003c/p>","calc":{"fn":"rssAfterTouch","vsz":8.2,"base":0.2,"touched":8,"expect":[8.2,8.2]}},{"id":"w5-01","week":"W5","topic":"kill 一個 pipeline 成員","src":"原題 W5-01","group":"W5-01","type":"single","q":"\u003cp>In a terminal: \u003ccode>$ sleep 1000 | cat\u003c/code>. No process has installed any signal handler. From another terminal, someone runs \u003ccode>kill -INT &lt;PID of sleep&gt;\u003c/code>. What happens to cat?\u003c/p>","opts":["It is killed by the same signal, because the kernel sends it to every process in a pipeline.","It is killed by a different signal, because its input pipe lost its writer.","It keeps waiting forever until someone presses Ctrl-C.","Its next read() returns 0, because no process holds the write end any more, so it exits normally."],"ans":3,"exp":"\u003cp>kill 只把 signal 送給指定的那個 PID（Ctrl-C 才會送給整個前景 pipeline）。sleep 被 SIGINT 終止 → 它持有的 write end 跟著關閉 → pipe 已經沒有任何 write end → cat 的下一次 read() 回傳 0（EOF）→ cat 正常結束。\u003c/p>\u003cp>SIGPIPE 是送給\u003cb>寫端\u003c/b>（寫進沒有讀者的 pipe 的 process），不是讀端，所以 (b) 錯。\u003c/p>","cprog":"w5_pipe kill-sleep","cexpect":"sleep:130 cat:0"},{"id":"w5-v02b","week":"W5","topic":"dup 與 close 之後 pipe 拿到的 fd","src":"變化題（源自 W5-02）","group":"W5-02","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>int a = open(\"x.txt\", O_RDONLY);\nint b = dup(1);\nclose(a);\nint fd[2];\npipe(fd);\u003c/code>\u003c/pre>\u003cp>x.txt exists. What are fd[0] and fd[1]? Type the two numbers separated by a space.\u003c/p>","ans":["3 5","3,5"],"exp":"\u003cp>a = 3、b = 4（dup 也是拿最小可用編號）。close(a) 讓 3 空出來。pipe：最小可用是 3 → fd[0] = \u003cb>3\u003c/b>；4 被 b 占著，下一個是 5 → fd[1] = \u003cb>5\u003c/b>。已實測。\u003c/p>","cprog":"w5_pipe v02b"},{"id":"w5-03","week":"W5","topic":"Debug 訊息不能印到 stdout（協定通道）","src":"原題 W5-03","group":"W5-03","type":"single","q":"\u003cp>A tool server talks to its client over stdin/stdout: the client reads JSON replies, one per line, from the server's stdout. The server's stderr still goes to the terminal. After a developer adds \u003ccode>printf(\"debug: ...\\n\")\u003c/code> lines, the client starts reporting parse errors. What is the best fix?\u003c/p>","opts":["Print the debug lines with \u003ccode>fprintf(stderr, ...)\u003c/code> instead of printf.","Print each debug line only after the reply has been written.","Use \u003ccode>fprintf(stderr, ...)\u003c/code> and also call \u003ccode>dup2(1, 2)\u003c/code> at the start of main().","Use \u003ccode>write(1, ...)\u003c/code> instead of printf.","Print each debug line as a JSON object."],"ans":0,"exp":"\u003cp>stdout 是協定通道（MCP 規範規定 stdout 只能寫協定訊息），除錯訊息要寫到 fd 2；stderr 仍連著終端機，開發者照樣看得到。\u003c/p>\u003cp>(b) 仍然寫進 stdout，只是換了時間。(c) dup2(1, 2) 讓 fd 2 也指向 pipe，問題重現。(d) write(1, …) 一樣是 stdout。(e) client 會把它當成回覆來解析，還是破壞協定。\u003c/p>"},{"id":"w2-v17b","week":"W2","topic":"stderr 不緩衝，crash 也留得住","src":"變化題（源自 W2-17 ⚠️）","group":"W2-17","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt 2&gt;&amp;1\u003c/code>, so stdout and stderr both go to out.txt. What does out.txt contain afterwards? Type the words separated by single spaces, or \u003ccode>empty\u003c/code>.\u003c/p>\u003cpre>\u003ccode>fprintf(stderr, \"one \");\nprintf(\"two \");\nwrite(1, \"three \", 6);\n*(int *)0 = 1;      // crash\u003c/code>\u003c/pre>","ans":["one three"],"exp":"\u003cp>stderr 是 \u003cb>unbuffered\u003c/b>：fprintf(stderr, …) 立刻 write 進 kernel → one。printf 的 \"two \" 在 stdout 的 buffer（導向檔案 → fully buffered）。write 立刻寫入 three。crash 時 stdout buffer 消失 → \u003cb>one three\u003c/b>。\u003c/p>\u003cp>這就是除錯訊息要印到 stderr 的原因：即使程式下一行就 crash，訊息也不會丟。\u003c/p>","cprog":"w2_buffers v17b"},{"id":"w2-v15a","week":"W2","topic":"rm 之後建立同名新檔","src":"變化題（源自 W2-15 ⚠️）","group":"W2-15","type":"single","q":"\u003cp>A program opened \u003ccode>/tmp/secret.txt\u003c/code> (link count 1) and has read its first 10 bytes. Someone runs \u003ccode>rm /tmp/secret.txt\u003c/code> and then creates a new, different file with the same name \u003ccode>/tmp/secret.txt\u003c/code>. The program now calls \u003ccode>read()\u003c/code> on its old descriptor. What does it get?\u003c/p>","opts":["The next bytes of the old file's contents","The beginning of the new file","An error (ENOENT), because the old name was removed","0 (end of file), because the file was deleted"],"ans":0,"exp":"\u003cp>程式手上的鏈是 fd → open file entry → \u003cb>舊的 inode\u003c/b>，跟名字無關。rm 只刪名字；新檔案雖然同名，卻是另一個 inode。舊 inode 還被開著，所以還在，read 從 offset 10 繼續讀舊內容。\u003c/p>"},{"id":"w5-10b","week":"W5","topic":"自製 shell 少了哪個 close","src":"原題 W5-10","group":"W5-10","type":"single","q":"\u003cp>A homemade shell runs \u003ccode>cat words.txt | grep cat\u003c/code>. cat has already exited, but the prompt never comes back. The fd tables are:\u003c/p>\u003cpre>\u003ccode>/proc/45111/fd (shell):  0,1,2 -&gt; /dev/pts/2    3 -&gt; pipe:[88216611] (lr-x)\n/proc/45113/fd (grep):   0 -&gt; pipe:[88216611] (lr-x)   1,2 -&gt; /dev/pts/2\n                         4 -&gt; pipe:[88216611] (l-wx)\u003c/code>\u003c/pre>\u003cp>Which close() is missing from the homemade shell's code?\u003c/p>","opts":["The shell never closes the read end.","The child that runs grep never closes the copy of the write end it inherited.","The child that runs cat never closes its stdout.","grep never closes its stdin."],"ans":1,"exp":"\u003cp>grep 的 child 在 dup2(fd[0], 0) 之後應該 close(fd[0]) 和 close(fd[1])；它漏了 close(fd[1])，exec 之後 grep 就帶著一個 write end（fd 4）。shell 漏關 fd 3（read end）也是 bug，但不會造成這個症狀。\u003c/p>"},{"id":"w5-v05a","week":"W5","topic":"strace 讀 fd：parent 是讀的一方","src":"變化題（源自 W5-05 ⚠️）","group":"W5-05","type":"single","q":"\u003cp>A program starts \u003ccode>ls\u003c/code> as a child and reads its output. strace shows:\u003c/p>\u003cpre>\u003ccode># 5200 is the parent; 5201 is the child that becomes ls\n5200  pipe2([3, 4], 0)   = 0\n5200  clone(...)         = 5201\n5201  dup2(4, 1)         = 1\n5201  close(3)           = 0\n5201  close(4)           = 0\n5201  execve(\"/bin/ls\", ...) = 0\n5200  close(4)           = 0\n5200  dup2(3, 0)         = 0\n5200  close(3)           = 0\u003c/code>\u003c/pre>\u003cp>After the last line, what do the \u003cb>parent's\u003c/b> (5200's) fd 0 and fd 1 refer to?\u003c/p>","opts":["fd 0: the read end of the pipe; fd 1: the terminal","fd 0: the terminal; fd 1: the write end of the pipe","fd 0: the read end; fd 1: the write end","fd 0: not open; fd 1: the terminal"],"ans":0,"exp":"\u003cp>這次 parent 是讀的一方。\u003ccode>dup2(4, 1)\u003c/code> 是 5201（ls）做的，只改 ls 的 fd 1 → parent 的 fd 1 仍是終端機。parent 自己做了 close(4)、dup2(3, 0)、close(3) → fd 0 指向 read end，3、4 都不開。\u003c/p>"},{"id":"w3-21b","week":"W3","topic":"fork + execv：輸出順序
