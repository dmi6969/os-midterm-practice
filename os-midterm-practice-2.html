短的時間（-d 會讓它很快結束）。環境變數並沒有加密，只是別人看不到。\u003c/p>"},{"id":"s2-w4-08","week":"W4","topic":"Illegal instruction 的 exit status","src":"變化題（源自 W4-03）","group":"s2-W4-exc","type":"fill","q":"\u003cp>A program executes an instruction that the CPU does not recognize. The kernel sends it SIGILL (signal 4), and the shell prints \u003ccode>Illegal instruction\u003c/code>. What is \u003ccode>$?\u003c/code> right afterwards?\u003c/p>","ans":["132"],"exp":"\u003cp>這是 fault（指令出錯，修不好）→ kernel 送 SIGILL。被 signal 終止的 process，shell 回報 128 + signal 編號 = 128 + 4 = \u003cb>132\u003c/b>。對照：SIGFPE（8）→ 136、SIGSEGV（11）→ 139。已實測。\u003c/p>","cprog":"s2_w4 ill"},{"id":"s2-w5-32","week":"W5","topic":"有攔 SIGTERM 的程式","src":"新題（依講義 W5 Part 4）","group":"s2-W5-sig","type":"single","q":"\u003cp>A server installs a SIGTERM handler that saves its state and then calls \u003ccode>exit(0)\u003c/code>. An admin runs \u003ccode>kill &lt;PID&gt;\u003c/code> (which sends SIGTERM). What exit status does the server's parent see?\u003c/p>","opts":["The server keeps running, because it caught the signal","143, because the process received SIGTERM","137, because kill always uses SIGKILL","A normal exit with status 0, because the handler ran and the program exited by itself"],"ans":3,"exp":"\u003cp>SIGTERM 可以被攔：handler 執行（存檔、收尾），然後程式自己 exit(0) → parent 用 wait 拿到的是「正常結束、status 0」，不是被 signal 終止。只有沒攔、走預設動作時才是 128 + 15 = 143。這就是為什麼工具都先送 SIGTERM：給程式機會優雅地結束。已實測。\u003c/p>","cprog":"s2_w5 termhandler","cexpect":"exit 0"},{"id":"s2-w5-23","week":"W5","topic":"角色反過來：parent 寫、child 讀","src":"變化題（源自 W5-07）","group":"s2-W5-eof","type":"single","q":"\u003cp>This time the \u003cb>parent\u003c/b> is the writer. It writes 1000 bytes into the pipe, forgets to close its write end, and calls \u003ccode>wait(NULL)\u003c/code>. The child has closed its own write end and reads until read() returns 0, then exits. What happens?\u003c/p>","opts":["It finishes, because 1000 bytes fit in the pipe","Deadlock: the child reads the 1000 bytes and then blocks in read(), because the parent still holds a write end; the parent blocks in wait()","The child gets SIGPIPE","The parent gets EOF"],"ans":1,"exp":"\u003cp>跟講義的 Bug 1 一樣，只是角色反過來：read 等的是「所有 write end 都關掉」。parent 自己還握著 write end，卻在 wait 等 child 結束；child 讀完資料後在 read() 等 EOF。兩個都睡著、不耗 CPU、沒有錯誤訊息。已實測（逾時）。\u003c/p>","cprog":"s2_w5 parentwriter","cexpect":"hang"},{"id":"s2-w4-17","week":"W4","topic":"errno：用了 −1 當 fd","src":"新題（依講義 W4 Part 8）","group":"s2-W4-errno","type":"fill","q":"\u003cpre>\u003ccode>int fd = open(\"config.txt\", O_RDONLY);   // config.txt does not exist\nread(fd, buf, 100);\u003c/code>\u003c/pre>\u003cp>The program does not check open's result. What errno does the read() call set? Type the errno name.\u003c/p>","ans":["EBADF"],"exp":"\u003cp>open 失敗回傳 −1（errno = ENOENT），程式沒檢查，接著用 −1 當 fd 呼叫 read → read 失敗、回傳 −1、errno = \u003cb>EBADF\u003c/b>（Bad file descriptor），buf 沒被改。之後若照樣 printf buf，就會印出未初始化的內容，使用者完全看不出是「檔案不存在」造成的。habit 2：每個 system call 都要檢查。\u003c/p>"},{"id":"s2-w5-22","week":"W5","topic":"第一次 read 拿到目前有的","src":"變化題（源自 W5-07）","group":"s2-W5-read","type":"fill","q":"\u003cp>A child writes 3000 bytes into a pipe, sleeps for one second, writes 3000 more bytes, and exits. The parent (which has closed its write end) waits until the first 3000 bytes are in the pipe and then calls \u003ccode>read(fd[0], buf, 4096)\u003c/code>. What does this first read() return?\u003c/p>","ans":["3000"],"exp":"\u003cp>此時 pipe 裡只有 3000 bytes。read 不會等湊滿 4096，有多少給多少 → \u003cb>3000\u003c/b>。下一次 read 會 block 到第二批資料寫進來，再下一次（child 結束後）回傳 0。已實測。\u003c/p>","cprog":"s2_w5 firstchunk"},{"id":"s2-w2-36","week":"W2","topic":"終端機：沒有換行就不會出現","src":"變化題（源自 W2-08）","group":"s2-W2-printf","type":"single","q":"\u003cp>A program running in a terminal executes \u003ccode>printf(\"hello\");\u003c/code> (no newline) and then \u003ccode>sleep(60);\u003c/code>. What does the user see during those 60 seconds?\u003c/p>","opts":["Nothing; hello stays in the C library buffer until a newline, a full buffer, fflush, or a normal exit","hello appears immediately, because stdout is a terminal","hello appears after about 1 second, when libc flushes idle buffers","hello appears on stderr instead"],"ans":0,"exp":"\u003cp>終端機是 \u003cb>line-buffered\u003c/b>，不是 unbuffered：要遇到換行（或 buffer 滿、fflush、正常結束）才會 write。沒有換行的 \"hello\" 會一直待在 buffer 裡，60 秒後程式正常結束時才出現。libc 沒有「閒置多久自動 flush」的機制。\u003c/p>"},{"id":"s2-w3-39","week":"W3","topic":"Fork bomb 與 ulimit -u","src":"新題（依講義 W3 Part 5）","group":"s2-W3-count","type":"fill","q":"\u003cp>A fork bomb starts as one process; in every round, every existing process forks once, so the count doubles. The user's process limit (\u003ccode>ulimit -u\u003c/code>) is 1000. In which round does fork() first fail?\u003c/p>","ans":["10"],"exp":"\u003cp>第 k 輪結束時應該有 2\u003csup>k\u003c/sup> 個 process：第 9 輪後是 512（沒超過），第 10 輪要變成 1024 &gt; 1000 → 第 \u003cb>10\u003c/b> 輪會碰到上限，fork() 開始回傳 −1。每個使用者有 process 上限，就是為了讓一個人的程式不會拖垮整台共用機器的其他使用者。\u003c/p>","calc":{"fn":"forkbomb","limit":1000}},{"id":"s2-w4-35","week":"W4","topic":"Kernel 先複製並檢查 user buffer","src":"變化題（源自 W4-05）","group":"s2-W4-sc","type":"single","q":"\u003cp>For \u003ccode>write(1, buf, 64)\u003c/code>, the kernel does not simply use \u003ccode>buf\u003c/code> as a pointer while it works. It first checks that the whole 64-byte range lies in user space and copies the bytes into kernel memory. What does the check prevent?\u003c/p>","opts":["Two processes writing to the same terminal","Programs writing more than 64 bytes at a time","The page cache filling up","A malicious program passing a pointer into kernel memory and making the kernel, which runs in kernel mode, print kernel data"],"ans":3,"exp":"\u003cp>handler 跑在 kernel mode，它「能」讀任何位址。如果直接相信使用者給的指標，傳一個 kernel 位址就能讓 write 把 kernel 記憶體（可能有別的 process 的資料）印出來。所以 sys_write 先確認整段都在 user space（否則回傳 EFAULT），再複製進 kernel 使用；read 則把結果複製回使用者的 buffer。\u003c/p>"},{"id":"s2-w5-34","week":"W5","topic":"systemd 的 grace period","src":"新題（依講義 W5 Part 4 optional）","group":"s2-W5-sig","type":"fill","q":"\u003cp>When systemd stops a service, it sends SIGTERM, waits for a grace period, and then sends SIGKILL if the service is still running. What is the default grace period (TimeoutStopSec), in seconds?\u003c/p>","ans":["90","90 s"],"exp":"\u003cp>systemd 預設 \u003cb>90\u003c/b> 秒；docker stop 是 10 秒；Kubernetes pod 是 30 秒（terminationGracePeriodSeconds）。模式都一樣：先 SIGTERM 讓程式收尾，過了寬限期才 SIGKILL。\u003c/p>"},{"id":"s2-w5-14","week":"W5","topic":"> 只改 fd 1","src":"新題（依講義 W5 Part 2）","group":"s2-W5-err","type":"single","q":"\u003cp>a.txt exists and missing.txt does not. You run \u003ccode>cat a.txt missing.txt &gt; out.txt\u003c/code> in a terminal. What happens?\u003c/p>","opts":["Nothing is printed anywhere","out.txt gets a.txt's contents followed by the error message","out.txt is empty, because cat failed","out.txt gets a.txt's contents; the error message about missing.txt appears on the terminal"],"ans":3,"exp":"\u003cp>\u003ccode>&gt;\u003c/code> 只把 cat 的 \u003cb>fd 1\u003c/b> 換成 out.txt；fd 2 仍是終端機。cat 把資料寫到 fd 1、錯誤訊息寫到 fd 2 → 檔案裡只有 a.txt 的內容，錯誤訊息出現在畫面上。\u003c/p>"},{"id":"s2-w2-29","week":"W2","topic":"Page cache：怎麼讓它再變慢","src":"新題（依講義 W2 Part 6）","group":"s2-W2-cache","type":"multi","q":"\u003cp>The second \u003ccode>import numpy\u003c/code> is fast because the files are in the page cache. Which of the following would make the next import slow again? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["Run other programs that need so much memory that the OS throws the cached pages away","Tell the OS to drop its page cache","Reboot the machine","Run import numpy a third time","Run chmod on the numpy files"],"ans":[0,1,2],"exp":"\u003cp>page cache 在 DRAM 裡：只要那些頁被丟掉，下次就要再從磁碟讀。記憶體不夠時 OS 會先丟 clean 的快取頁；也可以叫 OS 直接 drop caches；重開機會清空所有記憶體。再 import 一次只會更快；chmod 只改 inode 的權限，不影響資料頁是否在快取裡。\u003c/p>"},{"id":"s2-w3-23","week":"W3","topic":"PATH 搜尋失敗幾次","src":"變化題（源自 W3-13）","group":"s2-W3-path","type":"fill","q":"\u003cp>PATH is \u003ccode>/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\u003c/code>, and ls is installed only at \u003ccode>/usr/bin/ls\u003c/code>. The shell searches with execve. How many execve calls fail with ENOENT before ls is found?\u003c/p>","ans":["3"],"exp":"\u003cp>shell 依序嘗試：/usr/local/sbin/ls ✗、/usr/local/bin/ls ✗、/usr/sbin/ls ✗、/usr/bin/ls ✓ → 失敗 \u003cb>3\u003c/b> 次，第 4 次成功，後面的 /sbin、/bin 不會再試。strace 會看到三行 \u003ccode>= -1 ENOENT\u003c/code>。搜尋的是 shell（或 libc 的 execvp），不是 kernel。\u003c/p>","calc":{"fn":"pathSearch","path":["/usr/local/sbin","/usr/local/bin","/usr/sbin","/usr/bin","/sbin","/bin"],"at":"/usr/bin"}},{"id":"s2-w3-06","week":"W3","topic":"printf 在 fork 前、導向檔案","src":"變化題（源自 W3-21）","group":"s2-W3-buf","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog &gt; out.txt\u003c/code>. How many lines does out.txt contain? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>printf(\"start\\n\");\nfor (int i = 0; i &lt; 2; i++)\n    fork();\nprintf(\"end\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["8"],"exp":"\u003cp>導向檔案 → fully buffered，\"start\\n\" 不會在換行時寫出，fork 時跟著 buffer 被複製。最後 4 個 process，每個的 buffer 裡都是 start + end 兩行，結束時各自 flush → 4 × 2 = \u003cb>8\u003c/b> 行。在終端機上執行則是 1 + 4 = 5 行。已實測。\u003c/p>","cprog":"s2_w3 q6"},{"id":"s2-w5-18","week":"W5","topic":"read 不會等湊滿","src":"新題（依講義 W5 Part 3）","group":"s2-W5-read","type":"fill","q":"\u003cp>A pipe currently holds 3 bytes, and the writer still has its write end open. A reader calls \u003ccode>read(fd[0], buf, 100)\u003c/code>. What does read() return?\u003c/p>","ans":["3"],"exp":"\u003cp>buffer 裡有資料時，read 不管有沒有 writer、也不等湊滿 100，就把現有的複製出來並回傳數量 → \u003cb>3\u003c/b>。只有 buffer 是空的時候才會 block（有 writer）或回傳 0（沒有 writer）。已實測。\u003c/p>","cprog":"s2_w5 partial"},{"id":"s2-w4-16","week":"W4","topic":"wait4 後門","src":"新題（依講義 W4 Part 4）","group":"s2-W4-sc","type":"single","q":"\u003cpre>\u003ccode>if ((options == (__WCLONE|__WALL)) &amp;&amp; (current-&gt;uid = 0))\n    retval = -EINVAL;\u003c/code>\u003c/pre>\u003cp>This change was slipped into the argument check of the wait4 system call in 2003. What would it have done?\u003c/p>","opts":["Any process calling wait4 with that flag combination would have had its user ID set to 0, i.e. become root","It would have crashed every caller with EINVAL","Nothing, because the compiler removes the second condition","It would have made wait4 slower for root"],"ans":0,"exp":"\u003cp>關鍵是單一個 \u003ccode>=\u003c/code>：\u003ccode>current-&gt;uid = 0\u003c/code> 不是比較，而是\u003cb>把 UID 設成 0\u003c/b>。藏在「參數檢查」裡看起來像正常的驗證程式碼，卻讓任何人用特定旗標呼叫 wait4 就變成 root。這說明參數驗證碼在 kernel 權限下處理不可信的輸入，是安全關鍵的程式碼。\u003c/p>"},{"id":"s2-w5-16","week":"W5","topic":"2>&1 的順序很重要","src":"新題（依講義 W5 Part 2）","group":"s2-W5-err","type":"fill","q":"\u003cp>\u003ccode>cmd\u003c/code> prints one line to stdout and one line to stderr. You run it in a terminal as:\u003c/p>\u003cpre>\u003ccode>cmd 2&gt;&amp;1 &gt; out.txt\u003c/code>\u003c/pre>\u003cp>How many lines end up in out.txt?\u003c/p>","ans":["1"],"exp":"\u003cp>shell 由左到右處理：\u003ccode>2&gt;&amp;1\u003c/code> 是 dup2(1, 2)——讓 fd 2 指向 fd 1 \u003cb>此刻\u003c/b>指的東西，也就是終端機；接著 \u003ccode>&gt; out.txt\u003c/code> 才把 fd 1 換成檔案。所以 stdout 進檔案、stderr 仍在終端機 → \u003cb>1\u003c/b> 行。寫成 \u003ccode>cmd &gt; out.txt 2&gt;&amp;1\u003c/code> 才會兩行都進檔案。dup2 是「複製當下的參照」，不是「綁定」。已實測。\u003c/p>","cprog":"bash 2>&1 order"},{"id":"s2-w5-02","week":"W5","topic":"三次 pipe 與一次 close","src":"變化題（源自 W5-02）","group":"s2-W5-fd","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>int p[2], q[2], r[2];\npipe(p);\npipe(q);\nclose(p[0]);\npipe(r);\u003c/code>\u003c/pre>\u003cp>What are r[0] and r[1]? Type the two numbers separated by a space.\u003c/p>","ans":["3 7","3,7"],"exp":"\u003cp>p = 3、4；q = 5、6；close(p[0]) 讓 3 空出來。pipe(r) 拿兩個最小的可用編號：3 和 7（4、5、6 都在用）→ r[0] = \u003cb>3\u003c/b>、r[1] = \u003cb>7\u003c/b>。已實測。\u003c/p>","cprog":"s2_w5 fd2"},{"id":"s2-w4-31","week":"W4","topic":"EC2 上 vDSO 失效","src":"新題（依講義 W4 Part 7 optional）","group":"s2-W4-vdso","type":"single","q":"\u003cp>In 2017, a loop of gettimeofday() calls ran 77% slower on certain Amazon EC2 virtual machines than on the engineers' own hardware, with the same program, libc and kernel version. strace showed the calls on EC2 but not on their laptops. What happened?\u003c/p>","opts":["The EC2 kernel disabled timer interrupts","EC2 CPUs have a slower clock speed","strace itself slowed the program down only on EC2","The vDSO could not read the Xen hypervisor's clock from user mode, so every call fell back to a real system call (a trap)"],"ans":3,"exp":"\u003cp>那些 EC2 機器用 Xen 的時鐘來源，vDSO 在 user mode 讀不到，只好退回真正的 system call。每次讀時間都要付 mode switch 的成本，strace 也就看得到了。量到的差距正好就是 user / kernel 切換的成本。\u003c/p>"},{"id":"s2-w6-27","week":"W6","topic":"nice 會被繼承","src":"新題（依講義 W6 Part 6）","group":"s2-W6-nice","type":"single","q":"\u003cp>You run \u003ccode>nice -n 10 make -j8\u003c/code>. make starts many gcc processes. What nice value do those gcc processes have?\u003c/p>","opts":["10, because a child inherits its parent's nice value","0, because every new process starts at 0","−10","19"],"ans":0,"exp":"\u003cp>child 繼承 parent 的 nice 值（fork 時複製）。make 是 nice 10，它 fork 出的 gcc 也是 nice 10。所以用 nice 啟動一個大型建置，整個建置都會比較「客氣」，桌面不會卡。\u003c/p>"},{"id":"s2-w4-19","week":"W4","topic":"Exception 分類：磁碟讀完了","src":"變化題（源自 W4-01）","group":"s2-W4-exc","type":"fill","q":"\u003cp>A process is sleeping in \u003ccode>read()\u003c/code> on a disk block that is not cached. The disk controller signals that the block has arrived. Which of the four kinds of exception is this signal: trap, fault, interrupt or abort? Type one word.\u003c/p>","ans":["interrupt","an interrupt"],"exp":"\u003cp>由外部裝置（磁碟控制器）引起、跟當時正在跑的程式無關 → \u003cb>interrupt\u003c/b>。handler 把資料交給 kernel、把等待的 process 改成 ready，然後回到原本在跑的程式的下一個指令。\u003c/p>"},{"id":"s2-w5-43","week":"W5","topic":"提早離開 less","src":"新題（依講義 W5 Part 5 exercise 5）","group":"s2-W5-git","type":"single","q":"\u003cp>You run \u003ccode>git log\u003c/code> in a huge repository and press q in less after the first screen, while git still has thousands of commits to print. What happens to git?\u003c/p>","opts":["less sends git SIGINT","It keeps running in the background until it has printed everything","It receives EOF and exits normally","Its next write into the pipe, whose only reader is gone, makes the kernel send it SIGPIPE, which terminates it without a message"],"ans":3,"exp":"\u003cp>git 是寫端、less 是唯一的讀者。less 結束後 git 再寫 → 沒有讀者 → kernel 送 SIGPIPE 給 git → 預設動作終止，什麼訊息都不印。所以關掉 pager 永遠不會留下還在跑的 producer。\u003c/p>"},{"id":"s2-w6-05","week":"W6","topic":"由 timeline 算 waiting","src":"新題（依講義 W6 Part 2）","group":"s2-W6-metric","type":"fill","q":"\u003cp>A arrives at t = 0, B at t = 1, C at t = 4. The CPU runs A 0–3, B 3–5, A 5–8, C 8–9, B 9–12, and each job finishes at the end of its last interval. What is B's waiting time, in ms?\u003c/p>","ans":["6","6 ms"],"exp":"\u003cp>B 的 burst = (5 − 3) + (12 − 9) = 5；turnaround = 12 − 1 = 11；waiting = 11 − 5 = \u003cb>6\u003c/b> ms。也可以直接數它在 ready queue 裡的時間：1→3（2）+ 5→9（4）= 6。\u003c/p>","calc":{"fn":"timeline","arrive":1,"runs":[[3,5],[9,12]],"metric":"waiting"}},{"id":"s2-w2-08","week":"W2","topic":"User-facing 的指標","src":"變化題（源自 W2-03）","group":"s2-W2-qos","type":"multi","q":"\u003cp>A video-streaming company runs a user-facing playback service and a nightly batch job that turns viewing logs into recommendations. Which metrics belong to the \u003cb>user-facing\u003c/b> service? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The fraction of play requests that get an answer at all","The 99th-percentile time from tapping play until the video starts","Play requests handled per second","Terabytes of viewing logs processed per hour","How long the nightly recommendation job takes from start to finish"],"ans":[0,1,2],"exp":"\u003cp>user-facing serving 看 \u003cb>availability\u003c/b>（回不回得了）、\u003cb>latency\u003c/b>（多快回，用百分位數）、\u003cb>throughput\u003c/b>（每秒幾個 request）。batch 看 throughput（每小時處理多少資料）和 end-to-end latency（整批跑多久）。同一個詞（throughput、latency）在兩邊意思不同。\u003c/p>"},{"id":"s2-w3-11","week":"W3","topic":"wait 回收的是哪個 child","src":"變化題（源自 W3-17）","group":"s2-W3-wait","type":"single","q":"\u003cpre>\u003ccode>pid_t c1 = fork();\nif (c1 == 0) exit(0);                    // C1 exits at once\npid_t c2 = fork();\nif (c2 == 0) { sleep(100); exit(0); }    // C2 keeps running\nsleep(1);\npid_t r = wait(NULL);\u003c/code>\u003c/pre>\u003cp>What happens at the \u003ccode>wait(NULL)\u003c/code> call?\u003c/p>","opts":["It returns C2's PID, and C1 stays a zombie","It blocks until C2 exits, because wait() waits for the most recent child","It returns at once with C1's PID; afterwards the parent has no zombie children, and C2 is still running","It returns −1, because one child is still running"],"ans":2,"exp":"\u003cp>wait() 回收「任何一個」已經結束的 child；如果已經有 zombie，它立刻回傳。C1 早就 exit 了 → 回傳 C1 的 PID、收掉它的 zombie。C2 還在跑，不是 zombie。要等特定的 child 用 waitpid(pid, …)。已實測。\u003c/p>","cprog":"s2_w3 q11","cexpect":"c1 0"},{"id":"s2-w4-23","week":"W4","topic":"Timer interrupt 的成本","src":"新題（依講義 W4 Part 6）","group":"s2-W4-timer","type":"fill","q":"\u003cp>A kernel takes 1000 timer ticks per second, and handling one tick (saving registers, running the handler, returning) takes 2 µs. What percentage of the CPU's time goes to handling ticks? Type just the number.\u003c/p>","ans":["0.2","0.2%"],"exp":"\u003cp>每秒 1000 × 2 µs = 2000 µs = 2 ms → 2 ms / 1000 ms = \u003cb>0.2%\u003c/b>。timer interrupt 很便宜，卻保證 kernel 至少每 1 ms 拿回一次 CPU。\u003c/p>","calc":{"fn":"tickCost","hz":1000,"us":2}},{"id":"s2-w6-02","week":"W6","topic":"SJF：長工作的 turnaround","src":"新題（依講義 W6 Part 4）","group":"s2-W6-sjf","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with a 5 ms burst, B at t = 1 with 3 ms, C at t = 2 with 8 ms, D at t = 3 with 6 ms.\u003c/p>\u003cp>The scheduler is changed to non-preemptive \u003cb>SJF\u003c/b>. When does job C finish, and what is C's turnaround time? Type the turnaround in ms.\u003c/p>","ans":["20","20 ms"],"exp":"\u003cp>t = 0 只有 A → A 跑 0–5（SJF 不搶占）。t = 5 時 B（3）、C（8）、D（6）都在等 → 先 B 5–8，再 D 8–14，最後 C 14–22。C 在 t = 22 完成，turnaround = 22 − 2 = \u003cb>20\u003c/b> ms。最長的 C 被排到最後（FIFO 時 C 在 16 就完成了）——short-first 的代價由長工作付。\u003c/p>","calc":{"fn":"sched","policy":"sjf","jobs":[["A",0,5],["B",1,3],["C",2,8],["D",3,6]],"metric":"turnaround","job":"C"}},{"id":"s2-w6-19","week":"W6","topic":"RR q = 1：有人晚到","src":"新題（依講義 W6 Part 5）","group":"s2-W6-rr","type":"fill","q":"\u003cp>Under round robin with q = 1 ms and free context switches: A (3 ms) arrives at t = 0, B (1 ms) at t = 1, C (2 ms) at t = 2. A job that arrives when a slice ends is queued before the job whose slice just ended. What is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["3.33","3.3","10/3"],"exp":"\u003cp>A 0–1 → queue：B, A；B 1–2（完成）→ C 抵達：A, C；A 2–3 → C, A；C 3–4 → A, C；A 4–5（完成）；C 5–6（完成）。turnaround：A 5、B 1、C 4 → 10 / 3 ≈ \u003cb>3.33\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"rr","q":1,"jobs":[["A",0,3],["B",1,1],["C",2,2]],"metric":"avgTurnaround"}},{"id":"s2-w6-14","week":"W6","topic":"RR 切換成本","src":"新題（依講義 W6 Part 5）","group":"s2-W6-slice","type":"fill","q":"\u003cp>Under round robin, every slice is 4 ms and every context switch costs 0.1 ms; several CPU-bound jobs are always ready. What percentage of the CPU's time is lost to switching? (Round to two decimal places; type just the number.)\u003c/p>","ans":["2.44","2.4"],"exp":"\u003cp>每一輪 4 ms 工作 + 0.1 ms 切換：0.1 / 4.1 ≈ \u003cb>2.44%\u003c/b>。slice 遠大於切換成本時，浪費只有幾個百分比。\u003c/p>","calc":{"fn":"overhead","slice":4,"sw":0.1}},{"id":"s2-w5-05","week":"W5","topic":"dup2 的 oldfd 沒開","src":"新題（依講義 W5 Part 1）","group":"s2-W5-dup","type":"single","q":"\u003cp>fd 9 is not open. A program calls \u003ccode>dup2(9, 1)\u003c/code>. What happens?\u003c/p>","opts":["fd 1 is closed, and dup2 returns 1","dup2 returns −1 with errno EBADF, and fd 1 is left unchanged","dup2 opens a new file as fd 9","The program is killed with SIGSEGV"],"ans":1,"exp":"\u003cp>講義：dup2 成功回傳 newfd；失敗回傳 −1 並設定 errno，例如 oldfd 不是一個開著的 descriptor（EBADF）。這種情況下 newfd 不會被動到。所以 shell 的程式碼都寫 \u003ccode>if (dup2(...) == -1) die(\"dup2\");\u003c/code>。已實測。\u003c/p>","cprog":"s2_w5 dup2bad","cexpect":"-1 EBADF unchanged"},{"id":"s2-w5-15","week":"W5","topic":"2> 把錯誤訊息導到別處","src":"新題（依講義 W5 Part 2）","group":"s2-W5-err","type":"fill","q":"\u003cp>notes.txt has exactly 10 lines, and nothing named gone.txt exists. In a terminal you run:\u003c/p>\u003cpre>\u003ccode>cat notes.txt gone.txt 2&gt; err.txt | wc -l &gt; count.txt\u003c/code>\u003c/pre>\u003cp>Nothing appears on the screen. What number does count.txt contain?\u003c/p>","ans":["10"],"exp":"\u003cp>pipe 只接 cat 的 fd 1，而 \u003ccode>2&gt; err.txt\u003c/code> 把 cat 的 fd 2 導到檔案，所以錯誤訊息進了 err.txt，不會進 pipe 也不會出現在畫面上。wc 只收到 notes.txt 的 10 行 → count.txt 裡是 \u003cb>10\u003c/b>。若改成 \u003ccode>2&gt;&amp;1\u003c/code>，錯誤訊息會跟著進 pipe，wc 就會數到 11。已實測。\u003c/p>","cprog":"bash 2> err.txt"},{"id":"s2-w2-23","week":"W2","topic":"malloc 之後還沒寫","src":"變化題（源自 W2-01）","group":"s2-W2-vm","type":"single","q":"\u003cp>A C program calls \u003ccode>char *p = malloc(2UL &lt;&lt; 30);\u003c/code> (2 GiB) and has not written to the buffer yet. Compared with just before the call, what happened?\u003c/p>","opts":["RSS grew by about 2 GiB; VSZ barely changed","VSZ and RSS both grew by about 2 GiB","VSZ grew by about 2 GiB; RSS barely changed","Neither changed until the program calls free()"],"ans":2,"exp":"\u003cp>配置只增加 \u003cb>VSZ\u003c/b>（map 了多少頁）；只有被 touch 的頁才會拿到 DRAM frame（RSS）。還沒寫入 → 幾乎沒有 frame → RSS 幾乎不變。所以 malloc 很大的空間不會讓機器當掉，真正「用」（寫）才會。\u003c/p>"},{"id":"s2-w6-26","week":"W6","topic":"共用機器為什麼一定要 preemption","src":"新題（依講義 W6 Part 3）","group":"s2-W6-preempt","type":"single","q":"\u003cp>Early Macs and Windows 3.x used cooperative scheduling, but Unix machines shared by many users needed preemptive scheduling. Why?\u003c/p>","opts":["Preemptive scheduling uses less CPU time than cooperative scheduling","The kernel cannot trust every user's program to give the CPU back; one infinite loop would lock out everyone else","Cooperative scheduling cannot run more than one program","Unix programs never make system calls"],"ans":1,"exp":"\u003cp>自己一台 Mac，Word 卡死就重開機。多人共用的機器上，kernel 管不了大家跑什麼程式，只要有一個人的程式不交還 CPU，所有人都被卡住。timer interrupt 讓 kernel 的控制權不依賴程式乖不乖。代價是 process 可能在更新共享資料到一半時被打斷（之後的 synchronization 問題）。\u003c/p>"},{"id":"s2-w3-32","week":"W3","topic":"Dynamic loader","src":"新題（依講義 W3 Part 7）","group":"s2-W3-link","type":"single","q":"\u003cp>\u003ccode>ldd /bin/ls\u003c/code> lists \u003ccode>/lib64/ld-linux-x86-64.so.2\u003c/code> among the libraries. What is it?\u003c/p>","opts":["The part of the kernel that runs system calls","The dynamic loader: after execve and before main, it finds the needed .so files, maps them into the process and fills in the missing addresses","A copy of libc used only by ls","The compiler that produced ls"],"ans":1,"exp":"\u003cp>動態連結的執行檔只記錄「NEEDED libc.so.6…」。execve 之後先跑 dynamic loader（ld-linux），由它找到需要的 .so、map 進 process、填上函式位址，最後才跳到 main。靜態連結的程式沒有這一步，execve map 完就直接進 main。\u003c/p>"},{"id":"s2-w5-30","week":"W5","topic":"kill -INT 的 exit status","src":"新題（依講義 W5 Part 5 exercise 6）","group":"s2-W5-sig","type":"fill","q":"\u003cp>In bash: \u003ccode>sleep 1000 &amp;\u003c/code>, then \u003ccode>kill -INT %1; wait %1; echo \"exit status $?\"\u003c/code>. What number is printed? (SIGINT is signal 2.)\u003c/p>","ans":["130"],"exp":"\u003cp>sleep 沒有處理 SIGINT → 預設動作終止。被 signal 終止的 process，shell 回報 128 + signal 編號 = 128 + 2 = \u003cb>130\u003c/b>。同理 SIGTERM（15）→ 143、SIGKILL（9）→ 137。已實測。\u003c/p>","cprog":"bash kill -INT"},{"id":"s2-w5-08","week":"W5","topic":"中間那一段的 fd 0 和 fd 1","src":"變化題（源自 W5-05）","group":"s2-W5-pipeline","type":"single","q":"\u003cp>A shell runs the three-stage pipeline \u003ccode>a | b | c\u003c/code> the usual way: it creates pipe 1 (a → b) and pipe 2 (b → c), forks the three children, and each child uses dup2 and close before exec.\u003c/p>\u003cp>When \u003ccode>b\u003c/code> starts running, what do its fd 0 and fd 1 refer to?\u003c/p>","opts":["fd 0: the read end of pipe 2; fd 1: the write end of pipe 1","fd 0: the terminal; fd 1: the write end of pipe 1","fd 0: the read end of pipe 1; fd 1: the write end of pipe 2","fd 0: the read end of pipe 1; fd 1: the terminal"],"ans":2,"exp":"\u003cp>b 在中間：它從 a 讀（pipe 1 的 read end → dup2 成 fd 0），寫給 c（pipe 2 的 write end → dup2 成 fd 1）。fd 2 仍是終端機。b 自己完全不知道前後是誰，連接只存在 fd table 裡。\u003c/p>"},{"id":"s2-w5-36","week":"W5","topic":"timeout：程式自己先結束","src":"新題（依講義 W5 Part 4）","group":"s2-W5-timeout","type":"fill","q":"\u003cp>\u003ccode>prog\u003c/code> exits by itself after about 1 second with exit status 5. You run \u003ccode>timeout 3 ./prog; echo $?\u003c/code>. What number is printed?\u003c/p>","ans":["5"],"exp":"\u003cp>程式在時限前就結束了 → timeout 不送任何 signal，而且回傳和程式一樣的 exit status → \u003cb>5\u003c/b>。只有時間到、送了 SIGTERM 時才會是 124。已實測。\u003c/p>","cprog":"timeout 3 (exit 5)"},{"id":"s2-w2-22","week":"W2","topic":"Delete-while-open 的用途","src":"變化題（源自 W2-15）","group":"s2-W2-unlink","type":"single","q":"\u003cp>A program creates a temporary file, opens it, and immediately calls \u003ccode>unlink()\u003c/code> on its name, then keeps reading and writing through the descriptor. Why would a program do this on purpose?\u003c/p>","opts":["unlink makes later reads and writes faster","The space is reclaimed automatically when the program closes the file or exits, even if it crashes, and no other program can open the file by name","unlink encrypts the file contents","It moves the file into the page cache only"],"ans":1,"exp":"\u003cp>這就是講義說的 delete-while-open trick：名字刪掉了，但 fd → open file → inode 不需要名字，程式照常讀寫。程式一結束（就算是 crash），最後一個參照消失，kernel 自動回收空間——不會留下垃圾暫存檔，別人也沒辦法用路徑打開它。\u003c/p>"},{"id":"s2-w4-06","week":"W4","topic":"time：user 與 sys","src":"新題（依講義 W4 Part 2）","group":"s2-W4-time","type":"fill","q":"\u003cp>You run \u003ccode>time dd if=/dev/zero of=/dev/null bs=1 count=1000000\u003c/code>, which makes about two million system calls that each move one byte. Which of the two CPU-time lines, \u003ccode>user\u003c/code> or \u003ccode>sys\u003c/code>, is larger? Type the word.\u003c/p>","ans":["sys"],"exp":"\u003cp>每次只搬 1 byte，幾乎所有時間都花在 trap 進 kernel、執行 read / write、再回來 → 這些都算 \u003cb>sys\u003c/b>（kernel mode 的 CPU 時間）。純計算的程式（例如 \u003ccode>sum(range(10**7))\u003c/code>）則是 user 大；\u003ccode>sleep 1\u003c/code> 兩個都幾乎是 0，只有 real 是 1 秒。\u003c/p>"},{"id":"s2-w2-11","week":"W2","topic":"Container 拿到什麼","src":"變化題（源自 W2-04）","group":"s2-W2-iso","type":"multi","q":"\u003cp>Compared with a plain process, what does a container get of its own? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["Its own view of the file system","Its own CPU and memory limits","Its own identity (users and process IDs)","Its own kernel","Its own physical hardware"],"ans":[0,1,2],"exp":"\u003cp>container = 一群 process，有自己的身分、自己看到的檔案系統、自己的 CPU / 記憶體上限，但仍\u003cb>共用 host 的 kernel\u003c/b>。要有自己的 kernel 得用 VM；VM 也只是共用硬體，不是獨佔硬體。\u003c/p>"},{"id":"s2-w4-32","week":"W4","topic":"Meltdown 與 KPTI","src":"新題（依講義 W4 Part 7 optional）","group":"s2-W4-vdso","type":"single","q":"\u003cp>After Meltdown (2018), Linux adopted KPTI, which removes almost all kernel mappings from the user page table. Why did this slow down programs that make many system calls?\u003c/p>","opts":["KPTI makes every system call run twice","KPTI disables the page cache","Every trap now has to switch page tables, so the \"kernel mapped in every address space\" shortcut is lost","KPTI turns off the vDSO for all programs"],"ans":2,"exp":"\u003cp>原本 kernel 就 map 在每個 address space 的上半部，trap 進來不用換 page table，所以 system call 只要幾百 ns。Meltdown 讓 user 程式能透過 speculative execution 偷讀那些 kernel 頁，KPTI 只好把它們拿掉，每次 trap 都切換 page table → system call 多的程式慢了不少。這是「效能 vs 硬體能否正確執行權限」的取捨。\u003c/p>"},{"id":"s2-w4-10","week":"W4","topic":"Chrome 分頁 crash vs driver crash","src":"新題（依講義 W4 Part 2）","group":"s2-W4-mode","type":"single","q":"\u003cp>When a Chrome tab crashes, the other tabs keep running; when a buggy graphics driver crashes, Windows shows a blue screen. Both bugs may be in C++ code. Why are the outcomes different?\u003c/p>","opts":["Drivers run as root, and root crashes are fatal","C++ code in Chrome is compiled with more checks","The tab is a user-mode process in its own address space that the kernel can safely terminate; the driver runs in kernel mode inside the kernel's address space, so its bug can corrupt kernel state","Chrome catches all exceptions, drivers do not"],"ans":2,"exp":"\u003cp>分頁是 user mode、獨立 address space 的 process：記憶體錯誤碰不到別人，kernel 可以把它終止並回收資源。driver 跑在 kernel mode、在 kernel 的 address space 裡：它可能弄壞 kernel 的表格，沒有更高權限的東西能隔離它，只好重開機保護自己。跟 root 無關。\u003c/p>"},{"id":"s2-w4-27","week":"W4","topic":"哪些情況會 context switch","src":"新題（依講義 W4 Part 6）","group":"s2-W4-cs","type":"multi","q":"\u003cp>On a single CPU where other processes are ready to run, which of these events cause a context switch away from process A? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["A calls read() on the keyboard and no key has been pressed","A calls read() on the keyboard and a typed character is already waiting in the kernel buffer","A timer tick arrives and A's time slice is used up","A timer tick arrives but A is the only ready process","A calls getpid()"],"ans":[0,2],"exp":"\u003cp>沒有按鍵 → read 要等 → A 睡覺、換人 ✓。字元已經在 kernel buffer 裡 → read 立刻回傳，不用睡，不換人。slice 用完而且有別人 ready → scheduler 換人 ✓。只有 A 一個能跑 → tick 處理完回到 A。getpid 是 fast system call，只有 mode switch。\u003c/p>"},{"id":"s2-w2-28","week":"W2","topic":"Page cache：第二次 import 為什麼快","src":"新題（依講義 W2 Part 6）","group":"s2-W2-cache","type":"single","q":"\u003cp>\u003ccode>python3 -c \"import numpy\"\u003c/code> takes over a second the first time, but only a few milliseconds when run again right afterwards. The program did not change. Why?\u003c/p>","opts":["Python compiled numpy into machine code during the first run","The CPU clock speed increased after the first run","The second run skips most of the 2,549 files","The first run left copies of the file pages in the page cache, so the second run reads them from memory instead of the SSD"],"ans":3,"exp":"\u003cp>第一次要從 SSD 讀進 2,549 個檔案的每一頁，OS 把它們留在記憶體裡（\u003cb>page cache\u003c/b>）。第二次的讀取直接從記憶體回答（每頁約 100 ns，而不是約 100 µs）。程式完全感覺不到差別——這就是 file abstraction。而且不一定要同一個程式，任何讀這些檔案的程式都受益。\u003c/p>"},{"id":"s2-w2-37","week":"W2","topic":"為什麼 stderr 不緩衝","src":"新題（依講義 W2 Part 7）","group":"s2-W2-printf","type":"single","q":"\u003cp>Why does the C library leave stderr \u003cb>unbuffered\u003c/b> while stdout is buffered?\u003c/p>","opts":["To make error messages appear in the next command of a pipeline","Because stderr is always a file, and files cannot be buffered","Because the kernel refuses to buffer fd 2","So that an error message reaches the user right away, even if the program crashes on the next line"],"ans":3,"exp":"\u003cp>每次 fprintf(stderr, …) 都立刻交給 kernel，不等 buffer 滿、fflush 或正常結束。所以程式下一行就 crash 時，錯誤訊息也已經送出去了，而前面印到 stdout 的正常輸出反而可能丟失。這也是除錯訊息應該寫到 stderr 的原因。\u003c/p>"},{"id":"s2-w2-32","week":"W2","topic":"Page cache 的性質","src":"新題（依講義 W2 Part 6）","group":"s2-W2-cache","type":"multi","q":"\u003cp>Which statements about the page cache are true? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["Pages cached by one program speed up a different program that reads the same file","write() usually returns once the data is in the page cache, before it reaches the disk","A clean page can be dropped without writing anything to the disk","A dirty page holds data newer than the copy on disk","Data in the page cache survives a power failure"],"ans":[0,1,2,3],"exp":"\u003cp>page cache 是 kernel 管的、全系統共用的檔案頁快取：誰讀進來都能讓別人受益。clean page 和磁碟內容一樣，記憶體不夠時直接丟掉即可；dirty page 比磁碟新，丟掉前必須先寫回。它在 DRAM 裡，斷電就沒了。\u003c/p>"},{"id":"s2-w4-13","week":"W4","topic":"三個 printf 變成幾次 write","src":"新題（依講義 W4 Part 4）","group":"s2-W4-sc","type":"fill","q":"\u003cp>The program below runs in a terminal under strace. How many \u003ccode>write\u003c/code> system calls does strace show for these lines?\u003c/p>\u003cpre>\u003ccode>printf(\"meow\");\nprintf(\"meow\");\nprintf(\"meow\\n\");\u003c/code>\u003c/pre>","ans":["1"],"exp":"\u003cp>終端機是 line-buffered：前兩個 printf 只是把字放進 libc buffer，第三個遇到換行才 flush → strace 只看到一個 \u003ccode>write(1, \"meowmeowmeow\\n\", 13)\u003c/code>，共 \u003cb>1\u003c/b> 次。三次函式呼叫變成一次 system call，省下兩次 user / kernel 切換——這就是 libc 要 buffer 的原因。（講義 Part 9 的實驗。）\u003c/p>"},{"id":"s2-w4-11","week":"W4","topic":"ASLR","src":"新題（依講義 W4 Part 3）","group":"s2-W4-as","type":"single","q":"\u003cp>You run the lecture's \u003ccode>va.c\u003c/code> twice. Both runs show code &lt; heap &lt; stack, but all three addresses are different in the second run, although the program did not change. Why?\u003c/p>","opts":["The program was loaded into a different amount of physical memory","Address-space layout randomization (ASLR) places the regions at random virtual addresses on every run, which makes memory attacks harder","printf rounds addresses randomly","Another process was using the old addresses"],"ans":1,"exp":"\u003cp>程式看到的位址全是\u003cb>虛擬位址\u003c/b>。ASLR 每次執行都隨機擺放 code、heap、stack 的位置，讓攻擊者猜不到要跳去哪裡。每個 process 有自己的 address space，別的 process 用什麼位址都不衝突。\u003c/p>"},{"id":"s2-w3-31","week":"W3","topic":"靜態連結：同一個執行檔跑兩次","src":"變化題（源自 W3-02）","group":"s2-W3-link","type":"fill","q":"\u003cp>libZ contains 6 MB of code. 10 different programs, each \u003cb>statically\u003c/b> linked with libZ, are running, and \u003cb>each program has two processes\u003c/b> (20 processes in total). How much DRAM does libZ's code use, in MB?\u003c/p>","ans":["60","60 MB","60MB"],"exp":"\u003cp>kernel 會共享「同一個檔案」的頁：同一個執行檔的兩個 process，code 頁（包括裡面那份 libZ）是共用的。但 10 個不同的執行檔是 10 個不同的檔案，kernel 不會比對內容 → 10 份 × 6 MB = \u003cb>60 MB\u003c/b>（不是 120）。若改成動態連結，只有一份 6 MB。\u003c/p>","calc":{"fn":"mul","a":10,"b":6}},{"id":"s2-w2-18","week":"W2","topic":"沒有 O_TRUNC 的覆寫","src":"變化題（源自 W2-07）","group":"s2-W2-fd","type":"fill","q":"\u003cp>log.txt contains \u003ccode>hello world\u003c/code> (11 bytes, no newline).\u003c/p>\u003cpre>\u003ccode>int fd = open(\"log.txt\", O_WRONLY);   // no O_TRUNC, no O_APPEND\nwrite(fd, \"HEY\", 3);\nclose(fd);\u003c/code>\u003c/pre>\u003cp>What does log.txt contain now? Type its exact contents.\u003c/p>","ans":["HEYlo world"],"exp":"\u003cp>沒有 O_TRUNC 就不會清空，沒有 O_APPEND 就從 offset 0 開始寫：前 3 個 byte 被蓋掉 → \u003cb>HEYlo world\u003c/b>，檔案仍是 11 bytes。已實測。\u003c/p>","cprog":"s2_w2 overwrite"},{"id":"s2-w5-28","week":"W5","topic":"AgentScope：逾時其實是 deadlock","src":"新題（依講義 W5 Part 3）","group":"s2-W5-cap","type":"single","q":"\u003cp>An AI-agent framework runs shell commands, waits for each command to exit, and then reads its output. Commands that print more than 64 KiB hang and are reported as \"timeout\". What is the right fix?\u003c/p>","opts":["Read the command's output while it runs (drain the pipe until EOF, then wait), for example with communicate()","Increase the timeout","Run the commands on a faster machine","Print a warning when a command takes more than 10 seconds"],"ans":0,"exp":"\u003cp>這是講義的 Bug 2：parent 先 wait，child 輸出超過 pipe 容量就卡在 write()，兩邊互等。加長時限只是讓它卡更久，然後誤導人以為指令太慢——問題在 parent。修法是邊跑邊讀，讀到 EOF 再 wait；stdout、stderr 兩條都要讀（communicate() 會處理）。\u003c/p>"},{"id":"s2-w2-33","week":"W2","topic":"printf / write / fflush / _exit 混合","src":"變化題（源自 W2-17）","group":"s2-W2-printf","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. What does out.txt contain afterwards? Type the characters with no spaces, or \u003ccode>empty\u003c/code> if the file is empty.\u003c/p>\u003cpre>\u003ccode>printf(\"A\");\nwrite(1, \"B\", 1);\nprintf(\"C\");\nfflush(stdout);\nwrite(1, \"D\", 1);\nprintf(\"E\");\n_exit(0);\u003c/code>\u003c/pre>","ans":["BACD"],"exp":"\u003cp>導向檔案 → fully buffered。printf A → 進 buffer；write B → 立刻進 kernel（檔案：B）；printf C → buffer 裡是 AC；fflush → 把 AC 寫出（檔案：BAC）；write D → BACD；printf E → 進 buffer；\u003ccode>_exit\u003c/code> 直接結束、\u003cb>不 flush\u003c/b> → E 消失。結果 \u003cb>BACD\u003c/b>。已實測。\u003c/p>","cprog":"s2_w2 mix"},{"id":"s2-w3-30","week":"W3","topic":"靜態連結的磁碟用量","src":"變化題（源自 W3-05）","group":"s2-W3-link","type":"fill","q":"\u003cp>libZ contains 6 MB of code. 10 different programs each have 1 MB of their own code and all use libZ. With \u003cb>static\u003c/b> linking, how much disk space do the 10 executables take in total, in MB?\u003c/p>","ans":["70","70 MB","70MB"],"exp":"\u003cp>靜態連結把 libZ 複製進每個執行檔：10 × (1 + 6) = \u003cb>70 MB\u003c/b>。動態連結則是 10 × 1 + 6 = 16 MB（一份 libZ.so）。\u003c/p>","calc":{"fn":"linkDisk","lib":6,"own":1,"n":10,"mode":"static"}},{"id":"s2-w2-19","week":"W2","topic":"Hard link 的 link count","src":"變化題（源自 W2-10）","group":"s2-W2-unlink","type":"fill","q":"\u003cp>File f has link count 1. You run \u003ccode>ln f g\u003c/code>, then \u003ccode>ln f h\u003c/code>, then \u003ccode>rm g\u003c/code>. What is f's link count now?\u003c/p>","ans":["2"],"exp":"\u003cp>每個 ln 為同一個 inode 多加一個名字：1 → 2 → 3。rm（unlink）只刪掉一個名字：3 → \u003cb>2\u003c/b>（f 和 h）。資料還在，因為 link count 不是 0。已實測。\u003c/p>","cprog":"ln / rm / stat"},{"id":"s2-w3-37","week":"W3","topic":"Zombie 佔用什麼","src":"變化題（源自 W3-10）","group":"s2-W3-wait","type":"single","q":"\u003cp>What does a zombie process still hold?\u003c/p>","opts":["Its open files, so the files cannot be deleted","All of its memory, until the parent calls wait()","Only its row in the process table: its PID and exit status","One CPU core, because it keeps running exit()"],"ans":2,"exp":"\u003cp>process 結束時 kernel 立刻釋放它的記憶體、關掉它的檔案；只留下 process table 的那一列（PID + exit code），等 parent 用 wait() 拿走。一個 zombie 無害，但從不 wait 的 server 會一直累積，最後 process table 滿了，所有人的 fork() 都失敗。\u003c/p>"},{"id":"s2-w4-04","week":"W4","topic":"如果 user mode 能裝 trap table","src":"新題（依講義 W4 Part 4）","group":"s2-W4-mode","type":"single","q":"\u003cp>Suppose a user program could install its own trap table. Why would that effectively give it kernel privileges?\u003c/p>","opts":["It would let the program call kernel functions as ordinary functions in user mode","It would only make that one program's system calls slower","The CPU would ignore the new table","Its handlers would run in kernel mode on every system call and interrupt from every process, so it could read any memory or bypass permission checks"],"ans":3,"exp":"\u003cp>trap table 決定 trap / interrupt 發生時 CPU 跳去哪裡，而且跳過去時已經是 kernel mode。換成自己的 handler，就能在每一個 process 的 system call 和 interrupt 時以 kernel mode 執行自己的程式碼：讀任意記憶體、從 ps 隱藏 process、記錄按鍵、跳過權限檢查。所以安裝 trap table 是特權指令。\u003c/p>"},{"id":"s2-w4-24","week":"W4","topic":"鍵盤 interrupt 的間隔","src":"新題（依講義 W4 Part 6）","group":"s2-W4-timer","type":"fill","q":"\u003cp>A gamer presses 10 keys per second on a 3 GHz CPU. On average, how many clock cycles pass between two keyboard interrupts?\u003c/p>","ans":["300000000","300,000,000","300 million"],"exp":"\u003cp>兩次按鍵間隔 0.1 s，3 × 10⁹ × 0.1 = \u003cb>300,000,000\u003c/b> cycles。從 CPU 的角度看，就算是打字最快的人，鍵盤 interrupt 也非常稀少（講義：每秒 18 鍵，約每 55 ms 一次）。\u003c/p>","calc":{"fn":"cycles","ghz":3,"hz":10}},{"id":"s2-w6-21","week":"W6","topic":"Convoy effect","src":"新題（依講義 W6 Part 4）","group":"s2-W6-fifo","type":"single","q":"\u003cp>Under FIFO, a 60 ms job arrives just before two 6 ms jobs. Why is the average turnaround so bad?\u003c/p>","opts":["Both short jobs must wait for the whole long job, so its 60 ms is added to every turnaround behind it","FIFO wastes time on context switches","FIFO runs the shortest job last on purpose","FIFO preempts the long job too often"],"ans":0,"exp":"\u003cp>FIFO 一個跑完才換下一個。長工作排在前面，後面每一個短工作的 turnaround 都要加上它的 60 ms（像一輛慢車後面排了一串車）。換成 SJF 先跑短的：平均從 66 ms 降到 30 ms。\u003c/p>"},{"id":"s2-w2-20","week":"W2","topic":"刪掉兩個名字之後","src":"變化題（源自 W2-10）","group":"s2-W2-unlink","type":"single","q":"\u003cp>A file has three hard links, /a, /b and /c, and no process has it open. Someone runs \u003ccode>rm /a /b\u003c/code>. What happens to the file's data?\u003c/p>","opts":["It is freed, because two of the three names were removed","It is moved to a trash folder","It is freed when the next program opens /c","It stays: the link count drops to 1 and /c still leads to the inode"],"ans":3,"exp":"\u003cp>inode 只有在「link count = 0」而且「沒有任何 open file 參照它」時才會被釋放。刪掉兩個名字後 link count 是 1，/c 還指著同一個 inode，資料完整保留。\u003c/p>"},{"id":"s2-w2-17","week":"W2","topic":"write 和 read 共用同一個 offset","src":"變化題（源自 W2-07）","group":"s2-W2-fd","type":"fill","q":"\u003cp>data.txt contains \u003ccode>ABCDEF\u003c/code>.\u003c/p>\u003cpre>\u003ccode>int fd = open(\"data.txt\", O_RDWR);\nwrite(fd, \"xy\", 2);\nchar c;\nread(fd, &amp;c, 1);\u003c/code>\u003c/pre>\u003cp>What character is in \u003ccode>c\u003c/code>?\u003c/p>","ans":["C"],"exp":"\u003cp>同一個 fd 的讀和寫共用一個 offset。write 把 \"xy\" 蓋在 offset 0–1（檔案變成 xyCDEF），offset 變 2；read 從 offset 2 讀 → \u003cb>C\u003c/b>。已實測。\u003c/p>","cprog":"s2_w2 rdwr"},{"id":"s2-w2-25","week":"W2","topic":"RSS 超過 DRAM 時","src":"新題（依講義 W2 Part 5）","group":"s2-W2-vm","type":"single","q":"\u003cp>Many processes keep writing to memory they allocated earlier, and the total RSS of all processes is about to exceed the machine's DRAM (no swap). What does Linux do?\u003c/p>","opts":["The out-of-memory (OOM) killer picks a victim process and kills it","Nothing; the allocations already succeeded, so the writes are guaranteed to work","It refuses every new malloc() but lets the writes continue","It reboots the machine"],"ans":0,"exp":"\u003cp>overcommit 的代價：配置（VSZ）永遠不會讓機器當掉，\u003cb>touch\u003c/b> 才會。當所有 process 的 RSS 加起來超過 DRAM，kernel 的 OOM killer 會選一個 process 殺掉，把它的 frame 收回來。\u003c/p>"},{"id":"s2-w3-40","week":"W3","topic":"Subshell 裡的 cd","src":"變化題（源自 W3-03）","group":"s2-W3-path","type":"single","q":"\u003cp>Your shell's current directory is /home/nini. You run \u003ccode>(cd /tmp; pwd); pwd\u003c/code>. The parentheses make bash run their contents in a forked child. What is printed?\u003c/p>","opts":["/tmp, then /home/nini","/tmp, then /tmp","/home/nini, then /home/nini","/home/nini, then /tmp"],"ans":0,"exp":"\u003cp>括號裡的指令在 fork 出來的 subshell 裡執行：它的 cd 改的是自己的 cwd，所以裡面的 pwd 印 /tmp；subshell 結束後，外面的 shell 的 cwd 從來沒變 → 第二個 pwd 印 /home/nini。已實測（cwd 不變）。\u003c/p>","cprog":"bash subshell cd","cexpect":"unchanged"},{"id":"s2-w3-45","week":"W3","topic":"fork 為什麼很快","src":"新題（依講義 W3 Part 1）","group":"s2-W3-fork","type":"single","q":"\u003cp>A process with 2 GiB of resident memory calls fork(), and fork() returns within a fraction of a millisecond. How is that possible?\u003c/p>","opts":["fork() returns before the copy finishes, and the copy continues in the background","fork() copies 2 GiB using a special fast instruction","The child gets an empty address space","The child shares all of the parent's pages read-only (copy-on-write); a page is copied only when one of them writes to it"],"ans":3,"exp":"\u003cp>fork 只複製 page table，讓兩邊指向同樣的 frame 並標成唯讀。之後誰寫某一頁，就觸發 page fault，kernel 才複製那一頁（copy-on-write）。不寫的頁永遠共用。（細節在 Week 10。）\u003c/p>"},{"id":"s2-w5-39","week":"W5","topic":"yes | head -2 | wc -l 的 PIPESTATUS","src":"變化題（源自 W5-01）","group":"s2-W5-pipe","type":"fill","q":"\u003cp>In bash you run \u003ccode>yes | head -2 | wc -l\u003c/code> and then \u003ccode>echo \"${PIPESTATUS[@]}\"\u003c/code>. What does it print? Type the three numbers separated by spaces.\u003c/p>","ans":["141 0 0"],"exp":"\u003cp>head 印完 2 行就正常結束（0）。yes 下一次寫進那條已經沒有讀者的 pipe → SIGPIPE（13）→ 128 + 13 = 141。wc 讀到 EOF（head 的 write end 隨它結束而關閉）、印出 2、正常結束（0）→ \u003cb>141 0 0\u003c/b>。已實測。\u003c/p>","cprog":"bash PIPESTATUS"},{"id":"s2-w3-04","week":"W3","topic":"迴圈 fork + child break","src":"變化題（源自 W3-16）","group":"s2-W3-loop","type":"fill","q":"\u003cp>How many lines are printed in total? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>int i;\nfor (i = 0; i &lt; 3; i++)\n    if (fork() == 0)\n        break;              // the child leaves the loop\nprintf(\"%d\\n\", i);\nreturn 0;\u003c/code>\u003c/pre>","ans":["4"],"exp":"\u003cp>child 一出生就 break，不會再 fork；只有原本的 process 跑完整個迴圈。所以 P 產生 3 個 child，分別印 0、1、2，P 自己最後印 3 → 共 \u003cb>4\u003c/b> 行。結構是「一個 parent、三個 child」。已實測。\u003c/p>","cprog":"s2_w3 q4"},{"id":"s2-w6-08","week":"W6","topic":"預測 burst：α = 0.75","src":"新題（依講義 W6 Part 4）","group":"s2-W6-pred","type":"fill","q":"\u003cp>Using \u003ccode>next guess = α × last burst + (1 − α) × previous guess\u003c/code> with α = 0.75: the previous guess was 8 ms, and the burst that just ended took 12 ms. What is the next guess, in ms?\u003c/p>","ans":["11","11 ms"],"exp":"\u003cp>0.75 × 12 + 0.25 × 8 = 9 + 2 = \u003cb>11\u003c/b> ms。α 越大越相信最近一次的 burst。\u003c/p>","calc":{"fn":"predict","alpha":0.75,"guess":8,"bursts":[12]}},{"id":"s2-w3-26","week":"W3","topic":"為什麼 exit 也是 built-in","src":"變化題（源自 W3-03）","group":"s2-W3-path","type":"single","q":"\u003cp>Why must \u003ccode>exit\u003c/code> be a shell built-in?\u003c/p>","opts":["It has to end the shell process itself; a separate program could only end its own child process","Only built-ins may return an exit status","Because /bin/exit would need root","Because exec cannot run programs named exit"],"ans":0,"exp":"\u003cp>跟 cd 同一個道理：它要改變的是 shell \u003cb>自己\u003c/b>的狀態（結束 shell 本身）。如果 exit 是獨立程式，shell 會 fork 一個 child 去跑它，結束的只是那個 child，shell 照樣活著。export 同理（要改 shell 自己的環境）。\u003c/p>"},{"id":"s2-w2-03","week":"W2","topic":"Kernel-mode driver 當機","src":"新題（依講義 W2 Part 2）","group":"s2-W2-goal","type":"single","q":"\u003cp>An out-of-bounds memory read in an ordinary program usually just ends that one program. Why did the same kind of bug in CrowdStrike's Falcon sensor take down about 8.5 million Windows machines?\u003c/p>","opts":["The sensor is a driver that runs inside the kernel, so the bug corrupted the kernel itself and nothing at a higher privilege level could contain it","The sensor ran as root, and root processes are not protected by virtual memory","All 8.5 million machines shared one copy of the sensor over the network","Windows cannot kill a program that reads memory out of bounds"],"ans":0,"exp":"\u003cp>Falcon sensor 是跑在 Windows kernel 裡的 \u003cb>driver\u003c/b>（kernel mode）。一般程式 out-of-bounds 只會被 kernel 終止那個 process；kernel mode 的程式出錯則是 kernel 自己壞了，沒有更高權限的元件能把它隔離起來 → 整台機器當掉（藍屏）。這跟 root 無關：root 仍是 user mode。\u003c/p>"},{"id":"s2-w5-38","week":"W5","topic":"忽略 SIGPIPE 之後的 write","src":"變化題（源自 W5-01）","group":"s2-W5-pipe","type":"single","q":"\u003cp>A writer calls \u003ccode>signal(SIGPIPE, SIG_IGN)\u003c/code>. Later every read end of its pipe is closed, and it calls \u003ccode>write(fd[1], \"x\", 1)\u003c/code>. What happens?\u003c/p>","opts":["The writer is terminated by SIGPIPE anyway","write() returns −1 with errno EPIPE, and the writer keeps running","write() blocks until a reader appears","write() succeeds and the byte is discarded"],"ans":1,"exp":"\u003cp>寫進沒有讀者的 pipe 永遠不會成功。預設情況下 kernel 送 SIGPIPE、預設動作是終止寫端（所以 \u003ccode>yes | head\u003c/code> 會結束）。SIGPIPE 被忽略時，write 改成回傳 −1、errno = EPIPE，程式要自己檢查並處理。已實測。\u003c/p>","cprog":"s2_w5 epipe","cexpect":"-1 EPIPE"},{"id":"s2-w5-19","week":"W5","topic":"一次讀 2 bytes 要讀幾次","src":"變化題（源自 W2-16）","group":"s2-W5-read","type":"fill","q":"\u003cp>A child writes the 5 bytes \u003ccode>hello\u003c/code> into a pipe and exits. The parent has closed its own write end. It then runs \u003ccode>while ((n = read(fd[0], buf, 2)) &gt; 0) count++;\u003c/code>. What is \u003ccode>count\u003c/code> when the loop ends?\u003c/p>","ans":["3"],"exp":"\u003cp>依序讀到 he（2）、ll（2）、o（1），第四次 pipe 空了、沒有 write end → 回傳 0，迴圈結束。回傳正數的有 \u003cb>3\u003c/b> 次。已實測。\u003c/p>","calc":{"fn":"readCount","size":5,"req":2},"cprog":"s2_w5 count2"},{"id":"s2-w4-25","week":"W4","topic":"在 Linux 上殺掉 while(1)","src":"新題（依講義 W4 Part 6）","group":"s2-W4-timer","type":"single","q":"\u003cp>On Linux, a program runs \u003ccode>while (1);\u003c/code>, which never makes a system call. Why can you still kill it with Ctrl-C or from another terminal?\u003c/p>","opts":["Linux runs every program in kernel mode","The compiler inserts a hidden yield() into every loop","The hardware timer interrupts it within about a millisecond, so the kernel regains the CPU and can run other processes and deliver signals","The loop eventually overflows and crashes"],"ans":2,"exp":"\u003cp>preemptive scheduling：timer interrupt 不需要程式配合，每個 tick 都把 CPU 交回 kernel。kernel 可以讓其他 process（你的 shell、另一個終端機）執行，也能送 signal 給這個迴圈。在 cooperative 系統上它會讓整台機器卡住。\u003c/p>"},{"id":"s2-w2-39","week":"W2","topic":"權限字串轉 chmod 數字","src":"變化題（源自 W2-05）","group":"s2-W2-perm","type":"fill","q":"\u003cp>A file's permission string is \u003ccode>-rwx--x--x\u003c/code>. Which \u003ccode>chmod\u003c/code> number gives exactly these permissions?\u003c/p>","ans":["711","0711"],"exp":"\u003cp>owner rwx = 7；group --x = 1；others --x = 1 → \u003cb>711\u003c/b>。（常見於只想讓別人執行、不讓別人讀內容的程式。）\u003c/p>"},{"id":"s2-w5-40","week":"W5","topic":"殺掉 pipeline 的最後一段","src":"變化題（源自 W5-01）","group":"s2-W5-pipe","type":"fill","q":"\u003cp>\u003ccode>yes | cat | wc -l\u003c/code> is running. From another terminal, someone runs \u003ccode>kill -TERM &lt;PID of wc&gt;\u003c/code>. What are the three exit statuses of yes, cat and wc, in that order? Type three numbers separated by spaces.\u003c/p>","ans":["141 141 143"],"exp":"\u003cp>wc 被 SIGTERM 終止 → 143。cat 下一次寫給 wc → 那條 pipe 沒有讀者了 → cat 收到 SIGPIPE → 141。cat 一死，yes 寫給 cat 的那條 pipe 也沒有讀者了 → yes 也收到 SIGPIPE → 141。SIGPIPE 從下游往上游一路傳上去。已實測。\u003c/p>","cprog":"s2_w5 killwc"},{"id":"s2-w6-04","week":"W6","topic":"RR 平均 response","src":"新題（依講義 W6 Part 5）","group":"s2-W6-rr","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with a 5 ms burst, B at t = 1 with 3 ms, C at t = 2 with 8 ms, D at t = 3 with 6 ms.\u003c/p>\u003cp>Under \u003cb>round robin\u003c/b> with q = 2 ms and free context switches: a newly arrived job joins the back of the queue, and when a slice ends, jobs that arrived during or at the end of that slice are queued before the preempted job. What is the average \u003cb>response\u003c/b> time, in ms?\u003c/p>","ans":["2"],"exp":"\u003cp>A 0–2（B 在 1、C 在 2 抵達 → 排在 A 前面：B, C, A）；B 2–4（D 在 3 抵達 → C, A, D, B）；C 4–6；A 6–8；D 8–10；…\u003c/p>\u003cp>第一次執行：A 0、B 2、C 4、D 8 → response：A 0、B 1、C 2、D 5 → 8 / 4 = \u003cb>2\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"rr","q":2,"jobs":[["A",0,5],["B",1,3],["C",2,8],["D",3,6]],"metric":"avgResponse"}},{"id":"s2-w5-25","week":"W5","topic":"卡住時 pipe 裡有幾個 byte","src":"變化題（源自 W5-09）","group":"s2-W5-cap","type":"fill","q":"\u003cp>A worker writes 20 chunks of 4096 bytes each (81,920 bytes in total) into a pipe whose capacity is 65,536 bytes, and then exits. Its parent calls wait() before reading anything. When the program is stuck, how many bytes are sitting in the pipe?\u003c/p>","ans":["65536","65,536","64 KiB"],"exp":"\u003cp>前 16 塊（16 × 4096 = 65,536 bytes）剛好把 pipe 填滿；第 17 個 write() 放不進去，worker 就卡在那裡。此時 pipe 裡是容量上限 \u003cb>65,536\u003c/b> bytes。parent 卡在 wait() 等 worker 結束 → deadlock，兩邊都不耗 CPU。已實測（強制結束 worker 後把 pipe 讀乾，正好 65,536 bytes）。\u003c/p>","calc":{"fn":"stuckBytes","chunks":[4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096,4096],"cap":65536},"cprog":"s2_w5 stuck"},{"id":"s2-w5-41","week":"W5","topic":"由 exit status 反推 signal","src":"新題（依講義 W5 Part 4）","group":"s2-W5-pipe","type":"fill","q":"\u003cp>A process in a pipeline ended with exit status 141 as reported by the shell. Which signal number terminated it?\u003c/p>","ans":["13","SIGPIPE"],"exp":"\u003cp>被 signal 終止時 shell 回報 128 + n → n = 141 − 128 = \u003cb>13\u003c/b>，也就是 SIGPIPE：它寫進了一條已經沒有讀者的 pipe。（\u003ccode>kill -l\u003c/code> 可以看到完整的編號表。）\u003c/p>"},{"id":"s2-w5-20","week":"W5","topic":"read 回傳 0 的意義","src":"新題（依講義 W5 Part 3）","group":"s2-W5-read","type":"single","q":"\u003cp>On a pipe, what exactly does a return value of 0 from \u003ccode>read()\u003c/code> mean?\u003c/p>","opts":["The buffer is empty and no process anywhere holds the write end, so nothing can ever arrive","The buffer is empty right now, but more data may come later","The writer wrote a zero byte","An error occurred"],"ans":0,"exp":"\u003cp>EOF 不是一個儲存在 pipe 裡的字元。pipe 沒有檔案大小，所以 kernel 用「buffer 空 + write end 數量為 0」來判斷 EOF。buffer 空但還有 writer → block（不是回傳 0）；錯誤 → −1。\u003c/p>"},{"id":"s2-w2-38","week":"W2","topic":"chmod 數字轉權限字串","src":"變化題（源自 W2-05）","group":"s2-W2-perm","type":"fill","q":"\u003cp>After \u003ccode>chmod 754 report.sh\u003c/code>, what does \u003ccode>ls -l\u003c/code> show for the permission bits? Type the nine characters (for example \u003ccode>rw-r--r--\u003c/code>).\u003c/p>","ans":["rwxr-xr--","-rwxr-xr--"],"exp":"\u003cp>7 = 4 + 2 + 1 = rwx（owner）；5 = 4 + 1 = r-x（group）；4 = r--（others）→ \u003cb>rwxr-xr--\u003c/b>。\u003c/p>"},{"id":"s2-w2-05","week":"W2","topic":"Tail at scale：fan-out 放大尾端延遲","src":"新題（依講義 W2 Part 3 Machine sharing）","group":"s2-W2-qos","type":"fill","q":"\u003cp>Each backend server answers 1 request in 100 slowly. Loading one web page needs answers from 20 servers, and the page is slow if \u003cb>any\u003c/b> of them is slow. About what percentage of page loads are slow? (Round to the nearest whole percent; type just the number.)\u003c/p>","ans":["18","18%","18.2"],"exp":"\u003cp>20 台都快的機率 = 0.99²⁰ ≈ 0.818，所以至少碰到一台慢的機率 = 1 − 0.818 ≈ \u003cb>18%\u003c/b>。講義的例子是 100 台：1 − 0.99¹⁰⁰ ≈ 63%。fan-out 越多，尾端延遲被放大得越嚴重——這就是 SLO 要用百分位數的原因。\u003c/p>","calc":{"fn":"tail","p":0.01,"n":20}},{"id":"s2-w3-13","week":"W3","topic":"Double fork：為什麼要第二次 fork","src":"變化題（源自 W3-19）","group":"s2-W3-daemon","type":"single","q":"\u003cp>PTT's daemonize() does: fork (the parent exits), setsid(), fork again, redirect stdin/stdout/stderr, write a PID file. What does the \u003cb>second\u003c/b> fork achieve?\u003c/p>","opts":["The process can never acquire a controlling terminal again, and init becomes its parent","It doubles the number of worker processes","It resets all environment variables","It lets the shell reap the daemon"],"ans":0,"exp":"\u003cp>setsid() 開一個沒有終端機的新 session，自己是 session leader；再 fork 一次，新的 process 不是 session leader，就不會意外重新取得控制終端機。它的 parent 隨即結束 → 變成刻意製造的 orphan，由 init 收養（PPID = 1）。第一次 fork 則是讓原本的 parent 結束、終端機拿回 prompt。\u003c/p>"},{"id":"s2-w6-18","week":"W6","topic":"SJF：四個工作","src":"新題（依講義 W6 Part 4）","group":"s2-W6-sjf","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with an 8 ms burst, B at t = 1 with 4 ms, C at t = 2 with 9 ms, D at t = 3 with 5 ms.\u003c/p>\u003cp>Under \u003cb>SJF\u003c/b> (non-preemptive), what is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["14.25"],"exp":"\u003cp>t = 0 只有 A → A 0–8。t = 8：B（4）、C（9）、D（5）→ B 8–12、D 12–17、C 17–26。turnaround：A 8、B 11、D 14、C 24 → 57 / 4 = \u003cb>14.25\u003c/b> ms（STCF 是 13）。\u003c/p>","calc":{"fn":"sched","policy":"sjf","jobs":[["A",0,8],["B",1,4],["C",2,9],["D",3,5]],"metric":"avgTurnaround"}},{"id":"s2-w6-11","week":"W6","topic":"CFS：vruntime 成長速度的比例","src":"新題（依講義 W6 Part 7）","group":"s2-W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>P (nice 5) and Q (nice −5) each get exactly 3 ms of CPU time. P's vruntime grows by how many times as much as Q's? (Round to two decimal places.)\u003c/p>","ans":["9.32","9.3"],"exp":"\u003cp>P：3 × 1024 / 335 ≈ 9.17 ms；Q：3 × 1024 / 3121 ≈ 0.98 ms。比例 = 3121 / 335 ≈ \u003cb>9.32\u003c/b> 倍（跑的時間一樣時，只剩 weight 的比）。Q 的「時鐘」走得慢很多，所以它的 vruntime 長時間保持最小、常被挑中；差 10 個 nice 等級，weight 約差 1.25¹⁰ ≈ 9.3 倍。\u003c/p>","calc":{"fn":"ratio","a":3121,"b":335}},{"id":"s2-w5-11","week":"W5","topic":"最後一段握著別人的 write end","src":"變化題（源自 W5-10）","group":"s2-W5-pipeline","type":"single","q":"\u003cp>A shell runs the three-stage pipeline \u003ccode>a | b | c\u003c/code> the usual way: it creates pipe 1 (a → b) and pipe 2 (b → c), forks the three children, and each child uses dup2 and close before exec.\u003c/p>\u003cp>This time b closes everything correctly, but the child that becomes \u003ccode>c\u003c/code> forgot to close its inherited copy of the \u003cb>write end of pipe 1\u003c/b> (a pipe it does not use at all). a finishes and exits. What happens?\u003c/p>","opts":["b never sees EOF, because c still holds a write end of pipe 1; b keeps waiting, so c never sees EOF on pipe 2 either","Nothing goes wrong, because c does not use pipe 1","c is killed by SIGPIPE","a cannot exit"],"ans":0,"exp":"\u003cp>kernel 只數「全世界有幾個 write end」，不管握著的人會不會寫。c 繼承來的 pipe 1 write end 沒關 → b 永遠等不到 EOF → b 不結束 → c 自己在 pipe 2 上也等不到 EOF。兩個互相等待。教訓：每個 child 都要關掉所有用不到的 pipe 端，不只是自己那條。\u003c/p>"},{"id":"s2-w2-40","week":"W2","topic":"Group 權限","src":"變化題（源自 W2-06）","group":"s2-W2-perm","type":"single","q":"\u003cpre>\u003ccode>-rw-r----- 1 nini manager 812 Sep 22 10:03 salary.csv\u003c/code>\u003c/pre>\u003cp>niko is not nini, but niko is a member of the group \u003ccode>manager\u003c/code>. What can niko do with salary.csv?\u003c/p>","opts":["Read it and write it","Read it, but not write it","Neither read nor write it","Write it, but not read it"],"ans":1,"exp":"\u003cp>niko 不是 owner，但在 manager 群組裡 → 套用第二組 \u003cb>r--\u003c/b>：可以讀、不能寫。只有不是 owner 也不在群組裡的人才套用第三組 ---。\u003c/p>"},{"id":"s2-w2-02","week":"W2","topic":"為什麼重開機能修好大部分問題","src":"新題（依講義 W2 Part 2）","group":"s2-W2-goal","type":"single","q":"\u003cp>Why does rebooting fix most OS crashes, and why did rebooting \u003cb>not\u003c/b> fix the machines hit by the 2024 CrowdStrike update?\u003c/p>","opts":["A reboot installs a newer kernel; the CrowdStrike machines had no network connection","A reboot resets the CPU clock; CrowdStrike's bug depended on the date","A reboot erases the disk caches; CrowdStrike's bug lived only in RAM","A reboot throws away all in-memory state and rebuilds it from disk; CrowdStrike's bad file was on disk, so every boot crashed again"],"ans":3,"exp":"\u003cp>重開機會丟掉所有記憶體中的狀態、從磁碟上的副本重建。大部分 bug 弄壞的是記憶體，不是磁碟，所以重開就好了。CrowdStrike 麻煩在壞掉的設定檔在\u003cb>磁碟\u003c/b>上，每次開機 kernel driver 又讀到它又當機（boot loop），直到有人手動刪掉那個檔案。\u003c/p>"},{"id":"s2-w3-44","week":"W3","topic":"Chrome 一個分頁一個 process","src":"新題（依講義 W3 Part 1）","group":"s2-W3-fork","type":"single","q":"\u003cp>Chrome deliberately uses a separate process for each tab, created with fork(). What is the main benefit?\u003c/p>","opts":["Isolation: if one tab crashes, only its process ends, and the browser and the other tabs keep running","Tabs can read each other's memory more easily","fork() copies the whole browser instantly, so tabs need no memory at all","Each tab gets its own kernel"],"ans":0,"exp":"\u003cp>這是 W2 講的隔離：每個分頁是獨立的 process、有自己的位址空間，一個分頁 crash 或被攻擊不會波及其他分頁。fork 之所以便宜，是因為 copy-on-write（寫的時候才複製），不是「完全不用記憶體」。\u003c/p>"},{"id":"s2-w3-20","week":"W3","topic":"哪些寫法讓 child 看得到環境變數","src":"變化題（源自 W3-09）","group":"s2-W3-env","type":"multi","q":"\u003cp>In a fresh bash where KEY is not set, which command lines let \u003ccode>./prog\u003c/code> see \u003ccode>KEY=abc\u003c/code> in its environment? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>KEY=abc ./prog\u003c/code>","\u003ccode>KEY=abc; ./prog\u003c/code>","\u003ccode>export KEY=abc; ./prog\u003c/code>","\u003ccode>KEY=abc; export KEY; ./prog\u003c/code>","\u003ccode>./prog KEY=abc\u003c/code>"],"ans":[0,2,3],"exp":"\u003cp>\u003ccode>KEY=abc ./prog\u003c/code>：只給這一個指令的環境 ✓。\u003ccode>KEY=abc;\u003c/code> 只是 shell 變數，沒有 export 就不會傳給 child ✗；export 之後（不論一起寫或分開寫）從此 fork 出的 child 都會繼承 ✓。\u003ccode>./prog KEY=abc\u003c/code> 是\u003cb>命令列參數\u003c/b>（argv），不是環境變數 ✗。已實測。\u003c/p>","cprog":"bash env forms","cexpect":"a,c,d"},{"id":"s2-w2-30","week":"W2","topic":"Write buffering 與斷電","src":"新題（依講義 W2 Part 6）","group":"s2-W2-cache","type":"single","q":"\u003cp>\u003ccode>cp big.iso /mnt/usb/\u003c/code> returns after one second. Two seconds later the power fails. After reboot, the copy on the USB drive is empty. Why?\u003c/p>","opts":["cp never wrote anything; it only printed a message","The USB drive erases files that were written less than five seconds ago","cp's write() calls put the data into the page cache as dirty pages and returned; the OS had not yet written those pages to the drive","The data stayed in cp's libc buffer"],"ans":2,"exp":"\u003cp>write() 把資料複製進 kernel 的 page cache、標成 \u003cb>dirty\u003c/b>（比磁碟新）就回報完成；OS 幾秒後才把 dirty pages 一起寫出去。斷電時 dirty pages 還沒寫 → 資料遺失，即使程式被告知「寫好了」。要保證落盤得呼叫 fsync()（「安全移除」就是這樣做）。cp 用的是 write，不是 printf，所以不是 libc buffer 的問題。\u003c/p>"},{"id":"s2-w3-15","week":"W3","topic":"fork 之後哪些不一樣","src":"變化題（源自 W3-01）","group":"s2-W3-fork","type":"multi","q":"\u003cp>Right after a successful fork(), which of the following are \u003cb>different\u003c/b> in the parent and the child? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["The PID","The PPID","The value returned by fork()","The file offset of a file opened before the fork","The current working directory","The environment variables"],"ans":[0,1,2],"exp":"\u003cp>不同的只有：PID（child 拿新的）、PPID（child 的 parent 是呼叫 fork 的 process）、fork 的回傳值（parent 拿 child 的 PID，child 拿 0）。記憶體內容、cwd、使用者、環境變數、signal handler 都一樣；fork 前開的檔案甚至\u003cb>共用\u003c/b>同一個 offset（同一個 open-file entry）。\u003c/p>"},{"id":"s2-w4-30","week":"W4","topic":"/proc/self/maps 裡的 vvar 與 vdso","src":"新題（依講義 W4 Part 7）","group":"s2-W4-vdso","type":"single","q":"\u003cpre>\u003ccode>7ffd1a5f2000-7ffd1a5f6000 r--p 00000000 00:00 0   [vvar]\n7ffd1a5f6000-7ffd1a5f8000 r-xp 00000000 00:00 0   [vdso]\u003c/code>\u003c/pre>\u003cp>What are these two regions in every process's memory map?\u003c/p>","opts":["[vvar] is a read-only page of kernel-maintained data such as the current time; [vdso] is a small read-only, executable library that reads it without a trap","Two copies of the kernel stack","The process's heap and stack","Swap space reserved for the process"],"ans":0,"exp":"\u003cp>權限欄位就是線索：vvar 是 r--（只能讀的資料頁，kernel 會更新裡面的時間），vdso 是 r-x（可執行的小程式庫）。libc 的 gettimeofday 直接呼叫 vdso 裡的函式讀 vvar，所以 strace 看不到它。\u003c/p>"},{"id":"s2-w6-15","week":"W6","topic":"RR：slice 至少要多長","src":"新題（依講義 W6 Part 5）","group":"s2-W6-slice","type":"fill","q":"\u003cp>A context switch costs 50 µs. Under round robin with always-ready CPU-bound jobs, what is the shortest time slice, in ms, that keeps the CPU time lost to switching at or below 1%?\u003c/p>","ans":["4.95","4.95 ms"],"exp":"\u003cp>浪費比例 = sw / (q + sw) ≤ 0.01 → q ≥ 99 × sw = 99 × 0.05 ms = \u003cb>4.95\u003c/b> ms。真實系統切換只要幾 µs、slice 是幾 ms，所以能同時兼顧反應速度和效率。\u003c/p>","calc":{"fn":"minSlice","sw":0.05,"max":0.01}},{"id":"s2-w5-29","week":"W5","topic":"subprocess.run(capture_output=True)","src":"新題（依講義 W5 Part 3）","group":"s2-W5-cap","type":"single","q":"\u003cp>Is \u003ccode>r = subprocess.run(cmd, capture_output=True)\u003c/code> safe for a command that prints 10 MB to stdout and 10 MB to stderr?\u003c/p>","opts":["Only if the command writes stdout and stderr in turns","No: it calls wait() first and deadlocks once the output exceeds 64 KiB","No: it can only capture up to 64 KiB","Yes: run() uses communicate(), which reads both pipes until EOF while waiting for the child"],"ans":3,"exp":"\u003cp>subprocess.run 內部做的事跟 01-pipeline.c 一樣（pipe、fork、dup2、execve），而且用 communicate() 同時讀兩條 pipe 直到 EOF 才收 exit status，所以輸出再大也不會卡。自己用 Popen 再先 p.wait() 才是 Python 文件警告的寫法。\u003c/p>"},{"id":"s2-w6-06","week":"W6","topic":"Throughput","src":"新題（依講義 W6 Part 2）","group":"s2-W6-metric","type":"fill","q":"\u003cp>A server finishes 5 jobs in its first 20 ms of work. What is its throughput, in jobs per second?\u003c/p>","ans":["250"],"exp":"\u003cp>throughput = 完成的工作數 ÷ 時間 = 5 / 0.02 s = \u003cb>250\u003c/b> jobs/s。這是 server 經營者在乎的指標；使用者在乎的是 response 和 turnaround。\u003c/p>","calc":{"fn":"ratio","a":5,"b":0.02}},{"id":"s2-w2-13","week":"W2","topic":"兩次 open：各自的 offset","src":"變化題（源自 W2-14）","group":"s2-W2-fd","type":"fill","q":"\u003cpre>\u003ccode>int fd1 = open(\"notes.txt\", O_RDONLY);\nint fd2 = open(\"notes.txt\", O_RDONLY);\nread(fd1, buf, 10);\nread(fd2, buf, 3);\nread(fd1, buf, 5);\u003c/code>\u003c/pre>\u003cp>notes.txt is 1000 bytes long. At which byte offset will the \u003cb>next\u003c/b> read on fd2 start?\u003c/p>","ans":["3"],"exp":"\u003cp>兩次 open 建立兩個獨立的 open-file table entry，各有自己的 offset。fd2 只讀過 3 bytes → 下一次從 \u003cb>3\u003c/b> 開始；fd1 讀了 10 + 5 = 15，跟 fd2 無關。已實測。\u003c/p>","cprog":"s2_w2 twoopen"},{"id":"s2-w3-05","week":"W3","topic":"迴圈 fork + parent break","src":"變化題（源自 W3-16）","group":"s2-W3-loop","type":"single","q":"\u003cpre>\u003ccode>for (int i = 0; i &lt; 3; i++)\n    if (fork() &gt; 0)\n        break;              // the parent leaves the loop\n// ... each process then continues here\nreturn 0;\u003c/code>\u003c/pre>\u003cp>Assume every fork succeeds. Which description of the processes is correct?\u003c/p>","opts":["Only 3 processes in total","A tree of 8 processes","One parent with 3 children","A chain of 4 processes: each process is the parent of the next one"],"ans":3,"exp":"\u003cp>這次是 parent 一 fork 完就 break，child 繼續下一輪、再 fork 自己的 child。P → C1 → C2 → C3，每個 process 最多一個 child：一條 \u003cb>4 個 process 的鏈\u003c/b>。對照「child break」的版本：一個 parent、三個 child；都不 break 的版本：8 個 process 的樹。已實測（共 4 個 process）。\u003c/p>","cprog":"s2_w3 q5","cexpect":"4"},{"id":"s2-w3-27","week":"W3","topic":"Everything is a file","src":"變化題（源自 W3-04）","group":"s2-W3-unix","type":"single","q":"\u003cp>Which of the following is \u003cb>not\u003c/b> an example of the Unix idea \"everything is a file\"?\u003c/p>","opts":["Reading a disk through /dev/sda","Reading a process's state from /proc/1234/status","Reading the CPU temperature with cat /sys/class/thermal/thermal_zone0/temp","Piping the plain-text output of ps into grep"],"ans":3,"exp":"\u003cp>/dev 代表裝置、/proc 代表 process、/sys 代表硬體狀態——都是把東西表示成檔案，讓一般的 cat、ls 就能操作。把 ps 的輸出 pipe 給 grep 展示的是另一個原則：\u003cb>text streams\u003c/b> 是通用介面、每個程式只做好一件事、彼此組合。\u003c/p>"},{"id":"s2-w4-20","week":"W4","topic":"Exception 分類：硬體損壞","src":"新題（依講義 W4 Part 5）","group":"s2-W4-exc","type":"fill","q":"\u003cp>The CPU reports an uncorrectable error in a memory chip (a machine check). Which of the four kinds of exception is this: trap, fault, interrupt or abort? Type one word.\u003c/p>","ans":["abort","an abort"],"exp":"\u003cp>硬體回報 kernel 無法信任自己還能安全處理的損壞 → \u003cb>abort\u003c/b>，通常是 kernel panic（伺服器硬體支援時可能只終止用到那塊記憶體的 process）。trap 是程式故意的、fault 是指令意外出錯、interrupt 是外部裝置。\u003c/p>"},{"id":"s2-w3-42","week":"W3","topic":"$? 從哪裡來","src":"新題（依講義 W3 Part 2）","group":"s2-W3-wait","type":"single","q":"\u003cp>After \u003ccode>gcc -o meow meow.c\u003c/code> finishes, \u003ccode>echo $?\u003c/code> prints 0. Where did that 0 come from?\u003c/p>","opts":["gcc printed 0 to stderr and bash read it","bash guessed it from the fact that meow was created","gcc called exit(0); the kernel kept the code in gcc's process-table row until bash collected it with waitpid","The kernel sets $? to 0 for every program that does not crash"],"ans":2,"exp":"\u003cp>gcc 呼叫 exit(0) → kernel 釋放它的記憶體，但把 exit code 留在 process table 那一列 → 叫醒在 waitpid 裡睡覺的 bash → bash 拿到 exit code、存進 $?、顯示新的 prompt。被 signal 終止時，$? 則是 128 + signal 編號。\u003c/p>"},{"id":"s2-w4-12","week":"W4","topic":"每個 process 都要自己的 kernel stack","src":"新題（依講義 W4 Part 3）","group":"s2-W4-as","type":"single","q":"\u003cp>All processes share the kernel's code and data, yet each process has its own private kernel stack. Why can't the kernel use a single stack for everyone?\u003c/p>","opts":["The kernel is often in the middle of work for several processes at once (for example A asleep inside read() while the timer interrupts B); each needs saved state that must survive until it runs again","Kernel stacks hold user passwords","A single stack would be larger than physical memory","Each process uses a different kernel version"],"ans":0,"exp":"\u003cp>A 睡在 read() 裡時，它在 kernel 裡做到一半的狀態存在 kernel stack 上；這時 timer 打斷 B，B 也要在 kernel 裡存狀態。共用一個 stack，B 的狀態就會蓋掉 A 的。所以每個 process 一個 kernel stack，切換 process 時也要換 kernel stack。\u003c/p>"},{"id":"s2-w6-01","week":"W6","topic":"FIFO 平均 waiting","src":"新題（依講義 W6 Part 4）","group":"s2-W6-fifo","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with a 5 ms burst, B at t = 1 with 3 ms, C at t = 2 with 8 ms, D at t = 3 with 6 ms.\u003c/p>\u003cp>Under \u003cb>FIFO\u003c/b>, what is the average waiting time, in ms? (Round to two decimal places.)\u003c/p>","ans":["5.75"],"exp":"\u003cp>依抵達順序：A 0–5、B 5–8、C 8–16、D 16–22。waiting = 開始 − 抵達（沒被搶占）：A 0、B 4、C 6、D 13 → 23 / 4 = \u003cb>5.75\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"fifo","jobs":[["A",0,5],["B",1,3],["C",2,8],["D",3,6]],"metric":"avgWaiting"}},{"id":"s2-w3-03","week":"W3","topic":"fork 計數：&& 和 || 短路","src":"變化題（源自 W3-15）","group":"s2-W3-count","type":"fill","q":"\u003cp>How many lines of \u003ccode>Z\u003c/code> are printed? Assume every fork succeeds.\u003c/p>\u003cpre>\u003ccode>(fork() &amp;&amp; fork()) || fork();\nprintf(\"Z\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["5"],"exp":"\u003cp>P：第 1 個 fork 回傳正數 → 做第 2 個 fork，又是正數 → 括號為真，|| 短路，不做第 3 個。\u003c/p>\u003cp>第 1 個 fork 的 child：拿到 0 → && 短路（不做第 2 個），括號為假 → 做第 3 個 fork，多一個 process。\u003c/p>\u003cp>第 2 個 fork 的 child：拿到 0 → 括號為假 → 也做第 3 個 fork，再多一個。\u003c/p>\u003cp>共 P、2 個 child、2 個第 3 個 fork 產生的 process = \u003cb>5\u003c/b>。已實測。\u003c/p>","cprog":"s2_w3 q3"},{"id":"s2-w3-08","week":"W3","topic":"fork 前先 fflush","src":"變化題（源自 W3-21）","group":"s2-W3-buf","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog &gt; out.txt\u003c/code>. How many lines does out.txt contain?\u003c/p>\u003cpre>\u003ccode>printf(\"A\\n\");\nfflush(stdout);\nfork();\nprintf(\"B\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["3"],"exp":"\u003cp>fflush 在 fork 前就把 \"A\\n\" 寫進 kernel，buffer 清空，child 複製到的是空 buffer。之後兩個 process 各印一行 B → A 1 行 + B 2 行 = \u003cb>3\u003c/b> 行。這就是講義建議的寫法：fork 前先 fflush(stdout)。已實測。\u003c/p>","cprog":"s2_w3 q8"}]</script>
<script>
(function () {
  'use strict';
  var QS = JSON.parse(document.getElementById('qdata').textContent);
  var KEY = 'os-midterm-practice-2026-set2';
  var LET = 'abcdefghij';
  var TYPE = { single: '單選', multi: '多選', fill: '填充' };

  // ---------- 狀態（localStorage 讀寫都包 try/catch） ----------
  // ans[id] = 目前這題的作答 {r, ok}；hist[id] = 這題答錯過幾次（重做後也保留）
  // mode: all / wrong / ever / redo；redo = 這一輪要重做的題目 id
  function fresh() { return { ans: {}, hist: {}, cur: QS.length ? QS[0].id : null, mode: 'all', redo: [], grid: false }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object' && s.ans && typeof s.ans === 'object') return s;
    } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var st = load();
  var byId = {};
  QS.forEach(function (q, i) { byId[q.id] = i; });
  // 舊版紀錄相容：補上新欄位、丟掉對不上的紀錄
  if (!st.hist || typeof st.hist !== 'object') st.hist = {};
  if (!st.mode) st.mode = st.wrongOnly ? 'wrong' : 'all';
  delete st.wrongOnly;
  if (!Array.isArray(st.redo)) st.redo = [];
  Object.keys(st.ans).forEach(function (id) {
    var q = QS[byId[id]], r = st.ans[id] && st.ans[id].r;
    var fits = q && (q.type === 'fill' ? typeof r === 'string'
      : q.type === 'single' ? typeof r === 'number' && r < q.opts.length
      : Array.isArray(r) && r.every(function (i) { return i < q.opts.length; }));
    if (!fits) delete st.ans[id];
    else if (!st.ans[id].ok && !st.hist[id]) st.hist[id] = 1;
  });
  Object.keys(st.hist).forEach(function (id) { if (!(id in byId)) delete st.hist[id]; });
  st.redo = st.redo.filter(function (id) { return id in byId; });
  if (st.mode === 'redo' && !st.redo.length) st.mode = 'all';
  if (!(st.cur in byId)) st.cur = QS.length ? QS[0].id : null;

  var draft = {};   // 尚未送出的選擇（不存檔）

  // ---------- 答案比對 ----------
  function norm(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/\s*,\s*/g, ',');
  }
  function asNum(s) {
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : null;
  }
  function fillCorrect(input, accepted) {
    var a = norm(input);
    if (!a) return false;
    var na = asNum(a);
    return accepted.some(function (x) {
      var b = norm(x);
      if (a === b) return true;
      var nb = asNum(b);
      return na !== null && nb !== null && Math.abs(na - nb) < 1e-9;
    });
  }
  function grade(q, resp) {
    if (q.type === 'fill') return fillCorrect(resp, q.ans);
    if (q.type === 'single') return resp === q.ans;
    var a = (resp || []).slice().sort(), b = q.ans.slice().sort();
    return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
  }

  // ---------- 清單與統計 ----------
  function idxWhere(f) { var out = []; QS.forEach(function (q, i) { if (f(q)) out.push(i); }); return out; }
  function isWrong(q) { var r = st.ans[q.id]; return !!(r && !r.ok); }
  function wrongList() { return idxWhere(isWrong); }
  function list() {
    if (st.mode === 'wrong') return wrongList();
    if (st.mode === 'ever') return idxWhere(function (q) { return st.hist[q.id] > 0; });
    if (st.mode === 'redo') return st.redo.map(function (id) { return byId[id]; });
    return QS.map(function (_, i) { return i; });
  }
  function stats() {
    var n = 0, ok = 0, bad = 0;
    QS.forEach(function (q) { var r = st.ans[q.id]; if (r) { n++; if (r.ok) ok++; else bad++; } });
    return { n: n, ok: ok, bad: bad };
  }
  function cellClass(q) {
    var r = st.ans[q.id];
    if (!r) return '';
    if (!r.ok) return ' bad';
    return st.hist[q.id] > 0 ? ' fixed' : ' ok';
  }

  var $ = function (id) { return document.getElementById(id); };
  function h(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escT(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- 畫面 ----------
  function renderStats() {
    var s = stats();
    $('sAns').textContent = s.n;
    $('sTot').textContent = QS.length;
    $('sOk').textContent = s.ok;
    $('sBad').textContent = s.bad;
    $('sAcc').textContent = s.n ? Math.round(s.ok / s.n * 1000) / 10 + '%' : '–';
    $('pbar').style.width = (QS.length ? s.n / QS.length * 100 : 0) + '%';
  }

  function renderToolbar() {
    $('fAll').setAttribute('aria-pressed', st.mode === 'all' ? 'true' : 'false');
    $('fWrong').setAttribute('aria-pressed', st.mode === 'wrong' ? 'true' : 'false');
    $('fEver').setAttribute('aria-pressed', st.mode === 'ever' ? 'true' : 'false');
    var w = stats().bad;
    var b = $('bRedo');
    b.textContent = '重做錯題' + (w ? '（' + w + '）' : '');
    b.disabled = !w;
  }

  function renderBanner() {
    var box = $('banner');
    box.innerHTML = '';
    if (st.mode !== 'redo') return;
    var total = st.redo.length, done = 0, ok = 0;
    st.redo.forEach(function (id) { var r = st.ans[id]; if (r) { done++; if (r.ok) ok++; } });
    var bad = done - ok;
    var bn = h('div', 'banner');
    bn.appendChild(h('span', null, '錯題重做：已作答 <b>' + done + '</b> / <b>' + total + '</b>，訂正 <b>' + ok + '</b> 題' + (bad ? '，仍答錯 <b>' + bad + '</b> 題' : '')));
    if (done === total) {
      bn.appendChild(h('span', null, bad ? '— 這一輪做完了。' : '— 全部訂正！🎉'));
      if (bad) {
        var again = h('button', 'tbtn redo', '再重做仍答錯的 ' + bad + ' 題');
        again.id = 'bRedoAgain';
        again.addEventListener('click', startRedo);
        bn.appendChild(again);
      }
    }
    var exit = h('button', 'tbtn', '結束重做');
    exit.id = 'bRedoExit';
    exit.addEventListener('click', function () { setMode('all'); });
    bn.appendChild(exit);
    box.appendChild(bn);
  }

  function renderGrid() {
    var g = $('grid');
    $('bGrid').setAttribute('aria-pressed', st.grid ? 'true' : 'false');
    g.hidden = !st.grid;
    if (!st.grid) return;
    g.innerHTML = '';
    var label = { all: '', wrong: '（目前只顯示答錯的題目）', ever: '（目前只顯示曾經答錯的題目）', redo: '（目前只顯示這一輪要重做的題目）' }[st.mode];
    g.appendChild(h('div', 'legend',
      '<span><i style="background:var(--cell)"></i>未作答</span>' +
      '<span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>答對</span>' +
      '<span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>答錯</span>' +
      '<span><i style="background:var(--fix-soft);border:1px solid var(--fix)"></i>重做後答對</span>' +
      (label ? '<span>' + label + '</span>' : '')));
    var L = list();
    if (!L.length) { g.appendChild(h('div', 'empty', emptyText())); return; }
    var wrap = h('div', 'cells');
    L.forEach(function (i) {
      var q = QS[i];
      var b = h('button', 'cell' + cellClass(q) + (q.id === st.cur ? ' cur' : ''), String(i + 1));
      b.title = '第 ' + (i + 1) + ' 題';
      b.addEventListener('click', function () { go(q.id); });
      wrap.appendChild(b);
    });
    g.appendChild(wrap);
  }

  function emptyText() {
    return { wrong: '目前沒有答錯的題目。', ever: '還沒有答錯過的題目。', redo: '沒有要重做的題目。', all: '沒有題目。' }[st.mode];
  }

  function renderCard() {
    var card = $('card');
    card.innerHTML = '';
    var L = list();
    if (!L.length) {
      card.appendChild(h('div', 'empty', emptyText() + (st.mode !== 'all' ? ' 按「全部」可回到全部題目。' : '')));
      $('pos').textContent = '';
      $('bPrev').disabled = $('bNext').disabled = true;
      return;
    }
    var idx = byId[st.cur];
    if (L.indexOf(idx) < 0) { idx = L[0]; st.cur = QS[idx].id; }
    var q = QS[idx], rec = st.ans[q.id], locked = !!rec;
    var p = L.indexOf(idx);
    var prefix = { all: '', wrong: '錯題 ', ever: '曾錯 ', redo: '重做 ' }[st.mode];
    $('pos').textContent = st.mode === 'all' ? (idx + 1) + ' / ' + QS.length : prefix + (p + 1) + ' / ' + L.length;
    $('bPrev').disabled = p <= 0;
    $('bNext').disabled = p >= L.length - 1;

    var head = h('div', 'qhead');
    head.appendChild(h('span', 'qno', '第 ' + (idx + 1) + ' 題'));
    head.appendChild(h('span', 'badge', TYPE[q.type]));
    if (!locked && st.hist[q.id] > 0) head.appendChild(h('span', 'badge again', '重做'));
    head.appendChild(h('span', 'of', '共 ' + QS.length + ' 題'));
    card.appendChild(head);
    card.appendChild(h('div', 'stem', q.q));

    var resp = locked ? rec.r : draft[q.id];
    var body;
    if (q.type === 'fill') {
      body = h('div', 'fillrow');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'fill'; inp.id = 'fillIn';
      inp.placeholder = '輸入答案'; inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.setAttribute('autocapitalize', 'off');
      inp.value = resp || '';
      if (locked) { inp.disabled = true; inp.classList.add(rec.ok ? 'okv' : 'badv'); }
      inp.addEventListener('input', function () { draft[q.id] = inp.value; updateSubmit(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!st.ans[q.id]) submit(); else next(); }
      });
      body.appendChild(inp);
    } else {
      body = h('div', 'opts' + (locked ? ' locked' : ''));
      var multi = q.type === 'multi';
      q.opts.forEach(function (o, i) {
        var lab = h('label', 'opt');
        var inp = document.createElement('input');
        inp.type = multi ? 'checkbox' : 'radio';
        inp.name = 'opt'; inp.value = i;
        var chosen = multi ? (resp || []).indexOf(i) >= 0 : resp === i;
        inp.checked = chosen;
        if (chosen && !locked) lab.classList.add('sel');
        var isAns = multi ? q.ans.indexOf(i) >= 0 : q.ans === i;
        if (locked) {
          inp.disabled = true;
          if (isAns) lab.classList.add('is-correct');
          else if (chosen) lab.classList.add('is-wrong');
        }
        lab.appendChild(inp);
        lab.appendChild(h('span', 'ol', '(' + LET[i] + ')'));
        lab.appendChild(h('span', 'ot', o));
        if (locked) {
          if (isAns) lab.appendChild(h('span', 'mark', '✓'));
