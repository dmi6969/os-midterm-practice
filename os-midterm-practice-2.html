<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS 期中練習 · 第二回</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #677084; --border: #dde2ea;
  --accent: #2b67d6; --accent-soft: #e7effc; --ok: #17804a; --ok-soft: #e3f4ea;
  --bad: #c42c2c; --bad-soft: #fbe9e9; --fix: #b26a00; --fix-soft: #fdf1dc;
  --code-bg: #f0f2f5; --cell: #eceff3; --shadow: 0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161b; --card: #1c2027; --text: #e5e8ed; --muted: #98a1b0; --border: #2e343e;
    --accent: #6c9eff; --accent-soft: #1d2a42; --ok: #4fc487; --ok-soft: #163325;
    --bad: #ff7373; --bad-soft: #3a1c1c; --fix: #f0b048; --fix-soft: #3a2c12;
    --code-bg: #252a32; --cell: #262b33; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* header */
header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 10px 0 8px; flex-wrap: wrap; }
.title { font-weight: 700; font-size: 17px; margin-right: auto; }
.stats { display: flex; gap: 14px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--cell); }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; align-items: center; }
.tbtn {
  border: 1px solid var(--border); background: var(--card); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; min-height: 36px; text-decoration: none; color: var(--text);
  display: inline-flex; align-items: center;
}
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tbtn:disabled { opacity: .45; cursor: not-allowed; }
.tbtn.danger { color: var(--bad); }
.tbtn.redo { color: var(--fix); border-color: var(--fix); font-weight: 600; }
.seg { display: inline-flex; }
.seg .tbtn { border-radius: 0; margin-left: -1px; }
.seg .tbtn:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg .tbtn:last-child { border-radius: 0 8px 8px 0; }
.seg .tbtn[aria-pressed="true"] { position: relative; z-index: 1; }
.spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); width: 100%; }

/* redo banner */
.banner {
  border: 1px solid var(--fix); background: var(--fix-soft); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.banner b { font-variant-numeric: tabular-nums; }
.banner .tbtn { min-height: 32px; padding: 4px 10px; }

/* grid */
#grid { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
#grid .legend { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
#grid .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.cell {
  border: 1px solid transparent; background: var(--cell); border-radius: 6px; height: 34px;
  font-size: 13px; font-variant-numeric: tabular-nums; padding: 0;
}
.cell.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.cell.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.cell.fixed { background: var(--fix-soft); color: var(--fix); border-color: var(--fix); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.qno { font-weight: 700; font-size: 18px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge.again { background: var(--fix-soft); color: var(--fix); }
.qhead .of { color: var(--muted); font-size: 14px; margin-left: auto; }
.stem { overflow-wrap: anywhere; }
.stem p { margin: 0 0 10px; }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 10px 0; font-size: 14px; line-height: 1.5;
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .92em; }
:not(pre) > code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; white-space: nowrap; }
th { background: var(--code-bg); }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; cursor: pointer; background: var(--card); transition: border-color .1s, background .1s;
}
.opt:hover { border-color: var(--accent); }
.opt input { margin: 5px 0 0; flex: none; width: 17px; height: 17px; accent-color: var(--accent); }
.opt .ol { font-weight: 600; color: var(--muted); flex: none; min-width: 1.6em; }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .ot pre { margin: 4px 0; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.locked .opt { cursor: default; }
.locked .opt:hover { border-color: var(--border); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .mark { flex: none; font-weight: 700; }
.opt.is-correct .mark { color: var(--ok); }
.opt.is-wrong .mark { color: var(--bad); }

.fillrow { margin: 14px 0 4px; }
.fill {
  width: 100%; max-width: 420px; font: inherit; padding: 9px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
}
.fill:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fill.okv { border-color: var(--ok); background: var(--ok-soft); }
.fill.badv { border-color: var(--bad); background: var(--bad-soft); }

.actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.primary {
  background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 9px 22px; font-weight: 600; min-height: 42px;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 13px; color: var(--muted); }

.result { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
.vrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.verdict { font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.note { font-size: 13px; color: var(--fix); font-weight: 600; }
.kv { margin: 4px 0; overflow-wrap: anywhere; }
.kv .k { color: var(--muted); }
.meta { display: inline-flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--border); }
.tag.wk { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.exp { background: var(--code-bg); border-radius: 9px; padding: 10px 14px; overflow-wrap: anywhere; }
.exp p { margin: 0 0 8px; }
.exp p:last-child { margin-bottom: 0; }
.exp pre { background: var(--card); }

/* bottom nav */
.nav { display: flex; gap: 10px; justify-content: space-between; margin: 14px 0 28px; }
.nav button {
  flex: 1; max-width: 220px; border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 10px; min-height: 44px; font-weight: 600;
}
.nav button:disabled { opacity: .4; cursor: not-allowed; }
.nav .pos { align-self: center; color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 560px) {
  body { font-size: 15.5px; }
  .card { padding: 14px 13px; border-radius: 10px; }
  pre { font-size: 12.5px; padding: 8px 10px; }
  .hint { display: none; }
  .stats { gap: 10px; font-size: 13px; }
  .title { font-size: 16px; }
  .tbtn { padding: 6px 10px; }
  .nav { position: sticky; bottom: 0; background: var(--bg); margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .nav button { max-width: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="title">OS 期中練習 · 第二回</div>
      <div class="stats">
        <span>已作答 <b id="sAns">0</b> / <b id="sTot">0</b></span>
        <span>答對 <b id="sOk">0</b></span>
        <span>正確率 <b id="sAcc">–</b></span>
        <span>錯題 <b id="sBad">0</b></span>
      </div>
    </div>

  <div class="bar"><div id="pbar"></div></div>
</header>

<main class="wrap">
  <div class="toolbar">

      <button class="tbtn" id="fAll" aria-pressed="true">全部</button>

  </div>
  <div id="banner"></div>

</main>

<script id="qdata" type="application/json">[{"id":"s2-w6-25","week":"W6","topic":"I/O 完成時能不能馬上搶占","src":"新題（依講義 W6 Part 3）","group":"s2-W6-preempt","type":"single","q":"\u003cp>An editor was waiting for a key; the key arrives and the editor becomes ready (waiting → ready) while a compiler is running. Under which kind of scheduler may the kernel switch to the editor right away, before the compiler gives up the CPU?\u003c/p>","opts":["Only under a preemptive scheduler","Only under a cooperative scheduler","Under both kinds","Under neither; the editor always waits for the compiler to finish"],"ans":0,"exp":"\u003cp>四個 scheduling point 裡，「I/O 完成、有人醒來」（③）和「timer tick」（②）只有 preemptive 的 scheduler 能做決定。cooperative 只在正在跑的 process 自己 block（①）或結束（④）時才換人，所以 editor 必須等 compiler 自己交出 CPU。\u003c/p>"},{"id":"s2-w2-16","week":"W2","topic":"兩個 process 各自 open 同一個檔","src":"新題（依講義 W2 Part 4 Walkthrough 1）","group":"s2-W2-fd","type":"single","q":"\u003cp>Two unrelated processes each call \u003ccode>open(\"/data/fish\", O_RDONLY)\u003c/code> once. How many file-descriptor table entries, open-file table entries and inodes are involved in total?\u003c/p>","opts":["2 fd entries, 1 open-file entry, 1 inode","2 fd entries, 2 open-file entries, 1 inode","2 fd entries, 2 open-file entries, 2 inodes","1 fd entry, 1 open-file entry, 1 inode"],"ans":1,"exp":"\u003cp>每個 process 有自己的 fd table → 2 個 fd entry。每次 open() 都建立一個新的 open-file entry → 2 個（所以 offset 各自獨立）。同一個檔案只有一個 inode → 1 個。只有 fork 或 dup 才會讓兩個 fd 指向同一個 open-file entry。\u003c/p>"},{"id":"s2-w3-34","week":"W3","topic":"為什麼 library 的 code 可以共用","src":"新題（依講義 W3 Part 7）","group":"s2-W3-link","type":"single","q":"\u003cp>One copy of libc's code in DRAM can be shared by hundreds of processes. Why can its code be shared this way?\u003c/p>","opts":["libc runs in kernel mode","Every process runs the same program","The kernel copies libc into each process at exec time","Library code is read-only, so many page tables can point to the same physical frames"],"ans":3,"exp":"\u003cp>共享靠的是 page table：很多 process 的 page table 項目指向同一個實體 frame。library 的 code 是\u003cb>唯讀\u003c/b>的，沒有人會改它，所以一份就夠。會被寫入的資料（例如 library 的全域變數）則是每個 process 各自一份（寫的時候 copy-on-write）。講義的測量：共享省下 1.34 GB。\u003c/p>"},{"id":"s2-w2-26","week":"W2","topic":"fork 的 copy-on-write","src":"新題（依講義 W2 Part 4 Walkthrough 2）","group":"s2-W2-vm","type":"fill","q":"\u003cp>A parent process has written to every page of a 1 GiB array, so all of it is resident. It then calls fork(). The child writes to 25% of the array's pages; the parent does not write to the array again. About how much \u003cb>extra\u003c/b> physical memory, in GiB, does the array use now, beyond the original 1 GiB?\u003c/p>","ans":["0.25","0.25 GiB","1/4"],"exp":"\u003cp>fork 之後 parent 和 child 共用所有頁（唯讀，copy-on-write）。只有被寫的頁才會複製一份：child 寫了 25% 的頁 → 多出 0.25 × 1 GiB = \u003cb>0.25 GiB\u003c/b>。沒被寫的 75% 仍然共用同一份 frame。這就是 fork 很便宜的原因。\u003c/p>","calc":{"fn":"cow","size":1,"frac":0.25}},{"id":"s2-w3-24","week":"W3","topic":"PATH 清空之後還能用什麼","src":"變化題（源自 W3-13）","group":"s2-W3-path","type":"multi","q":"\u003cp>In bash you run \u003ccode>PATH=\"\"\u003c/code>. Which of the following still work in that shell? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>cd /tmp\u003c/code>","\u003ccode>/bin/ls\u003c/code>","\u003ccode>echo hi\u003c/code>","\u003ccode>export X=1\u003c/code>","\u003ccode>ls\u003c/code>","\u003ccode>python3 --version\u003c/code>"],"ans":[0,1,2,3],"exp":"\u003cp>cd、echo、export 是 bash 的 \u003cb>built-in\u003c/b>，在 shell 自己的 process 裡執行，根本不需要找執行檔 ✓。\u003ccode>/bin/ls\u003c/code> 有斜線，直接當路徑執行，不搜尋 PATH ✓。只有沒有斜線的外部程式（ls、python3）要靠 PATH，現在找不到 → command not found。已實測。\u003c/p>","cprog":"bash PATH=\"\"","cexpect":"cd,abs,echo,export"},{"id":"s2-w4-29","week":"W4","topic":"為什麼需要 vDSO：算算成本","src":"新題（依講義 W4 Part 7）","group":"s2-W4-vdso","type":"fill","q":"\u003cp>A busy server calls \u003ccode>gettimeofday()\u003c/code> 2 million times per second. If every call were a real system call costing 300 ns, how many milliseconds of CPU time per second would these calls consume?\u003c/p>","ans":["600","600 ms"],"exp":"\u003cp>2 × 10⁶ × 300 ns = 6 × 10⁸ ns = 0.6 s = \u003cb>600 ms\u003c/b>，每秒有六成 CPU 時間花在讀時鐘的 trap 上。vDSO 把時間放在每個 process 都 map 了的唯讀頁，gettimeofday 變成普通函式呼叫，不 trap、不切 mode。\u003c/p>","calc":{"fn":"syscallCost","calls":2000000,"ns":300}},{"id":"s2-w3-35","week":"W3","topic":"Heartbleed：換掉 .so 之後還要做什麼","src":"變化題（源自 W3-18）","group":"s2-W3-link","type":"single","q":"\u003cp>Ubuntu ships a patched \u003ccode>libssl.so\u003c/code> for Heartbleed, and the admin installs it. What must still be done so that no running program uses the vulnerable code?\u003c/p>","opts":["Restart the dynamically linked services that were already running; statically linked programs need a rebuilt version from their vendors","Nothing; every program uses the new library immediately","Reboot only the statically linked programs","Recompile every dynamically linked program"],"ans":0,"exp":"\u003cp>動態連結的程式在啟動時才載入 .so：已經在跑的還留著舊版程式碼，必須重啟（之後啟動的會自動拿到新版，不用重新編譯）。靜態連結的程式把舊版 OpenSSL 帶在執行檔裡，換 .so 對它沒用，只能等廠商重新建置發布。\u003c/p>"},{"id":"s2-w3-09","week":"W3","topic":"fork 與 exec 之間做 redirection","src":"新題（依講義 W3 Part 2）","group":"s2-W3-exec","type":"fill","q":"\u003cpre>\u003ccode>if (fork() == 0) {\n    int fd = open(\"out.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0644);\n    dup2(fd, 1);\n    close(fd);\n    execlp(\"echo\", \"echo\", \"hello\", (char *)NULL);\n    exit(1);\n}\nwait(NULL);\nprintf(\"done\\n\");\u003c/code>\u003c/pre>\u003cp>The program is started from a terminal. What does out.txt contain afterwards? (Ignore the trailing newline.)\u003c/p>","ans":["hello"],"exp":"\u003cp>child 在 fork 之後、exec 之前把自己的 fd 1 改成 out.txt；exec 保留 fd table，所以 echo 照常寫 fd 1，就寫進了檔案，它自己完全不知道。parent 的 fd 1 沒動過，\"done\" 印在終端機上。out.txt 只有 \u003cb>hello\u003c/b>。這就是 shell 做 \u003ccode>echo hello &gt; out.txt\u003c/code> 的方式。已實測。\u003c/p>","cprog":"s2_w3 q9"},{"id":"s2-w5-01","week":"W5","topic":"先 dup 再關掉兩個標準 fd","src":"變化題（源自 W5-02）","group":"s2-W5-fd","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>int saved = dup(2);      // keep a copy of stderr\nclose(0);\nclose(2);\nint fd[2];\npipe(fd);\u003c/code>\u003c/pre>\u003cp>What are fd[0] and fd[1]? Type the two numbers separated by a space.\u003c/p>","ans":["0 2","0,2"],"exp":"\u003cp>dup(2) 拿最小可用的 3（saved = 3）。關掉 0 和 2 之後，可用的是 0、2、4…。pipe 拿兩個最小的 → fd[0] = \u003cb>0\u003c/b>、fd[1] = \u003cb>2\u003c/b>：這個 process 的 stdin 變成 read end、stderr 變成 write end，原本的 stderr 只剩 saved（3）還連著。已實測。\u003c/p>","cprog":"s2_w5 fd1"},{"id":"s2-w5-45","week":"W5","topic":"git 為什麼先 dup(1)","src":"新題（依講義 W5 Part 1 case study）","group":"s2-W5-git","type":"single","q":"\u003cpre>\u003ccode>old_fd1 = dup(1);\ndup2(pager_process.in, 1);\nclose(pager_process.in);\u003c/code>\u003c/pre>\u003cp>Before redirecting its own stdout into the pager's pipe, git calls \u003ccode>dup(1)\u003c/code> and keeps the result. Why?\u003c/p>","opts":["Because dup2 requires the old fd to be duplicated first","To keep a descriptor for the original stdout (the terminal), so that git can restore it later","To give less a copy of the terminal","To close the terminal"],"ans":1,"exp":"\u003cp>dup(1) 在最小的可用編號上做一份 fd 1 的複本，指向原本的終端機。接著 dup2 把 fd 1 改指 pipe 的 write end。之後 git 需要時，可以用保存下來的 old_fd1 把 stdout 換回終端機。這裡 parent 自己就是 producer，跟 01-pipeline.c（parent 只負責接線）不同。\u003c/p>"},{"id":"s2-w5-24","week":"W5","topic":"上一題的修法","src":"變化題（源自 W5-07）","group":"s2-W5-eof","type":"single","q":"\u003cp>The parent writes 1000 bytes into a pipe for its child, then calls \u003ccode>wait(NULL)\u003c/code>. The child reads until read() returns 0. The program hangs. What is the minimal fix?\u003c/p>","opts":["The parent calls close(fd[1]) after writing and before wait()","The child calls wait() instead of read()","Make the pipe bigger","The parent calls read() on the pipe before wait()"],"ans":0,"exp":"\u003cp>parent 寫完就關掉自己的 write end → write end 數量變 0 → child 讀完 1000 bytes 後下一次 read() 回傳 0、結束 → parent 的 wait 回來。跟資料量、pipe 大小無關。\u003c/p>"},{"id":"s2-w4-14","week":"W4","topic":"每行都有換行時","src":"新題（依講義 W4 Part 4）","group":"s2-W4-sc","type":"fill","q":"\u003cp>This time each printf ends with a newline, and the program again runs in a \u003cb>terminal\u003c/b> under strace. How many \u003ccode>write\u003c/code> system calls are made for these lines?\u003c/p>\u003cpre>\u003ccode>printf(\"a\\n\");\nprintf(\"b\\n\");\nprintf(\"c\\n\");\u003c/code>\u003c/pre>","ans":["3"],"exp":"\u003cp>line-buffered：每遇到一個換行就 flush 一次 → \u003cb>3\u003c/b> 次 write。如果改成導向檔案（\u003ccode>&gt; out.txt\u003c/code>，fully buffered），三行都留在 buffer，結束時才一次寫出 → 1 次。\u003c/p>"},{"id":"s2-w2-09","week":"W2","topic":"隔離層級：需要自己的 kernel","src":"變化題（源自 W2-04）","group":"s2-W2-iso","type":"single","q":"\u003cp>A course wants each student to have a machine on which the student can load their own kernel modules and even boot a different kernel version, without affecting other students. Which isolation level is needed?\u003c/p>","opts":["A separate process for each student","A container for each student","A virtual machine for each student","A separate user account for each student"],"ans":2,"exp":"\u003cp>process 和 container 都\u003cb>共用同一個 OS kernel\u003c/b>，所以不能換 kernel、也不能各自載 kernel module。只有 VM 裡面有自己完整的 OS（自己的 kernel），和別人只共用硬體（由 hypervisor 切分）。代價是最高的：每個 VM 都要多跑一整個 OS。\u003c/p>"},{"id":"s2-w5-44","week":"W5","topic":"git 只在終端機上開 pager","src":"新題（依講義 W5 Part 5 exercise 5）","group":"s2-W5-git","type":"single","q":"\u003cp>Why does \u003ccode>git log | grep fix\u003c/code> not start less, while \u003ccode>git log\u003c/code> alone does?\u003c/p>","opts":["less cannot read from a pipe","grep kills less automatically","git starts a pager only when its stdout is a terminal; with | its stdout is a pipe","The shell removes the pager option when it sees |"],"ans":2,"exp":"\u003cp>git 先檢查自己的 stdout 是不是終端機（isatty），是的話才 fork less、把自己的 stdout dup2 到 pipe。被 pipe 給 grep 時 stdout 已經不是終端機，git 就直接輸出。這也是講義要你用 strace -o 把 trace 寫到檔案的原因（不能用 pipe，否則 git 不開 pager）。\u003c/p>"},{"id":"s2-w6-16","week":"W6","topic":"Aging：要等多久","src":"新題（依講義 W6 Part 6）","group":"s2-W6-prio","type":"fill","q":"\u003cp>Job L becomes ready at t = 0 with priority 1 (bigger = more important). High-priority jobs with priority 6 keep arriving and would use the CPU forever; when priorities are equal, the high-priority jobs win. L gains +1 priority for every 4 ms it has waited. At what time t (ms) does L first run?\u003c/p>","ans":["24","24 ms"],"exp":"\u003cp>L 要比 6 大、也就是到 7 才贏得過：從 1 到 7 要升 6 級，每 4 ms 一級 → 6 × 4 = \u003cb>24\u003c/b> ms。沒有 aging 的話 L 永遠停在 1（starvation）；有 aging 就保證在有限時間內會跑（liveness）。\u003c/p>","calc":{"fn":"aging","start":1,"step":4,"high":6}},{"id":"s2-w2-42","week":"W2","topic":"PATH 的順序","src":"變化題（源自 W2-11）","group":"s2-W2-path","type":"fill","q":"\u003cp>PATH is \u003ccode>/home/niko/bin:/usr/bin:/bin\u003c/code>. Both \u003ccode>/home/niko/bin/python3\u003c/code> and \u003ccode>/usr/bin/python3\u003c/code> exist and are executable. When niko types \u003ccode>python3\u003c/code>, which file runs? Type its full path.\u003c/p>","ans":["/home/niko/bin/python3"],"exp":"\u003cp>shell 依 PATH 的順序一個一個目錄找，用\u003cb>第一個\u003c/b>找到的：/home/niko/bin 排最前面 → \u003cb>/home/niko/bin/python3\u003c/b>。\u003ccode>which python3\u003c/code> 做同樣的搜尋，會印出這個路徑。\u003c/p>"},{"id":"s2-w3-10","week":"W3","topic":"child 用 _exit 避免重複輸出","src":"變化題（源自 W3-21）","group":"s2-W3-buf","type":"fill","q":"\u003cp>The program is run as \u003ccode>./prog &gt; out.txt\u003c/code>. How many lines does out.txt contain?\u003c/p>\u003cpre>\u003ccode>printf(\"x\\n\");\nif (fork() == 0)\n    _exit(0);\nwait(NULL);\nreturn 0;\u003c/code>\u003c/pre>","ans":["1"],"exp":"\u003cp>fork 時 \"x\\n\" 在 buffer 裡，child 也有一份。但 child 呼叫的是 \u003ccode>_exit\u003c/code>：直接結束、\u003cb>不 flush\u003c/b> stdio buffer，那一份就丟了。parent return 時 flush 自己的那份 → 只有 \u003cb>1\u003c/b> 行。若 child 用 exit(0)，就會是 2 行。已實測。\u003c/p>","cprog":"s2_w3 q10"},{"id":"s2-w2-04","week":"W2","topic":"iPhone 為什麼跑好幾個 OS","src":"新題（依講義 W2 Part 3）","group":"s2-W2-goal","type":"multi","q":"\u003cp>An iPhone runs several small operating systems on separate chips (for example sepOS on the Secure Enclave and RTKit on the Always-On Processor) instead of letting iOS do everything. Which reasons are correct? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["If iOS is compromised, Face ID data and payment keys handled by the other chips can stay protected","The low-power processor can listen for \"Hey Siri\" while iOS sleeps, which saves battery","iOS is too slow to compare two face images","Apple has to license each OS separately, so splitting them is cheaper"],"ans":[0,1],"exp":"\u003cp>兩個理由：\u003cb>安全\u003c/b>——每個子系統在自己的小 OS 上，iOS 被駭也拿不到 Secure Enclave（Face ID）和 Secure Element（Apple Pay）的秘密；\u003cb>省電\u003c/b>——聽「Hey Siri」的處理器要一直醒著，用很小的 OS 就能讓 iOS 睡覺。跟 iOS 速度、授權費無關。\u003c/p>"},{"id":"s2-w3-33","week":"W3","topic":"缺的位址什麼時候填上","src":"新題（依講義 W3 Part 7）","group":"s2-W3-link","type":"single","q":"\u003cp>app1.c calls \u003ccode>meow()\u003c/code>, which lives in libmeow. When is the missing address of meow() filled in?\u003c/p>","opts":["Both: by the kernel during fork","Both: by the compiler when it translates app1.c","Static linking: by the linker at build time. Dynamic linking: by the dynamic loader at run time","Static linking: at run time. Dynamic linking: at build time"],"ans":2,"exp":"\u003cp>compiler 翻譯 app1.c 時不知道 meow() 在哪，留下一個空位。靜態連結：linker 在\u003cb>建置時\u003c/b>把 libmeow 的程式碼複製進來並填上位址。動態連結：linker 只寫一個 NEEDED libmeow.so 的註記，程式\u003cb>執行時\u003c/b>由 dynamic loader 找到 .so、map 進來再填位址。\u003c/p>"},{"id":"s2-w2-21","week":"W2","topic":"rm 之後磁碟還是滿的","src":"變化題（源自 W2-15）","group":"s2-W2-unlink","type":"single","q":"\u003cp>The disk is full, so an admin runs \u003ccode>rm /var/log/nginx/huge.log\u003c/code>. \u003ccode>df\u003c/code> still shows the disk as full, and \u003ccode>ls -l /proc/&lt;nginx PID&gt;/fd\u003c/code> shows \u003ccode>huge.log (deleted)\u003c/code>. Which action frees the space?\u003c/p>","opts":["Restart (or reload) nginx so that it closes its descriptor for the old log","Run sync so that the deletion reaches the disk","Run rm on the same path again","Wait a few minutes; the kernel frees deleted files in the background"],"ans":0,"exp":"\u003cp>名字刪掉了（link count = 0），但 nginx 還開著它 → inode 和資料區塊被保留。只有最後一個參照它的 open file 關掉時才會釋放：讓 nginx 關檔（重啟或重新開 log）。再 rm 一次會失敗（名字已經沒了）；sync 只是把 dirty page 寫回；kernel 也不會自己去回收還開著的檔案。\u003c/p>"},{"id":"s2-w5-26","week":"W5","topic":"兩條 pipe：換容量與 chunk","src":"變化題（源自 W5-06）","group":"s2-W5-cap","type":"multi","q":"\u003cp>parent ──(pipe A)──▶ child ──(pipe B)──▶ parent. Each pipe holds 32 KiB; the child loops: read up to 8 KiB from A, write those bytes into B, and exits when A reaches EOF. The parent does \u003ccode>write(A, data, n); close(A); read B until read() returns 0\u003c/code>. For which n does the program finish? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["n = 40 KiB","n = 70 KiB","n = 75 KiB","n = 100 KiB"],"ans":[0,1],"exp":"\u003cp>parent 開始讀 B 之前，系統最多能吸收：A 32 + B 32 + child 手上的 8 = \u003cb>72 KiB\u003c/b>。40、70 KiB ≤ 72 → 跑完；75、100 KiB 超過 → B 滿了 child 卡在 write(B)、A 滿了 parent 卡在 write(A)。\u003c/p>","calc":{"fn":"twoPipe","a":32,"b":32,"chunk":8,"opts":[40,70,75,100]}},{"id":"s2-w5-04","week":"W5","topic":"dup2 蓋掉已經開著的 newfd","src":"新題（依講義 W5 Part 1）","group":"s2-W5-dup","type":"single","q":"\u003cp>A child has fd 1 connected to the terminal (and fds 0 and 2 also on the terminal). It calls \u003ccode>dup2(fd[1], 1)\u003c/code>. What happens to the terminal?\u003c/p>","opts":["dup2 fails, because fd 1 is already open","The terminal is closed for every process on the machine","The kernel first closes this process's fd 1, so fd 1 no longer refers to the terminal; the terminal itself stays open through fds 0 and 2","fd 1 now refers to both the terminal and the pipe"],"ans":2,"exp":"\u003cp>dup2(oldfd, newfd)：如果 newfd 已經開著，kernel 先把它關掉，再讓它指向 oldfd 的物件。關掉的只是「這個 process 的 1 號」對終端機的那一個參照；終端機本身還被 0 號、2 號（和其他 process）用著。一個 fd 不會同時指向兩個東西。\u003c/p>"},{"id":"s2-w3-17","week":"W3","topic":"ls > out.txt：誰在什麼時候 open","src":"新題（依講義 W3 Part 2）","group":"s2-W3-exec","type":"single","q":"\u003cp>You type \u003ccode>ls &gt; out.txt\u003c/code> in bash. Which process opens out.txt, and when?\u003c/p>","opts":["bash's child opens it after fork and before exec, then makes it fd 1; ls never knows","bash itself opens it before forking, so every later command writes there","ls opens it, because the shell passes \"> out.txt\" to ls as arguments","The kernel opens it during execve"],"ans":0,"exp":"\u003cp>這就是 fork 和 exec 分成兩個呼叫的好處：fork 之後、exec 之前，child 還在跑 bash 的程式碼，可以先 open out.txt、dup2 成 fd 1、關掉多餘的 fd，再 exec ls。exec 保留 fd table，所以 ls 只是照常寫 fd 1。\u003ccode>&gt; out.txt\u003c/code> 不會出現在 ls 的 argv 裡。\u003c/p>"},{"id":"s2-w5-31","week":"W5","topic":"Ctrl-C 之後的 PIPESTATUS","src":"變化題（源自 W5-01）","group":"s2-W5-sig","type":"fill","q":"\u003cp>You run \u003ccode>sleep 1000 | cat\u003c/code> in the foreground and press Ctrl-C. Then you run \u003ccode>echo \"${PIPESTATUS[@]}\"\u003c/code>. What does it print? Type the two numbers separated by a space.\u003c/p>","ans":["130 130"],"exp":"\u003cp>Ctrl-C 讓終端機送 SIGINT 給\u003cb>整個前景 pipeline\u003c/b>：sleep 和 cat 都被 SIGINT 終止 → 兩個都是 128 + 2 = 130 → \u003cb>130 130\u003c/b>。對照：從別的終端機 kill -INT 只殺 sleep 時，cat 讀到 EOF 正常結束，會是 130 0。\u003c/p>"},{"id":"s2-w3-07","week":"W3","topic":"終端機上沒有換行的 printf 也會被複製","src":"變化題（源自 W3-21）","group":"s2-W3-buf","type":"fill","q":"\u003cp>The program is run in a \u003cb>terminal\u003c/b>. How many times does \u003ccode>hi\u003c/code> appear on the screen?\u003c/p>\u003cpre>\u003ccode>printf(\"hi\");\nfork();\nprintf(\"\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["2"],"exp":"\u003cp>終端機是 line-buffered，但 \"hi\" \u003cb>沒有換行\u003c/b>，所以 fork 時它還在 buffer 裡，被 child 複製一份。之後兩個 process 各自印 \"\\n\"、各自 flush → hi 出現 \u003cb>2\u003c/b> 次。「終端機就不會重複」只在 fork 前已經印出換行時才成立。已用 pty 實測。\u003c/p>","cprog":"s2_w3 q7"},{"id":"s2-w5-12","week":"W5","topic":"孫子 process 握著 write end","src":"新題（依講義 W5 Part 3 optional）","group":"s2-W5-eof","type":"single","q":"\u003cp>In a capture program, the child writes its output and exits quickly, and the parent closed its own write end correctly. But before writing, the child had started a grandchild that runs \u003ccode>sleep 100\u003c/code> without closing the inherited write end. When does the parent's read() return 0?\u003c/p>","opts":["Immediately after the child exits","About 100 seconds later, when the grandchild exits and the last write end closes","Never, because sleep never closes files","Immediately, because sleep does not write anything"],"ans":1,"exp":"\u003cp>kernel 只看 write end 有沒有人握著，不知道誰會真的寫。孫子雖然不寫，但它繼承的 write end 還開著 → parent 讀完 child 的資料後 block，直到孫子結束（約 100 秒後）才拿到 EOF。講義：被繼承的 descriptor 是 pipeline 不結束最常見的原因；可以用 \u003ccode>ls -l /proc/*/fd | grep pipe:[&lt;inode&gt;]\u003c/code> 找出是誰。\u003c/p>"},{"id":"s2-w6-03","week":"W6","topic":"STCF 平均 turnaround","src":"新題（依講義 W6 Part 4）","group":"s2-W6-stcf","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with a 5 ms burst, B at t = 1 with 3 ms, C at t = 2 with 8 ms, D at t = 3 with 6 ms.\u003c/p>\u003cp>Under \u003cb>STCF\u003c/b> (preemptive), what is the average turnaround time, in ms? (Round to two decimal places.)\u003c/p>","ans":["10.5","10.50"],"exp":"\u003cp>t = 0：A 開始。t = 1：B（3）&lt; A 剩下的 4 → 搶占，B 1–4。t = 2、3：C（8）、D（6）都比 B 剩下的長，不搶占。t = 4：B 完成；剩 A（4）、C（8）、D（6）→ A 4–8；D 8–14；C 14–22。\u003c/p>\u003cp>turnaround：A 8、B 3、C 20、D 11 → 42 / 4 = \u003cb>10.5\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"stcf","jobs":[["A",0,5],["B",1,3],["C",2,8],["D",3,6]],"metric":"avgTurnaround"}},{"id":"s2-w3-21","week":"W3","topic":"script 裡的 export 改不到父 shell","src":"變化題（源自 W3-09）","group":"s2-W3-env","type":"single","q":"\u003cp>setkey.sh contains the single line \u003ccode>export API_KEY=xyz\u003c/code>. You run \u003ccode>./setkey.sh\u003c/code> and then \u003ccode>echo $API_KEY\u003c/code> in the same terminal. Nothing is printed. Why, and what works instead?\u003c/p>","opts":["export only works for root; run it with sudo","The script ran in a child process, whose environment disappears when it exits; source ./setkey.sh runs it inside the current shell instead","The variable name is too long","Environment variables are only visible after logging out and in again"],"ans":1,"exp":"\u003cp>./setkey.sh 會 fork 出一個新的 bash 來跑 script；export 改的是那個 child 自己的環境，child 結束就沒了，parent shell 完全不受影響（跟 cd 必須是 built-in 同一個道理）。\u003ccode>source ./setkey.sh\u003c/code>（或 \u003ccode>. ./setkey.sh\u003c/code>）讓目前這個 shell 自己執行這些指令。\u003c/p>"},{"id":"s2-w5-35","week":"W5","topic":"為什麼先 SIGTERM 再 SIGKILL","src":"新題（依講義 W5 Part 4）","group":"s2-W5-sig","type":"single","q":"\u003cp>Why do process managers such as timeout, docker stop and systemd send SIGTERM first and SIGKILL only later?\u003c/p>","opts":["SIGTERM is required before SIGKILL by the kernel","SIGKILL is slower to deliver than SIGTERM","SIGTERM can be caught, giving the program a chance to finish requests, save state and remove temporary files; SIGKILL is the last resort that cannot be caught","SIGKILL only works on processes that already received SIGTERM"],"ans":2,"exp":"\u003cp>寫得好的 server 會攔 SIGTERM：處理完手上的 request、存好狀態、在寬限期內自己結束。如果它不理（或卡住了），才用不能被攔的 SIGKILL 強制結束，代價是什麼都來不及收尾。\u003c/p>"},{"id":"s2-w5-13","week":"W5","topic":"用 /proc 找 pipe 的持有者","src":"新題（依講義 W5 Part 5）","group":"s2-W5-eof","type":"single","q":"\u003cp>A pipeline hangs. You find its pipe's inode number is 48213 and run \u003ccode>ls -l /proc/*/fd | grep 'pipe:\\[48213\\]'\u003c/code>. What are you looking for?\u003c/p>","opts":["The pipe's capacity","The bytes still stored in the pipe","Every process that still has a descriptor for that pipe, and whether each link is the read end (lr-x) or the write end (l-wx)","Which process created the pipe"],"ans":2,"exp":"\u003cp>/proc/PID/fd 底下每個 fd 一個連結，指向它參照的物件；同一條 pipe 在每個 process 裡都顯示同一個 \u003ccode>pipe:[inode]\u003c/code>。找出所有持有者，再看權限字母：還有 \u003ccode>l-wx\u003c/code> 的人就是讓讀者等不到 EOF 的那個。\u003c/p>"},{"id":"s2-w4-05","week":"W4","topic":"如果 user mode 能改 page table","src":"新題（依講義 W4 Part 2）","group":"s2-W4-mode","type":"single","q":"\u003cp>Suppose a user program could change its own page table. What could it do?\u003c/p>","opts":["Map any physical memory, including other processes' data and the kernel, into its own address space","Only rearrange its own heap and stack","Speed up its own page faults, which is harmless","Nothing, because page tables only matter in kernel mode"],"ans":0,"exp":"\u003cp>虛擬記憶體的隔離完全靠 page table：每個 process 只能碰到自己的 page table 映射到的 frame。能改 page table 就能把任何實體記憶體（別的 process、kernel）map 進來，隔離就沒了。所以改 page table 是特權操作。\u003c/p>"},{"id":"s2-w6-07","week":"W6","topic":"CPU utilization","src":"新題（依講義 W6 Part 2）","group":"s2-W6-metric","type":"fill","q":"\u003cp>Over a 50 ms window, the CPU is idle for 5 ms and spends 5 ms on context switches; the rest is useful work. What is the CPU utilization, in percent? Type just the number.\u003c/p>","ans":["80","80%"],"exp":"\u003cp>utilization = 有用的時間 ÷ 總時間 = (50 − 5 − 5) / 50 = \u003cb>80%\u003c/b>。閒置和切換都不算有用的工作。\u003c/p>","calc":{"fn":"util","total":50,"idle":5,"sw":5}},{"id":"s2-w4-34","week":"W4","topic":"Trap 指令不帶位址","src":"新題（依講義 W4 Part 4）","group":"s2-W4-sc","type":"single","q":"\u003cp>The trap instruction never takes a target address; the CPU always jumps to the one entry point the kernel set up at boot, and the program only passes a service number. Why?\u003c/p>","opts":["If the program could choose where to land, it could jump past the kernel's permission checks","Addresses do not fit in a register","The kernel has only one function","To make system calls faster than function calls"],"ans":0,"exp":"\u003cp>程式只能選「要什麼服務」（編號），不能選「跳到 kernel 的哪裡」。否則它可以直接跳到權限檢查之後的那一行，用 kernel mode 做任何事。這就是 system call 和 function call 的根本差別之一。\u003c/p>"},{"id":"s2-w4-18","week":"W4","topic":"errno：沒有權限","src":"新題（依講義 W4 Part 8）","group":"s2-W4-errno","type":"fill","q":"\u003cp>A normal user calls \u003ccode>open(\"/etc/shadow\", O_RDONLY)\u003c/code>; only root may read that file. open() returns −1. What is errno? Type the errno name.\u003c/p>","ans":["EACCES"],"exp":"\u003cp>權限不足 → \u003cb>EACCES\u003c/b>，perror 印出 Permission denied。其他常見的：ENOENT（No such file or directory）、EFAULT（傳了無效的指標給 kernel）、ENOMEM（記憶體不夠）。\u003c/p>"},{"id":"s2-w5-42","week":"W5","topic":"Ctrl-C 不影響背景工作","src":"新題（依講義 W5 Part 4）","group":"s2-W5-sig","type":"single","q":"\u003cp>You start \u003ccode>./backup &amp;\u003c/code> in the background, then run \u003ccode>sleep 100 | cat\u003c/code> in the foreground and press Ctrl-C. What happens to ./backup?\u003c/p>","opts":["Nothing; Ctrl-C sends SIGINT only to the processes in the foreground pipeline","It is terminated too, because Ctrl-C reaches every process started from this terminal","It receives SIGPIPE","It is paused until the foreground pipeline exits"],"ans":0,"exp":"\u003cp>終端機在 Ctrl-C 時把 SIGINT 送給「前景」pipeline 的每一個 process（sleep 和 cat），背景工作不在前景，不會收到。要停它得用 kill（例如 \u003ccode>kill %1\u003c/code>）。\u003c/p>"},{"id":"s2-w2-01","week":"W2","topic":"OS 擋得住的錯：權限與 sandbox","src":"新題（依講義 W2 Part 1）","group":"s2-W2-goal","type":"single","q":"\u003cp>In July 2025 an AI coding agent ran a command that dropped a company's production database. It ran with exactly the same permissions as the engineer who launched it. Which change would have prevented the damage most directly?\u003c/p>","opts":["Use a larger AI model that makes fewer mistakes","Give the agent root so that it can undo its own mistakes","Run the agent as a separate, less-privileged user inside a sandbox","Move the database to a faster disk"],"ans":2,"exp":"\u003cp>程式語言和模型都擋不住它，因為它擁有跟工程師一樣的權限。OS 能強制執行的是\u003cb>權限與隔離\u003c/b>：讓 agent 以另一個權限較低的使用者、在 sandbox 裡執行，它就碰不到 production database。這是講義說的四個 production 問題之一：security（只碰得到被允許的東西）。給它 root 只會更糟。\u003c/p>"},{"id":"s2-w4-21","week":"W4","topic":"哪些是 trap","src":"新題（依講義 W4 Part 5）","group":"s2-W4-exc","type":"multi","q":"\u003cp>Which of the following are \u003cb>traps\u003c/b>? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["\u003ccode>write(1, \"hi\", 2)\u003c/code> entering the kernel","The program reaches an int3 breakpoint that gdb inserted","The first write to a freshly allocated page","A timer tick","A key press","An integer division by zero"],"ans":[0,1],"exp":"\u003cp>trap = 程式\u003cb>故意\u003c/b>用一條指令進 kernel：system call、gdb 插入的 int3。做完後從下一個指令繼續。第一次寫新頁、除以 0 是 fault（意外）；timer、按鍵是 interrupt（外部）。\u003c/p>"},{"id":"s2-w3-36","week":"W3","topic":"Orphan 計數","src":"變化題（源自 W3-12）","group":"s2-W3-wait","type":"fill","q":"\u003cp>Process P forks C1, C2 and C3. C1 also forks a child G1. Then P exits immediately, while C1, C2, C3 and G1 keep sleeping. After P has exited, how many of these processes have PPID 1?\u003c/p>","ans":["3"],"exp":"\u003cp>parent 不見了的才是 orphan：C1、C2、C3 的 parent P 結束了 → 由 init 收養，PPID 變 1。G1 的 parent 是 C1，C1 還活著 → G1 的 PPID 仍是 C1。所以是 \u003cb>3\u003c/b> 個。已實測。\u003c/p>","cprog":"s2_w3 q36"},{"id":"s2-w3-29","week":"W3","topic":"Each program does one thing well","src":"新題（依講義 W3 Part 6）","group":"s2-W3-unix","type":"single","q":"\u003cpre>\u003ccode>for i in server{1..500}; do\n    echo -n \"$i: \"\n    ssh $i \"cat /sys/class/thermal/thermal_zone0/temp\"\ndone | sort -n -k2 | tail -n2\u003c/code>\u003c/pre>\u003cp>In this command, ssh, cat, sort and tail know nothing about each other, yet together they find the two hottest servers. Which principle does this show?\u003c/p>","opts":["Everything runs in kernel mode","Each program does one thing well, and programs work together through a common text-stream interface","Programs share memory through the page cache","The shell compiles the loop into one program"],"ans":1,"exp":"\u003cp>每個程式只做好一件事：ssh 遠端執行、cat 讀檔、sort 排序、tail 取最後幾行；它們唯一的共同介面是一串純文字。shell script 把小程式接起來，而不是自己實作每個功能。（溫度感測器能用 cat 讀，則是 everything is a file。）\u003c/p>"},{"id":"s2-w6-10","week":"W6","topic":"CFS：三個都調高 nice","src":"新題（依講義 W6 Part 7）","group":"s2-W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>Three CPU-bound jobs, all started by a normal user with \u003ccode>nice\u003c/code>, are the only runnable processes on a core: two run at nice 5 and one at nice 10. What percentage of the CPU does the nice-10 job get? (Round to one decimal place; type just the number.)\u003c/p>","ans":["14.1","14","14.1%","14%"],"exp":"\u003cp>總 weight = 335 + 335 + 110 = 780 → nice 10 拿 110 / 780 ≈ \u003cb>14.1%\u003c/b>，兩個 nice 5 各約 43%。三個都比預設 nice，但沒有 nice 0 的對手時，CPU 照樣全部分給它們——nice 只看\u003cb>相對\u003c/b>的 weight。\u003c/p>","calc":{"fn":"cfsShare","weights":[335,335,110],"which":2}},{"id":"s2-w3-41","week":"W3","topic":"fork 失敗時","src":"變化題（源自 W3-07）","group":"s2-W3-fork","type":"single","q":"\u003cp>A user has reached the per-user process limit, and a program calls \u003ccode>fork()\u003c/code>. Which statement is true?\u003c/p>","opts":["The child is created but cannot run until another process exits","fork() returns −1 in the child, and the child exits","fork() returns 0 in both processes","fork() returns −1 in the parent, and no child is created"],"ans":3,"exp":"\u003cp>fork 失敗時沒有 child，只有 parent 拿到 −1（errno 說明原因，例如 EAGAIN：超過 process 上限，或記憶體不夠）。所以呼叫 fork 的程式碼要處理三種情況：&gt; 0 是 parent、== 0 是 child、−1 是失敗。\u003c/p>"},{"id":"s2-w3-14","week":"W3","topic":"pstree：daemon 都掛在 systemd 下","src":"新題（依講義 W3 Part 4）","group":"s2-W3-daemon","type":"single","q":"\u003cp>In \u003ccode>pstree -p 1\u003c/code>, sshd, database servers and web servers appear directly under \u003ccode>systemd(1)\u003c/code>. Why?\u003c/p>","opts":["Every process on Linux is a direct child of PID 1","They were started by systemd (PID 1) as services, or they daemonized and were adopted by init","They are threads of systemd","pstree only shows processes owned by root"],"ans":1,"exp":"\u003cp>現代系統用 systemd service unit 啟動伺服器：systemd（PID 1）自己 fork + exec，處理 redirection、環境變數、當機重啟、log。傳統自己 double fork 的 daemon 也會被 init 收養。所以它們都直接掛在 PID 1 下面。你登入後開的 bash 則是一路從 sshd fork 下來的。\u003c/p>"},{"id":"s2-w5-06","week":"W5","topic":"往 read end 寫","src":"新題（依講義 W5 Part 1）","group":"s2-W5-dup","type":"single","q":"\u003cp>A program creates a pipe with \u003ccode>pipe(fd)\u003c/code> and then, by mistake, calls \u003ccode>write(fd[0], \"hi\", 2)\u003c/code>. What happens?\u003c/p>","opts":["write fails and returns −1 (EBADF), because fd[0] is the read end and is not open for writing","The bytes go into the pipe anyway","The bytes are written to the terminal","The program receives SIGPIPE"],"ans":0,"exp":"\u003cp>pipe 是單向的：fd[0] 只能讀、fd[1] 只能寫（記法：0 像 stdin、1 像 stdout）。對 read end 寫會失敗、回傳 −1。SIGPIPE 是「對 write end 寫、但已經沒有任何 read end」時才發生。已實測。\u003c/p>","cprog":"s2_w5 writeread","cexpect":"-1 EBADF"},{"id":"s2-w6-28","week":"W6","topic":"nice 數字越小越重要","src":"新題（依講義 W6 Part 6）","group":"s2-W6-nice","type":"single","q":"\u003cp>Which nice value gives a process the \u003cb>highest\u003c/b> scheduling priority on Linux?\u003c/p>","opts":["−20","0","+19","+20"],"ans":0,"exp":"\u003cp>nice 的範圍是 −20 到 +19，預設 0。數字越大越「nice」（越讓別人）→ 優先權越低；\u003cb>−20\u003c/b> 最不 nice、優先權最高。設成負值需要 root。\u003c/p>"},{"id":"s2-w3-16","week":"W3","topic":"exec 失敗之後","src":"變化題（源自 W3-21）","group":"s2-W3-exec","type":"single","q":"\u003cpre>\u003ccode>if (fork() == 0) {\n    execlp(\"nosuchcmd\", \"nosuchcmd\", (char *)NULL);\n    perror(\"exec\");\n    exit(127);\n}\nint st;\nwait(&amp;st);\u003c/code>\u003c/pre>\u003cp>No program named nosuchcmd exists in any PATH directory. What happens in the child?\u003c/p>","opts":["execlp runs the parent program again from the start","execlp never returns, so nothing is printed","The kernel kills the child with SIGSEGV","execlp returns −1, so the child prints \"exec: No such file or directory\" to stderr and exits with status 127"],"ans":3,"exp":"\u003cp>exec 只有\u003cb>成功\u003c/b>才不會回來。找不到程式 → execlp 回傳 −1、errno = ENOENT，於是接著執行下一行：perror 印出 \u003ccode>exec: No such file or directory\u003c/code>，然後 exit(127)（shell 對「找不到指令」也用 127）。已實測。\u003c/p>","cprog":"s2_w3 q16","cexpect":"exec: No such file or directory|127"},{"id":"s2-w2-24","week":"W2","topic":"RSS：跳著寫（stride 大於一頁）","src":"變化題（源自 W2-13）","group":"s2-W2-vm","type":"fill","q":"\u003cp>Page size is 4 KiB. \u003ccode>a = np.zeros(8192)\u003c/code> creates 8192 doubles (64 KiB = 16 pages; assume it starts at a page boundary). The script then runs:\u003c/p>\u003cpre>\u003ccode>a[::1024] = 1.0     # writes elements 0, 1024, 2048, ..., 7168\u003c/code>\u003c/pre>\u003cp>By how many KiB does RSS grow?\u003c/p>","ans":["32","32 KiB","32KiB"],"exp":"\u003cp>第 1024k 個元素在 byte 1024k × 8 = 8192k → 頁號 2k：寫到的是第 0、2、4、…、14 頁，共 8 頁 → 8 × 4 = \u003cb>32 KiB\u003c/b>。間隔（8 KiB）比一頁大，所以有一半的頁沒被碰到、仍指向 zero page。如果改成 \u003ccode>a[::256]\u003c/code>（間隔 2 KiB），每一頁都會被寫到 → 64 KiB。\u003c/p>","calc":{"fn":"pages","pageSize":4096,"offsets":[0,8192,16384,24576,32768,40960,49152,57344],"unit":"KiB"}},{"id":"s2-w4-01","week":"W4","topic":"Mode bit 什麼時候變 1","src":"變化題（源自 W4-05）","group":"s2-W4-mode","type":"single","q":"\u003cp>Which of these events sets the CPU's mode bit to 1 (kernel mode)?\u003c/p>","opts":["A timer interrupt","Calling a function in libc","Executing a ret instruction","Calling malloc() for a small block"],"ans":0,"exp":"\u003cp>mode bit 只有硬體能改：處理 \u003cb>trap 或 interrupt\u003c/b>（包括 timer、system call 的 trap 指令、fault）時設成 1，kernel 執行 return-from-trap 時改回 0。函式呼叫、ret、在 heap 裡配一小塊記憶體都只是 user mode 的普通指令。\u003c/p>"},{"id":"s2-w3-19","week":"W3","topic":"KEY=abc ./prog 只影響那一個指令","src":"變化題（源自 W3-09）","group":"s2-W3-env","type":"single","q":"\u003cp>In bash (where KEY was not set before), you run \u003ccode>KEY=abc ./prog\u003c/code> and then, after it finishes, \u003ccode>echo \"[$KEY]\"\u003c/code>. What does echo print?\u003c/p>","opts":["[abc]","[]","An error: KEY is not defined","[./prog]"],"ans":1,"exp":"\u003cp>\u003ccode>KEY=abc ./prog\u003c/code> 只把 KEY 放進\u003cb>那一個\u003c/b> child 的環境；bash 自己並沒有 KEY 這個變數，所以之後 echo 印出空的 \u003cb>[]\u003c/b>。（bash 對未設定的變數展開成空字串，不會報錯。）\u003c/p>"},{"id":"s2-w6-23","week":"W6","topic":"Interactive boost","src":"新題（依講義 W6 Part 6）","group":"s2-W6-prio","type":"single","q":"\u003cp>You are playing a CPU-hungry game and type a chat message. Why does the scheduler raise the priority of the chat window when you press a key?\u003c/p>","opts":["Because I/O-bound programs must always run before CPU-bound programs, forever","Because the chat program uses more CPU than the game","The keypress wakes the chat process, which needs only a tiny burst; running it immediately removes the visible lag while the game barely notices","To punish the game for using too much memory"],"ans":2,"exp":"\u003cp>每個按鍵只是一個很小的工作（顯示一個字，約半毫秒）。醒來的互動程式被提高優先權、立刻搶占遊戲，跑完又睡回去；遊戲幾乎感覺不到。要是照普通 RR，按鍵得等遊戲用完它剩下的 slice，就會覺得「累擱」。\u003c/p>"},{"id":"s2-w4-15","week":"W4","topic":"System call 的錯誤怎麼傳回來","src":"變化題（源自 W4-05）","group":"s2-W4-sc","type":"single","q":"\u003cp>A program calls \u003ccode>write(99, \"x\", 1)\u003c/code> although fd 99 is not open. The libc wrapper returns −1 and sets errno to EBADF. What value did the kernel leave in R1 (the result register) on return from the trap?\u003c/p>","opts":["0, meaning nothing was written","A negative error code (−EBADF), which the wrapper turned into −1 and errno","The number 99","Nothing; the kernel sets errno directly in user memory"],"ans":1,"exp":"\u003cp>講義的五步驟最後一步：return-from-trap 時結果放在 R1，負值代表錯誤。libc 的 wrapper 檢查 R1：負的就把它（取絕對值）存進 errno，並回傳 −1 給你的程式。所以程式要檢查 −1、再看 errno（或用 perror）。\u003c/p>"},{"id":"s2-w2-44","week":"W2","topic":"三種 abstraction","src":"新題（依講義 W2 Part 4）","group":"s2-W2-abs","type":"single","q":"\u003cp>The file system works with numbered 4 KB blocks and does not know whether they live on a hard disk or an SSD. Which OS abstraction is this?\u003c/p>","opts":["The file abstraction","The block abstraction","The virtual-memory abstraction","The process abstraction"],"ans":1,"exp":"\u003cp>講義的三種 abstraction：\u003cb>file\u003c/b>——open(\"movie.mp4\") 不知道資料在 SSD、USB 還是雲端；\u003cb>block\u003c/b>——檔案系統只看到編號的 4 KB block，不知道底下是 HDD 或 SSD；\u003cb>virtual memory\u003c/b>——程式看到私有、連續、看似無限的位址空間。每一層 indirection 都是一張表。\u003c/p>"},{"id":"s2-w3-12","week":"W3","topic":"Background job 為什麼不會一直是 zombie","src":"新題（依講義 W3 Part 4）","group":"s2-W3-wait","type":"single","q":"\u003cp>You start \u003ccode>./server &amp;\u003c/code> in bash. bash does not block in waitpid, so the prompt returns immediately. Why doesn't the server become a long-lived zombie when it later exits?\u003c/p>","opts":["Background jobs never become zombies","bash polls with ps every second","init reaps every background job","When the child exits, the kernel sends bash SIGCHLD, and bash calls waitpid in its signal handler"],"ans":3,"exp":"\u003cp>child 結束時 kernel 送 \u003cb>SIGCHLD\u003c/b> 給 parent（bash），bash 在 signal handler 裡呼叫 waitpid 收掉它，所以 zombie 只存在幾微秒。init 只收養 parent 已經不在的 orphan，bash 還活著。\u003c/p>"},{"id":"s2-w4-02","week":"W4","topic":"為什麼保護需要硬體","src":"新題（依講義 W4 Part 1）","group":"s2-W4-mode","type":"single","q":"\u003cp>Why can't the OS enforce protection purely in software, for example with a checker program that inspects every instruction before it runs?\u003c/p>","opts":["Software checkers are illegal in most countries","While the user program is running, the checker is not running, so it cannot intercept a privileged instruction before it executes; the CPU itself must refuse it based on a mode bit","Checking instructions would need more than 64 KB of memory","Because compilers already remove all privileged instructions"],"ans":1,"exp":"\u003cp>同一顆 CPU 一次只跑一段程式：user 程式在跑的時候，kernel（或任何檢查程式）根本沒有在執行，無法在那條指令執行前攔下它。所以要由\u003cb>硬體\u003c/b>根據 mode bit 限制特權指令和受保護的記憶體，違規時直接產生 exception 交給 kernel。\u003c/p>"},{"id":"s2-w5-27","week":"W5","topic":"Deadlock 的 process 狀態","src":"新題（依講義 W5 Part 5）","group":"s2-W5-cap","type":"single","q":"\u003cp>04-capture-broken hangs with a 1 MB output: the worker is blocked in write() on the full pipe and the parent is blocked in wait(). What does \u003ccode>ps -o pid,stat,cmd\u003c/code> show for the two processes, and how much CPU do they use?\u003c/p>","opts":["Both are in state R (running) and use 100% of a core each","Both are in state S (sleeping) and use no CPU","The worker is Z (zombie) and the parent is S","Both are T (stopped) until someone sends SIGCONT"],"ans":1,"exp":"\u003cp>block 在 system call 裡的 process 睡在 wait queue 上（狀態 S），完全不用 CPU，等 kernel 叫醒——所以 deadlock 不會有任何錯誤訊息，也不會讓機器變慢。worker 還沒 exit，所以不是 zombie。wchan 欄位會顯示它們卡在 kernel 的哪個函式（寫 pipe、等 child）。\u003c/p>"},{"id":"s2-w6-09","week":"W6","topic":"預測 burst：連續三次","src":"新題（依講義 W6 Part 4）","group":"s2-W6-pred","type":"fill","q":"\u003cp>Using \u003ccode>next guess = α × last burst + (1 − α) × previous guess\u003c/code> with α = ½ and an initial guess of 16 ms, a process has three CPU bursts of 8 ms each. What is the guess after the third burst, in ms?\u003c/p>","ans":["9","9 ms"],"exp":"\u003cp>16 → ½ × 8 + ½ × 16 = 12 → ½ × 8 + ½ × 12 = 10 → ½ × 8 + ½ × 10 = \u003cb>9\u003c/b> ms。每次把誤差減半，猜測值很快逼近實際的 8 ms。\u003c/p>","calc":{"fn":"predict","alpha":0.5,"guess":16,"bursts":[8,8,8]}},{"id":"s2-w4-09","week":"W4","topic":"TCB：anti-cheat 跑在 kernel mode","src":"新題（依講義 W4 Part 2）","group":"s2-W4-mode","type":"single","q":"\u003cp>Riot's Vanguard anti-cheat is installed as a kernel-mode driver so that it can detect cheats that also run in kernel mode. What is the cost of this design?\u003c/p>","opts":["The driver can read every process's memory, and a bug in it can crash the whole machine; it enlarges the trusted computing base","The game runs in kernel mode too and becomes faster","Nothing, because drivers are checked by the CPU","It only affects the game's own process"],"ans":0,"exp":"\u003cp>user mode 的程式只看得到 kernel 讓它看的東西，偵測不到 kernel mode 的外掛，所以 anti-cheat 也得進 kernel。代價：它有權讀所有 process 的記憶體，而且它的 bug 會拖垮整台電腦。kernel 裡的程式碼屬於 \u003cb>trusted computing base（TCB）\u003c/b>：TCB 越大，越多地方出錯就能毀掉整個系統，所以安全設計要盡量縮小 TCB。\u003c/p>"},{"id":"s2-w6-20","week":"W6","topic":"RR 的 response 有上限","src":"新題（依講義 W6 Part 5）","group":"s2-W6-rr","type":"single","q":"\u003cp>n jobs arrive together and none of them blocks. Which policy guarantees that every job starts within (n − 1) × q of arriving, where q is the time slice?\u003c/p>","opts":["Round robin","FIFO","SJF","STCF"],"ans":0,"exp":"\u003cp>RR 每個人最多跑一個 slice 就換下一個，所以排在最後的人最多等 n − 1 個 slice 就開始跑。FIFO、SJF、STCF 都可能讓某個工作等前面的工作整個跑完（長工作排前面、或短工作一直來）。代價是 RR 的 turnaround 比較差。\u003c/p>"},{"id":"s2-w3-01","week":"W3","topic":"fork 計數：child 再 fork","src":"變化題（源自 W3-14）","group":"s2-W3-count","type":"fill","q":"\u003cp>How many lines of \u003ccode>X\u003c/code> are printed? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>if (fork() == 0)\n    fork();\nprintf(\"X\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["3"],"exp":"\u003cp>原本的 process（P）fork 出 C；C 拿到 0，再 fork 出孫子 G；P 拿到正數，不進 if。共 P、C、G 三個 process，各印一次 → \u003cb>3\u003c/b>。已實測。\u003c/p>","cprog":"s2_w3 q1"},{"id":"s2-w5-21","week":"W5","topic":"迴圈條件寫成 != 0 遇上錯誤","src":"變化題（源自 W5-07）","group":"s2-W5-read","type":"single","q":"\u003cp>Because of an earlier bug, \u003ccode>fd\u003c/code> is −1. The program then runs:\u003c/p>\u003cpre>\u003ccode>char buf[1000];\nssize_t n;\nwhile ((n = read(fd, buf, sizeof buf)) != 0)\n    ;   // process n bytes\u003c/code>\u003c/pre>\u003cp>What happens?\u003c/p>","opts":["The program is killed by SIGPIPE","read() blocks forever, using no CPU","The loop ends immediately, because read() returns 0 on error","read() returns −1 every time, which is not 0, so the loop never ends and keeps a CPU core busy"],"ans":3,"exp":"\u003cp>錯誤時 read 立刻回傳 −1（errno = EBADF），−1 != 0 成立 → 迴圈不停，而且每次都是立刻回傳 → 吃滿一顆 CPU。正確寫法是 \u003ccode>&gt; 0\u003c/code>，然後在迴圈後檢查 \u003ccode>n == -1\u003c/code>。對照 W5-07 的 \u003ccode>&gt;= 0\u003c/code>：那是 EOF 時一直回傳 0 而停不下來。已實測（5 秒內 CPU 時間約 5 秒）。\u003c/p>","cprog":"s2_w5 spin","cexpect":"spin"},{"id":"s2-w4-03","week":"W4","topic":"如果 user mode 能關 interrupt","src":"新題（依講義 W4 Part 2）","group":"s2-W4-mode","type":"single","q":"\u003cp>Suppose a user-mode program were allowed to turn off interrupts. What could it then do?\u003c/p>","opts":["Nothing harmful; interrupts only matter for the keyboard","Read other processes' memory directly","Keep the CPU forever, because the timer interrupt could no longer give the kernel a chance to preempt it","Make its system calls faster, which is why it is allowed"],"ans":2,"exp":"\u003cp>kernel 拿回 CPU 的方法就是 timer interrupt。關掉 interrupt，kernel 就再也跑不到，排程器不能把它換下來——整台機器被一個程式霸佔，和 cooperative scheduling 裡的 \u003ccode>while (1);\u003c/code> 一樣。所以關 interrupt 是特權指令。\u003c/p>"},{"id":"s2-w3-43","week":"W3","topic":"waitpid 指定一個 child","src":"變化題（源自 W3-17）","group":"s2-W3-wait","type":"fill","q":"\u003cpre>\u003ccode>pid_t kid[3];\nfor (int i = 0; i &lt; 3; i++) {\n    kid[i] = fork();\n    if (kid[i] == 0) exit(0);      // each child exits immediately\n}\nsleep(1);\nwaitpid(kid[1], NULL, 0);\nsleep(30);\u003c/code>\u003c/pre>\u003cp>During the final \u003ccode>sleep(30)\u003c/code>, how many zombie children does the parent have?\u003c/p>","ans":["2"],"exp":"\u003cp>3 個 child 都已經 exit；waitpid(kid[1], …) 只收掉第二個 → 剩 kid[0] 和 kid[2] 兩個 zombie → \u003cb>2\u003c/b>。已實測。\u003c/p>","cprog":"s2_w3 q43"},{"id":"s2-w4-22","week":"W4","topic":"Page fault 什麼時候變 segfault","src":"變化題（源自 W4-04）","group":"s2-W4-exc","type":"single","q":"\u003cp>Page faults happen all the time in healthy programs. When does a page fault end with \"Segmentation fault\"?\u003c/p>","opts":["When the program has more than 1000 page faults","Whenever a program touches a page for the first time","When the page fault happens during a system call","When the faulting address is outside any valid region of the process, so the kernel cannot fix it"],"ans":3,"exp":"\u003cp>第一次碰到 malloc 的頁、寫 zero page、copy-on-write 都會 fault，但位址合法，kernel 配好 frame 後重試，程式毫無感覺。只有位址不屬於任何合法區域（例如 NULL、已經 unmap 的記憶體），kernel 修不好，才送 SIGSEGV（$? = 139）。\u003c/p>"},{"id":"s2-w3-25","week":"W3","topic":"script 裡的 cd","src":"變化題（源自 W3-03）","group":"s2-W3-path","type":"fill","q":"\u003cp>Your shell's current directory is \u003ccode>/home/nini\u003c/code>. goto.sh contains the single line \u003ccode>cd /tmp\u003c/code> and is executable. You run \u003ccode>./goto.sh\u003c/code> and then \u003ccode>pwd\u003c/code>. What does pwd print?\u003c/p>","ans":["/home/nini","/home/nini/"],"exp":"\u003cp>./goto.sh 在一個 child process（新的 bash）裡執行，cd 改的是那個 child 的 cwd，child 結束後就消失了 → 你的 shell 仍然在 \u003cb>/home/nini\u003c/b>。這正是 cd 不能是獨立程式、必須是 built-in 的原因。已實測（cwd 不變）。\u003c/p>","cprog":"bash goto.sh","cexpect":"unchanged"},{"id":"s2-w4-28","week":"W4","topic":"睡著的 process 怎麼被叫醒","src":"變化題（源自 W4-01）","group":"s2-W4-cs","type":"single","q":"\u003cp>Process A sleeps on a wait queue inside \u003ccode>read()\u003c/code> on the keyboard. What makes A ready again?\u003c/p>","opts":["A checks the keyboard again every millisecond","The keyboard interrupt handler stores the character and moves A from the wait queue to the ready state","The next timer tick always wakes every sleeping process","A wakes up after a fixed timeout of one second"],"ans":1,"exp":"\u003cp>睡著的 process 完全不用 CPU，也不會自己輪詢。按鍵產生 interrupt，kernel 的 handler 把字元存起來、把 A 標成 ready；之後 scheduler 選到 A，A 才從 read() 回來、拿到那個字元。\u003c/p>"},{"id":"s2-w2-35","week":"W2","topic":"Buffer 滿了才寫出","src":"變化題（源自 W2-22）","group":"s2-W2-printf","type":"fill","q":"\u003cp>The program is run as \u003ccode>./test &gt; out.txt\u003c/code>. The first line makes stdout fully buffered with a 4096-byte buffer.\u003c/p>\u003cpre>\u003ccode>setvbuf(stdout, NULL, _IOFBF, 4096);\nfor (int i = 0; i &lt; 5000; i++)\n    printf(\"x\");\n*(int *)0 = 1;      // crash\u003c/code>\u003c/pre>\u003cp>How many bytes does out.txt contain afterwards?\u003c/p>","ans":["4096"],"exp":"\u003cp>buffer 滿了（4096 個 x）時 libc 會呼叫 write() 把它送進 kernel；剩下的 5000 − 4096 = 904 個 x 還在 buffer 裡，crash 時消失 → 檔案 \u003cb>4096\u003c/b> bytes。buffer 滿是 flush 的三種時機之一（另外兩種是 fflush 和正常結束）。已實測。\u003c/p>","cprog":"s2_w2 full"},{"id":"s2-w2-15","week":"W2","topic":"inode 存什麼","src":"新題（依講義 W2 Part 4 Walkthrough 1）","group":"s2-W2-fd","type":"single","q":"\u003cp>Which structure stores a file's size, its permission bits, and where its data blocks are on disk?\u003c/p>","opts":["The file descriptor","The open-file table entry","The inode","The directory entry that holds the file name"],"ans":2,"exp":"\u003cp>\u003cb>inode\u003c/b> 是檔案本身：大小、權限、擁有者、link count、資料區塊的位置。目錄只存「名字 → inode 編號」；open-file entry 存 offset 和開啟模式；fd 只是 process 自己的編號。這就是為什麼刪掉名字（unlink）不會立刻刪掉 inode。\u003c/p>"},{"id":"s2-w4-33","week":"W4","topic":"glibc 為什麼不再快取 PID","src":"新題（依講義 W4 Part 7）","group":"s2-W4-vdso","type":"single","q":"\u003cp>In principle getpid() could avoid the trap, because the PID is public and never changes within a process. glibc once cached the PID in user space. Why did it stop?\u003c/p>","opts":["Caching the PID was a security hole that let other users read it","The cached value could become wrong after fork in some unusual cases, because the child has a new PID","getpid() became a slow system call","The kernel forbids user programs from storing their PID"],"ans":1,"exp":"\u003cp>fork 之後 child 有新的 PID，但記憶體是從 parent 複製來的——快取裡還是 parent 的 PID。某些特殊情況下快取沒有被正確更新，getpid() 就回傳錯的值，所以 glibc 放棄了。read() 則原則上就不可能用 vDSO（要碰裝置、可能要睡、依賴 fd table）。\u003c/p>"},{"id":"s2-w2-12","week":"W2","topic":"open 拿最小的可用 fd","src":"變化題（源自 W2-14）","group":"s2-W2-fd","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It opens a.txt, b.txt and c.txt, in that order, then closes b.txt, then closes a.txt, and then opens d.txt and e.txt, in that order. What fd number does e.txt get?\u003c/p>","ans":["4"],"exp":"\u003cp>a = 3、b = 4、c = 5。關掉 4 和 3 之後，可用的是 3、4、6…。open 永遠拿\u003cb>最小\u003c/b>的可用編號：d = 3、e = \u003cb>4\u003c/b>。（跟關閉的順序無關。）已實測。\u003c/p>","cprog":"s2_w2 fdnum"},{"id":"s2-w3-18","week":"W3","topic":"fork 和 exec 之間降低權限","src":"新題（依講義 W3 Part 2）","group":"s2-W3-exec","type":"single","q":"\u003cp>A server runs as root. For each client it forks, and the child switches to an unprivileged user before calling exec to run the handler program. Why switch users in the child between fork and exec?\u003c/p>","opts":["Because exec refuses to run programs as root","So that the handler program runs with only the privileges it needs, while the root parent keeps its own privileges","Because changing users is only allowed in a child process","To make the handler start faster"],"ans":1,"exp":"\u003cp>fork 之後、exec 之前，child 還在執行 server 自己的程式碼，可以先準備環境（redirection、降權限），再 exec 真正的程式。新程式從一開始就是低權限，就算有漏洞也拿不到 root；parent 不受影響，繼續以 root 服務下一個連線。\u003c/p>"},{"id":"s2-w6-12","week":"W6","topic":"CFS：跑完之後的 vruntime","src":"新題（依講義 W6 Part 7）","group":"s2-W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>A (nice 0) has vruntime 10 ms and B (nice 5) has vruntime 12 ms; they are the only runnable processes. CFS runs the process with the smaller vruntime for 4 ms; then it runs the other one for 1 ms. What is B's vruntime after that, in ms? (Round to two decimal places.)\u003c/p>","ans":["15.06","15.1"],"exp":"\u003cp>先跑 vruntime 小的 A：4 ms × 1024 / 1024 → A 變 14。現在 B（12）比較小 → B 跑 1 ms：1 × 1024 / 335 ≈ 3.06 → B 變 12 + 3.06 = \u003cb>15.06\u003c/b> ms。接下來 A（14）又比較小，換回 A。\u003c/p>","calc":{"fn":"cfsAfter","start":12,"run":1,"weight":335}},{"id":"s2-w2-14","week":"W2","topic":"Offset 存在哪一張表","src":"新題（依講義 W2 Part 4 Walkthrough 1）","group":"s2-W2-fd","type":"single","q":"\u003cp>Linux keeps three tables for files: each process's file-descriptor table, the system-wide open-file table, and the inodes. Where is a file's current read/write \u003cb>offset\u003c/b> kept?\u003c/p>","opts":["In the process's file-descriptor table","In the open-file table entry","In the file's inode","In the directory entry for the file name"],"ans":1,"exp":"\u003cp>offset 在 \u003cb>open-file table entry\u003c/b>。所以：同一個 entry 被多個 fd 指到（dup、fork）就會共用 offset；分別 open 會各有一個 entry、各自的 offset。fd table 只是「編號 → entry」的對照；inode 存的是檔案本身（大小、權限、資料位置），所有人共用。\u003c/p>"},{"id":"s2-w2-45","week":"W2","topic":"OS 替 production 程式把關的四件事","src":"新題（依講義 W2 Part 1）","group":"s2-W2-goal","type":"single","q":"\u003cp>The lecture lists four things a demo program often ignores and the OS can enforce for production software. Which of the following is \u003cb>not\u003c/b> one of them?\u003c/p>","opts":["Security: touching only what it is allowed to touch","Resource constraints: working when memory, CPU and disk are finite","A pleasant user-interface design","Coexistence: sharing the machine without corrupting other programs"],"ans":2,"exp":"\u003cp>四件事是 security（權限、特權）、resource constraints（虛擬記憶體、排程）、coexistence（隔離、公平分享）、scale（同一個 kernel 用不同設定跑在手錶到資料中心）。UI 好不好看不是 OS 能強制的。\u003c/p>"},{"id":"s2-w4-26","week":"W4","topic":"Mode switch 一定有、context switch 不一定","src":"新題（依講義 W4 Part 6）","group":"s2-W4-cs","type":"single","q":"\u003cp>Which statement about system calls is correct?\u003c/p>","opts":["Only slow system calls involve a mode switch","Every system call involves a context switch","System calls never involve a mode switch","Every system call involves a mode switch (user → kernel → user); a context switch happens only if the process blocks or the scheduler picks another process"],"ans":3,"exp":"\u003cp>system call 一定要 trap 進 kernel 再回來 → 一定有 mode switch。context switch 是「換另一個 process 上 CPU」：只在 process 要等待（slow system call 睡著）或 scheduler 決定換人時才發生。getpid() 只有 mode switch。\u003c/p>"},{"id":"s2-w5-37","week":"W5","topic":"timeout -s INT","src":"新題（依講義 W5 Part 5 exercise 7）","group":"s2-W5-timeout","type":"fill","q":"\u003cp>You run \u003ccode>timeout -s INT 2 sleep 10; echo $?\u003c/code>. sleep does not handle any signal. What number is printed?\u003c/p>","ans":["124"],"exp":"\u003cp>\u003ccode>-s INT\u003c/code> 只是把逾時送的 signal 換成 SIGINT；sleep 照樣被終止。因為是逾時造成的，而且送的不是 SIGKILL，timeout 回報 \u003cb>124\u003c/b>，讓呼叫者知道「逾時了」。只有用 \u003ccode>-s KILL\u003c/code>（或 -k 之後真的送出 SIGKILL）時才回報 137。已實測。\u003c/p>","cprog":"timeout -s INT 2 sleep 10"},{"id":"s2-w5-09","week":"W5","topic":"Shell 要關幾個 fd","src":"變化題（源自 W5-04）","group":"s2-W5-pipeline","type":"fill","q":"\u003cp>A shell runs the three-stage pipeline \u003ccode>a | b | c\u003c/code> the usual way: it creates pipe 1 (a → b) and pipe 2 (b → c), forks the three children, and each child uses dup2 and close before exec.\u003c/p>\u003cp>After forking all three children, how many file descriptors must the \u003cb>shell itself\u003c/b> close before it calls wait()?\u003c/p>","ans":["4"],"exp":"\u003cp>shell 自己開了兩條 pipe，每條兩端 → 共 \u003cb>4\u003c/b> 個 fd，全部都要關。只要 shell 還握著某條 pipe 的 write end，下游那一段就永遠等不到 EOF，shell 又卡在 wait 等它。\u003c/p>","calc":{"fn":"pipeline","stages":3,"what":"fds"}},{"id":"s2-w5-17","week":"W5","topic":"啟動方式把 stderr 接進協定通道","src":"變化題（源自 W5-03）","group":"s2-W5-err","type":"single","q":"\u003cp>A tool server correctly prints its debug messages with \u003ccode>fprintf(stderr, ...)\u003c/code> and only JSON replies to stdout. But the client still gets parse errors, because the launcher starts the server with \u003ccode>./server 2&gt;&amp;1\u003c/code> and connects the server's stdout to its pipe. What is wrong?\u003c/p>","opts":["JSON replies must be written to stderr","fprintf(stderr) is buffered, so the messages arrive late","2>&1 makes the server's fd 2 refer to the same pipe as fd 1, so the debug messages enter the protocol stream again","The client must read stderr instead of stdout"],"ans":2,"exp":"\u003cp>程式寫得對（除錯訊息走 fd 2），但啟動時的 \u003ccode>2&gt;&amp;1\u003c/code> 讓 fd 2 也指向 stdout 那條 pipe——效果跟在程式裡 dup2(1, 2) 一樣，除錯訊息又混進協定了。stdout 當協定通道時，fd 2 必須接到別的地方（終端機或 log 檔）。\u003c/p>"},{"id":"s2-w6-24","week":"W6","topic":"Slice 用完之後的狀態","src":"新題（依講義 W6 Part 3）","group":"s2-W6-preempt","type":"single","q":"\u003cp>A CPU-bound process is preempted because its time slice is used up. Which state does it move to?\u003c/p>","opts":["ready","waiting","terminated","new"],"ans":0,"exp":"\u003cp>slice 用完（timer tick）→ running → \u003cb>ready\u003c/b>：它隨時可以再跑，只是在 ready queue 裡等 CPU。waiting 是等 I/O 或事件（例如在 read() 裡睡覺），I/O 完成才會變回 ready。\u003c/p>"},{"id":"s2-w2-10","week":"W2","topic":"Process 層級的隔離（PTT）","src":"變化題（源自 W2-04）","group":"s2-W2-iso","type":"single","q":"\u003cp>PTT gives every logged-in user a process of their own on one Linux machine. What do these users' processes still share with each other?\u003c/p>","opts":["The operating system and the file system","Their private memory","Nothing at all","A hypervisor that splits the hardware"],"ans":0,"exp":"\u003cp>process 層級：每個人有自己的私有記憶體和公平的 CPU 時間，但\u003cb>共用 OS 和檔案系統\u003c/b>（靠 Linux 的權限機制隔開）。幾乎不花成本，所以一台機器能撐十幾萬人同時上線。container 只共用 OS；VM 只共用硬體。\u003c/p>"},{"id":"s2-w2-27","week":"W2","topic":"Overcommit 倍數","src":"變化題（源自 W2-20）","group":"s2-W2-vm","type":"fill","q":"\u003cp>A cloud-notebook server has 256 GB of DRAM. It promises each of its 2,000 users 8 GB of memory. By what factor is the memory oversubscribed?\u003c/p>","ans":["62.5","62.5x","62.5×"],"exp":"\u003cp>答應的總量 = 2000 × 8 = 16,000 GB；實際 256 GB → 16000 / 256 = \u003cb>62.5\u003c/b> 倍。能這樣做是因為大部分使用者閒置、程式要的記憶體大多沒被 touch、相同的頁可以共用。（講義的例子是 10,000 人 × 12 GB 對 0.5 TB，約 240 倍。）\u003c/p>","calc":{"fn":"ratio","a":16000,"b":256}},{"id":"s2-w5-07","week":"W5","topic":"Pipeline 要幾個 pipe","src":"變化題（源自 W5-04）","group":"s2-W5-pipeline","type":"fill","q":"\u003cp>How many times does the shell call \u003ccode>pipe()\u003c/code> to run the four-stage pipeline \u003ccode>a | b | c | d\u003c/code>?\u003c/p>","ans":["3"],"exp":"\u003cp>每一個 \u003ccode>|\u003c/code> 需要一條 pipe：4 段 → \u003cb>3\u003c/b> 條 pipe（a→b、b→c、c→d）。shell 還要 fork 4 個 child、最後 wait 4 次。\u003c/p>","calc":{"fn":"pipeline","stages":4,"what":"pipes"}},{"id":"s2-w2-41","week":"W2","topic":"目錄只有 r 沒有 x","src":"變化題（源自 W2-12）","group":"s2-W2-perm","type":"single","q":"\u003cp>For you, the directory \u003ccode>/srv/box\u003c/code> has permissions \u003ccode>r--\u003c/code> (read but no execute). The file \u003ccode>/srv/box/note.txt\u003c/code> itself is \u003ccode>rw-r--r--\u003c/code>. What happens?\u003c/p>","opts":["Neither works, because the directory has no x","Both ls and cat work, because note.txt is readable by everyone","\u003ccode>ls /srv/box\u003c/code> lists the names, but \u003ccode>cat /srv/box/note.txt\u003c/code> fails with Permission denied","cat works, but ls fails"],"ans":2,"exp":"\u003cp>目錄的 r = 可以讀目錄內容（列出名字）；目錄的 x = 可以「穿過」它、用名字去找裡面的 inode。沒有 x → 路徑解析到 /srv/box 就停住，打不開裡面的任何檔案，即使檔案本身大家都能讀。所以 ls 看得到名字、cat 失敗。\u003c/p>"},{"id":"s2-w3-38","week":"W3","topic":"kill -9 一個 zombie","src":"變化題（源自 W3-10）","group":"s2-W3-wait","type":"single","q":"\u003cp>\u003ccode>ps\u003c/code> shows a zombie (state Z). You run \u003ccode>kill -9 &lt;its PID&gt;\u003c/code>. What happens, and how can you get rid of the zombie?\u003c/p>","opts":["The kernel kills the zombie's parent instead","The zombie is removed immediately","The zombie restarts and exits normally","Nothing happens, because the process has already exited; the parent must wait() for it, or the parent must exit so that init adopts and reaps it"],"ans":3,"exp":"\u003cp>zombie 已經死了，沒有任何程式碼可以接收 signal，kill 對它沒有作用。它只是在等 parent 來 wait。解法：讓 parent 呼叫 wait，或結束 parent（講義 exercise：kill %1 殺掉 parent 後再 ps，zombie 就被 init 收掉了）。\u003c/p>"},{"id":"s2-w6-13","week":"W6","topic":"CFS：slice","src":"新題（依講義 W6 Part 7）","group":"s2-W6-cfs","type":"fill","q":"\u003cp>CFS weights: nice −5 → 3121, nice 0 → 1024, nice 5 → 335, nice 10 → 110. Δvruntime = Δruntime × 1024 / weight.\u003c/p>\u003cp>The scheduling latency is 6 ms, and three processes are runnable: two with nice 0 and one with nice 10. Using \u003ccode>slice = latency × weight / total weight\u003c/code>, how long is the nice-10 process's slice, in ms? (Round to two decimal places.)\u003c/p>","ans":["0.31","0.306"],"exp":"\u003cp>總 weight = 1024 + 1024 + 110 = 2158 → 6 × 110 / 2158 ≈ \u003cb>0.31\u003c/b> ms；兩個 nice 0 各約 2.85 ms。加起來就是 6 ms 的 scheduling latency。\u003c/p>","calc":{"fn":"cfsSlice","latency":6,"weights":[1024,1024,110],"which":2}},{"id":"s2-w2-07","week":"W2","topic":"Borg 的 overcommit 與 colocation","src":"新題（依講義 W2 Part 3 Machine sharing）","group":"s2-W2-qos","type":"multi","q":"\u003cp>Which statements about Google's cluster scheduler Borg (as described in the lecture) are true? \u003cb>(Select all that apply)\u003c/b>\u003c/p>","opts":["User-facing jobs are allocated about 70% of the CPU but use only about 60%","Borg lends the unused part of that allocation to batch jobs","When a machine nears its limit, Borg throttles or kills user-facing jobs first","Running both kinds of work on the same machines saves an estimated 20–30% of hardware","Batch jobs are never killed"],"ans":[0,1,3],"exp":"\u003cp>user-facing 工作分到約 70% CPU、實際只用約 60%（保留突發用量）。Borg 把沒用到的部分拿去跑 batch，比分開兩批機器省 20–30% 硬體。代價是：機器快滿時 Borg 會 throttle 或 kill \u003cb>batch\u003c/b>，從不動 user-facing——所以「先砍 user-facing」和「batch 從不被殺」都錯。\u003c/p>"},{"id":"s2-w6-17","week":"W6","topic":"STCF：四個工作","src":"新題（依講義 W6 Part 4）","group":"s2-W6-stcf","type":"fill","q":"\u003cp>Four jobs: A arrives at t = 0 with an 8 ms burst, B at t = 1 with 4 ms, C at t = 2 with 9 ms, D at t = 3 with 5 ms.\u003c/p>\u003cp>Under \u003cb>STCF\u003c/b>, what is the average turnaround time, in ms?\u003c/p>","ans":["13","13 ms"],"exp":"\u003cp>A 0–1；t = 1 B（4）&lt; A 剩 7 → B 1–5；t = 5 剩 A（7）、C（9）、D（5）→ D 5–10；A 10–17；C 17–26。turnaround：A 17、B 4、C 24、D 7 → 52 / 4 = \u003cb>13\u003c/b> ms。\u003c/p>","calc":{"fn":"sched","policy":"stcf","jobs":[["A",0,8],["B",1,4],["C",2,9],["D",3,5]],"metric":"avgTurnaround"}},{"id":"s2-w5-33","week":"W5","topic":"SIGKILL 不能攔","src":"新題（依講義 W5 Part 4）","group":"s2-W5-sig","type":"single","q":"\u003cp>A program calls \u003ccode>signal(SIGKILL, my_handler)\u003c/code> to try to clean up before being killed. Later someone runs \u003ccode>kill -9 &lt;PID&gt;\u003c/code>. What happens?\u003c/p>","opts":["The signal() call itself fails (SIGKILL cannot be caught), and kill -9 ends the process immediately without running any of its code","my_handler runs, and then the process exits","my_handler runs, and the process keeps running","kill -9 is ignored because a handler is installed"],"ans":0,"exp":"\u003cp>SIGKILL 不能被 catch 也不能被 ignore：signal() 會回傳 SIG_ERR（EINVAL），handler 根本沒裝上去。kernel 收到 SIGKILL 就直接結束 process，不執行它的任何程式碼——沒有機會存檔或刪暫存檔（「媽媽直接拔插頭」）。已實測。\u003c/p>","cprog":"s2_w5 killhandler","cexpect":"SIG_ERR killed 9"},{"id":"s2-w2-06","week":"W2","topic":"SLO 為什麼用百分位數","src":"新題（依講義 W2 Part 3 Machine sharing）","group":"s2-W2-qos","type":"single","q":"\u003cp>Why does a site reliability engineer write the objective as \"99% of requests are answered within 100 ms\" instead of \"the average latency is below 50 ms\"?\u003c/p>","opts":["Percentiles are cheaper to compute than averages","Batch jobs are measured with percentiles, so serving jobs must be too","Averages cannot be computed for latencies measured in milliseconds","An average can look fine while a slow tail of requests, which real users hit, is hidden; fan-out makes that tail even more common"],"ans":3,"exp":"\u003cp>平均值會掩蓋少數很慢的 request（corner case），但使用者感受到的正是那些慢的。一個網頁要等很多台 server，只要一台慢整頁就慢，所以要用百分位數（p99）直接管住尾端。\u003c/p>"},{"id":"s2-w2-43","week":"W2","topic":"VSZ 可以比 DRAM 大","src":"變化題（源自 W2-21）","group":"s2-W2-vm","type":"single","q":"\u003cp>On a laptop with 2 GiB of DRAM and no swap, \u003ccode>ps\u003c/code> shows a process with VSZ 3.2 GiB and RSS 0.4 GiB. Is that possible?\u003c/p>","opts":["Yes: VSZ counts the pages the process has mapped, and only the pages it has touched (RSS) need DRAM frames","No; VSZ can never exceed DRAM","Yes, but only because the extra 1.2 GiB is stored on the disk","Only if the process runs as root"],"ans":0,"exp":"\u003cp>VSZ = 所有 map 的頁（配置了就算），RSS = 現在真的有 DRAM frame 的頁。沒被 touch 的頁不佔記憶體，也不必放到磁碟上。只有 RSS 的總和必須塞得進 DRAM。\u003c/p>"},{"id":"s2-w6-29","week":"W6","topic":"CFS 的紅黑樹","src":"新題（依講義 W6 Part 7 optional）","group":"s2-W6-cfs","type":"single","q":"\u003cp>CFS keeps its run queue in a red-black tree sorted by vruntime, with a cached pointer to the leftmost node. What does this give?\u003c/p>","opts":["Picking the next process (smallest vruntime) is O(1), and putting a process back into the tree is O(log n)","Both picking and reinserting are O(n)","Picking is O(log n), and reinserting is O(1)","The tree lets CFS skip timer interrupts"],"ans":0,"exp":"\u003cp>scheduler 每秒要做幾千次決定，自己的程式碼也在消耗 CPU，所以必須很快。最左邊的節點就是 vruntime 最小的，有快取指標 → 挑選 O(1)；跑完更新 vruntime 後插回樹裡 → O(log n)（紅黑樹保持平衡）。\u003c/p>"},{"id":"s2-w2-31","week":"W2","topic":"fsync 做什麼","src":"新題（依講義 W2 Part 6）","group":"s2-W2-cache","type":"single","q":"\u003cp>What does a program get by calling \u003ccode>fsync(fd)\u003c/code> after its writes?\u003c/p>","opts":["It flushes the C library's stdout buffer","The kernel writes the file's dirty pages to the device right away, and fsync blocks until the device confirms","It removes the file from the page cache so that the next read is slower","It makes later writes skip the page cache"],"ans":1,"exp":"\u003cp>fsync 是 system call：要求 OS \u003cb>立刻\u003c/b>把這個檔案的 dirty pages 寫到裝置上，並且等裝置確認後才回來。這是「耐久性」要自己明確要求的原因。fflush 只負責 libc buffer → kernel，跟 fsync（kernel → 磁碟）是不同的兩層。\u003c/p>"},{"id":"s2-w2-34","week":"W2","topic":"終端機上的 printf 與 crash","src":"變化題（源自 W2-17）","group":"s2-W2-printf","type":"fill","q":"\u003cp>The program is run in a terminal (no redirection). Which words appear on the screen? Type them in order, separated by single spaces.\u003c/p>\u003cpre>\u003ccode>printf(\"one\\n\");\nprintf(\"two \");\nwrite(1, \"three\\n\", 6);\n*(int *)0 = 1;      // crash\u003c/code>\u003c/pre>","ans":["one three"],"exp":"\u003cp>終端機 → line-buffered：一遇到 \\n 就 flush。\"one\\n\" 立刻寫出；\"two \" 沒有換行，留在 buffer；write 直接寫出 three；crash 時 buffer 消失 → 畫面上是 \u003cb>one three\u003c/b>。如果導向檔案（fully buffered），one 也會一起消失，只剩 three。已用 pty 實測。\u003c/p>","cprog":"s2_w2 ttycrash"},{"id":"s2-w6-30","week":"W6","topic":"Kernel 怎麼知道 burst 多長","src":"新題（依講義 W6 Part 4）","group":"s2-W6-pred","type":"single","q":"\u003cp>SJF and STCF need each job's CPU burst before it runs. Where does the kernel get this number?\u003c/p>","opts":["The compiler stores the burst in the executable","Every program declares its burst when it calls exec","It does not know it; it predicts the next burst from the process's recent bursts, for example with an exponential average","The kernel runs each job once in advance to measure it"],"ans":2,"exp":"\u003cp>kernel 事先不知道，只能從過去猜：\u003ccode>next guess = α × last burst + (1 − α) × previous guess\u003c/code>，越近的 burst 權重越高。一直只有短 burst 的 process（例如互動程式）很快就會被猜成短的、優先被排。\u003c/p>"},{"id":"s2-w4-07","week":"W4","topic":"sleep 不用 CPU","src":"新題（依講義 W4 Part 2）","group":"s2-W4-time","type":"single","q":"\u003cp>\u003ccode>time sleep 1\u003c/code> reports \u003ccode>real 1.00s\u003c/code> but \u003ccode>user\u003c/code> and \u003ccode>sys\u003c/code> close to 0. Why?\u003c/p>","opts":["time cannot measure programs shorter than 2 seconds","sleep runs on a separate hidden CPU","The process sleeps on a wait queue for a second and uses no CPU; real is wall-clock time","The kernel charges sleeping time to the init process"],"ans":2,"exp":"\u003cp>real 是牆上時鐘的時間；user / sys 是真的在 CPU 上跑的時間。sleep 一開始就請 kernel 讓它睡一秒，睡覺的 process 不在 CPU 上，所以幾乎沒有 user 也沒有 sys。\u003c/p>"},{"id":"s2-w6-22","week":"W6","topic":"SJF / STCF 會餓死長工作","src":"新題（依講義 W6 Part 4）","group":"s2-W6-sjf","type":"single","q":"\u003cp>Under STCF, a 500 ms job is waiting, and new 2 ms jobs keep arriving every 2 ms forever. What happens to the long job?\u003c/p>","opts":["It runs after at most one time slice","It may never run (starvation), because there is always a shorter job to pick","It runs first, because it arrived first","STCF splits it into 2 ms pieces"],"ans":1,"exp":"\u003cp>STCF（和 SJF）永遠挑最短的；短工作源源不絕時，長工作就永遠輪不到——starvation。這是 short-first 的代價，也是 aging、RR、CFS 這類保證 liveness 的機制存在的原因。\u003c/p>"},{"id":"s2-w5-10","week":"W5","topic":"中間那一段忘了關","src":"變化題（源自 W5-10）","group":"s2-W5-pipeline","type":"single","q":"\u003cp>A shell runs the three-stage pipeline \u003ccode>a | b | c\u003c/code> the usual way: it creates pipe 1 (a → b) and pipe 2 (b → c), forks the three children, and each child uses dup2 and close before exec.\u003c/p>\u003cp>The child that becomes \u003ccode>b\u003c/code> forgot to close its copy of the \u003cb>write end of pipe 1\u003c/b> (the pipe it reads from). a finishes and exits. What happens?\u003c/p>","opts":["c sees EOF immediately and exits, but b keeps running","b sees EOF as soon as a exits","a receives SIGPIPE","b never sees EOF on its stdin, because it still holds a write end of that pipe itself; b never finishes, so c and the shell wait forever too"],"ans":3,"exp":"\u003cp>pipe 1 的 read() 只有在「沒有任何 write end」時才回傳 0。a 結束後，write end 只剩 b 自己手上那一個 → b 讀完資料後 block，在等自己。b 不結束 → pipe 2 的 write end 一直在 → c 也等不到 EOF → shell 卡在 wait。跟 W5-10 的 grep 同一個 bug，只是換到中間那一段。\u003c/p>"},{"id":"s2-w5-03","week":"W5","topic":"dup2 + close 之後的下一個 open","src":"變化題（源自 W5-02）","group":"s2-W5-fd","type":"fill","q":"\u003cp>A process starts with fds 0, 1 and 2 open. It runs:\u003c/p>\u003cpre>\u003ccode>int fd = open(\"log.txt\", O_WRONLY | O_CREAT, 0644);\ndup2(fd, 1);\nclose(fd);\nint g = open(\"other.txt\", O_RDONLY);\u003c/code>\u003c/pre>\u003cp>other.txt exists. What is the value of \u003ccode>g\u003c/code>?\u003c/p>","ans":["3"],"exp":"\u003cp>fd = 3。dup2(3, 1) 讓 1 號也指向 log.txt（1 原本指的終端機被關掉）。close(3) 只移除 3 這個編號，log.txt 仍被 1 號開著。下一個 open 拿最小可用的 → \u003cb>3\u003c/b>。已實測。\u003c/p>","cprog":"s2_w5 fd3"},{"id":"s2-w3-28","week":"W3","topic":"PowerShell vs Unix","src":"新題（依講義 W3 Part 6）","group":"s2-W3-unix","type":"single","q":"\u003cp>What is the key difference between PowerShell pipelines and Unix pipelines, according to the lecture?\u003c/p>","opts":["Unix pipelines run the commands one after another, PowerShell runs them in parallel","PowerShell cannot connect more than two commands","PowerShell passes structured .NET objects between commands; Unix passes unstructured plain text","Only PowerShell supports scripting"],"ans":2,"exp":"\u003cp>PowerShell 傳的是 .NET 物件（有結構的 API）；Unix 傳的是沒有結構的純文字。Peter Salus 的說法：text streams are a universal interface——任何語言寫的程式都能讀寫文字，所以 ssh、cat、sort、tail 彼此不用知道對方。\u003c/p>"},{"id":"s2-w3-02","week":"W3","topic":"fork 計數：parent 多 fork 一次","src":"變化題（源自 W3-14）","group":"s2-W3-count","type":"fill","q":"\u003cp>How many lines of \u003ccode>Y\u003c/code> are printed? Assume every fork succeeds and stdout is a terminal.\u003c/p>\u003cpre>\u003ccode>if (fork() &gt; 0)\n    fork();\nfork();\nprintf(\"Y\\n\");\nreturn 0;\u003c/code>\u003c/pre>","ans":["6"],"exp":"\u003cp>第一個 fork：P 和 C1。只有 P（拿到正數）再做 if 裡的 fork → 多一個 C2。現在 P、C1、C2 三個，每個都執行最後那個 fork() → 變成 6 個 process，各印一次 → \u003cb>6\u003c/b>。已實測。\u003c/p>","cprog":"s2_w3 q2"},{"id":"s2-w3-22","week":"W3","topic":"Docker 用 -e 傳密碼","src":"變化題（源自 W3-11）","group":"s2-W3-env","type":"single","q":"\u003cp>Why does the lecture pass a database password with \u003ccode>docker run -e POSTGRES_PASSWORD=... -d postgres\u003c/code> instead of writing it as an argument after the image name?\u003c/p>","opts":["Arguments after the image name become the long-running server's command line, which other users can see with ps for as long as the server runs","Docker refuses arguments that contain the word password","Environment variables are encrypted by the kernel","Arguments are limited to 8 characters"],"ans":0,"exp":"\u003cp>寫在 image 名稱後面的參數會變成 PostgreSQL 這個長期執行的 process 的命令列；server 跑多久，別的使用者就能用 ps / top 看多久。用 -e 傳的是環境變數，不會出現在命令列裡；docker run 這個 client 本身只存在很
