<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS 期中練習</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #677084; --border: #dde2ea;
  --accent: #2b67d6; --accent-soft: #e7effc; --ok: #17804a; --ok-soft: #e3f4ea;
  --bad: #c42c2c; --bad-soft: #fbe9e9; --code-bg: #f0f2f5; --cell: #eceff3; --shadow: 0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161b; --card: #1c2027; --text: #e5e8ed; --muted: #98a1b0; --border: #2e343e;
    --accent: #6c9eff; --accent-soft: #1d2a42; --ok: #4fc487; --ok-soft: #163325;
    --bad: #ff7373; --bad-soft: #3a1c1c; --code-bg: #252a32; --cell: #262b33; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* header */
header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 10px 0 8px; flex-wrap: wrap; }
.title { font-weight: 700; font-size: 17px; margin-right: auto; }
.stats { display: flex; gap: 14px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--cell); }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; align-items: center; }
.tbtn {
  border: 1px solid var(--border); background: var(--card); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; min-height: 36px;
}
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tbtn.danger { color: var(--bad); }
.hint { font-size: 13px; color: var(--muted); margin-left: auto; }

/* grid */
#grid { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
#grid .legend { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
#grid .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.cell {
  border: 1px solid transparent; background: var(--cell); border-radius: 6px; height: 34px;
  font-size: 13px; font-variant-numeric: tabular-nums; padding: 0;
}
.cell.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.cell.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.qno { font-weight: 700; font-size: 18px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.qhead .of { color: var(--muted); font-size: 14px; margin-left: auto; }
.stem { overflow-wrap: anywhere; }
.stem p { margin: 0 0 10px; }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 10px 0; font-size: 14px; line-height: 1.5;
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .92em; }
:not(pre) > code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; white-space: nowrap; }
th { background: var(--code-bg); }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; cursor: pointer; background: var(--card); transition: border-color .1s, background .1s;
}
.opt:hover { border-color: var(--accent); }
.opt input { margin: 5px 0 0; flex: none; width: 17px; height: 17px; accent-color: var(--accent); }
.opt .ol { font-weight: 600; color: var(--muted); flex: none; min-width: 1.6em; }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .ot pre { margin: 4px 0; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.locked .opt { cursor: default; }
.locked .opt:hover { border-color: var(--border); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .mark { flex: none; font-weight: 700; }
.opt.is-correct .mark { color: var(--ok); }
.opt.is-wrong .mark { color: var(--bad); }

.fillrow { margin: 14px 0 4px; }
.fill {
  width: 100%; max-width: 420px; font: inherit; padding: 9px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
}
.fill:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fill.okv { border-color: var(--ok); background: var(--ok-soft); }
.fill.badv { border-color: var(--bad); background: var(--bad-soft); }

.actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.primary {
  background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 9px 22px; font-weight: 600; min-height: 42px;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 13px; color: var(--muted); }

.result { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
.verdict { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.kv { margin: 4px 0; overflow-wrap: anywhere; }
.kv .k { color: var(--muted); }
.meta { display: inline-flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--border); }
.tag.wk { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.exp { background: var(--code-bg); border-radius: 9px; padding: 10px 14px; overflow-wrap: anywhere; }
.exp p { margin: 0 0 8px; }
.exp p:last-child { margin-bottom: 0; }
.exp pre { background: var(--card); }

/* bottom nav */
.nav { display: flex; gap: 10px; justify-content: space-between; margin: 14px 0 28px; }
.nav button {
  flex: 1; max-width: 220px; border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 10px; min-height: 44px; font-weight: 600;
}
.nav button:disabled { opacity: .4; cursor: not-allowed; }
.nav .pos { align-self: center; color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 560px) {
  body { font-size: 15.5px; }
  .card { padding: 14px 13px; border-radius: 10px; }
  pre { font-size: 12.5px; padding: 8px 10px; }
  .hint { display: none; }
  .stats { gap: 10px; font-size: 13px; }
  .title { font-size: 16px; }
  .nav { position: sticky; bottom: 0; background: var(--bg); margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .nav button { max-width: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="title">OS 期中練習</div>
      <div class="stats">
        <span>已作答 <b id="sAns">0</b> / <b id="sTot">0</b></span>
        <span>答對 <b id="sOk">0</b></span>
        <span>正確率 <b id="sAcc">–</b></span>
      </div>
    </div>
  </div>
  <div class="bar"><div id="pbar"></div></div>
</header>

<main class="wrap">
  <div class="toolbar">
    <button class="tbtn" id="bGrid" aria-pressed="false">題號</button>
    <button class="tbtn" id="bWrong" aria-pressed="false">只看答錯的題目</button>
    <button class="tbtn danger" id="bReset">全部重來</button>
    <span class="hint">← → 換題 · Enter 送出 / 下一題 · 1–6 選選項</span>
  </div>
  <div id="grid" hidden></div>
  <article class="card" id="card"></article>
  <div class="nav">
    <button id="bPrev">← 上一題</button>
    <span class="pos" id="pos"></span>
    <button id="bNext">下一題 →</button>
  </div>
</main>

<script id="qdata" type="application/json">/*__QDATA__*/</script>
<script>
(function () {
  'use strict';
  var QS = JSON.parse(document.getElementById('qdata').textContent);
  var KEY = 'os-midterm-practice-2026';
  var LET = 'abcdefghij';
  var TYPE = { single: '單選', multi: '多選', fill: '填充' };

  // ---------- 狀態（localStorage 讀寫都包 try/catch） ----------
  function fresh() { return { ans: {}, cur: QS.length ? QS[0].id : null, wrongOnly: false, grid: false }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object' && s.ans && typeof s.ans === 'object') return s;
    } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var st = load();
  var byId = {};
  QS.forEach(function (q, i) { byId[q.id] = i; });
  if (!(st.cur in byId)) st.cur = QS.length ? QS[0].id : null;
  // 題目改版後，丟掉對不上的舊紀錄（題目不存在、或作答型態和題型不符）
  Object.keys(st.ans).forEach(function (id) {
    var q = QS[byId[id]], r = st.ans[id] && st.ans[id].r;
    var fits = q && (q.type === 'fill' ? typeof r === 'string'
      : q.type === 'single' ? typeof r === 'number' && r < q.opts.length
      : Array.isArray(r) && r.every(function (i) { return i < q.opts.length; }));
    if (!fits) delete st.ans[id];
  });

  var draft = {};   // 尚未送出的選擇（不存檔）

  // ---------- 答案比對 ----------
  function norm(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/\s*,\s*/g, ',');
  }
  function asNum(s) {
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : null;
  }
  function fillCorrect(input, accepted) {
    var a = norm(input);
    if (!a) return false;
    var na = asNum(a);
    return accepted.some(function (x) {
      var b = norm(x);
      if (a === b) return true;
      var nb = asNum(b);
      return na !== null && nb !== null && Math.abs(na - nb) < 1e-9;
    });
  }
  function grade(q, resp) {
    if (q.type === 'fill') return fillCorrect(resp, q.ans);
    if (q.type === 'single') return resp === q.ans;
    var a = (resp || []).slice().sort(), b = q.ans.slice().sort();
    return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
  }

  // ---------- 清單與統計 ----------
  function wrongList() {
    var out = [];
    QS.forEach(function (q, i) { var r = st.ans[q.id]; if (r && !r.ok) out.push(i); });
    return out;
  }
  function list() { return st.wrongOnly ? wrongList() : QS.map(function (_, i) { return i; }); }
  function stats() {
    var n = 0, ok = 0;
    QS.forEach(function (q) { var r = st.ans[q.id]; if (r) { n++; if (r.ok) ok++; } });
    return { n: n, ok: ok };
  }

  var $ = function (id) { return document.getElementById(id); };
  function h(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escT(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- 畫面 ----------
  function renderStats() {
    var s = stats();
    $('sAns').textContent = s.n;
    $('sTot').textContent = QS.length;
    $('sOk').textContent = s.ok;
    $('sAcc').textContent = s.n ? Math.round(s.ok / s.n * 1000) / 10 + '%' : '–';
    $('pbar').style.width = (QS.length ? s.n / QS.length * 100 : 0) + '%';
  }

  function renderGrid() {
    var g = $('grid');
    $('bGrid').setAttribute('aria-pressed', st.grid ? 'true' : 'false');
    g.hidden = !st.grid;
    if (!st.grid) return;
    g.innerHTML = '';
    g.appendChild(h('div', 'legend',
      '<span><i style="background:var(--cell)"></i>未作答</span>' +
      '<span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>答對</span>' +
      '<span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>答錯</span>' +
      (st.wrongOnly ? '<span>（目前只顯示答錯的題目）</span>' : '')));
    var L = list();
    if (!L.length) { g.appendChild(h('div', 'empty', '目前沒有答錯的題目。')); return; }
    var wrap = h('div', 'cells');
    L.forEach(function (i) {
      var q = QS[i], r = st.ans[q.id];
      var b = h('button', 'cell' + (r ? (r.ok ? ' ok' : ' bad') : '') + (q.id === st.cur ? ' cur' : ''), String(i + 1));
      b.title = '第 ' + (i + 1) + ' 題';
      b.addEventListener('click', function () { go(q.id); });
      wrap.appendChild(b);
    });
    g.appendChild(wrap);
  }

  function renderCard() {
    var card = $('card');
    card.innerHTML = '';
    var L = list();
    $('bWrong').setAttribute('aria-pressed', st.wrongOnly ? 'true' : 'false');
    if (!L.length) {
      card.appendChild(h('div', 'empty', st.wrongOnly ? '目前沒有答錯的題目。按「只看答錯的題目」可回到全部題目。' : '沒有題目。'));
      $('pos').textContent = '';
      $('bPrev').disabled = $('bNext').disabled = true;
      return;
    }
    var idx = byId[st.cur];
    if (L.indexOf(idx) < 0) { idx = L[0]; st.cur = QS[idx].id; }
    var q = QS[idx], rec = st.ans[q.id], locked = !!rec;
    var p = L.indexOf(idx);
    $('pos').textContent = st.wrongOnly ? '錯題 ' + (p + 1) + ' / ' + L.length : (idx + 1) + ' / ' + QS.length;
    $('bPrev').disabled = p <= 0;
    $('bNext').disabled = p >= L.length - 1;

    var head = h('div', 'qhead');
    head.appendChild(h('span', 'qno', '第 ' + (idx + 1) + ' 題'));
    head.appendChild(h('span', 'badge', TYPE[q.type]));
    head.appendChild(h('span', 'of', '共 ' + QS.length + ' 題'));
    card.appendChild(head);
    card.appendChild(h('div', 'stem', q.q));

    var resp = locked ? rec.r : draft[q.id];
    var body;
    if (q.type === 'fill') {
      body = h('div', 'fillrow');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'fill'; inp.id = 'fillIn';
      inp.placeholder = '輸入答案'; inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.setAttribute('autocapitalize', 'off');
      inp.value = resp || '';
      if (locked) { inp.disabled = true; inp.classList.add(rec.ok ? 'okv' : 'badv'); }
      inp.addEventListener('input', function () { draft[q.id] = inp.value; updateSubmit(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!st.ans[q.id]) submit(); else next(); }
      });
      body.appendChild(inp);
    } else {
      body = h('div', 'opts' + (locked ? ' locked' : ''));
      var multi = q.type === 'multi';
      q.opts.forEach(function (o, i) {
        var lab = h('label', 'opt');
        var inp = document.createElement('input');
        inp.type = multi ? 'checkbox' : 'radio';
        inp.name = 'opt'; inp.value = i;
        var chosen = multi ? (resp || []).indexOf(i) >= 0 : resp === i;
        inp.checked = chosen;
        if (chosen && !locked) lab.classList.add('sel');
        if (locked) {
          inp.disabled = true;
          var isAns = multi ? q.ans.indexOf(i) >= 0 : q.ans === i;
          if (isAns) lab.classList.add('is-correct');
          else if (chosen) lab.classList.add('is-wrong');
        }
        lab.appendChild(inp);
        lab.appendChild(h('span', 'ol', '(' + LET[i] + ')'));
        lab.appendChild(h('span', 'ot', o));
        if (locked) {
          var isA = multi ? q.ans.indexOf(i) >= 0 : q.ans === i;
          if (isA) lab.appendChild(h('span', 'mark', '✓'));
          else if (chosen) lab.appendChild(h('span', 'mark', '✗'));
        }
        inp.addEventListener('change', function () { pick(q, i); });
        body.appendChild(lab);
      });
    }
    card.appendChild(body);

    var act = h('div', 'actions');
    var sb = h('button', 'primary', locked ? '已送出' : '送出');
    sb.id = 'bSubmit';
    sb.addEventListener('click', submit);
    act.appendChild(sb);
    if (!locked && q.type === 'multi') act.appendChild(h('span', 'small', '多選題：全部選對才算對'));
    if (!locked && q.type === 'fill') act.appendChild(h('span', 'small', '不分大小寫、忽略前後空白'));
    card.appendChild(act);
    updateSubmit();

    if (locked) card.appendChild(resultBox(q, rec));
  }

  function answerText(q) {
    if (q.type === 'fill') {
      var s = '<code>' + escT(q.ans[0]) + '</code>';
      if (q.ans.length > 1) s += ' <span class="small">（也接受：' + q.ans.slice(1).map(function (a) { return '<code>' + escT(a) + '</code>'; }).join('、') + '）</span>';
      return s;
    }
    var arr = q.type === 'multi' ? q.ans.slice().sort() : [q.ans];
    return arr.map(function (i) { return '(' + LET[i] + ')'; }).join(' ');
  }
  function respText(q, r) {
    if (q.type === 'fill') return '<code>' + escT(r) + '</code>';
    var arr = q.type === 'multi' ? (r || []).slice().sort() : [r];
    return arr.length ? arr.map(function (i) { return '(' + LET[i] + ')'; }).join(' ') : '（未選）';
  }
  function resultBox(q, rec) {
    var box = h('div', 'result');
    box.appendChild(h('div', 'verdict ' + (rec.ok ? 'ok' : 'bad'), rec.ok ? '✓ 答對了' : '✗ 答錯了'));
    box.appendChild(h('div', 'kv', '<span class="k">正確答案：</span>' + answerText(q)));
    if (!rec.ok) box.appendChild(h('div', 'kv', '<span class="k">你的答案：</span>' + respText(q, rec.r)));
    var meta = h('div', 'meta');
    meta.appendChild(h('span', 'tag wk', q.week));
    meta.appendChild(h('span', 'tag', escT(q.topic)));
    meta.appendChild(h('span', 'tag', escT(q.src)));
    box.appendChild(meta);
    box.appendChild(h('div', 'exp', q.exp));
    return box;
  }

  function currentQ() { return QS[byId[st.cur]]; }
  function hasResp(q) {
    var r = draft[q.id];
    if (q.type === 'fill') return !!(r && r.trim());
    if (q.type === 'single') return typeof r === 'number';
    return !!(r && r.length);
  }
  function updateSubmit() {
    var b = $('bSubmit'), q = currentQ();
    if (!b || !q) return;
    b.disabled = !!st.ans[q.id] || !hasResp(q);
  }
  function pick(q, i) {
    if (st.ans[q.id]) return;
    if (q.type === 'single') draft[q.id] = i;
    else {
      var a = (draft[q.id] || []).slice(), k = a.indexOf(i);
      if (k >= 0) a.splice(k, 1); else a.push(i);
      draft[q.id] = a;
    }
    var labs = document.querySelectorAll('#card .opt');
    labs.forEach(function (lab, j) {
      var on = q.type === 'single' ? draft[q.id] === j : draft[q.id].indexOf(j) >= 0;
      lab.classList.toggle('sel', on);
      lab.querySelector('input').checked = on;
    });
    updateSubmit();
  }
  function submit() {
    var q = currentQ();
    if (!q || st.ans[q.id] || !hasResp(q)) return;
    var r = draft[q.id];
    if (q.type === 'fill') r = r.trim();
    st.ans[q.id] = { r: r, ok: grade(q, r) };
    delete draft[q.id];
    save();
    render();
    var res = document.querySelector('#card .result');
    if (res && res.getBoundingClientRect().top > window.innerHeight - 120) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function go(id) {
    st.cur = id; save(); render();
    window.scrollTo(0, 0);
    var f = $('fillIn');
    if (f && !f.disabled && window.matchMedia('(min-width: 700px)').matches) f.focus();
  }
  function step(d) {
    var L = list(), p = L.indexOf(byId[st.cur]);
    var np = p + d;
    if (np >= 0 && np < L.length) go(QS[L[np]].id);
  }
  function next() { step(1); }

  function render() { renderStats(); renderCard(); renderGrid(); }

  // ---------- 事件 ----------
  $('bPrev').addEventListener('click', function () { step(-1); });
  $('bNext').addEventListener('click', next);
  $('bGrid').addEventListener('click', function () { st.grid = !st.grid; save(); renderGrid(); });
  $('bWrong').addEventListener('click', function () {
    st.wrongOnly = !st.wrongOnly;
    if (st.wrongOnly) { var w = wrongList(); if (w.length && w.indexOf(byId[st.cur]) < 0) st.cur = QS[w[0]].id; }
    save(); render();
  });
  $('bReset').addEventListener('click', function () {
    if (!confirm('確定要清除全部作答紀錄、從頭開始嗎？')) return;
    var g = st.grid;
    st = fresh(); st.grid = g; draft = {};
    save(); render(); window.scrollTo(0, 0);
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' && t.type === 'text' || t.tagName === 'TEXTAREA')) return;
    var q = currentQ();
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 'Enter' && q) {
      if (t && t.tagName === 'BUTTON') return;
      e.preventDefault();
      if (st.ans[q.id]) next(); else submit();
    } else if (q && q.type !== 'fill' && !st.ans[q.id] && /^[1-9]$/.test(e.key)) {
      var i = +e.key - 1;
      if (i < q.opts.length) pick(q, i);
    }
  });

  render();
})();
</script>
</body>
</html>
